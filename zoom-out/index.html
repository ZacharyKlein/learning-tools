<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zoom Out!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;800&display=swap">
<style>
/* ---------- tokens: a sunny sketchbook that turns into deep space ---------- */
:root{
  --ink:#2b2350;        /* indigo-plum, all text + outlines */
  --paper:#fff8e7;      /* butter cream ground */
  --paper-2:#ffefc2;    /* deeper butter for chrome */
  --rocket:#ff6b35;     /* the one loud thing: ZOOM OUT */
  --rocket-dk:#c2431a;
  --sky:#4fb3f6;
  --grass:#63c64d;
  --gold:#ffd23f;
  --space:#12103a;
  --white:#fffdf7;
  --display:"Fredoka","Chalkboard SE","Comic Sans MS","Segoe UI Rounded",ui-rounded,system-ui,sans-serif;
  --body:"Nunito","Segoe UI Rounded",ui-rounded,"Segoe UI",system-ui,sans-serif;
  --emoji:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji","Twemoji Mozilla",sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:var(--body);
  font-size:16px;
  line-height:1.3;
  -webkit-text-size-adjust:100%;
  overflow:hidden;
}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible{outline:4px solid var(--sky);outline-offset:3px}

.app{
  height:100vh;height:100dvh;
  display:grid;
  grid-template-rows:auto 1fr auto;
  gap:10px;
  padding:10px 14px 12px;
  max-width:1180px;
  margin:0 auto;
}

/* ---------- header ---------- */
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.brand h1{
  font-family:var(--display);font-weight:700;font-size:38px;line-height:1;margin:0;
  letter-spacing:.5px;
  color:var(--ink);
  text-shadow:3px 3px 0 var(--gold);
}
.brand .tagline{margin:4px 0 0;font-weight:800;font-size:15px;opacity:.85}

.meter{
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  background:var(--paper-2);border:3px solid var(--ink);border-radius:18px;
  padding:6px 14px;box-shadow:4px 4px 0 var(--ink);
  min-height:56px;max-width:100%;
}
.meter-label{font-family:var(--display);font-weight:600;font-size:13px;letter-spacing:1.5px;text-transform:uppercase}
.meter-num{
  font-family:var(--display);font-weight:700;font-size:26px;line-height:1;
  font-variant-numeric:tabular-nums;white-space:nowrap;
}
.meter-num.long{font-size:17px}
.pills{display:flex;flex-wrap:wrap;gap:4px;max-width:360px}
.pill{
  font-family:var(--display);font-weight:600;font-size:11px;line-height:1;
  background:var(--sky);color:var(--white);border:2px solid var(--ink);
  border-radius:999px;padding:4px 6px;
  animation:pop .35s cubic-bezier(.34,1.56,.64,1) both;
}
.pill.hot{background:var(--rocket)}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}

/* ---------- stage ---------- */
.stage-wrap{min-height:0;display:flex}
.stage{
  position:relative;flex:1;min-height:300px;
  border:5px solid var(--ink);border-radius:26px;overflow:hidden;
  background:var(--space);
  box-shadow:6px 6px 0 var(--ink);
  touch-action:none;
}
#view{position:absolute;inset:0;width:100%;height:100%;display:block}

.caption{
  position:absolute;left:14px;top:12px;max-width:min(64%,460px);
  background:var(--white);border:3px solid var(--ink);border-radius:18px;
  padding:8px 14px 10px;box-shadow:4px 4px 0 var(--ink);
  pointer-events:none;
  transition:transform .3s cubic-bezier(.34,1.56,.64,1),opacity .3s;
}
.caption.bump{animation:bump .5s cubic-bezier(.34,1.56,.64,1)}
@keyframes bump{0%{transform:scale(.85)}100%{transform:scale(1)}}
.cap-level{font-family:var(--display);font-weight:700;font-size:24px;line-height:1.1}
.cap-text{font-weight:800;font-size:16px;margin-top:3px;text-wrap:balance}
.cap-text b{color:var(--rocket-dk)}

.hint{
  position:absolute;right:14px;bottom:12px;
  background:rgba(255,253,247,.92);border:3px solid var(--ink);border-radius:999px;
  padding:6px 14px;font-weight:800;font-size:14px;pointer-events:none;
  box-shadow:3px 3px 0 var(--ink);
}

.card{
  position:absolute;right:14px;top:12px;width:min(330px,calc(100% - 28px));
  display:flex;gap:12px;align-items:flex-start;
  background:var(--white);border:3px solid var(--ink);border-radius:20px;
  padding:12px 12px 12px 12px;box-shadow:4px 4px 0 var(--ink);
  animation:bump .4s cubic-bezier(.34,1.56,.64,1);
}
.card[hidden]{display:none}
.card-thumb{width:84px;height:84px;flex:0 0 84px;border-radius:14px;border:3px solid var(--ink);background:#e8f4ff}
.card-body{min-width:0;flex:1}
.card-name{font-family:var(--display);font-weight:700;font-size:22px;line-height:1.05}
.card-size{font-family:var(--display);font-weight:600;font-size:18px;color:var(--rocket-dk);margin-top:2px}
.card-fact{font-weight:800;font-size:15px;margin-top:6px}
.card-meters{font-weight:700;font-size:12px;margin-top:6px;opacity:.75;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.card-x{
  position:absolute;right:-12px;top:-12px;width:34px;height:34px;border-radius:50%;
  border:3px solid var(--ink);background:var(--gold);font-family:var(--display);font-weight:700;font-size:20px;line-height:1;
  box-shadow:2px 2px 0 var(--ink);
}

.toast{
  position:absolute;left:50%;bottom:16px;transform:translateX(-50%);
  background:var(--gold);border:3px solid var(--ink);border-radius:999px;
  padding:8px 18px;font-family:var(--display);font-weight:700;font-size:20px;white-space:nowrap;
  box-shadow:4px 4px 0 var(--ink);pointer-events:none;
  animation:bump .5s cubic-bezier(.34,1.56,.64,1);
}
.toast[hidden]{display:none}

/* ---------- dock ---------- */
.dock{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:14px}
.levels{display:flex;gap:5px;flex-wrap:wrap}
.lvl{
  width:40px;height:40px;border-radius:50%;border:3px solid var(--ink);
  background:var(--white);font-size:20px;font-family:var(--emoji);line-height:1;padding:0;
  box-shadow:3px 3px 0 var(--ink);transition:transform .15s;
}
.lvl:hover{transform:translateY(-2px)}
.lvl.on{background:var(--gold);transform:scale(1.12)}
.lvl.done{background:var(--paper-2)}

.buttons{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;min-width:0}
.btn{
  font-family:var(--display);font-weight:700;border:3px solid var(--ink);border-radius:999px;
  background:var(--white);padding:9px 15px;font-size:16px;line-height:1;
  box-shadow:0 5px 0 var(--ink);transition:transform .08s,box-shadow .08s,opacity .2s;
  white-space:nowrap;
}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn:disabled{opacity:.35;cursor:default;transform:none;box-shadow:0 5px 0 var(--ink)}
.btn.big{
  background:var(--rocket);color:var(--white);font-size:26px;padding:13px 24px;
  box-shadow:0 7px 0 var(--rocket-dk),0 7px 0 3px var(--ink);
  text-shadow:2px 2px 0 var(--rocket-dk);
}
.btn.big:active{transform:translateY(5px);box-shadow:0 2px 0 var(--rocket-dk),0 2px 0 3px var(--ink)}
.btn.big:disabled{box-shadow:0 7px 0 var(--rocket-dk),0 7px 0 3px var(--ink)}
.btn.big.home{background:var(--sky);text-shadow:2px 2px 0 #1f6fa8;box-shadow:0 7px 0 #1f6fa8,0 7px 0 3px var(--ink)}
.btn.big.home:active{box-shadow:0 2px 0 #1f6fa8,0 2px 0 3px var(--ink)}
.btn.on{background:var(--gold)}

.slider{display:flex;flex-direction:column;align-items:center;gap:4px;font-family:var(--display);font-weight:600;font-size:13px;letter-spacing:1px;text-transform:uppercase;min-width:150px}
.slider input{
  -webkit-appearance:none;appearance:none;width:100%;height:14px;border-radius:999px;
  background:linear-gradient(90deg,var(--grass),var(--sky) 45%,var(--space));
  border:3px solid var(--ink);outline-offset:4px;margin:0;
}
.slider input::-webkit-slider-thumb{
  -webkit-appearance:none;appearance:none;width:30px;height:30px;border-radius:50%;
  background:var(--gold);border:3px solid var(--ink);box-shadow:2px 2px 0 var(--ink);cursor:grab;
}
.slider input::-moz-range-thumb{
  width:24px;height:24px;border-radius:50%;background:var(--gold);border:3px solid var(--ink);cursor:grab;
}

/* ---------- make-yourself panel ---------- */
.maker{position:absolute;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;padding:10px;background:rgba(43,35,80,.5)}
.maker[hidden]{display:none}
.maker-box{
  position:relative;width:100%;max-width:540px;max-height:100%;overflow:auto;
  background:var(--white);border:4px solid var(--ink);border-radius:24px;
  box-shadow:6px 6px 0 var(--ink);padding:14px 16px 16px;
  display:flex;flex-direction:column;gap:10px;
  animation:bump .35s cubic-bezier(.34,1.56,.64,1);
}
.maker-title{font-family:var(--display);font-weight:700;font-size:26px;line-height:1;margin:0}
.maker-grid{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:start}
#mePreview{width:170px;height:250px;border:3px solid var(--ink);border-radius:16px;display:block}
.maker-controls{display:flex;flex-direction:column;gap:10px;min-width:0}
.row{display:flex;flex-direction:column;gap:5px}
.lbl{font-family:var(--display);font-weight:600;font-size:12px;letter-spacing:1.4px;text-transform:uppercase;opacity:.7}
.opts{display:flex;flex-wrap:wrap;gap:7px}
.sw{width:30px;height:30px;border-radius:50%;border:3px solid var(--ink);padding:0;box-shadow:2px 2px 0 rgba(43,35,80,.3)}
.sw.on{box-shadow:0 0 0 4px var(--gold),2px 2px 0 rgba(43,35,80,.3)}
.seg{font-family:var(--display);font-weight:700;font-size:16px;line-height:1;border:3px solid var(--ink);border-radius:999px;background:var(--white);padding:8px 14px;box-shadow:0 4px 0 var(--ink)}
.seg.on{background:var(--gold)}
.tall{display:flex;align-items:center;gap:10px}
.tall>span{font-family:var(--display);font-weight:700;font-size:22px;min-width:84px;font-variant-numeric:tabular-nums}
.tall input{
  -webkit-appearance:none;appearance:none;flex:1;min-width:0;height:14px;border-radius:999px;margin:0;
  background:linear-gradient(90deg,var(--sky),var(--grass));border:3px solid var(--ink);outline-offset:4px;
}
.tall input::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:30px;height:30px;border-radius:50%;background:var(--gold);border:3px solid var(--ink);box-shadow:2px 2px 0 var(--ink);cursor:grab}
.tall input::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:var(--gold);border:3px solid var(--ink);cursor:grab}
.agehint{font-weight:800;font-size:14px;opacity:.8;min-height:19px}
.btn.done{align-self:flex-start;background:var(--gold);font-size:20px;padding:10px 22px}
@media (max-width:600px){
  .maker-grid{grid-template-columns:1fr}
  #mePreview{width:118px;height:174px}
  .maker-title{font-size:22px}
}

/* ---------- small screens ---------- */
@media (max-width:760px){
  .app{padding:8px 8px 8px;gap:8px}
  .brand h1{font-size:28px}
  .brand .tagline{display:none}
  .meter{padding:4px 10px;min-height:44px;gap:8px}
  .meter-num{font-size:20px}.meter-num.long{font-size:13px}
  .pills{max-width:220px}
  .dock{grid-template-columns:1fr;gap:8px}
  .levels{justify-content:center}
  .slider{min-width:0}
  .btn.big{font-size:22px;padding:12px 22px}
  .caption{max-width:calc(100% - 28px)}
  .cap-level{font-size:20px}.cap-text{font-size:14px}
  .hint{display:none}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none !important;transition:none !important}
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <h1>Zoom Out!</h1>
      <p class="tagline">Small or big? It depends how far you zoom.</p>
    </div>
    <div class="meter" aria-live="polite">
      <div class="meter-label">Zoom<br>power</div>
      <div class="meter-num" id="zoomNum">×1</div>
      <div class="pills" id="pills" aria-label="each pill is ten times bigger"></div>
    </div>
  </header>

  <main class="stage-wrap">
    <div class="stage" id="stage">
      <canvas id="view"></canvas>
      <div class="caption" id="caption">
        <div class="cap-level" id="capLevel">🐜 Bugs</div>
        <div class="cap-text" id="capText">Some bugs are small. Some bugs are <b>BIG!</b></div>
      </div>
      <div class="hint" id="hint">👆 Tap a thing to learn about it</div>
      <div class="card" id="card" hidden>
        <button class="card-x" id="cardClose" aria-label="Close">×</button>
        <canvas class="card-thumb" id="thumb" width="168" height="168"></canvas>
        <div class="card-body">
          <div class="card-name" id="cardName"></div>
          <div class="card-size" id="cardSize"></div>
          <div class="card-fact" id="cardFact"></div>
          <div class="card-meters" id="cardMeters"></div>
        </div>
      </div>
      <div class="maker" id="maker" hidden>
        <div class="maker-box" role="dialog" aria-label="Make yourself">
          <button class="card-x" id="makerClose" aria-label="Close">&times;</button>
          <h2 class="maker-title">Make yourself!</h2>
          <div class="maker-grid">
            <canvas id="mePreview" width="340" height="500" aria-label="Your character next to a height ruler"></canvas>
            <div class="maker-controls">
              <div class="row"><span class="lbl">Who are you?</span><div class="opts" id="optSex"></div></div>
              <div class="row"><span class="lbl">Skin</span><div class="opts" id="optSkin"></div></div>
              <div class="row"><span class="lbl">Hair</span><div class="opts" id="optHair"></div></div>
              <div class="row"><span class="lbl">Clothes</span><div class="opts" id="optOutfit"></div></div>
              <div class="row"><span class="lbl">How tall are you?</span>
                <div class="tall"><span id="meCm">125 cm</span><input type="range" id="meH" min="85" max="170" step="1" value="125" aria-label="Your height in centimeters"></div>
                <span class="agehint" id="meAge"></span>
              </div>
              <button class="btn done" id="makerDone">👍 That's me!</button>
            </div>
          </div>
        </div>
      </div>
      <div class="toast" id="toast" hidden></div>
    </div>
  </main>

  <footer class="dock">
    <div class="levels" id="levels"></div>
    <div class="buttons">
      <button class="btn" id="btnIn">🔍 Zoom in</button>
      <button class="btn big" id="btnOut">🚀 ZOOM OUT!</button>
      <button class="btn" id="btnPlay">▶ Play</button>
      <button class="btn" id="btnMe">✨ Make me!</button>
    </div>
    <label class="slider"><span>Slide to zoom</span><input type="range" id="zoom" min="0" max="1000" value="0" aria-label="Zoom"></label>
  </footer>
</div>
<script>
'use strict';
/* =====================================================================
   ZOOM OUT!  —  orders of magnitude for small people
   Everything is placed in one world measured in real meters. The camera
   only knows one number: z = log10(meters per pixel). Zooming out one
   "×10" means z goes up by exactly 1. All sizes below are real.
   ===================================================================== */
const LY = 9.461e15;            // one light-year, in meters
// --- your character. Kids build this; it is the "you" in the People and Trees lineups. ---
const SKINS   = ['#fbdcc0','#f0c49a','#d79a68','#a86f46','#6d472c'];
const HAIRS   = ['#2a2119','#6b4423','#b9793a','#efd07a','#a8391c','#9aa0ad'];
const OUTFITS = ['#ff6b35','#4fb3f6','#63c64d','#ffd23f','#a45fd6','#ff4fa3','#2b2350','#fffdf7'];
const ME = { sex:'girl', skin:1, hair:1, outfit:1, h:1.25 };   // h is your height in meters
const ME_MIN=0.85, ME_MAX=1.70;
function saveMe(){ try{ localStorage.setItem('zoomout.me',JSON.stringify(ME)); }catch(e){} }
(function loadMe(){
  try{
    const raw=localStorage.getItem('zoomout.me'); if(!raw) return;
    const v=JSON.parse(raw); if(!v||typeof v!=='object') return;
    if(v.sex==='boy'||v.sex==='girl') ME.sex=v.sex;
    for(const [k,arr] of [['skin',SKINS],['hair',HAIRS],['outfit',OUTFITS]])
      if(Number.isInteger(v[k])&&v[k]>=0&&v[k]<arr.length) ME[k]=v[k];
    if(typeof v.h==='number'&&v.h>=ME_MIN&&v.h<=ME_MAX) ME.h=v.h;
  }catch(e){}
})();
const R_EARTH = 6.371e6;        // Earth's radius, in meters
const TAU = Math.PI*2;
const EMOJI_FONT = '"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji","Twemoji Mozilla",sans-serif';
const LABEL_FONT = '"Nunito","Segoe UI Rounded",ui-rounded,"Segoe UI",system-ui,sans-serif';
const DISPLAY_FONT = '"Fredoka","Chalkboard SE","Comic Sans MS","Segoe UI Rounded",ui-rounded,system-ui,sans-serif';

// size = the number the object is famous for (length, height or diameter), in meters.
// w/h = drawn width/height as a fraction of size. lay = how much of the width the layout reserves.
const LEVELS = [
  // `at` is how high each creature floats inside the drop, as a fraction of the drop's depth
  { id:'drop', name:'In a Drop', icon:'🔬', ground:false, water:true,
    caption:'Way too small to see! But some are small and some are <b>BIG</b> — for a microbe.',
    objects:[
      {name:'Euglena',     draw:'euglena',    size:0.00015, w:1, h:.30, at:.72, mm:true, fact:'It swims with a tiny whip and eats sunlight like a plant.'},
      {name:'Paramecium',  draw:'paramecium', size:0.0002, w:1, h:.42, at:.34, mm:true, fact:'Covered in hairs it waves to swim. One single cell!'},
      {name:'Amoeba',      draw:'amoeba',     size:0.0004, w:1, h:.72, at:.62, mm:true, fact:'No fixed shape. It oozes along and wraps around its food.'},
      {name:'Rotifer',     draw:'rotifer',    size:0.0005, w:.5, h:1,  at:.30, mm:true, fact:'Its spinning hairs look like wheels sweeping food in.'},
      {name:'Water bear',  draw:'tardigrade', size:0.0007, w:1, h:.62, at:.70, mm:true, fact:'Eight stubby legs. It can even survive in outer space!'},
      {name:'Water flea',  draw:'daphnia',    size:0.0015, w:1, h:.62, at:.46, mm:true, fact:'Big enough to see as a speck. Watch it hop through the water.'},
    ]},
  { id:'bugs', name:'Bugs', icon:'🐜', ground:true,
    caption:'Some bugs are small. Some bugs are <b>BIG!</b>',
    objects:[
      {name:'Ant',            emoji:'🐜', size:0.01,  fact:'Tiny, but it can carry 50 ants!'},
      {name:'Honeybee',       emoji:'🐝', size:0.015, fact:'Buzz! It makes honey.'},
      {name:'Grasshopper',    emoji:'🦗', size:0.05,  fact:'Jumps 20 times its own length!'},
      {name:'Goliath beetle', emoji:'🪲', size:0.10,  fact:'As long as your hand!'},
      {name:'Atlas moth',     emoji:'🦋', size:0.25,  fact:'Wings as wide as a dinner plate!'},
    ]},
  { id:'people', name:'Me & You', icon:'🧒', ground:true,
    caption:'A baby is tiny. A grown-up is <b>BIG!</b> You grow taller every year.',
    objects:[
      {name:'Newborn baby', draw:'person', size:0.5,  w:.42, cm:true, look:{sex:'girl',skin:0,hair:1,outfit:5}, fact:'You were this tiny once!'},
      {name:'Age 5',        draw:'person', size:1.1,  w:.42, cm:true, look:{sex:'boy', skin:3,hair:0,outfit:2}, fact:'Big enough for kindergarten.'},
      {name:'You!',         draw:'person', size:ME.h, w:.42, cm:true, me:true,                                  fact:'Tap me to change my hair, clothes and size!'},
      {name:'A grown-up',   draw:'person', size:1.75, w:.42, cm:true, look:{sex:'girl',skin:2,hair:3,outfit:1}, fact:'About as tall as a door.'},
      {name:'Tallest ever', draw:'person', size:2.72, w:.42, cm:true, look:{sex:'boy', skin:1,hair:2,outfit:4}, fact:'Robert Wadlow, the tallest person ever measured.'},
    ]},
  { id:'trees', name:'Trees', icon:'🌳', ground:true,
    caption:'Some trees are small. Some trees are <b>BIG!</b>',
    objects:[
      {name:'You!',          draw:'person',   size:ME.h, w:.42, cm:true, me:true, fact:'Even a small tree is way taller than you.'},
      {name:'Apple tree',    draw:'apple',    size:5,   w:.7,  fact:'As tall as a giraffe!'},
      {name:'Palm tree',     draw:'palm',     size:15,  w:.6,  fact:'As tall as a 4-story building!'},
      {name:'Pine tree',     draw:'pine',     size:25,  w:.45, fact:'20 kids stacked up!'},
      {name:'Giant redwood', draw:'redwood',  size:110, w:.28, fact:'As tall as a 30-story building!'},
    ]},
  { id:'mountains', name:'Mountains', icon:'⛰️', ground:true,
    caption:'Some mountains are small. Some are <b>BIG!</b>',
    objects:[
      {name:'A big hill',     draw:'hill',     size:500,  w:2.4, lay:.8, fact:'Roll all the way down!'},
      {name:'A mountain',     draw:'mountain', size:2000, w:1.6, lay:.75, fact:'A whole day to hike up!'},
      {name:'Mount Fuji',     draw:'fuji',     size:3776, w:2.2, lay:.75, fact:'A volcano in Japan!'},

/* ---------- helpers ---------- */
const clamp = (v,a,b)=> v<a?a:v>b?b:v;
const lerp  = (a,b,t)=> a+(b-a)*t;
const smooth= t => t*t*(3-2*t);
const easeInOut = t => t<.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2;
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
function seeded(n){ let s=n*9301+49297; return ()=>{ s=(s*9301+49297)%233280; return s/233280; }; }

/* ---------- the view (canvas + camera) ---------- */
const stage = document.getElementById('stage');
const view  = document.getElementById('view');
let ctx     = view.getContext('2d');      // swapped for the card's little canvas while drawing a portrait
const V = { w:900, h:520, dpr:1 };
const cam = { z:0 };                      // z = log10(meters per pixel)
let tween = null;                         // {from,to,t0,dur,onDone}
let current = 0;                          // level we are "at" (for captions/buttons)

function resize(){
  const r = stage.getBoundingClientRect();
  V.w = Math.max(320, Math.round(r.width));
  V.h = Math.max(240, Math.round(r.height));
  V.dpr = Math.min(2, window.devicePixelRatio||1);
  view.width = Math.round(V.w*V.dpr); view.height = Math.round(V.h*V.dpr);
  const parked = !tween && Math.abs(cam.z-LEVELS[current].z)<1e-9;
  layout();
  if(parked) cam.z = LEVELS[current].z;   // stay parked at the level's (new) home zoom
  syncSlider();
}

// Lay each level out in a row, smallest → biggest, at a "home zoom" that fits the stage.
function layout(){
  const W=V.w, H=V.h, availW=W-40, gapPx=78, spacePx=24;
  LEVELS.forEach(L=>{
    const objs=L.objects.slice().sort((a,b)=>a.size-b.size), n=objs.length, planets=(L.id==='planets');
    objs.forEach((o,k)=>{ o.row=k%2; });          // stagger the name tags so they never collide
    const sumW = objs.reduce((s,o)=>s+o.size*o.w*o.lay,0);
    const maxH = Math.max(...objs.map(o=>o.size*o.h));
    const budgetW = availW - (planets?0:gapPx) - (n-1)*spacePx;
    const budgetH = (L.water?0.40:L.ground?0.56:0.68)*H;
    let mpp = Math.max(sumW/budgetW, maxH/budgetH);
    objs.forEach(o=>{ o.cy = L.ground ? o.size*o.h/2 : -R_EARTH; });   // world y of the object's center
    const place = ()=>{
      const sp = spacePx*mpp;
      const halfOf = o => Math.max(o.size*o.w*o.lay, 62*mpp)/2;   // tiny things still get room for a name tag
      if(!planets){
        let cur = gapPx*mpp;               // the dot (everything smaller) lives at x = 0, on the left
        objs.forEach(o=>{ const half=halfOf(o); o.x=cur+half; cur+=2*half+sp; });
        L.left = 0; L.right = cur-sp;
      }else{
        // Earth is the ground we have been standing on, so it stays at x = 0.
        const earth = objs.find(o=>o.draw==='earth'); earth.x = 0;
        const before = objs.filter(o=>o.size<earth.size), after = objs.filter(o=>o.size>earth.size);
        let cur = -Math.max(R_EARTH, 31*mpp) - sp;
        before.slice().reverse().forEach(o=>{ const half=halfOf(o); o.x=cur-half; cur-=2*half+sp; });
        L.left = cur+sp;
        cur = Math.max(R_EARTH, 31*mpp) + sp;
        after.forEach(o=>{ const half=halfOf(o); o.x=cur+half; cur+=2*half+sp; });
        L.right = cur-sp;
      }
      return (L.right-L.left)/mpp;         // row width in px
    };
    const rowPx = place();
    if(rowPx > availW){ mpp *= rowPx/availW; place(); }   // name-tag room pushed it too wide: zoom out a touch
    if(L.water){                                          // a drop squashed under a coverslip, sitting on the grass
      L.dropW = (L.right - L.left) + 2*44*mpp;      // a margin of water around the biggest creature
      L.dropH = Math.min(L.dropW*0.42, 0.60*H*mpp);
      objs.forEach(o=>{ o.wy = L.dropH*o.at; });
    }
    L.mpp = mpp; L.z = Math.log10(mpp);
    L.cx = (L.left+L.right)/2;
  });
}

// 1 = flat ground under our feet, 0 = Earth is a ball on the screen
function groundBlend(rPx){ return smooth(clamp((Math.log10(rPx)-Math.log10(0.35*V.h)),0,1)); }

// The camera is a pure function of z, so the slider and the tweens agree.
function cameraAt(z){
  const mpp = Math.pow(10,z), H=V.h;
  const r = R_EARTH/mpp;
  const g = groundBlend(r);
  const anchorY = g*(0.80*H) + (1-g)*(0.5*H - r);   // where Earth's top edge (0,0) sits on screen
  const cy = (anchorY - 0.5*H)*mpp;
  let cx = LEVELS[0].cx;
  for(let i=1;i<LEVELS.length;i++){
    const s = smooth(clamp((z-(LEVELS[i].z-0.8))/0.8,0,1));
    cx = lerp(cx, LEVELS[i].cx, s);
  }
  return {z, mpp, cx, cy, g, r};
}
let C = null;   // current camera
const sx = x => V.w/2 + (x-C.cx)/C.mpp;
const sy = y => V.h/2 - (y-C.cy)/C.mpp;

function nearestLevel(z){
  let best=0, d=Infinity;
  LEVELS.forEach((L,i)=>{ const dd=Math.abs(L.z-z); if(dd<d){d=dd;best=i;} });
  return best;
}
function zoomFactor(z){ return Math.pow(10, z-LEVELS[0].z); }

/* ---------- number words ---------- */
function group(intStr){ return intStr.replace(/\B(?=(\d{3})+(?!\d))/g,','); }
function bigRound(x){                       // 2 significant digits, any magnitude, no exponent notation
  if(x<10) return (Math.round(x*10)/10).toString();
  const e = Math.floor(Math.log10(x));
  const sig = Math.round(x/Math.pow(10,e-1));
  return group(String(sig)+'0'.repeat(Math.max(0,e-1)));
}
function friendlySize(o){
  const m=o.size, L=o.level;
  if(o.cm) return Math.round(m*100)+' cm';        // people grow in centimeters, not rounded meters
  if(o.mm) return (Math.round(m*1e4)/10)+' mm';   // pond life belongs on a ruler kids have held
  if(L.id==='galaxies') return group(String(Math.round(m/LY)))+' light-years';
  if(m>=1e6) return group(String(Math.round(m/1000)))+' km';
  if(m>=1)  return group(String(Math.round(m)))+' m';
  if(m>=0.01) return (Math.round(m*1000)/10)+' cm';
  return (Math.round(m*10000)/10)+' mm';
}
function metersLine(o){
  const m=o.size;
  if(m<1) return '= '+m+' meters';
  return '= '+bigRound(m)+' meters';
}
/* =====================================================================
   DRAWING
   ===================================================================== */
const STARS = (()=>{ const r=seeded(7); return Array.from({length:170},()=>({x:r(),y:r(),s:r()*1.5+.4,p:r()*TAU})); })();
const CONTINENTS = (()=>{ const r=seeded(3); return Array.from({length:8},()=>({x:(r()-.5)*1.5,y:(r()-.5)*1.5,rx:r()*.26+.1,ry:r()*.18+.08,a:r()*TAU})); })();
const INK='#2b2350';

function hexRgb(h){ return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]; }
function rgba(h,a){ const c=hexRgb(h); return `rgba(${c[0]},${c[1]},${c[2]},${a})`; }
function darker(h,k){ const c=hexRgb(h).map(v=>Math.round(v*(1-k))); return `rgb(${c[0]},${c[1]},${c[2]})`; }
function mixRgb(a,b,t){ return `rgb(${Math.round(lerp(a[0],b[0],t))},${Math.round(lerp(a[1],b[1],t))},${Math.round(lerp(a[2],b[2],t))})`; }
function circle(x,y,r,fill){ ctx.fillStyle=fill; ctx.beginPath(); ctx.arc(x,y,r,0,TAU); ctx.fill(); }
function ring(x,y,r,stroke,w){ ctx.strokeStyle=stroke; ctx.lineWidth=w; ctx.beginPath(); ctx.arc(x,y,r,0,TAU); ctx.stroke(); }
function poly(P,fill,stroke,lw){ ctx.beginPath(); P.forEach((p,i)=> i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1])); ctx.closePath(); ctx.fillStyle=fill; ctx.fill(); if(stroke){ ctx.strokeStyle=stroke; ctx.lineWidth=lw; ctx.lineJoin='round'; ctx.stroke(); } }
function rrect(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
const outlineW = px => px<8 ? 0 : clamp(px*0.012,1.2,3);

/* --- sky and space --- */
function drawBackground(t){
  const g=C.g, W=V.w, H=V.h;
  ctx.fillStyle='#12103a'; ctx.fillRect(0,0,W,H);
  if(g<1){
    ctx.fillStyle='#fff6d8';
    for(const s of STARS){
      ctx.globalAlpha=(1-g)*(0.55+0.45*Math.sin(t*1.7+s.p));
      ctx.beginPath(); ctx.arc(s.x*W,s.y*H,s.s,0,TAU); ctx.fill();
    }
    ctx.globalAlpha=1;
  }
  if(g>0){
    ctx.globalAlpha=g;
    const sky=ctx.createLinearGradient(0,0,0,H); sky.addColorStop(0,'#3d9be9'); sky.addColorStop(1,'#cdeeff');
    ctx.fillStyle=sky; ctx.fillRect(0,0,W,H);
    const sx0=W-72, sy0=66;
    circle(sx0,sy0,30,'#ffd23f'); ring(sx0,sy0,30,INK,3);
    ctx.strokeStyle='#ffd23f'; ctx.lineWidth=5; ctx.lineCap='round';
    for(let i=0;i<8;i++){ const a=i*TAU/8+t*0.25; ctx.beginPath(); ctx.moveTo(sx0+Math.cos(a)*40,sy0+Math.sin(a)*40); ctx.lineTo(sx0+Math.cos(a)*54,sy0+Math.sin(a)*54); ctx.stroke(); }
    ctx.globalAlpha=1;
  }
}

/* --- the ground, which turns out to be a planet --- */
function drawEarthBall(x,y,r,g){
  if(r<2.6*V.h){
    const glow=ctx.createRadialGradient(x,y,r*0.97,x,y,r*1.14);
    glow.addColorStop(0,'rgba(130,205,255,0.6)'); glow.addColorStop(1,'rgba(130,205,255,0)');
    circle(x,y,r*1.14,glow);
  }
  circle(x,y,r,mixRgb([0x63,0xc6,0x4d],[0x2f,0x86,0xf4],1-g));
  if(g<1){
    ctx.save(); ctx.beginPath(); ctx.arc(x,y,r,0,TAU); ctx.clip();
    ctx.globalAlpha=1-g;
    ctx.fillStyle='#5cbf4a';
    for(const c of CONTINENTS){ ctx.beginPath(); ctx.ellipse(x+c.x*r,y+c.y*r,c.rx*r,c.ry*r,c.a,0,TAU); ctx.fill(); }
    ctx.fillStyle='#f6fbff';
    ctx.beginPath(); ctx.ellipse(x,y-r*0.95,r*0.38,r*0.13,0,0,TAU); ctx.fill();
    ctx.beginPath(); ctx.ellipse(x,y+r*0.95,r*0.32,r*0.11,0,0,TAU); ctx.fill();
    const sh=ctx.createRadialGradient(x-r*0.4,y-r*0.4,r*0.15,x,y,r*1.02);
    sh.addColorStop(0,'rgba(255,255,255,0.18)'); sh.addColorStop(0.7,'rgba(0,0,0,0)'); sh.addColorStop(1,'rgba(10,10,60,0.5)');
    ctx.fillStyle=sh; ctx.fillRect(x-r,y-r,2*r,2*r);
    ctx.restore();
    if(r>6){ ctx.globalAlpha=1-g; ring(x,y,r,INK,outlineW(r*2)||1.2); ctx.globalAlpha=1; }
  }
}
function drawGround(){
  const {r,g}=C, W=V.w, H=V.h, groundY=sy(0);
  if(r>4e5){                                  // too big to curve: it is just "the ground"
    if(groundY<H){
      const grd=ctx.createLinearGradient(0,groundY,0,H); grd.addColorStop(0,'#7ed957'); grd.addColorStop(1,'#3f8f2f');
      ctx.fillStyle=grd; ctx.fillRect(0,groundY,W,H-groundY);
      ctx.fillStyle='#4e7d2b'; ctx.fillRect(0,groundY,W,3);
    }
    drawGrass(groundY); return;
  }
  drawEarthBall(sx(0),sy(-R_EARTH),r,g);
  if(g>0){ ctx.globalAlpha=g; ring(sx(0),sy(-R_EARTH),r,'#4e7d2b',3); ctx.globalAlpha=1; }
  drawGrass(groundY);
}
function drawGrass(groundY){
  const mpp=C.mpp, step=0.02, hpx=0.045/mpp;
  if(hpx<3||hpx>420) return;
  const a=clamp((hpx-3)/6,0,1)*clamp((420-hpx)/160,0,1);
  const i0=Math.floor((C.cx-V.w/2*mpp)/step), i1=Math.ceil((C.cx+V.w/2*mpp)/step);
  if(i1-i0>500) return;
  ctx.save(); ctx.globalAlpha=a; ctx.strokeStyle='#3f8f2f'; ctx.lineCap='round'; ctx.lineWidth=Math.max(1,hpx*0.1);
  for(let i=i0;i<=i1;i++){
    const h=((i*7919)%13)/13, bx=sx(i*step), bh=hpx*(0.6+0.8*h), lean=(h-0.5)*bh*0.7;
    ctx.beginPath(); ctx.moveTo(bx,groundY); ctx.quadraticCurveTo(bx+lean*0.2,groundY-bh*0.6,bx+lean,groundY-bh); ctx.stroke();
  }
  ctx.restore();
}

/* --- a drop of pond water, and the things living in it --- */
function drawDrop(){
  const L=LEVELS[0]; if(!L.dropW) return;
  const w=L.dropW/C.mpp; if(w<2.5||w>40000) return;
  const h=L.dropH/C.mpp, cx=sx(L.cx), bot=sy(0), top=bot-h, r=Math.min(h/2,w/2);
  ctx.save(); ctx.globalAlpha=clamp((w-2.5)/7,0,1);
  rrect(cx-w/2,top,w,h,r);
  const g=ctx.createLinearGradient(0,top,0,bot);
  g.addColorStop(0,'rgba(158,228,246,0.78)'); g.addColorStop(1,'rgba(74,166,214,0.68)');
  ctx.fillStyle=g; ctx.fill();
  ctx.strokeStyle='rgba(43,35,80,.5)'; ctx.lineWidth=clamp(w*0.005,1.2,4); ctx.stroke();
  if(w>110){
    ctx.save(); rrect(cx-w/2,top,w,h,r); ctx.clip();
    ctx.fillStyle='rgba(255,255,255,0.5)';
    ctx.beginPath(); ctx.ellipse(cx-w*0.24,top+h*0.15,w*0.15,h*0.055,-0.12,0,TAU); ctx.fill();
    const rnd=seeded(21); ctx.globalAlpha=0.5;
    for(let i=0;i<14;i++){ const bx=cx-w/2+rnd()*w, by=top+rnd()*h, br=w*0.004+rnd()*w*0.007;
      ring(bx,by,br,'rgba(255,255,255,0.85)',Math.max(1,br*0.4)); }
    ctx.restore();
  }
  ctx.restore();
}
function cilia(x,y,rx,ry,n,len,col,lw){
  ctx.strokeStyle=col; ctx.lineWidth=lw; ctx.lineCap='round';
  for(let i=0;i<n;i++){
    const a=i*TAU/n, px=x+Math.cos(a)*rx, py=y+Math.sin(a)*ry;
    const nx=Math.cos(a)/rx, ny=Math.sin(a)/ry, m=Math.hypot(nx,ny)||1;
    ctx.beginPath(); ctx.moveTo(px,py); ctx.lineTo(px+nx/m*len,py+ny/m*len); ctx.stroke();
  }
}
function blobPath(x,y,rx,ry,seed,lobes,wob){
  const rnd=seeded(seed), k=[]; for(let i=0;i<lobes;i++) k.push(1+(rnd()-0.5)*wob);
  ctx.beginPath();
  for(let i=0;i<=lobes*4;i++){
    const t=i/(lobes*4)*TAU, f=k[i%lobes], f2=k[(i+1)%lobes], m=f+(f2-f)*((i%1)||0);
    const rr=m, px=x+Math.cos(t)*rx*rr, py=y+Math.sin(t)*ry*rr;
    i?ctx.lineTo(px,py):ctx.moveTo(px,py);
  }

    ctx.moveTo(x-w*0.42,top+h*0.14);
    ctx.quadraticCurveTo(x-w*0.44,y+h*0.06,x-w*0.12,bot-h*0.22);
    ctx.lineTo(x+w*0.12,bot-h*0.22);
    ctx.quadraticCurveTo(x+w*0.44,y+h*0.06,x+w*0.42,top+h*0.14);
    ctx.closePath(); ctx.fillStyle='#f3e0b6'; ctx.fill(); stroke();
    [-1,1].forEach(sd=>{ ctx.beginPath(); ctx.moveTo(x+sd*w*0.10,bot-h*0.22); // toes
      ctx.lineTo(x+sd*w*0.22,bot); ctx.strokeStyle=INK; ctx.lineWidth=Math.max(1.2,w*0.09); ctx.stroke(); });
    [-1,1].forEach(sd=>{                                                       // the two "wheels"
      circle(x+sd*headR*0.52,top+h*0.10,headR*0.46,'#f7ecd0');
      if(ol) ring(x+sd*headR*0.52,top+h*0.10,headR*0.46,INK,ol);
      if(w>22) cilia(x+sd*headR*0.52,top+h*0.10,headR*0.46,headR*0.46,12,Math.max(2.5,w*0.16),'#c9a961',Math.max(1.2,w*0.035));
    });
    if(h>34) circle(x,y-h*0.10,Math.max(1.5,w*0.10),'#c9a961');               // gut
  }else if(o.draw==='tardigrade'){
    const legY=y+r*0.62;
    for(let i=0;i<4;i++){                                                      // eight stubby legs
      const lx=x-L*0.62+i*L*0.40;
      [-1,1].forEach(sd=>{
        const off=sd*r*0.10;
        limb(lx+off,y+r*0.3,lx+off-L*0.03,legY+r*0.30,Math.max(1.5,h*0.16),sd<0?'#d9ab77':'#e8c9a0',ol);
      });
    }
    ctx.beginPath();                                                           // plump body
    ctx.ellipse(x-L*0.05,y,L*0.92,r*0.92,0,0,TAU);
    ctx.fillStyle='#e8c9a0'; ctx.fill(); stroke();
    if(w>30){
      ctx.strokeStyle='rgba(43,35,80,.28)'; ctx.lineWidth=Math.max(1,w*0.012);
      [-0.4,-0.1,0.2].forEach(k=>{ ctx.beginPath(); ctx.moveTo(x+k*L,y-r*0.8); ctx.quadraticCurveTo(x+k*L+L*0.05,y,x+k*L,y+r*0.8); ctx.stroke(); });
      circle(x+L*0.78,y-r*0.1,Math.max(1.5,r*0.16),INK);                       // snout
      circle(x+L*0.55,y-r*0.42,Math.max(1,r*0.10),INK);                        // eye
    }
  }else if(o.draw==='daphnia'){
    ctx.translate(x,y); ctx.rotate(-0.07);
    ctx.strokeStyle=INK; ctx.lineWidth=Math.max(1.2,w*0.011);                  // tail spine
    ctx.beginPath(); ctx.moveTo(-L*0.6,r*0.5); ctx.quadraticCurveTo(-L*0.84,r*0.76,-L*1.0,r*0.95); ctx.stroke();
    if(w>30){                                                                  // branched swimming antennae, behind the shell
      ctx.strokeStyle=INK; ctx.lineWidth=Math.max(1.2,w*0.013); ctx.lineJoin='round';
      [[0.16,-1.02],[-0.24,-0.88]].forEach(d=>{
        const ex=L*d[0], ey=r*d[1];
        ctx.beginPath(); ctx.moveTo(L*0.72,-r*0.2); ctx.quadraticCurveTo(L*0.62,ey*1.05,ex,ey); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(ex,ey); ctx.lineTo(ex-L*0.2,ey-r*0.16); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(ex,ey); ctx.lineTo(ex-L*0.16,ey+r*0.2); ctx.stroke();
      });
    }
    ctx.beginPath();                                                           // carapace, beak at the front
    ctx.moveTo(L*0.86,-r*0.1);
    ctx.quadraticCurveTo(L*0.5,-r*1.0,-L*0.15,-r*0.93);
    ctx.quadraticCurveTo(-L*0.78,-r*0.78,-L*0.68,r*0.18);
    ctx.quadraticCurveTo(-L*0.6,r*0.86,-L*0.1,r*0.9);
    ctx.quadraticCurveTo(L*0.55,r*0.78,L*0.86,-r*0.1);
    ctx.closePath(); ctx.fillStyle='rgba(246,220,170,0.9)'; ctx.fill(); stroke();
    if(w>30){
      [[-.44,-.44],[-.18,-.52],[-.3,-.18]].forEach(d=>circle(d[0]*L,d[1]*r,Math.max(1.6,r*0.12),'#e8a94a'));   // eggs
      ctx.strokeStyle='rgba(43,35,80,.28)'; ctx.lineWidth=Math.max(1,w*0.012); // gut
      ctx.beginPath(); ctx.moveTo(L*0.42,r*0.02); ctx.quadraticCurveTo(0,r*0.34,-L*0.48,r*0.28); ctx.stroke();
    }
    circle(L*0.58,-r*0.4,Math.max(1.6,r*0.15),INK);                            // one big compound eye
  }
  ctx.restore();
}

/* --- people --- */
// A thick round-capped line with an ink outline behind it: arms, legs, pigtails.
function limb(x1,y1,x2,y2,w,fill,ol){
  ctx.lineCap='round';
  if(ol){ ctx.strokeStyle=INK; ctx.lineWidth=w+ol*2; ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke(); }
  ctx.strokeStyle=fill; ctx.lineWidth=w; ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
}
function drawPerson(o,x,base,h){
  const look = o.me ? ME : o.look;
  const skin=SKINS[look.skin], hairC=HAIRS[look.hair], cloth=OUTFITS[look.outfit];
  const girl = look.sex==='girl', ol=outlineW(h);
  // little kids really are head-heavy: the head shrinks from ~1/3 to ~1/5 of height as you grow
  const hr = lerp(0.31,0.185,clamp((o.size-0.5)/2.2,0,1));
  const headH=h*hr, headR=headH/2, rest=h-headH;
  const legH=rest*0.54, bodyH=rest*0.46;
  const headCy=base-h+headR, bodyTop=base-h+headH, bodyBot=base-legH;
  const shoulder=h*(girl?0.100:0.110), hem=girl?h*0.20:h*0.105;
  const limbW=Math.max(1,h*0.052), footY=base-h*0.012;
  const hemY = girl ? bodyBot+legH*0.32 : bodyBot;

  ctx.save();
  if(girl){                                   // hair behind the head
    circle(x,headCy+headR*0.30,headR*1.18,hairC);
    if(ol) ring(x,headCy+headR*0.30,headR*1.18,INK,ol);
  }
  [-1,1].forEach(sd=>limb(x+sd*h*0.042,bodyBot,x+sd*h*0.052,footY,limbW,skin,ol));      // legs
  [-1,1].forEach(sd=>{                                                                   // shoes
    ctx.beginPath(); ctx.ellipse(x+sd*h*0.055,footY,h*0.046,h*0.023,0,0,TAU);
    ctx.fillStyle=darker(cloth,0.5); ctx.fill();
    if(ol){ ctx.strokeStyle=INK; ctx.lineWidth=ol; ctx.stroke(); }
  });
  poly([[x-shoulder,bodyTop],[x+shoulder,bodyTop],[x+hem,hemY],[x-hem,hemY]],cloth,ol&&INK,ol); // shirt or dress
  if(!girl){                                                                             // shorts
    const sy2=bodyBot+legH*0.30;
    poly([[x-hem,bodyBot-h*0.005],[x+hem,bodyBot-h*0.005],[x+hem*1.12,sy2],[x+h*0.012,sy2],
          [x,bodyBot+legH*0.14],[x-h*0.012,sy2],[x-hem*1.12,sy2]],darker(cloth,0.34),ol&&INK,ol);
  }
  [-1,1].forEach(sd=>limb(x+sd*shoulder*0.72,bodyTop+bodyH*0.14,x+sd*(shoulder+h*0.045),bodyBot-h*0.015,limbW*0.92,skin,ol)); // arms
  circle(x,headCy,headR,skin); if(ol) ring(x,headCy,headR,INK,ol);                       // head
  ctx.save();                                                                            // hair, down to a hairline above the eyes
  ctx.beginPath(); ctx.arc(x,headCy,headR,0,TAU); ctx.clip();
  const brow=headCy-headR*(girl?0.24:0.32), dip=headR*(girl?0.14:0.16);
  ctx.beginPath();
  ctx.moveTo(x-headR*1.2,headCy-headR*1.3); ctx.lineTo(x+headR*1.2,headCy-headR*1.3);
  ctx.lineTo(x+headR*1.2,brow);
  ctx.quadraticCurveTo(x,brow+dip*2,x-headR*1.2,brow);                                   // soft fringe
  ctx.closePath(); ctx.fillStyle=hairC; ctx.fill();
  ctx.restore();
  if(girl){ [-1,1].forEach(sd=>{                                                         // pigtails
    circle(x+sd*headR*1.02,headCy+headR*0.16,headR*0.40,hairC);
    if(ol) ring(x+sd*headR*1.02,headCy+headR*0.16,headR*0.40,INK,ol);
  }); }
  if(headR>7){                                                                           // face, once it can be seen
    circle(x-headR*0.33,headCy+headR*0.08,headR*0.10,INK);
    circle(x+headR*0.33,headCy+headR*0.08,headR*0.10,INK);
    ctx.strokeStyle=INK; ctx.lineWidth=Math.max(1,headR*0.09); ctx.lineCap='round';
    ctx.beginPath(); ctx.arc(x,headCy+headR*0.18,headR*0.36,0.35,Math.PI-0.35); ctx.stroke();
  }
  ctx.restore();
}

/* --- trees --- */
function trunk(x,base,w,h,c,ol){ ctx.fillStyle=c; ctx.fillRect(x-w/2,base-h,w,h); if(ol){ ctx.strokeStyle=INK; ctx.lineWidth=ol; ctx.strokeRect(x-w/2,base-h,w,h);} }
function drawTree(o,x,base,h,w){
  const ol=outlineW(h);
  if(o.draw==='apple'){
    trunk(x,base,w*0.18,h*0.46,'#8b5a2b',ol);
    const r=w/2, cy=base-h+r;
    circle(x,cy,r,'#4caf50'); if(ol) ring(x,cy,r,INK,ol);
    if(h>40){ [[-.45,-.1],[.2,-.45],[.4,.3],[-.15,.45],[.05,0]].forEach(p=>circle(x+p[0]*r,cy+p[1]*r,r*0.11,'#e53935')); }
  }else if(o.draw==='palm'){
    const top=base-h*0.86, tx=x+w*0.12;
    ctx.strokeStyle='#a0763b'; ctx.lineWidth=Math.max(1.5,w*0.13); ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(x,base); ctx.quadraticCurveTo(x,base-h*0.5,tx,top); ctx.stroke();
    if(ol){ ctx.strokeStyle=INK; ctx.lineWidth=Math.max(1.5,w*0.13)+ol*2; ctx.globalCompositeOperation='destination-over'; ctx.stroke(); ctx.globalCompositeOperation='source-over'; }
    for(let i=0;i<7;i++){
      const a=-Math.PI+i*(Math.PI/6)+0.05;
      ctx.save(); ctx.translate(tx,top); ctx.rotate(a);
      ctx.fillStyle='#3fa34d'; ctx.beginPath(); ctx.ellipse(w*0.3,w*0.03,w*0.32,w*0.09,0.12,0,TAU); ctx.fill();
      if(ol){ ctx.strokeStyle=INK; ctx.lineWidth=ol; ctx.stroke(); }
      ctx.restore();
    }
    if(h>40) [[-1,0],[0,1],[1,.2]].forEach(p=>circle(tx+p[0]*w*0.07,top+w*0.08+p[1]*w*0.05,w*0.05,'#6b4a2b'));
  }else if(o.draw==='pine'){
    trunk(x,base,w*0.16,h*0.24,'#6d4423',ol);
    [[1,.12,.55],[.8,.38,.8],[.58,.62,1]].forEach(([wf,b,tp])=>
      poly([[x-w*wf/2,base-h*b],[x,base-h*tp],[x+w*wf/2,base-h*b]],'#2e8b57',ol&&INK,ol));
  }else if(o.draw==='redwood'){
    trunk(x,base,w*0.3,h*0.36,'#7a3e1d',ol);
    poly([[x-w/2,base-h*0.3],[x-w*0.36,base-h*0.6],[x-w*0.18,base-h*0.85],[x,base-h],[x+w*0.18,base-h*0.85],[x+w*0.36,base-h*0.6],[x+w/2,base-h*0.3]],'#2f7a3f',ol&&INK,ol);
  }
}

/* --- mountains --- */
function mountain(x,base,h,w,pathFn,color,snow,ol){
  ctx.beginPath(); pathFn(); ctx.closePath();
  ctx.fillStyle=color; ctx.fill();
  if(snow>0&&h>6){
    ctx.save(); ctx.clip();
    ctx.fillStyle='#ffffff'; ctx.beginPath();
    const y0=base-h*(1-snow), n=8; ctx.moveTo(x-w,y0);
    for(let i=0;i<=n;i++) ctx.lineTo(x-w/2+i*w/n, y0+(i%2?h*0.05:-h*0.02));
    ctx.lineTo(x+w,y0); ctx.lineTo(x+w,base-h*3); ctx.lineTo(x-w,base-h*3); ctx.closePath(); ctx.fill();
    ctx.restore();
  }
  if(ol){ ctx.beginPath(); pathFn(); ctx.closePath(); ctx.strokeStyle=INK; ctx.lineWidth=ol; ctx.lineJoin='round'; ctx.stroke(); }
}
function drawMountain(o,x,base,h,w){
  const ol=outlineW(h);
  const P=pts=>()=>pts.forEach((p,i)=>{ const X=x+p[0]*w, Y=base-p[1]*h; i?ctx.lineTo(X,Y):ctx.moveTo(X,Y); });
  if(o.draw==='hill'){
    mountain(x,base,h,w,()=>ctx.ellipse(x,base,w/2,h,0,Math.PI,TAU),'#7fcf5a',0,ol);
    if(h>30){ circle(x-w*0.18,base-h*0.55,h*0.08,'#e53935'); circle(x+w*0.22,base-h*0.35,h*0.08,'#fff'); }
  }else if(o.draw==='mountain'){
    mountain(x,base,h,w,P([[-.5,0],[-.3,.42],[-.2,.36],[0,1],[.14,.72],[.3,.5],[.5,0]]),'#8d7b68',.25,ol);
  }else if(o.draw==='fuji'){
    mountain(x,base,h,w,()=>{ ctx.moveTo(x-w/2,base); ctx.quadraticCurveTo(x-w*0.12,base-h*0.3,x-w*0.08,base-h); ctx.lineTo(x+w*0.08,base-h); ctx.quadraticCurveTo(x+w*0.12,base-h*0.3,x+w/2,base); },'#6d7fa6',.38,ol);
  }else if(o.draw==='everest'){
    mountain(x,base,h,w,P([[-.5,0],[-.36,.36],[-.24,.6],[-.14,.52],[0,1],[.1,.78],[.2,.84],[.34,.44],[.5,0]]),'#8a8f9a',.45,ol);
  }
}

/* --- planets and stars --- */
function planetBase(x,y,r,c1,c2){ const g=ctx.createRadialGradient(x-r*0.35,y-r*0.35,r*0.1,x,y,r); g.addColorStop(0,c1); g.addColorStop(1,c2); circle(x,y,r,g); }
function planetShade(x,y,r){ const g=ctx.createRadialGradient(x-r*0.3,y-r*0.3,r*0.3,x,y,r*1.02); g.addColorStop(0,'rgba(255,255,255,0.12)'); g.addColorStop(0.72,'rgba(0,0,0,0)'); g.addColorStop(1,'rgba(10,10,50,0.5)'); circle(x,y,r,g); }
function clipCircle(x,y,r){ ctx.beginPath(); ctx.arc(x,y,r,0,TAU); ctx.clip(); }
function drawPlanet(o,x,y,r){
  const ol=outlineW(r*2);
  ctx.save();
  if(o.draw==='moon'){
    planetBase(x,y,r,'#f0f0f6','#9d9dab');
    if(r>10){ clipCircle(x,y,r); [[-.3,-.2,.22],[.35,.12,.16],[-.05,.48,.12],[.25,-.5,.1],[-.55,.3,.1]].forEach(c=>{ circle(x+c[0]*r,y+c[1]*r,c[2]*r,'#b6b6c4'); ring(x+c[0]*r,y+c[1]*r,c[2]*r,'#9a9aa8',Math.max(1,r*0.02)); }); }
  }else if(o.draw==='mars'){
    planetBase(x,y,r,'#ff9a66','#b8390e');
    if(r>10){ clipCircle(x,y,r); ctx.fillStyle='#9a2f0a'; ctx.beginPath(); ctx.ellipse(x+r*0.2,y+r*0.1,r*0.5,r*0.2,-0.4,0,TAU); ctx.fill();
      ctx.fillStyle='#fff'; ctx.beginPath(); ctx.ellipse(x,y-r*0.93,r*0.3,r*0.1,0,0,TAU); ctx.fill(); }
  }else if(o.draw==='neptune'){
    planetBase(x,y,r,'#79bdff','#1f49b8');
    if(r>10){ clipCircle(x,y,r); ctx.strokeStyle='rgba(255,255,255,0.22)'; ctx.lineWidth=r*0.09; [-0.35,0.05,0.4].forEach(k=>{ ctx.beginPath(); ctx.moveTo(x-r,y+k*r); ctx.lineTo(x+r,y+k*r); ctx.stroke(); }); }
  }else if(o.draw==='jupiter'){
    clipCircle(x,y,r); ctx.fillStyle='#ebcaa2'; ctx.fillRect(x-r,y-r,2*r,2*r);
    if(r>8){ [[-.78,.1,'#c98a4b'],[-.5,.12,'#dda36c'],[-.18,.16,'#b87a44'],[.16,.1,'#dda36c'],[.44,.16,'#c98a4b'],[.74,.1,'#b87a44']].forEach(b=>{ ctx.fillStyle=b[2]; ctx.fillRect(x-r,y+b[0]*r-b[1]*r/2,2*r,b[1]*r); });
      ctx.fillStyle='#c8553d'; ctx.beginPath(); ctx.ellipse(x+r*0.3,y+r*0.36,r*0.22,r*0.12,0,0,TAU); ctx.fill(); }
  }else if(o.draw==='earth'){
    drawEarthBall(x,y,r,0);
  }
  if(o.draw!=='earth') planetShade(x,y,r);
  ctx.restore();
  if(ol&&o.draw!=='earth') ring(x,y,r,INK,ol);
}
function drawStar(o,x,y,r){
  const c=o.color;
  const gl=ctx.createRadialGradient(x,y,r*0.85,x,y,r*1.7); gl.addColorStop(0,rgba(c,0.6)); gl.addColorStop(1,rgba(c,0));
  circle(x,y,r*1.7,gl);
  const g=ctx.createRadialGradient(x-r*0.25,y-r*0.25,r*0.05,x,y,r); g.addColorStop(0,'#ffffff'); g.addColorStop(0.4,c); g.addColorStop(1,darker(c,0.3));
  circle(x,y,r,g);
  if(r>40){ ctx.save(); clipCircle(x,y,r); ctx.fillStyle='rgba(255,255,255,0.10)';
    for(let i=0;i<6;i++){ const a=i*1.05; ctx.beginPath(); ctx.ellipse(x+Math.cos(a)*r*0.5,y+Math.sin(a)*r*0.5,r*0.16,r*0.09,a,0,TAU); ctx.fill(); }
    ctx.restore(); }
}

/* --- galaxies --- */
function drawGalaxy(o,x,y,rw,rh){
  ctx.save(); ctx.translate(x,y);
  if(o.draw==='spiral'){
    ctx.rotate(-0.35); ctx.scale(1,rh/rw);
    const g=ctx.createRadialGradient(0,0,0,0,0,rw); g.addColorStop(0,'#fff7d6'); g.addColorStop(0.16,'rgba(255,225,205,0.9)'); g.addColorStop(0.5,'rgba(190,170,255,0.5)'); g.addColorStop(1,'rgba(120,110,220,0)');
    circle(0,0,rw,g);
    if(rw>14){
      ctx.strokeStyle='rgba(255,255,255,0.32)'; ctx.lineWidth=rw*0.09; ctx.lineCap='round';
      for(let arm=0;arm<2;arm++){ ctx.beginPath(); for(let k=0;k<=48;k++){ const th=k/48*3.7, rr=rw*0.12*Math.exp(0.55*th); if(rr>rw*0.96) break; const a=th+arm*Math.PI; k?ctx.lineTo(Math.cos(a)*rr,Math.sin(a)*rr):ctx.moveTo(Math.cos(a)*rr,Math.sin(a)*rr); } ctx.stroke(); }
      const rnd=seeded(o.i+11);
      for(let k=0;k<50;k++){ const a=rnd()*TAU, rr=Math.sqrt(rnd())*rw*0.92; circle(Math.cos(a)*rr,Math.sin(a)*rr,rw*0.008+rnd()*rw*0.012,'rgba(255,255,255,0.85)'); }
    }
    circle(0,0,rw*0.1,'#fff9e6');
  }else{
    const rnd=seeded(o.i+5);
    for(let k=0;k<4;k++){ const ox=(rnd()-.5)*rw*0.9, oy=(rnd()-.5)*rh*0.9, rr=rw*(0.4+rnd()*0.3);
      const g=ctx.createRadialGradient(ox,oy,0,ox,oy,rr); g.addColorStop(0,'rgba(240,243,255,0.9)'); g.addColorStop(0.5,'rgba(190,200,255,0.4)'); g.addColorStop(1,'rgba(150,160,255,0)'); circle(ox,oy,rr,g); }
    if(o.i===1&&rw>8) circle(rw*0.45,-rh*0.2,rw*0.13,'rgba(255,120,140,0.85)');
  }
  ctx.restore();
}

/* --- dispatch --- */
function drawObject(o,x,y,hPx,wPx,alpha){
  ctx.save(); ctx.globalAlpha=alpha;
  if(o.emoji){
    ctx.font=hPx+'px '+EMOJI_FONT; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(o.emoji,x,y-hPx*0.5);
  }else if(o.level.water) drawMicrobe(o,x,y,wPx,hPx);
  else if(o.draw==='person') drawPerson(o,x,y,hPx);
  else if(o.level.id==='trees') drawTree(o,x,y,hPx,wPx);
  else if(o.level.id==='mountains') drawMountain(o,x,y,hPx,wPx);
  else if(o.level.id==='planets') drawPlanet(o,x,y,hPx/2);
  else if(o.level.id==='stars') drawStar(o,x,y,hPx/2);
  else if(o.level.id==='galaxies') drawGalaxy(o,x,y,wPx/2,hPx/2);
  ctx.restore();
}

/* --- name tags --- */
function drawLabel(o,x,bottom,row,dark,alpha){
  const y=bottom+17+row*30;
  ctx.save(); ctx.globalAlpha=alpha; ctx.textAlign='center'; ctx.textBaseline='alphabetic'; ctx.lineJoin='round';
  ctx.strokeStyle=dark?'rgba(255,248,231,0.75)':'rgba(18,16,58,0.75)'; ctx.lineWidth=4;
  ctx.fillStyle=dark?INK:'#fff8e7';
  ctx.font='800 13px '+LABEL_FONT; ctx.strokeText(o.name,x,y); ctx.fillText(o.name,x,y);
  ctx.font='700 12px '+LABEL_FONT; ctx.globalAlpha=alpha*0.9; const s=friendlySize(o); ctx.strokeText(s,x,y+14); ctx.fillText(s,x,y+14);
  ctx.restore();
}

/* --- "they are all in this dot" --- */
function drawMarker(t){
  const collapsed=LEVELS.filter(L=>L.maxSize/C.mpp<3);
  if(!collapsed.length) return;
  const last=collapsed[collapsed.length-1];
  const a=clamp((3-last.maxSize/C.mpp)/2,0,1);
  const px=sx(0), py=sy(0);
  if(px<-20||px>V.w+20||py<-20||py>V.h+20) return;
  ctx.save(); ctx.globalAlpha=a;
  const pr=10+3*Math.sin(t*4);
  ring(px,py,pr,'#ffd23f',3); circle(px,py,3.5,'#ffd23f');
  const icons=collapsed.map(L=>L.icon).join(''), text=collapsed.length>1?' are all in here!':' are in here!';
  ctx.font='17px '+EMOJI_FONT; const iw=ctx.measureText(icons).width;
  ctx.font='800 14px '+LABEL_FONT; const tw=ctx.measureText(text).width;
  const bw=iw+tw+24, bh=36; let bx=px+22, by=py-64;
  if(bx+bw>V.w-8) bx=px-22-bw;
  if(by<8) by=py+28;
  ctx.strokeStyle=INK; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(px+Math.sign(bx-px)*pr*0.8,py-pr*0.8); ctx.lineTo(bx<px?bx+bw:bx,by+bh*0.7); ctx.stroke();
  rrect(bx,by,bw,bh,12); ctx.fillStyle='#fffdf7'; ctx.fill(); ctx.strokeStyle=INK; ctx.lineWidth=3; ctx.stroke();
  ctx.textAlign='left'; ctx.textBaseline='middle';
  ctx.font='17px '+EMOJI_FONT; ctx.fillStyle='#000'; ctx.fillText(icons,bx+12,by+bh/2+1);
  ctx.font='800 14px '+LABEL_FONT; ctx.fillStyle=INK; ctx.fillText(text,bx+12+iw,by+bh/2+1);
  ctx.restore();
}

/* --- rocket speed lines and confetti --- */
function drawWhoosh(speed){
  const a=clamp(speed/6,0,0.4); if(a<0.03) return;
  ctx.save(); ctx.globalAlpha=a; ctx.strokeStyle='#fff'; ctx.lineWidth=2; ctx.lineCap='round';
  const cx=V.w/2, cy=V.h/2, R=Math.hypot(cx,cy);
  for(let i=0;i<30;i++){ const ang=i*TAU/30+0.13, r0=R*(0.35+0.25*((i*37)%7)/7); ctx.beginPath(); ctx.moveTo(cx+Math.cos(ang)*r0,cy+Math.sin(ang)*r0); ctx.lineTo(cx+Math.cos(ang)*R,cy+Math.sin(ang)*R); ctx.stroke(); }
  ctx.restore();
}
const confetti=[];
function burstConfetti(){
  if(REDUCED) return;
  const rnd=seeded(Date.now()%977+1), cols=['#ff6b35','#ffd23f','#4fb3f6','#63c64d','#fffdf7','#ff4fa3'];
  for(let i=0;i<110;i++) confetti.push({x:rnd()*V.w,y:-10-rnd()*120,vx:(rnd()-.5)*80,vy:60+rnd()*90,r:rnd()*TAU,vr:(rnd()-.5)*8,c:cols[i%cols.length],s:7+rnd()*7});
}
function drawConfetti(dt){
  for(let i=confetti.length-1;i>=0;i--){
    const p=confetti[i]; p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=70*dt; p.r+=p.vr*dt;
    if(p.y>V.h+20){ confetti.splice(i,1); continue; }
    ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r); ctx.fillStyle=p.c; ctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2); ctx.restore();
  }
}

/* --- one frame --- */
let selected=null, visible=[];
function render(t,dt,speed){
  C=cameraAt(cam.z);
  ctx.setTransform(V.dpr,0,0,V.dpr,0,0);
  drawBackground(t);
  drawGround();
  drawDrop();
  visible=[];
  for(const L of LEVELS) for(const o of L.objects){
    const hPx=o.size*o.h/C.mpp, wPx=o.size*o.w/C.mpp, big=Math.max(hPx,wPx);
    if(big<0.4) continue;
    const cap=o.emoji?2.5*V.h:10*V.h;
    if(big>cap) continue;
    const alpha=o.emoji?clamp((2.5*V.h-big)/(1.2*V.h),0,1):clamp((10*V.h-big)/(6*V.h),0,1);
    const x=sx(o.x), y=L.water?sy(o.wy):L.ground?sy(0):sy(-R_EARTH);
    if(x+wPx/2<-60||x-wPx/2>V.w+60) continue;
    if(o.draw!=='earth') drawObject(o,x,y,hPx,wPx,alpha);
    visible.push({o,x,y,hPx,wPx,alpha,big});
  }
  for(const v of visible){
    const minTag = v.o.level.index===current ? 2.5 : 70;  // "you" gets a tag even at 3px; other levels' leftovers stay quiet
    if(v.big>=minTag&&v.big<=2.2*V.h){
      const bottom=v.o.level.water?sy(0):v.o.level.ground?v.y:v.y+v.hPx/2;
      drawLabel(v.o,v.x,bottom,v.o.row||0,C.g>0.5,v.alpha*clamp((v.big-3)/5,0.35,1));
    }
  }
  drawMarker(t);
  if(selected){
    const v=visible.find(v=>v.o===selected);
    if(v){ const cy=v.o.level.ground?v.y-v.hPx/2:v.y, rr=Math.max(16,v.big/2+10);
      ctx.save(); ctx.setLineDash([8,6]); ctx.lineDashOffset=-t*30; ring(v.x,cy,rr,'#ffd23f',4); ctx.restore(); }
  }
  drawWhoosh(speed);
  drawConfetti(dt);
}

/* --- the little portrait on the info card --- */
const thumb=document.getElementById('thumb'), tctx=thumb.getContext('2d');
function drawThumb(o){
  const realCtx=ctx, S=84;
  ctx=tctx;                                 // the drawing helpers write to whatever `ctx` is
  ctx.setTransform(2,0,0,2,0,0); ctx.clearRect(0,0,S,S);
  if(o.level.water){ const g=ctx.createLinearGradient(0,0,0,S); g.addColorStop(0,'#9ee4f6'); g.addColorStop(1,'#4aa6d6'); ctx.fillStyle=g; ctx.fillRect(0,0,S,S); }
  else if(o.level.ground){ const g=ctx.createLinearGradient(0,0,0,S); g.addColorStop(0,'#3d9be9'); g.addColorStop(1,'#cdeeff'); ctx.fillStyle=g; ctx.fillRect(0,0,S,S); ctx.fillStyle='#7ed957'; ctx.fillRect(0,S*0.82,S,S*0.18); }
  else{ ctx.fillStyle='#12103a'; ctx.fillRect(0,0,S,S); ctx.fillStyle='#fff6d8'; for(let i=0;i<14;i++) ctx.fillRect((i*37)%S,(i*53)%S,1.5,1.5); }
  const h=o.level.ground?S*0.62:S*0.66, w=h*o.w/o.h;
  const fit=Math.min(1,(S*0.9)/w), hh=h*fit, ww=w*fit;
  if(o.draw==='earth') drawEarthBall(S/2,S/2,hh/2,0);
  else if(o.level.water) drawObject(o,S/2,S/2,hh,ww,1);
  else if(o.level.ground) drawObject(o,S/2,S*0.82,hh,ww,1);
  else drawObject(o,S/2,S/2,hh,ww,1);
  ctx=realCtx;
}
/* =====================================================================
   BUTTONS, TAPS, AND THE TOUR
   ===================================================================== */
const $=id=>document.getElementById(id);
const els={ zoomNum:$('zoomNum'), pills:$('pills'), capLevel:$('capLevel'), capText:$('capText'), caption:$('caption'), hint:$('hint'),
  card:$('card'), cardName:$('cardName'), cardSize:$('cardSize'), cardFact:$('cardFact'), cardMeters:$('cardMeters'), cardClose:$('cardClose'),
  toast:$('toast'), levels:$('levels'), btnIn:$('btnIn'), btnOut:$('btnOut'), btnPlay:$('btnPlay'), zoom:$('zoom') };

LEVELS.forEach((L,i)=>{
  const b=document.createElement('button'); b.className='lvl'; b.type='button'; b.textContent=L.icon; b.title=L.name; b.setAttribute('aria-label','Go to '+L.name);
  b.addEventListener('click',()=>{ stopPlay(); goTo(i); });
  els.levels.appendChild(b); L.chip=b;
});

/* --- zoom power meter --- */
let pillCount=-1;
function updateMeter(){
  const f=Math.max(1,zoomFactor(cam.z)), txt='×'+bigRound(f);
  els.zoomNum.textContent=txt; els.zoomNum.classList.toggle('long',txt.length>13);
  const n=Math.floor(Math.log10(f)+1e-9);
  if(n!==pillCount){
    while(els.pills.children.length>n) els.pills.lastChild.remove();
    while(els.pills.children.length<n){ const p=document.createElement('span'); p.className='pill'+(els.pills.children.length>=10?' hot':''); p.textContent='×10'; els.pills.appendChild(p); }
    pillCount=n;
  }
}

/* --- words on the screen --- */
function setCaption(i){
  const L=LEVELS[i];
  els.capLevel.textContent=L.icon+' '+L.name;
  let txt=L.caption;
  if(i>0) txt='All the '+LEVELS.slice(0,i).map(p=>p.icon).join('')+' fit in one dot now! '+txt;
  els.capText.innerHTML=txt;
  if(!REDUCED){ els.caption.classList.remove('bump'); void els.caption.offsetWidth; els.caption.classList.add('bump'); }
}
let toastTimer=null;
function toast(msg){ els.toast.textContent=msg; els.toast.hidden=false; clearTimeout(toastTimer); toastTimer=setTimeout(()=>{ els.toast.hidden=true; },4000); }
function updateChips(i){ LEVELS.forEach((L,k)=>{ L.chip.classList.toggle('on',k===i); L.chip.classList.toggle('done',k<i); }); }
function updateButtons(){
  els.btnIn.disabled=(current===0);
  const atEnd=(current===LAST);
  els.btnOut.textContent=atEnd?'🔁 Back to bugs!':'🚀 ZOOM OUT!';
  els.btnOut.classList.toggle('home',atEnd);
}

/* --- moving the camera --- */
function goTo(i,opts){
  i=clamp(i,0,LAST); opts=opts||{};
  const from=cam.z, to=LEVELS[i].z, dz=Math.abs(to-from), fromLevel=current;
  closeCard(); els.hint.hidden=true;
  current=i; updateChips(i); updateButtons();
  if(REDUCED||dz<1e-6){ cam.z=to; tween=null; arrive(i,fromLevel); return; }
  tween={from,to,t0:performance.now(),dur:opts.dur||clamp(900+380*dz,900,5200),target:i,fromLevel};
}
function arrive(i,fromLevel){
  tween=null; cam.z=LEVELS[i].z; current=i;
  setCaption(i); updateChips(i); updateButtons(); syncSlider(); updateMeter();
  if(pendingMaker&&i===PEOPLE){ pendingMaker=false; openMaker(); }
  else if(i===PEOPLE&&!metMe&&!playing) openMaker();
  if(i===LAST){ burstConfetti(); toast('WOW! You zoomed out ×'+bigRound(zoomFactor(cam.z))+'!'); }
  else if(i===0&&fromLevel===LAST) toast('Back home! The bugs look BIG again.');
  if(playing) schedulePlay();
}

/* --- the tour --- */
let playing=false, playTimer=null;
function schedulePlay(){ clearTimeout(playTimer); playTimer=setTimeout(()=>{ if(playing) goTo(current===LAST?0:current+1); }, current===LAST?6500:4200); }
function startPlay(){ playing=true; els.btnPlay.textContent='⏸ Pause'; els.btnPlay.classList.add('on'); if(!tween) goTo(current===LAST?0:current+1); }
function stopPlay(){ playing=false; clearTimeout(playTimer); els.btnPlay.textContent='▶ Play'; els.btnPlay.classList.remove('on'); }
els.btnPlay.addEventListener('click',()=>playing?stopPlay():startPlay());
els.btnOut.addEventListener('click',()=>{ stopPlay(); goTo(current===LAST?0:current+1); });
els.btnIn.addEventListener('click',()=>{ stopPlay(); goTo(current-1); });

/* --- the slider: free zooming --- */
const Z0=()=>LEVELS[0].z-0.3, Z1=()=>LEVELS[LAST].z+0.3;
function syncSlider(){ els.zoom.value=Math.round(1000*(cam.z-Z0())/(Z1()-Z0())); }
els.zoom.addEventListener('input',()=>{
  stopPlay(); tween=null; closeCard(); els.hint.hidden=true;
  cam.z=Z0()+(Z1()-Z0())*els.zoom.value/1000;
  const n=nearestLevel(cam.z);
  if(n!==current){ current=n; setCaption(n); updateChips(n); updateButtons(); }
  updateMeter();
});
els.zoom.addEventListener('change',()=>{ const n=nearestLevel(cam.z); if(Math.abs(cam.z-LEVELS[n].z)<0.35) goTo(n,{dur:500}); });

/* --- tap a thing --- */
let pDown=null;
view.addEventListener('pointerdown',e=>{ pDown={x:e.clientX,y:e.clientY}; });
view.addEventListener('pointerup',e=>{
  if(!pDown) return;
  const moved=Math.hypot(e.clientX-pDown.x,e.clientY-pDown.y); pDown=null;
  if(moved>12) return;
  const r=view.getBoundingClientRect(), hit=hitTest(e.clientX-r.left,e.clientY-r.top);
  if(hit&&hit.o.me) openMaker();          // tapping yourself opens the character maker
  else if(hit) showCard(hit.o); else closeCard();
});
function hitTest(x,y){
  let best=null, bestArea=Infinity;
  for(const v of visible){
    if(v.big<0.5) continue;
    const cy=v.o.level.ground?v.y-v.hPx/2:v.y;
    const hw=Math.max(v.wPx/2,16), hh=Math.max(v.hPx/2,16);
    if(Math.abs(x-v.x)<=hw+4&&Math.abs(y-cy)<=hh+4){ const area=hw*hh; if(area<bestArea){ best=v; bestArea=area; } }
  }
  return best;
}
function showCard(o){
  selected=o;
  els.cardName.textContent=o.name; els.cardSize.textContent=friendlySize(o);
  els.cardFact.textContent=o.fact; els.cardMeters.textContent=metersLine(o);
  drawThumb(o); els.card.hidden=false; els.hint.hidden=true;
}
function closeCard(){ selected=null; els.card.hidden=true; }
els.cardClose.addEventListener('click',closeCard);

/* --- keyboard --- */
window.addEventListener('keydown',e=>{
  const tag=e.target.tagName;
  if(makerOpen()){ if(e.key==='Escape') closeMaker(); return; }
  if(tag==='INPUT') return;
  if((e.key===' '||e.key==='Enter')&&tag==='BUTTON') return;
  if(e.key==='ArrowRight'||e.key===' '||e.key==='Enter'){ e.preventDefault(); els.btnOut.click(); }
  else if(e.key==='ArrowLeft'){ e.preventDefault(); els.btnIn.click(); }
  else if(e.key==='Escape') closeCard();
  else if(e.key==='p'||e.key==='P') els.btnPlay.click();
});

/* --- make yourself --- */
const mk={ box:$('maker'), close:$('makerClose'), done:$('makerDone'), btn:$('btnMe'),
  sex:$('optSex'), skin:$('optSkin'), hair:$('optHair'), outfit:$('optOutfit'),
  h:$('meH'), cm:$('meCm'), age:$('meAge'), canvas:$('mePreview') };
const mctx=mk.canvas.getContext('2d');
const AGES=[[95,'most 2-year-olds'],[105,'most 4-year-olds'],[113,'most 5-year-olds'],[120,'most 6-year-olds'],
            [127,'most 7-year-olds'],[133,'most 8-year-olds'],[140,'most 9-year-olds'],[147,'most 10-year-olds'],
            [155,'most 12-year-olds'],[999,'a lot of grown-ups']];
function ageHint(cm){ for(const [max,txt] of AGES) if(cm<=max) return 'About as tall as '+txt+'.'; }

function swatches(host,colors,key){
  colors.forEach((c,k)=>{
    const b=document.createElement('button'); b.type='button'; b.className='sw'; b.style.background=c;
    b.setAttribute('aria-label',key+' '+(k+1));
    b.addEventListener('click',()=>{ ME[key]=k; markOptions(); remakeMe(); });
    host.appendChild(b);
  });
}
[['boy','👦 Boy'],['girl','👧 Girl']].forEach(([val,label])=>{
  const b=document.createElement('button'); b.type='button'; b.className='seg'; b.textContent=label; b.dataset.sex=val;
  b.addEventListener('click',()=>{ ME.sex=val; markOptions(); remakeMe(); });
  mk.sex.appendChild(b);
});
swatches(mk.skin,SKINS,'skin'); swatches(mk.hair,HAIRS,'hair'); swatches(mk.outfit,OUTFITS,'outfit');

function markOptions(){
  [...mk.sex.children].forEach(b=>b.classList.toggle('on',b.dataset.sex===ME.sex));
  [[mk.skin,'skin'],[mk.hair,'hair'],[mk.outfit,'outfit']].forEach(([host,key])=>
    [...host.children].forEach((b,k)=>b.classList.toggle('on',k===ME[key])));
  const cm=Math.round(ME.h*100);
  mk.h.value=cm; mk.cm.textContent=cm+' cm'; mk.age.textContent=ageHint(cm);
}

// your character, drawn against a real centimeter ruler
function drawMePreview(){
  const real=ctx; ctx=mctx;
  const W=170,H=250,baseY=H-20;
  ctx.setTransform(2,0,0,2,0,0);
  const sky=ctx.createLinearGradient(0,0,0,H); sky.addColorStop(0,'#bfe6ff'); sky.addColorStop(1,'#eefaff');
  ctx.fillStyle=sky; ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#7ed957'; ctx.fillRect(0,baseY,W,H-baseY);
  ctx.fillStyle='#4e7d2b'; ctx.fillRect(0,baseY,W,2);
  const pxm=(baseY-14)/1.8, rx=30;
  ctx.strokeStyle=INK; ctx.lineCap='butt';
  ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(rx,baseY); ctx.lineTo(rx,baseY-1.8*pxm); ctx.stroke();
  ctx.font='700 9px '+LABEL_FONT; ctx.fillStyle=INK; ctx.textAlign='right'; ctx.textBaseline='middle';
  for(let cm=0;cm<=180;cm+=25){
    const y=baseY-cm/100*pxm, big=cm%50===0;
    ctx.beginPath(); ctx.moveTo(rx,y); ctx.lineTo(rx+(big?9:5),y); ctx.stroke();
    if(big&&cm>0) ctx.fillText(cm,rx-3,y);
  }
  const me={me:true,size:ME.h,w:.42,h:1,level:{ground:true,id:'people'}}, px=rx+56, top=baseY-ME.h*pxm;
  ctx.save(); ctx.setLineDash([4,4]); ctx.strokeStyle='rgba(43,35,80,.5)'; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.moveTo(rx,top); ctx.lineTo(W-8,top); ctx.stroke(); ctx.restore();
  drawPerson(me,px,baseY,ME.h*pxm);
  ctx=real;
}

// your height feeds the layout, so the whole world re-measures around you
function remakeMe(){
  ME.h=clamp(ME.h,ME_MIN,ME_MAX);
  MY_OBJECTS.forEach(o=>{ o.size=ME.h; });
  remeasureLevels();
  const parked = !tween && Math.abs(cam.z-LEVELS[current].z)<1e-9;
  layout();
  if(parked) cam.z=LEVELS[current].z;
  syncSlider(); updateMeter(); markOptions(); drawMePreview(); saveMe();
}
mk.h.addEventListener('input',()=>{ ME.h=(+mk.h.value)/100; remakeMe(); });

let metMe=false, pendingMaker=false;
function openMaker(){ stopPlay(); closeCard(); els.hint.hidden=true; metMe=true; markOptions(); drawMePreview(); mk.box.hidden=false; mk.done.focus(); }
function closeMaker(){ mk.box.hidden=true; }
const makerOpen=()=>!mk.box.hidden;
mk.close.addEventListener('click',closeMaker);
mk.done.addEventListener('click',closeMaker);
mk.box.addEventListener('click',e=>{ if(e.target===mk.box) closeMaker(); });
mk.btn.addEventListener('click',()=>{
  stopPlay();
  if(current===PEOPLE&&!tween) openMaker();
  else { pendingMaker=true; goTo(PEOPLE); }
});

/* --- go --- */
let lastT=performance.now(), lastZ=0;
function frame(now){
  const dt=Math.min(0.05,(now-lastT)/1000); lastT=now;
  if(tween){
    const k=clamp((now-tween.t0)/tween.dur,0,1);
    cam.z=lerp(tween.from,tween.to,easeInOut(k));
    updateMeter(); syncSlider();
    if(k>=1) arrive(tween.target,tween.fromLevel);
  }
  const speed=Math.abs(cam.z-lastZ)/Math.max(dt,1e-3); lastZ=cam.z;
  render(now/1000,dt,speed);
  requestAnimationFrame(frame);
}
if(document.fonts&&document.fonts.load){ document.fonts.load('800 13px Nunito'); document.fonts.load('700 20px Fredoka'); }
new ResizeObserver(resize).observe(stage);
resize(); cam.z=LEVELS[0].z; lastZ=cam.z;
setCaption(0); updateChips(0); updateButtons(); updateMeter(); syncSlider();
markOptions(); drawMePreview();
requestAnimationFrame(frame);
</script>
</body>
