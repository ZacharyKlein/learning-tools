<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Inside a Tree</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;800&display=swap">
<style>
/* ---------- tokens: the Learning Tools sketchbook, plus a tree's own colors ---------- */
:root{
  --ink:#2b2350;        /* indigo-plum, all text + outlines */
  --paper:#fff8e7;      /* butter cream ground */
  --paper-2:#ffefc2;    /* deeper butter for chrome */
  --rocket:#ff6b35;     /* the one loud thing: NEXT PART */
  --rocket-dk:#c2431a;
  --sky:#4fb3f6;
  --grass:#63c64d;
  --gold:#ffd23f;
  --space:#12103a;
  --white:#fffdf7;
  --leaf:#3f9d3a;
  --leaf-dk:#2e7d32;
  --bark:#7a4b2a;
  --soil:#8b5a2b;
  --water:#3b8beb;
  --sugar:#ff6f9c;
  --display:"Fredoka","Chalkboard SE","Comic Sans MS","Segoe UI Rounded",ui-rounded,system-ui,sans-serif;
  --body:"Nunito","Segoe UI Rounded",ui-rounded,"Segoe UI",system-ui,sans-serif;
  --emoji:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji","Twemoji Mozilla",sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:var(--body);
  font-size:16px;
  line-height:1.3;
  -webkit-text-size-adjust:100%;
  overflow:hidden;
}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:4px solid var(--sky);outline-offset:3px}

.app{
  height:100vh;height:100dvh;
  display:grid;
  grid-template-rows:auto 1fr auto;
  gap:10px;
  padding:10px 14px 12px;
  max-width:1180px;
  margin:0 auto;
}

/* ---------- header ---------- */
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.brand h1{
  font-family:var(--display);font-weight:700;font-size:38px;line-height:1;margin:0;
  letter-spacing:.5px;color:var(--ink);text-shadow:3px 3px 0 var(--gold);
}
.brand .tagline{margin:4px 0 0;font-weight:800;font-size:15px;opacity:.85}
.right{display:flex;align-items:center;gap:12px}
.meter{
  display:flex;align-items:center;gap:12px;
  background:var(--paper-2);border:3px solid var(--ink);border-radius:18px;
  padding:6px 14px;box-shadow:4px 4px 0 var(--ink);min-height:56px;
  transition:background .4s;
}
.meter.all{background:var(--gold)}
.meter-label{font-family:var(--display);font-weight:600;font-size:13px;letter-spacing:1.5px;text-transform:uppercase;line-height:1.1}
.badges{display:flex;gap:6px}
.badge{
  width:38px;height:38px;border-radius:50%;border:3px solid var(--ink);
  background:var(--white);display:grid;place-items:center;font-size:19px;font-family:var(--emoji);line-height:1;
  opacity:.28;filter:grayscale(1);transition:opacity .3s,filter .3s;
}
.badge.won{opacity:1;filter:none;background:var(--gold);animation:pop .5s cubic-bezier(.34,1.56,.64,1)}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
.map{
  display:flex;flex-direction:column;align-items:center;gap:2px;
  background:var(--white);border:3px solid var(--ink);border-radius:18px;padding:4px 10px 5px;box-shadow:4px 4px 0 var(--ink);
}
.map canvas{width:64px;height:60px;display:block}
.map span{font-family:var(--display);font-weight:600;font-size:10px;letter-spacing:1px;text-transform:uppercase}

/* ---------- stage ---------- */
.stage-wrap{min-height:0;display:flex}
.stage{
  position:relative;flex:1;min-height:300px;
  border:5px solid var(--ink);border-radius:26px;overflow:hidden;
  background:#bfe4ff;box-shadow:6px 6px 0 var(--ink);touch-action:none;
}
#view{position:absolute;inset:0;width:100%;height:100%;display:block}

.caption{
  position:absolute;left:14px;top:12px;max-width:min(60%,470px);
  background:var(--white);border:3px solid var(--ink);border-radius:18px;
  padding:8px 14px 10px;box-shadow:4px 4px 0 var(--ink);pointer-events:none;
}
.caption.bump{animation:bump .5s cubic-bezier(.34,1.56,.64,1)}
@keyframes bump{0%{transform:scale(.85)}100%{transform:scale(1)}}
.cap-level{font-family:var(--display);font-weight:700;font-size:24px;line-height:1.1}
.cap-text{font-weight:800;font-size:15px;margin-top:3px;text-wrap:balance}
.cap-text b{color:var(--rocket-dk)}

.hint{
  position:absolute;left:50%;transform:translateX(-50%);bottom:12px;
  background:rgba(255,253,247,.92);border:3px solid var(--ink);border-radius:999px;
  padding:6px 14px;font-weight:800;font-size:14px;pointer-events:none;box-shadow:3px 3px 0 var(--ink);
}
.stat{
  position:absolute;right:14px;bottom:12px;display:flex;gap:8px;pointer-events:none;
}
.stat span{
  background:rgba(255,253,247,.94);border:3px solid var(--ink);border-radius:999px;
  padding:5px 12px;font-family:var(--display);font-weight:600;font-size:15px;box-shadow:3px 3px 0 var(--ink);
  font-variant-numeric:tabular-nums;white-space:nowrap;
}
.stat[hidden]{display:none}

.card{
  position:absolute;right:14px;top:12px;width:min(340px,calc(100% - 28px));
  display:flex;gap:12px;align-items:flex-start;
  background:var(--white);border:3px solid var(--ink);border-radius:20px;
  padding:12px;box-shadow:4px 4px 0 var(--ink);
  animation:bump .4s cubic-bezier(.34,1.56,.64,1);
}
.card[hidden]{display:none}
.card-thumb{width:84px;height:84px;flex:0 0 84px;border-radius:14px;border:3px solid var(--ink);background:#e8f4ff}
.card-body{min-width:0;flex:1}
.card-name{font-family:var(--display);font-weight:700;font-size:21px;line-height:1.05}
.card-sub{font-family:var(--display);font-weight:600;font-size:15px;color:var(--rocket-dk);margin-top:2px}
.card-fact{font-weight:800;font-size:14.5px;margin-top:6px}
.card-extra{font-weight:700;font-size:12px;margin-top:6px;opacity:.75}
.card-x{
  position:absolute;right:-12px;top:-12px;width:34px;height:34px;border-radius:50%;
  border:3px solid var(--ink);background:var(--gold);font-family:var(--display);font-weight:700;font-size:20px;line-height:1;
  box-shadow:2px 2px 0 var(--ink);
}

.toast{
  position:absolute;left:50%;bottom:64px;transform:translateX(-50%);
  background:var(--gold);border:3px solid var(--ink);border-radius:999px;
  padding:8px 18px;font-family:var(--display);font-weight:700;font-size:19px;white-space:nowrap;
  box-shadow:4px 4px 0 var(--ink);pointer-events:none;max-width:calc(100% - 28px);overflow:hidden;text-overflow:ellipsis;
  animation:bump .5s cubic-bezier(.34,1.56,.64,1);
}
.toast[hidden]{display:none}

/* ---------- the challenge panel ---------- */
.quest{
  position:absolute;left:14px;bottom:12px;width:min(400px,calc(100% - 28px));
  background:var(--white);border:3px solid var(--ink);border-radius:20px;
  padding:12px 14px 12px;box-shadow:4px 4px 0 var(--ink);
  animation:bump .4s cubic-bezier(.34,1.56,.64,1);
}
.quest[hidden]{display:none}
.quest.tr{left:auto;right:14px;top:12px;bottom:auto}
.q-head{display:flex;align-items:center;gap:8px}
.q-title{font-family:var(--display);font-weight:700;font-size:17px;flex:1}
.dots{display:flex;gap:4px}
.dot{width:11px;height:11px;border-radius:50%;border:2px solid var(--ink);background:var(--white)}
.dot.done{background:var(--grass)}
.dot.now{background:var(--gold)}
.q-text{font-weight:800;font-size:15.5px;margin-top:6px;text-wrap:balance}
.q-opts{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px}
.q-opts[hidden]{display:none}
.opt{
  font-family:var(--display);font-weight:600;font-size:15px;border:3px solid var(--ink);border-radius:999px;
  background:var(--paper-2);padding:7px 13px;line-height:1;box-shadow:0 3px 0 var(--ink);
  transition:transform .08s,box-shadow .08s;
}
.opt:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.opt.yes{background:var(--grass);color:var(--white)}
.opt.no{animation:shake .4s}
.opt:disabled{cursor:default}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.q-fb{font-weight:800;font-size:14px;margin-top:8px;min-height:18px}
.q-fb.good{color:var(--leaf-dk)}
.q-fb.bad{color:var(--rocket-dk)}
.q-x{position:absolute;right:-12px;top:-12px;width:34px;height:34px;border-radius:50%;border:3px solid var(--ink);background:var(--gold);font-family:var(--display);font-weight:700;font-size:20px;line-height:1;box-shadow:2px 2px 0 var(--ink)}

/* ---------- dock ---------- */
.dock{display:grid;grid-template-columns:auto auto minmax(0,1fr);align-items:center;gap:14px}
.levels{display:flex;gap:5px}
.lvl{
  width:42px;height:42px;border-radius:50%;border:3px solid var(--ink);
  background:var(--white);font-size:22px;font-family:var(--emoji);line-height:1;padding:0;
  box-shadow:3px 3px 0 var(--ink);transition:transform .15s;position:relative;
}
.lvl:hover{transform:translateY(-2px)}
.lvl.on{background:var(--gold);transform:scale(1.12)}
.lvl.done{background:var(--paper-2)}
.lvl.won::after{content:"✓";position:absolute;right:-7px;top:-7px;width:18px;height:18px;border-radius:50%;background:var(--grass);color:var(--white);border:2px solid var(--ink);font:700 11px/14px var(--display)}

.buttons{display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-width:0}
.btn{
  font-family:var(--display);font-weight:700;border:3px solid var(--ink);border-radius:999px;
  background:var(--white);padding:10px 16px;font-size:16px;line-height:1;
  box-shadow:0 5px 0 var(--ink);transition:transform .08s,box-shadow .08s,opacity .2s;white-space:nowrap;
}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn:disabled{opacity:.35;cursor:default;transform:none;box-shadow:0 5px 0 var(--ink)}
.btn.big{
  background:var(--rocket);color:var(--white);font-size:23px;padding:12px 22px;
  box-shadow:0 7px 0 var(--rocket-dk),0 7px 0 3px var(--ink);text-shadow:2px 2px 0 var(--rocket-dk);
}
.btn.big:active{transform:translateY(5px);box-shadow:0 2px 0 var(--rocket-dk),0 2px 0 3px var(--ink)}
.btn.big.home{background:var(--sky);text-shadow:2px 2px 0 #1f6fa8;box-shadow:0 7px 0 #1f6fa8,0 7px 0 3px var(--ink)}
.btn.big.home:active{box-shadow:0 2px 0 #1f6fa8,0 2px 0 3px var(--ink)}
.btn.quest-btn{background:var(--gold)}
.btn.quest-btn.won{background:var(--grass);color:var(--white)}

/* chapter controls: one group shown at a time */
.ctl{display:flex;justify-content:flex-end;min-width:0}
.ctl-group{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.ctl-group[hidden]{display:none}
.ctl-label{font-family:var(--display);font-weight:600;font-size:12px;letter-spacing:1px;text-transform:uppercase;opacity:.8}
.tog{
  font-family:var(--display);font-weight:600;font-size:15px;border:3px solid var(--ink);border-radius:999px;
  background:var(--white);padding:8px 13px;line-height:1;box-shadow:0 4px 0 var(--ink);
  transition:transform .08s,box-shadow .08s,background .15s;white-space:nowrap;
}
.tog:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.tog.on{background:var(--gold)}
.tog.off{opacity:.6;text-decoration:line-through}
.tog.night.on{background:var(--space);color:var(--white)}
.tog.grow{background:var(--grass);color:var(--white);text-shadow:1px 1px 0 var(--leaf-dk)}
.tog.rain{background:var(--sky);color:var(--white);text-shadow:1px 1px 0 #1f6fa8}
.tog.press{background:var(--rocket);color:var(--white);text-shadow:1px 1px 0 var(--rocket-dk)}
.tog:disabled{opacity:.4;cursor:default;transform:none}

/* ---------- small screens ---------- */
@media (max-width:820px){
  .app{padding:8px;gap:8px}
  .top{flex-wrap:nowrap;gap:8px}
  .brand h1{font-size:22px;text-shadow:2px 2px 0 var(--gold)}
  .brand .tagline{display:none}
  .map{display:none}
  .meter{padding:3px 8px;min-height:40px;gap:6px;border-width:2.5px;box-shadow:3px 3px 0 var(--ink)}
  .meter-label{display:none}
  .badge{width:27px;height:27px;font-size:13px;border-width:2px}
  .badges{gap:4px}
  .dock{grid-template-columns:auto minmax(0,1fr);grid-template-areas:"levels buttons" "ctl ctl";gap:8px}
  .levels{grid-area:levels;gap:4px}
  .lvl{width:34px;height:34px;font-size:18px;box-shadow:2px 2px 0 var(--ink)}
  .buttons{grid-area:buttons;justify-content:flex-end;gap:8px}
  #btnBack{display:none}
  .ctl{grid-area:ctl;justify-content:center;align-items:center;gap:8px}
  .ctl-group{justify-content:center;gap:6px}
  .btn.big{font-size:17px;padding:10px 14px}
  .btn{padding:8px 11px;font-size:14px}
  .tog{font-size:13.5px;padding:7px 10px}
  .ctl-label{font-size:11px}
  .caption{max-width:calc(100% - 28px);padding:6px 10px 8px}
  .cap-level{font-size:17px}.cap-text{font-size:12.5px}
  .hint{display:none}
  .card{width:calc(100% - 28px)}
  .card-thumb{width:56px;height:56px;flex-basis:56px}
  .card-name{font-size:17px}.card-sub{font-size:13px}.card-fact{font-size:13px}
  .quest{width:calc(100% - 28px);left:14px;right:14px;top:12px;bottom:auto;padding:10px 12px}
  .quest.tr{top:12px}
  .q-title{font-size:15px}.q-text{font-size:14px}.opt{font-size:14px;padding:6px 11px}
  body.questing .caption,body.carding .caption{display:none}
  .stat span{font-size:12px;padding:4px 9px}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none !important;transition:none !important}
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <h1>Inside a Tree</h1>
      <p class="tagline">How a tree eats, drinks, grows — and who lives in it.</p>
    </div>
    <div class="right">
      <div class="meter" id="meter" aria-live="polite">
        <div class="meter-label">Tree<br>badges</div>
        <div class="badges" id="badges" aria-label="one badge for each part of the tree"></div>
      </div>
      <div class="map" aria-hidden="true">
        <canvas id="minimap" width="128" height="120"></canvas>
        <span>You are here</span>
      </div>
    </div>
  </header>

  <main class="stage-wrap">
    <div class="stage" id="stage">
      <canvas id="view"></canvas>
      <div class="caption" id="caption">
        <div class="cap-level" id="capLevel"></div>
        <div class="cap-text" id="capText"></div>
      </div>
      <div class="stat" id="stat" hidden></div>
      <div class="hint" id="hint">👆 Tap things to learn about them</div>
      <div class="card" id="card" hidden>
        <button class="card-x" id="cardClose" aria-label="Close">×</button>
        <canvas class="card-thumb" id="thumb" width="168" height="168"></canvas>
        <div class="card-body">
          <div class="card-name" id="cardName"></div>
          <div class="card-sub" id="cardSub"></div>
          <div class="card-fact" id="cardFact"></div>
          <div class="card-extra" id="cardExtra"></div>
        </div>
      </div>
      <div class="quest" id="quest" hidden>
        <button class="q-x" id="questClose" aria-label="Close the challenge">×</button>
        <div class="q-head"><div class="q-title" id="qTitle"></div><div class="dots" id="qDots"></div></div>
        <div class="q-text" id="qText"></div>
        <div class="q-opts" id="qOpts"></div>
        <div class="q-fb" id="qFb"></div>
      </div>
      <div class="toast" id="toast" hidden></div>
    </div>
  </main>

  <footer class="dock">
    <div class="levels" id="levels"></div>
    <div class="buttons">
      <button class="btn" id="btnBack">◀ Back</button>
      <button class="btn big" id="btnNext">NEXT PART ▶</button>
      <button class="btn quest-btn" id="btnQuest">🎯 Challenge!</button>
    </div>
    <div class="ctl" id="ctl">
      <div class="ctl-group" id="ctl-leaf" hidden>
        <span class="ctl-label">Turn things off:</span>
        <button class="tog on" id="togSun">☀️ Sun</button>
        <button class="tog on" id="togWater">💧 Water</button>
        <button class="tog on" id="togAir">🌬️ Air (CO₂)</button>
      </div>
      <div class="ctl-group" id="ctl-roots" hidden>
        <button class="tog rain" id="btnRain">🌧️ Make it rain!</button>
        <button class="tog" id="togHot">🥵 Hot day</button>
      </div>
      <div class="ctl-group" id="ctl-rings" hidden>
        <span class="ctl-label">Next year is:</span>
        <button class="tog" id="wRain">☔ Rainy</button>
        <button class="tog on" id="wNorm">⛅ Normal</button>
        <button class="tog" id="wDry">☀️ Dry</button>
        <button class="tog grow" id="btnGrow">🌱 Grow a year!</button>
      </div>
      <div class="ctl-group" id="ctl-wood" hidden>
        <button class="tog press" id="btnPress">🔩 Press test!</button>
      </div>
      <div class="ctl-group" id="ctl-animals" hidden>
        <button class="tog night" id="togNight">🌙 Night</button>
      </div>
    </div>
  </footer>
</div>
<script>
'use strict';
/* =====================================================================
   INSIDE A TREE  —  how a tree works, for grades 3–4
   Five parts of one white oak. Each part is a little animated scene on
   one canvas, with tap-to-learn cards and a small challenge that earns a
   badge. Chapter changes "zoom" through a map of the whole tree.
   ===================================================================== */
const TAU=Math.PI*2;
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const smooth=t=>t*t*(3-2*t);
const easeInOut=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const easeOut=t=>1-Math.pow(1-t,3);
const REDUCED=matchMedia('(prefers-reduced-motion: reduce)').matches;
function seeded(n){ let s=n*9301+49297; return ()=>{ s=(s*9301+49297)%233280; return s/233280; }; }
const rnd=Math.random;
const EMOJI_FONT='"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji","Twemoji Mozilla",sans-serif';
const LABEL_FONT='"Nunito","Segoe UI Rounded",ui-rounded,"Segoe UI",system-ui,sans-serif';
const DISPLAY_FONT='"Fredoka","Chalkboard SE","Comic Sans MS","Segoe UI Rounded",ui-rounded,system-ui,sans-serif';
const INK='#2b2350', PAPER='#fff8e7', GOLD='#ffd23f', ROCKET='#ff6b35', SKY='#4fb3f6', GRASS='#63c64d', WHITE='#fffdf7';
const LEAF='#3f9d3a', LEAF_DK='#2e7d32', LEAF_LT='#7ccf5a', BARK='#7a4b2a', BARK_DK='#4e2f18', SOIL='#8b5a2b', SOIL_DK='#5a3a1c';
const WATER='#3b8beb', SUGAR='#ff6f9c', O2='#bfe9ff', CO2='#9aa3b5';

/* ---------- canvas + timing ---------- */
const stage=$('stage'), view=$('view');
let ctx=view.getContext('2d');
const V={w:900,h:520,dpr:1};
let now=0;                    // seconds since load

/* ---------- drawing helpers (all write to whatever `ctx` is) ---------- */
function circle(x,y,r,fill){ ctx.fillStyle=fill; ctx.beginPath(); ctx.arc(x,y,r,0,TAU); ctx.fill(); }
function ring(x,y,r,stroke,w){ ctx.strokeStyle=stroke; ctx.lineWidth=w; ctx.beginPath(); ctx.arc(x,y,r,0,TAU); ctx.stroke(); }
function disc(x,y,r,fill,ol){ circle(x,y,r,fill); if(ol) ring(x,y,r,INK,ol); }
function ellipse(x,y,rx,ry,rot,fill,ol){ ctx.beginPath(); ctx.ellipse(x,y,rx,ry,rot||0,0,TAU); ctx.fillStyle=fill; ctx.fill(); if(ol){ ctx.strokeStyle=INK; ctx.lineWidth=ol; ctx.stroke(); } }
function poly(P,fill,ol){ ctx.beginPath(); P.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1])); ctx.closePath(); if(fill){ ctx.fillStyle=fill; ctx.fill(); } if(ol){ ctx.strokeStyle=INK; ctx.lineWidth=ol; ctx.lineJoin='round'; ctx.stroke(); } }
function rrect(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function box(x,y,w,h,r,fill,ol){ rrect(x,y,w,h,r); ctx.fillStyle=fill; ctx.fill(); if(ol){ ctx.strokeStyle=INK; ctx.lineWidth=ol; ctx.stroke(); } }
function line(x1,y1,x2,y2,stroke,w,cap){ ctx.strokeStyle=stroke; ctx.lineWidth=w; ctx.lineCap=cap||'round'; ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke(); }

// a little sign: rounded box with text, optional pointer line to (px,py)

function cloudPath(x,y,r,n,seed){          // a leafy blob: a circle with a scalloped edge

    const x0=x+Math.cos(a0)*r, y0=y+Math.sin(a0)*r, x1=x+Math.cos(a1)*r, y1=y+Math.sin(a1)*r;
    const cx=x+Math.cos(am)*(r+bump*2.2), cy=y+Math.sin(am)*(r+bump*2.2);

function hexRgb(h){ return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]; }
function rgba(h,a){ const c=hexRgb(h); return `rgba(${c[0]},${c[1]},${c[2]},${a})`; }
function mix(a,b,t){ const A=hexRgb(a),B=hexRgb(b); return `rgb(${Math.round(lerp(A[0],B[0],t))},${Math.round(lerp(A[1],B[1],t))},${Math.round(lerp(A[2],B[2],t))})`; }
function darker(h,k){ const c=hexRgb(h).map(v=>Math.round(v*(1-k))); return `rgb(${c[0]},${c[1]},${c[2]})`; }
function lighter(h,k){ const c=hexRgb(h).map(v=>Math.round(v+(255-v)*k)); return `rgb(${c[0]},${c[1]},${c[2]})`; }
function dist(ax,ay,bx,by){ return Math.hypot(ax-bx,ay-by); }
// walk a polyline: returns the point at fraction t (0..1) of its length
function polyLen(P){ let L=0; for(let i=1;i<P.length;i++) L+=dist(P[i-1][0],P[i-1][1],P[i][0],P[i][1]); return L; }
function polyAt(P,t){

/* =====================================================================
   THE OAK  —  one tree, drawn in "tree units": trunk base at (0,0),
   y grows upward, the crown top is near y = 1.1, roots reach y = -0.4.
   A frame {cx, gy, s} says where the base sits on screen and how many
   pixels one unit is. The same tree is the chapter map, the roots
   scene, and the neighbors scene.
   ===================================================================== */
const CROWN=[ [0,0.74,0.34],[-0.29,0.62,0.26],[0.3,0.6,0.27],[-0.15,0.9,0.22],[0.17,0.93,0.2],[-0.43,0.5,0.17],[0.44,0.48,0.18],[0.02,1.02,0.15] ];
const BRANCHES=[ [[0,0.36],[-0.22,0.46],[-0.46,0.52]], [[0,0.42],[0.2,0.5],[0.44,0.5]], [[0,0.48],[-0.14,0.66],[-0.3,0.82]], [[0,0.5],[0.12,0.7],[0.28,0.88]], [[0,0.55],[0.02,0.8],[0.0,1.02]], [[0,0.27],[-0.2,0.3],[-0.47,0.33]], [[0,0.3],[0.22,0.34],[0.47,0.41]] ];
const ROOTS=[ [[-0.06,0.02],[-0.32,-0.08],[-0.78,-0.14]], [[0.06,0.02],[0.34,-0.07],[0.8,-0.16]], [[-0.04,0.0],[-0.18,-0.2],[-0.5,-0.3]], [[0.04,0.0],[0.2,-0.19],[0.52,-0.31]], [[-0.02,0.0],[-0.06,-0.22],[-0.14,-0.42]], [[0.02,0.0],[0.1,-0.24],[0.24,-0.4]] ];
const ROOTLETS=[ [0,0.55,-1],[0,0.8,1],[1,0.5,1],[1,0.75,-1],[2,0.6,1],[3,0.55,-1],[4,0.6,-1],[5,0.5,1],[0,0.35,1],[1,0.3,-1] ];  // [root index, fraction along, side]

function treeGeom(F){        // screen-space geometry for a frame
  const X=x=>F.cx+x*F.s, Y=y=>F.gy-y*F.s;
  const roots=ROOTS.map(r=>bezPts([X(r[0][0]),Y(r[0][1])],[X(r[1][0]),Y(r[1][1])],[X(r[2][0]),Y(r[2][1])],14));
  const rootlets=ROOTLETS.map(([ri,t,side])=>{ const P=roots[ri]; const a=polyAt(P,t), b=polyAt(P,Math.min(1,t+0.12)); const dx=b[0]-a[0], dy=b[1]-a[1], L=Math.hypot(dx,dy)||1; const nx=-dy/L*side, ny=dx/L*side; const len=F.s*0.11; return [a,[a[0]+nx*len*0.6+dx/L*len*0.4, a[1]+ny*len*0.6+dy/L*len*0.4+F.s*0.03],[a[0]+nx*len+dx/L*len*0.6, a[1]+ny*len+dy/L*len*0.6+F.s*0.06]]; });
  const branches=BRANCHES.map(b=>bezPts([X(b[0][0]),Y(b[0][1])],[X(b[1][0]),Y(b[1][1])],[X(b[2][0]),Y(b[2][1])],10));
  const crown=CROWN.map(c=>({x:X(c[0]),y:Y(c[1]),r:c[2]*F.s}));
  return {X,Y,roots,rootlets,branches,crown,trunkW:0.17*F.s};
}
function drawSky(F,night,t){
  const W=V.w,H=V.h, gy=F.gy;
  const g=ctx.createLinearGradient(0,0,0,gy);
  if(night<1){ g.addColorStop(0,'#3d9be9'); g.addColorStop(1,'#cdeeff'); ctx.fillStyle=g; ctx.fillRect(0,0,W,Math.max(gy,0)+2); }
  if(night>0){
    ctx.globalAlpha=night; const n=ctx.createLinearGradient(0,0,0,gy); n.addColorStop(0,'#12103a'); n.addColorStop(1,'#2b2a6e'); ctx.fillStyle=n; ctx.fillRect(0,0,W,Math.max(gy,0)+2);
    const rr=seeded(9); ctx.fillStyle='#fff6d8';
    for(let i=0;i<70;i++){ const x=rr()*W, y=rr()*gy*0.9, s=rr()*1.6+.4; ctx.globalAlpha=night*(0.5+0.5*Math.sin(t*1.6+i)); ctx.beginPath(); ctx.arc(x,y,s,0,TAU); ctx.fill(); }
    ctx.globalAlpha=night;
    disc(W*0.84,gy*0.2,26,'#fff3c4',3); circle(W*0.84+11,gy*0.2-6,20,'#2b2a6e'); ring(W*0.84,gy*0.2,26,INK,3);
    ctx.globalAlpha=1;
  }
  if(night<1){
    ctx.globalAlpha=1-night;
    const sx0=W*0.84, sy0=gy*0.2; circle(sx0,sy0,30,GOLD); ring(sx0,sy0,30,INK,3);
    ctx.strokeStyle=GOLD; ctx.lineWidth=5; ctx.lineCap='round';
    for(let i=0;i<8;i++){ const a=i*TAU/8+t*0.25; ctx.beginPath(); ctx.moveTo(sx0+Math.cos(a)*40,sy0+Math.sin(a)*40); ctx.lineTo(sx0+Math.cos(a)*54,sy0+Math.sin(a)*54); ctx.stroke(); }
    // a couple of slow clouds
    ctx.fillStyle='rgba(255,255,255,0.85)';
    [[0.12,0.22,1],[0.5,0.12,0.7]].forEach(([fx,fy,k],i)=>{ const cx=((fx+t*0.006*(i+1))%1.2-0.1)*W, cy=fy*gy; [[0,0,22],[22,-8,26],[46,0,20],[24,8,18]].forEach(c=>{ ctx.beginPath(); ctx.arc(cx+c[0]*k,cy+c[1]*k,c[2]*k,0,TAU); ctx.fill(); }); });
    ctx.globalAlpha=1;
  }
}
function drawGround(F,depth){        // grass line + soil down to `depth` px (or bottom)
  const W=V.w,H=V.h, gy=F.gy, bottom=depth?gy+depth:H;
  const g=ctx.createLinearGradient(0,gy,0,bottom); g.addColorStop(0,'#a06b38'); g.addColorStop(0.35,SOIL); g.addColorStop(1,SOIL_DK);
  ctx.fillStyle=g; ctx.fillRect(0,gy,W,bottom-gy);
  const rr=seeded(4); ctx.fillStyle='rgba(60,35,15,0.35)';
  for(let i=0;i<50;i++){ const x=rr()*W, y=gy+12+rr()*(bottom-gy-12), r=2+rr()*5; ctx.beginPath(); ctx.ellipse(x,y,r*1.4,r,rr()*3,0,TAU); ctx.fill(); }
  ctx.fillStyle='#4e7d2b'; ctx.fillRect(0,gy-2,W,6);
  ctx.fillStyle=GRASS; ctx.fillRect(0,gy-6,W,5);
  ctx.strokeStyle='#3f8f2f'; ctx.lineWidth=2.5; ctx.lineCap='round';
  for(let x=6;x<W;x+=14){ const h=8+((x*7)%9); ctx.beginPath(); ctx.moveTo(x,gy-4); ctx.lineTo(x+((x%3)-1)*3,gy-4-h); ctx.stroke(); }
}
function drawRootsOf(G,F,opts){

  const drawRoot=(P,w0)=>{
    for(let i=1;i<P.length;i++){ const k=1-i/P.length; ctx.strokeStyle=INK; ctx.lineWidth=w0*k+4; ctx.beginPath(); ctx.moveTo(P[i-1][0],P[i-1][1]); ctx.lineTo(P[i][0],P[i][1]); ctx.stroke(); }
    for(let i=1;i<P.length;i++){ const k=1-i/P.length; ctx.strokeStyle=opts.color||'#b8874f'; ctx.lineWidth=Math.max(1.5,w0*k); ctx.beginPath(); ctx.moveTo(P[i-1][0],P[i-1][1]); ctx.lineTo(P[i][0],P[i][1]); ctx.stroke(); }

  G.roots.forEach((P,i)=>drawRoot(P,s*(i<2?0.075:0.055)));

    ctx.strokeStyle='#e9d3b0'; ctx.lineWidth=1.5;
    const tips=[...G.roots.map(P=>P.slice(-4)),...G.rootlets.map(P=>P.slice(-2))];

function drawTrunk(G,F,opts){
  opts=opts||{}; const s=F.s, X=G.X, Y=G.Y, w=G.trunkW;
  const top=Y(0.62), base=Y(0), flare=w*0.35;

  ctx.quadraticCurveTo(X(0)-w/2,base-s*0.06,X(0)-w*0.46,Y(0.2));

  ctx.lineTo(X(0)+w*0.36,top);
  ctx.lineTo(X(0)+w*0.46,Y(0.2));
  ctx.quadraticCurveTo(X(0)+w/2,base-s*0.06,X(0)+w/2+flare,base+s*0.02);

  const rr=seeded(21); ctx.strokeStyle='rgba(60,35,20,0.35)'; ctx.lineWidth=Math.max(1.5,s*0.012); ctx.lineCap='round';
  for(let i=0;i<26;i++){ const x=X(0)-w*0.45+rr()*w*0.9, y0=base-rr()*s*0.6, l=s*(0.05+rr()*0.12); ctx.beginPath(); ctx.moveTo(x,y0); ctx.lineTo(x+(rr()-.5)*s*0.02,y0-l); ctx.stroke(); }

  ctx.restore();

}
function drawBranches(G,F){
  const s=F.s;
  G.branches.forEach(P=>{ path(P,INK,s*0.05+4); path(P,'#8d6b52',s*0.05); });
}
function drawCrown(G,F,opts){
  opts=opts||{}; const s=F.s, col=opts.color||LEAF, ol=Math.max(2,s*0.012);
  G.crown.forEach((c,i)=>{ blob(c.x,c.y,c.r,darker(col,0.12),ol,i+1); });
  G.crown.forEach((c,i)=>{ blob(c.x,c.y,c.r*0.86,col,0,i+1); });
  G.crown.forEach((c,i)=>{ blob(c.x-c.r*0.22,c.y-c.r*0.25,c.r*0.42,lighter(col,0.22),0,i+11); });

}
function drawOak(F,opts){         // the whole tree at a frame
  opts=opts||{};
  const G=treeGeom(F);
  drawSky(F,opts.night||0,now);
  drawGround(F,opts.depth);
  drawRootsOf(G,F,{hairs:opts.hairs});
  drawTrunk(G,F,opts);
  drawBranches(G,F);
  drawCrown(G,F,{acorns:opts.acorns});
  return G;

function mapFrame(){                // the framing used for the chapter map + neighbors scene
  const W=V.w,H=V.h, gy=H*0.7;
  const s=Math.min((gy-12)/1.12, W/1.75, (H-gy)/0.46);
  return {cx:W/2,gy,s};
}
// where each chapter "lives" on the map, in tree units
const ANCHORS={leaf:[0.33,0.86], roots:[0.25,-0.2], rings:[0,0.22], wood:[0.0,0.08], animals:[0,0.7]};
function anchorPx(id,F){ const a=ANCHORS[id]; return [F.cx+a[0]*F.s, F.gy-a[1]*F.s]; }

/* ---------- the challenge panel ---------- */
// A challenge is a list of steps. Each step has a prompt; either `options`
// (buttons; `ok` says which are right) or `tap` (a function of what was
// tapped on the canvas that returns true/false/'almost').
const quest={active:null,step:0,picked:0};
function startQuest(id){
  const scene=SCENES[id]; if(!scene.quest) return;
  closeCard(); quest.active=scene.quest(); quest.step=0; quest.picked=0;
  els.qTitle.textContent=quest.active.title; els.quest.hidden=false; els.hint.hidden=true;
  els.quest.classList.toggle('tr',scene.questPos==='tr'); document.body.classList.add('questing');
  if(quest.active.onStart) quest.active.onStart();
  renderStep();
}
function endQuest(){ if(quest.active&&quest.active.onEnd) quest.active.onEnd(); quest.active=null; els.quest.hidden=true; document.body.classList.remove('questing'); }
function renderStep(){
  const Q=quest.active, S=Q.steps[quest.step];
  els.qDots.innerHTML=''; Q.steps.forEach((_,i)=>{ const d=document.createElement('span'); d.className='dot'+(i<quest.step?' done':i===quest.step?' now':''); els.qDots.appendChild(d); });
  els.qText.innerHTML=S.prompt; els.qFb.textContent=''; els.qFb.className='q-fb'; quest.picked=0;
  els.qOpts.innerHTML='';
  if(S.options){
    els.qOpts.hidden=false;
    S.options.forEach((o,i)=>{ const b=document.createElement('button'); b.className='opt'; b.textContent=o.text; b.addEventListener('click',()=>pick(i,b)); els.qOpts.appendChild(b); });
  }else{ els.qOpts.hidden=true; }
  if(S.onShow) S.onShow();
}
function feedback(msg,good){ els.qFb.textContent=msg; els.qFb.className='q-fb '+(good?'good':'bad'); }
function stepDone(){
  const Q=quest.active; quest.step++;
  if(quest.step>=Q.steps.length){ setTimeout(()=>{ endQuest(); award(Q.id); },1100); }
  else setTimeout(renderStep,1300);
}
function pick(i,btn){
  const S=quest.active.steps[quest.step], o=S.options[i];
  if(btn.disabled) return;
  if(o.ok){ btn.classList.add('yes'); btn.disabled=true; quest.picked++; feedback(o.say||'Yes!',true); if(quest.picked>=(S.need||1)){ els.qOpts.querySelectorAll('.opt').forEach(b=>b.disabled=true); stepDone(); } }
  else{ btn.classList.remove('no'); void btn.offsetWidth; btn.classList.add('no'); feedback(o.say||'Not that one. Try again!',false); }
}
function questTap(item){          // the canvas was tapped while a tap-step is open
  const Q=quest.active; if(!Q) return false;
  const S=Q.steps[quest.step]; if(!S.tap) return false;
  const r=S.tap(item);
  if(r===true){ feedback(S.yes||'Yes!',true); stepDone(); return true; }
  feedback(typeof r==='string'?r:(S.no||'Not that. Look again!'),false);
  return true;
}
els.questClose.addEventListener('click',endQuest);
els.btnQuest.addEventListener('click',()=>{ if(quest.active) endQuest(); else startQuest(CHAPTERS[current].id); });

/* ---------- confetti ---------- */
const confetti=[];
function burstConfetti(){
  if(REDUCED) return;
  const rr=seeded(Date.now()%977+1), cols=[ROCKET,GOLD,SKY,GRASS,WHITE,'#ff4fa3'];
  for(let i=0;i<120;i++) confetti.push({x:rr()*V.w,y:-10-rr()*120,vx:(rr()-.5)*80,vy:60+rr()*90,r:rr()*TAU,vr:(rr()-.5)*8,c:cols[i%cols.length],s:7+rr()*7});
}
function drawConfetti(dt){
  for(let i=confetti.length-1;i>=0;i--){
    const p=confetti[i]; p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=70*dt; p.r+=p.vr*dt;
    if(p.y>V.h+20){ confetti.splice(i,1); continue; }
    ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r); ctx.fillStyle=p.c; ctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2); ctx.restore();
  }
}

/* =====================================================================
   SCENE 1 · THE LEAF — a cross-section of a leaf, run as a factory.
   Sunlight lands on the chloroplasts, CO₂ comes in through the stomata,
   water arrives by the vein; when one chloroplast has all three it makes
   a sugar (which leaves by the phloem) and an oxygen (out a stoma).
   ===================================================================== */
SCENES.leaf=(()=>{
  const L={}; let chloro=[], stomata=[], photons=[], co2s=[], waters=[], sugars=[], o2s=[], items=[];
  let sugarMade=0, o2Made=0, night=0, jar=0, acc={p:0,c:0,w:0};
  const tog={sun:true,water:true,air:true};
  const sunThumb=S=>{ ctx.fillStyle='#cdeeff'; ctx.fillRect(0,0,S,S); disc(S/2,S/2,S*0.22,GOLD,3); ctx.strokeStyle=GOLD; ctx.lineWidth=5; ctx.lineCap='round'; for(let i=0;i<8;i++){ const a=i*TAU/8; ctx.beginPath(); ctx.moveTo(S/2+Math.cos(a)*S*0.3,S/2+Math.sin(a)*S*0.3); ctx.lineTo(S/2+Math.cos(a)*S*0.42,S/2+Math.sin(a)*S*0.42); ctx.stroke(); } };
  const gasThumb=(fill,txt)=>S=>{ ctx.fillStyle='#cdeeff'; ctx.fillRect(0,0,S,S); disc(S/2,S/2,S*0.3,fill,3); ctx.fillStyle=INK; ctx.font='700 20px '+DISPLAY_FONT; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(txt,S/2,S/2+1); };
  const cards={
    sun:{name:'Sunlight',sub:'The energy',fact:'Sunlight powers the factory. No light, no sugar — at night the leaf rests and waits for morning.',thumb:sunThumb},
    chloro:{name:'Chlorophyll',sub:'KLOR-oh-fil · the green stuff',fact:'Chlorophyll catches sunlight. It\'s what makes leaves green! In fall it fades away, and the yellow and orange that were hiding all summer finally show.',extra:'Big word: chloroplast — a tiny green pocket full of chlorophyll.',
      thumb:S=>{ ctx.fillStyle='#e6f4c8'; ctx.fillRect(0,0,S,S); ellipse(S/2,S/2,S*0.36,S*0.24,-0.5,LEAF_DK,3); ellipse(S/2-7,S/2-7,S*0.13,S*0.07,-0.5,LEAF_LT,0); }},
    stoma:{name:'Stomata',sub:'stoh-MAH-tuh · tiny mouths',fact:'Thousands of tiny mouths on the underside of a leaf. They open to let air in and oxygen out — and close to keep water from escaping.',extra:'One mouth is a stoma. Lots of them are stomata.',
      thumb:S=>{ ctx.fillStyle='#dff2b8'; ctx.fillRect(0,0,S,S); ellipse(S/2-13,S/2,11,22,0,'#8fc96b',3); ellipse(S/2+13,S/2,11,22,0,'#8fc96b',3); ellipse(S/2,S/2,5,12,0,'#cdeeff',0); }},
    xylem:{name:'Water pipe (xylem)',sub:'ZY-lem',fact:'Water comes up from the roots in these tubes. The leaf needs it to make sugar — and to stay stiff and flat.',
      thumb:S=>{ ctx.fillStyle='#e6f4c8'; ctx.fillRect(0,0,S,S); box(0,S/2-12,S,24,0,'#7fb8ff',3); for(let i=0;i<3;i++) disc(16+i*26,S/2,5,WATER,1.5); }},
    phloem:{name:'Sugar pipe (phloem)',sub:'FLOH-em',fact:'Fresh sugar leaves through these tubes to feed the whole tree — the roots, the buds, and the acorns.',
      thumb:S=>{ ctx.fillStyle='#e6f4c8'; ctx.fillRect(0,0,S,S); box(0,S/2-12,S,24,0,'#ffb36b',3); for(let i=0;i<3;i++) box(11+i*26,S/2-5,10,10,2,SUGAR,1.5); }},
    co2:{name:'Carbon dioxide',sub:'CO₂ · a gas in the air',fact:'You breathe OUT carbon dioxide. The leaf breathes it IN, and uses the carbon in it to build sugar.',thumb:gasThumb(CO2,'CO₂')},
    o2:{name:'Oxygen',sub:'O₂ · the gas you breathe',fact:'The factory\'s leftover is oxygen — the gas you need every second. Almost all the oxygen on Earth was made by plants and tiny ocean plants.',thumb:gasThumb(O2,'O₂')},
    sugar:{name:'Sugar',sub:'The tree\'s food',fact:'Trees don\'t eat dirt. They make their own food: sugar! The tree uses it to grow wood, leaves, roots, and acorns.',extra:'For big kids: 6 water + 6 carbon dioxide + light → 1 sugar + 6 oxygen',
      thumb:S=>{ ctx.fillStyle='#ffe8ef'; ctx.fillRect(0,0,S,S); box(S/2-16,S/2-16,32,32,6,SUGAR,3); label('✦',S/2-6,S/2-6,{size:14,color:WHITE,dark:false}); }},
  };
  function layout(){
    const W=V.w,H=V.h, narrow=W<640;
    L.sun={x:narrow?W*0.82:W*0.6, y:narrow?H*0.27:H*0.16, r:narrow?24:30};
    L.x0=W*0.16; L.x1=W*0.965; L.y0=H*(narrow?0.44:0.40); L.y1=H*(narrow?0.68:0.66); L.T=L.y1-L.y0; L.cy=(L.y0+L.y1)/2;
    L.vr=Math.min(L.T*0.4,46); L.vx=L.x0+L.vr*1.15; L.e=L.T*0.1; L.pipeW=L.vr*0.5;
    L.xyl={x:L.vx,y:L.cy-L.vr*0.4}; L.phl={x:L.vx,y:L.cy+L.vr*0.42};
    L.channelY=L.y0+L.T*0.74;
    chloro=[]; L.cells=[];
    const cellW=Math.max(26,Math.min(46,W*0.046)), xs=L.vx+L.vr+cellW*0.5, xe=L.x1-cellW*0.8, n=Math.max(4,Math.floor((xe-xs)/cellW));
    for(let i=0;i<n;i++){ const cx=xs+cellW*(i+0.5); L.cells.push({x:cx-cellW*0.43,y:L.y0+L.e,w:cellW*0.86,h:L.T*0.44});
      for(let k=0;k<2;k++) chloro.push({x:cx+(k?cellW*0.19:-cellW*0.19), y:L.y0+L.e+L.T*0.44*(k?0.68:0.3), light:0,co2:0,water:0,flash:0}); }
    stomata=[0.33,0.57,0.81].map(f=>({x:L.x0+(L.x1-L.x0)*f,y:L.y1,open:1}));
    const rr=seeded(8); L.spongy=[]; for(let x=xs+8;x<L.x1-L.T*0.5;x+=L.T*0.19){ for(let row=0;row<2;row++) L.spongy.push({x:x+(rr()-.5)*6+(row?L.T*0.09:0),y:L.y0+L.T*(row?0.83:0.67)+(rr()-.5)*4,r:L.T*(0.055+rr()*0.02)}); }
    photons=[]; co2s=[]; waters=[]; sugars=[]; o2s=[];
    chloro.forEach(c=>{ c.light=rnd()<0.5?1:0; c.co2=rnd()<0.5?1:0; c.water=rnd()<0.5?1:0; });   // the factory is already humming
    // tappable things, first match wins
    items=[
      {card:'sun', hit:(x,y)=>dist(x,y,L.sun.x,L.sun.y)<L.sun.r+16, pos:()=>[L.sun.x,L.sun.y,L.sun.r+18]},
      ...stomata.map(s=>({card:'stoma', hit:(x,y)=>dist(x,y,s.x,s.y)<24, pos:()=>[s.x,s.y,26]})),
      {card:'xylem', hit:(x,y)=>(y>L.xyl.y-L.pipeW&&y<L.xyl.y+L.pipeW*0.2&&x<L.vx)||(dist(x,y,L.vx,L.cy)<L.vr&&y<L.cy), pos:()=>[L.xyl.x,L.xyl.y,L.vr*0.6]},
      {card:'phloem', hit:(x,y)=>(y>L.phl.y-L.pipeW*0.2&&y<L.phl.y+L.pipeW&&x<L.vx)||(dist(x,y,L.vx,L.cy)<L.vr&&y>=L.cy), pos:()=>[L.phl.x,L.phl.y,L.vr*0.6]},
      {card:'chloro', hit:(x,y)=>x>L.vx+L.vr&&x<L.x1&&y>L.y0&&y<L.y0+L.T*0.56, pos:()=>{ const c=chloro[Math.floor(chloro.length/2)]; return [c.x,c.y,22]; }},
      {card:'co2', hit:(x,y)=>x>L.x0&&y>L.y1+6&&y<V.h, pos:()=>[stomata[1].x,L.y1+44,26]},
      {card:'sugar', hit:(x,y)=>x>L.vx+L.vr&&x<L.x1&&y>=L.y0+L.T*0.56&&y<L.y1, pos:()=>[L.x0+(L.x1-L.x0)*0.5,L.channelY,24]},
    ];
    items.forEach(it=>Object.assign(it,cards[it.card]));
  }
  const pickTarget=res=>{ const need=chloro.filter(c=>c[res]<1); const pool=need.length?need:chloro.filter(c=>c[res]<2); return pool.length?pool[Math.floor(rnd()*pool.length)]:null; };
  function spawnPhoton(){ const t=pickTarget('light'); if(!t||photons.length>40) return; photons.push({x:L.sun.x+(rnd()-.5)*20,y:L.sun.y+(rnd()-.5)*20,t,px:0,py:0}); }
  function spawnCO2(){ const t=pickTarget('co2'); if(!t||co2s.length>24) return; const s=stomata[Math.floor(rnd()*stomata.length)]; co2s.push({x:L.x0+rnd()*(L.x1-L.x0),y:L.y1+40+rnd()*(V.h-L.y1-60),s,t,ph:0,w:rnd()*TAU}); }
  function spawnWater(){ const t=pickTarget('water'); if(!t||waters.length>24) return; waters.push({P:[[-12,L.xyl.y],[L.xyl.x,L.xyl.y],[L.vx+L.vr*0.9,L.channelY],[t.x,L.channelY],[t.x,t.y+8]],k:0,t}); }
  function react(c){
    c.light--; c.co2--; c.water--; c.flash=0.7; sugarMade++; o2Made++;
    sugars.push({P:[[c.x,c.y],[c.x,L.channelY],[L.vx+L.vr*0.9,L.channelY],[L.phl.x,L.phl.y],[-16,L.phl.y]],k:0});
    let s=stomata[0]; stomata.forEach(q=>{ if(Math.abs(q.x-c.x)<Math.abs(s.x-c.x)) s=q; });
    o2s.push({x:c.x,y:c.y,s,ph:0,w:rnd()*TAU});
  }
  function update(dt){
    night+=((tog.sun?0:1)-night)*Math.min(1,dt*3); jar+=((tog.air?0:1)-jar)*Math.min(1,dt*3);
    if(tog.sun){ acc.p+=dt*5; while(acc.p>=1){ acc.p--; spawnPhoton(); } }
    if(tog.air){ acc.c+=dt*2.4; while(acc.c>=1){ acc.c--; spawnCO2(); } }
    if(tog.water){ acc.w+=dt*2.4; while(acc.w>=1){ acc.w--; spawnWater(); } }
    for(let i=photons.length-1;i>=0;i--){ const p=photons[i], tx=p.t.x, ty=L.y0-2; const d=dist(p.x,p.y,tx,ty); p.px=p.x; p.py=p.y; if(d<6){ p.t.light=Math.min(2,p.t.light+1); photons.splice(i,1); continue; } const v=300*dt; p.x+=(tx-p.x)/d*v; p.y+=(ty-p.y)/d*v; }
    for(let i=co2s.length-1;i>=0;i--){ const p=co2s[i]; const tx=p.ph?p.t.x:p.s.x, ty=p.ph?p.t.y+10:p.s.y+12; const d=dist(p.x,p.y,tx,ty); const v=(p.ph?130:80)*dt; if(d<v){ if(p.ph){ p.t.co2=Math.min(2,p.t.co2+1); co2s.splice(i,1); } else { p.ph=1; p.x=tx; p.y=ty; } continue; } p.x+=(tx-p.x)/d*v+(p.ph?0:Math.sin(now*3+p.w)*20*dt); p.y+=(ty-p.y)/d*v; }
    for(let i=waters.length-1;i>=0;i--){ const p=waters[i]; p.k+=dt*330/polyLen(p.P); if(p.k>=1){ p.t.water=Math.min(2,p.t.water+1); waters.splice(i,1); } }
    for(let i=sugars.length-1;i>=0;i--){ const p=sugars[i]; p.k+=dt*260/polyLen(p.P); if(p.k>=1) sugars.splice(i,1); }
    for(let i=o2s.length-1;i>=0;i--){ const p=o2s[i];
      if(p.ph===0){ const tx=p.s.x, ty=p.s.y+16, d=dist(p.x,p.y,tx,ty), v=120*dt; if(d<v){ p.ph=1; p.x=tx; p.y=ty; } else { p.x+=(tx-p.x)/d*v; p.y+=(ty-p.y)/d*v; } }
      else if(p.ph===1){ p.y+=60*dt; if(p.y>L.y1+34) p.ph=2; }
      else { p.x+=55*dt+Math.sin(now*4+p.w)*14*dt; p.y-=40*dt; if(p.x>V.w+20||p.y<-20) o2s.splice(i,1); } }
    chloro.forEach(c=>{ if(c.light>=1&&c.co2>=1&&c.water>=1) react(c); c.flash=Math.max(0,c.flash-dt); });
    stomata.forEach(s=>{ s.open+=((tog.air?1:0.15)-s.open)*Math.min(1,dt*4); });
    const st='🍬 Sugar made: <b>'+sugarMade+'</b>'; if(els.stat.dataset.v!==st+o2Made){ els.stat.dataset.v=st+o2Made; setStat('<span>'+st+'</span><span>💨 Oxygen out: <b>'+o2Made+'</b></span>'); }
  }
  function draw(){
    const W=V.w,H=V.h;
    // sky, sun or moon
    const g=ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,'#3d9be9'); g.addColorStop(1,'#cdeeff'); ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
    if(night>0){ ctx.globalAlpha=night; const n=ctx.createLinearGradient(0,0,0,H); n.addColorStop(0,'#12103a'); n.addColorStop(1,'#3a3d8a'); ctx.fillStyle=n; ctx.fillRect(0,0,W,H);
      const rr=seeded(9); ctx.fillStyle='#fff6d8'; for(let i=0;i<60;i++){ const x=rr()*W,y=rr()*H*0.38; ctx.globalAlpha=night*(0.5+0.5*Math.sin(now*1.6+i)); ctx.beginPath(); ctx.arc(x,y,rr()*1.6+.4,0,TAU); ctx.fill(); }
      ctx.globalAlpha=night; disc(L.sun.x,L.sun.y,L.sun.r,'#fff3c4',3); circle(L.sun.x+L.sun.r*0.4,L.sun.y-L.sun.r*0.2,L.sun.r*0.72,'#2b2a6e'); ring(L.sun.x,L.sun.y,L.sun.r,INK,3);
      label('z z z',L.sun.x+L.sun.r+26,L.sun.y-L.sun.r,{size:16,display:true,dark:false}); ctx.globalAlpha=1; }
    if(night<1){ ctx.globalAlpha=1-night; disc(L.sun.x,L.sun.y,L.sun.r,GOLD,3); ctx.strokeStyle=GOLD; ctx.lineWidth=5; ctx.lineCap='round';
      for(let i=0;i<8;i++){ const a=i*TAU/8+now*0.25; ctx.beginPath(); ctx.moveTo(L.sun.x+Math.cos(a)*(L.sun.r+10),L.sun.y+Math.sin(a)*(L.sun.r+10)); ctx.lineTo(L.sun.x+Math.cos(a)*(L.sun.r+24),L.sun.y+Math.sin(a)*(L.sun.r+24)); ctx.stroke(); } ctx.globalAlpha=1; }
    // photons in flight
    ctx.lineCap='round'; photons.forEach(p=>{ line(p.px,p.py,p.x,p.y,'rgba(255,210,63,0.5)',6); circle(p.x,p.y,3.5,'#fff3a0'); });
    // the pipes in from the tree
    box(-10,L.xyl.y-L.pipeW/2,L.vx+10,L.pipeW,0,'#7fb8ff',3);
    box(-10,L.phl.y-L.pipeW/2,L.vx+10,L.pipeW,0,'#ffb36b',3);
    // leaf body
    const T=L.T, x0=L.x0, x1=L.x1, y0=L.y0, y1=L.y1;
    ctx.beginPath(); ctx.moveTo(x0,y0); ctx.lineTo(x1-T*0.6,y0); ctx.quadraticCurveTo(x1+T*0.05,y0,x1,L.cy); ctx.quadraticCurveTo(x1+T*0.05,y1,x1-T*0.6,y1); ctx.lineTo(x0,y1); ctx.closePath();
    ctx.fillStyle='#c8e6a0'; ctx.fill(); ctx.save(); ctx.clip();
    ctx.fillStyle='#dff2b8'; ctx.fillRect(x0,y0,x1-x0,L.e); ctx.fillRect(x0,y1-L.e,x1-x0,L.e);
    ctx.fillStyle='rgba(255,255,255,0.55)'; ctx.fillRect(x0,y0+2,x1-x0,3);   // waxy cuticle
    // spongy layer
    L.spongy.forEach((s,i)=>{ disc(s.x,s.y,s.r,'#b9df8a',1.5); });
    // palisade cells + chloroplasts
    L.cells.forEach(c=>{ box(c.x,c.y,c.w,c.h,6,'#a9d975',1.5); });
    chloro.forEach(c=>{
      const glow=c.flash>0?c.flash/0.7:0;
      if(glow>0){ const gg=ctx.createRadialGradient(c.x,c.y,2,c.x,c.y,26); gg.addColorStop(0,'rgba(255,240,150,'+(0.9*glow)+')'); gg.addColorStop(1,'rgba(255,240,150,0)'); circle(c.x,c.y,26,gg); }
      ellipse(c.x,c.y,10,6.5,-0.4,glow>0.4?'#7bd35e':LEAF_DK,1.5); ellipse(c.x-3,c.y-2,4,2,-0.4,'rgba(255,255,255,0.35)',0);
      // what it is holding, waiting for the rest
      const dots=[[c.light,'#ffd23f'],[c.co2,CO2],[c.water,WATER]]; let k=0; dots.forEach(([n,col])=>{ if(n>0){ disc(c.x-9+k*9,c.y-12,3.5,col,1); k++; } });
    });
    // the vein: xylem (water) on top, phloem (sugar) below
    disc(L.vx,L.cy,L.vr,'#c8e6a0',2.5);
    ctx.save(); ctx.beginPath(); ctx.arc(L.vx,L.cy,L.vr-3,0,TAU); ctx.clip();
    ctx.fillStyle='#7fb8ff'; ctx.fillRect(L.vx-L.vr,L.cy-L.vr,2*L.vr,L.vr); ctx.fillStyle='#ffb36b'; ctx.fillRect(L.vx-L.vr,L.cy,2*L.vr,L.vr);
    for(let i=0;i<5;i++){ disc(L.vx+(i-2)*L.vr*0.36,L.cy-L.vr*0.42,L.vr*0.14,'#e8f2ff',1); disc(L.vx+(i-2)*L.vr*0.36,L.cy+L.vr*0.42,L.vr*0.12,'#fff0d8',1); }
    ctx.restore(); ring(L.vx,L.cy,L.vr,INK,2.5);
    ctx.restore();
    // outline of the leaf
    ctx.beginPath(); ctx.moveTo(x0,y0); ctx.lineTo(x1-T*0.6,y0); ctx.quadraticCurveTo(x1+T*0.05,y0,x1,L.cy); ctx.quadraticCurveTo(x1+T*0.05,y1,x1-T*0.6,y1); ctx.lineTo(x0,y1); ctx.closePath(); ctx.strokeStyle=INK; ctx.lineWidth=3; ctx.stroke();
    // stomata: two guard cells with a gap that opens and closes

  function layout(){
    const W=V.w,H=V.h;

    if(night>0.2&&night<0.85){ ctx.globalAlpha=night; circle(G.X(-0.315),G.Y(0.315),2.5,GOLD); circle(G.X(-0.285),G.Y(0.315),2.5,GOLD); ctx.globalAlpha=1; }
    // the drey (squirrel's leaf nest) in the right side of the crown
    blob(G.X(0.46),G.Y(0.52),F.s*0.06,'#8a6a3a',2,4,9); blob(G.X(0.46),G.Y(0.52),F.s*0.045,'#a98a55',0,4,9);
    ANIMALS.filter(a=>a.at[1]>=0).forEach(a=>drawAnimal(a));
    if(night>0.3){ ctx.globalAlpha=night; fireflies.forEach(f=>{ const b=0.5+0.5*Math.sin(now*f.v*3+f.p); if(b>0.55){ const x=f.x*W, y=F.gy-10-f.y*F.s*0.25; circle(x,y,3+b*2,'rgba(255,240,120,'+b+')'); circle(x,y,1.6,'#fff9c4'); } }); ctx.globalAlpha=1; }
    if(night>0.5){ const p=P(ANIMALS.find(a=>a.id==='frog')); ctx.globalAlpha=night; label('♪',p[0]+22+Math.sin(now*3)*4,p[1]-16-((now*20)%22),{size:14,display:true,dark:false,color:GOLD}); ctx.globalAlpha=1; }
    if(night<0.5){ const p=P(ANIMALS.find(a=>a.id==='cicada')); ctx.globalAlpha=1-night; label('bzzz',p[0]+24,p[1]-14+Math.sin(now*6)*2,{size:12,display:true,dark:true}); ctx.globalAlpha=1; }
    const log=logSpot(F); drawLog(log.x,log.y,log.s);
    const n=Object.keys(found).length; sign('🔎 Found '+n+' of '+ANIMALS.length+' neighbors',W-14,H-14-16,{size:12,align:'right',fill:n===ANIMALS.length?GOLD:WHITE});
  }
  function drawAnimal(a){
    const al=alphaOf(a); if(al<0.03) return;
    const p=pos(a), sz=a.size*F.s;
    if(a.id==='frog'){ ctx.save(); ctx.globalAlpha=al; if(night<0.5){ ctx.filter='grayscale(0.85) brightness(0.9)'; } emoji('🐸',p[0],p[1],sz); ctx.restore(); return; }
    if(a.draw){ drawCustom(a,p[0],p[1],sz,al); return; }
    ctx.save(); ctx.globalAlpha=al; const bob=a.flies?0:Math.sin(now*2+a.at[0]*7)*1.5; emoji(a.emoji,p[0],p[1]+bob,sz,a.flip); ctx.restore();
  }
  function hit(x,y){
    for(let i=items.length-1;i>=0;i--){ const it=items[i], a=it.a, p=pos(a), r=a.size*F.s*0.6+12;
      if(dist(x,y,p[0],p[1])<r){ if(alphaOf(a)<0.4){ return Object.assign({},it,{name:a.name+' (asleep)',sub:a.where,fact:sleepy[a.id]||a.fact,id:a.id+'_asleep',pos:it.pos}); } found[a.id]=true; return it; } }
    // tapping a hollow while its owner is out
    return null;
  }
  function setNight(v){ wantNight=v; $('togNight').classList.toggle('on',v); $('togNight').textContent=v?'☀️ Day':'🌙 Night'; }
  $('togNight').addEventListener('click',()=>{ setNight(!wantNight); toast(wantNight?'🌙 Night! Who came out?':'☀️ Morning! Who went to bed?',3000); });
  function quest(){
    const who=(text,id,n,hint)=>({prompt:text+' <b>Tap me!</b>',tap:it=>it&&it.id===id?true:(it&&it.id===id+'_asleep')?'That\'s me — but I\'m asleep! Switch to night.':hint,yes:'Yes!',onShow(){ setNight(n); }});
    return {id:'animals',title:'🦉 Who am I?',steps:[
      who('I chop rectangular holes in the trunk to hunt ants.','woodpecker',false,'Look on the trunk, by the rectangular hole.'),
      who('I have a fluffy tail. I bury acorns and forget some — so I plant new oaks!','squirrel',false,'Look on the branches, near the ball of leaves.'),
      who('I lived underground for 17 years. Now I\'m on the trunk, singing.','cicada',false,'Listen for the bzzz on the trunk.'),
      who('My babies jump out of the nest hole the day after they hatch.','duck',false,'I\'m a bird, but I nest in a hole in the trunk.'),
      who('I hoot "Who cooks for you?" from my hollow.','owl',true,'Look for glowing eyes in a hollow.'),
      who('I turn gray or green to match the bark, and my toes are sticky.','frog',true,'Look low on the trunk. Listen for the ♪.'),
    ]};
  }
  return {layout,update,draw,hit,quest,enter(){},leave(){}};
})();

/* @@SCENES@@ */

/* =====================================================================
   NAVIGATION: chips, buttons, the zoom-through-the-map transition
   ===================================================================== */
CHAPTERS.forEach((c,i)=>{
  const b=document.createElement('button'); b.className='lvl'; b.type='button'; b.textContent=c.icon; b.title=c.name; b.setAttribute('aria-label','Go to '+c.name);
  b.addEventListener('click',()=>goTo(i)); els.levels.appendChild(b); c.chip=b;
});
function updateChips(){ CHAPTERS.forEach((c,k)=>{ c.chip.classList.toggle('on',k===current); c.chip.classList.toggle('done',k<current); }); }
function updateButtons(){
  els.btnBack.disabled=(current===0);
  const last=(current===CHAPTERS.length-1);
  els.btnNext.textContent=last?(narrowMQ.matches?'🔁 Again':'🔁 Back to the leaves'):'NEXT PART ▶';
  els.btnNext.classList.toggle('home',last);
  const id=CHAPTERS[current].id, won=!!badges[id];
  els.btnQuest.textContent=won?'✅ Challenge done!':'🎯 Challenge!';
  els.btnQuest.classList.toggle('won',won);
  CHAPTERS.forEach(c=>{ const g=$('ctl-'+c.id); if(g) g.hidden=(c.id!==id); });
}
let trans=null;   // {from,to,t0,dur}
function goTo(i){
  i=clamp(i,0,CHAPTERS.length-1); if(i===current&&!trans) return;
  if(trans) return;
  closeCard(); endQuest(); els.hint.hidden=true;
  const from=current;
  if(REDUCED){ switchTo(i); return; }
  trans={from,to:i,t0:performance.now(),dur:1250};
  SCENES[CHAPTERS[i].id].enter();
}
function switchTo(i){
  SCENES[CHAPTERS[current].id].leave(); current=i; SCENES[CHAPTERS[i].id].enter();
  setCaption(i); updateChips(); updateButtons(); drawMinimap(); setStat(SCENES[CHAPTERS[i].id].stat&&SCENES[CHAPTERS[i].id].stat());
}
els.btnNext.addEventListener('click',()=>goTo(current===CHAPTERS.length-1?0:current+1));
els.btnBack.addEventListener('click',()=>goTo(current-1));

/* ---------- taps ---------- */
let pDown=null;
view.addEventListener('pointerdown',e=>{ pDown={x:e.clientX,y:e.clientY}; });
view.addEventListener('pointerup',e=>{
  if(!pDown) return; const moved=Math.hypot(e.clientX-pDown.x,e.clientY-pDown.y); pDown=null;
  if(moved>12||trans) return;
  const r=view.getBoundingClientRect(), x=e.clientX-r.left, y=e.clientY-r.top;
  const scene=SCENES[CHAPTERS[current].id];
  const item=scene.hit?scene.hit(x,y):null;
  if(quest.active&&quest.active.steps[quest.step].tap){ if(questTap(item)) return; }
  if(item){ if(scene.onTap&&scene.onTap(item)===false) return; showCard(item); } else closeCard();
});
window.addEventListener('keydown',e=>{
  const tag=e.target.tagName; if(tag==='INPUT') return;
  if((e.key===' '||e.key==='Enter')&&tag==='BUTTON') return;
  if(e.key==='ArrowRight'){ e.preventDefault(); els.btnNext.click(); }
  else if(e.key==='ArrowLeft'){ e.preventDefault(); els.btnBack.click(); }
  else if(e.key==='Escape'){ closeCard(); endQuest(); }
  else if(e.key>='1'&&e.key<='5') goTo(+e.key-1);
});

/* ---------- sizing + the frame loop ---------- */
// on phones the Challenge button moves down next to the chapter controls
function placeQuestBtn(){ if(narrowMQ.matches) $('ctl').prepend(els.btnQuest); else els.btnNext.after(els.btnQuest); updateButtons(); }
narrowMQ.addEventListener('change',placeQuestBtn); placeQuestBtn();
function resize(){
  const r=stage.getBoundingClientRect();
  V.w=Math.max(320,Math.round(r.width)); V.h=Math.max(240,Math.round(r.height));
  V.dpr=Math.min(2,window.devicePixelRatio||1);
  view.width=Math.round(V.w*V.dpr); view.height=Math.round(V.h*V.dpr);
  Object.values(SCENES).forEach(s=>s.layout&&s.layout());
}
function drawMapOverlay(a,r){      // the chapter map, everywhere except inside a circle
  ctx.save(); ctx.beginPath(); ctx.rect(0,0,V.w,V.h); ctx.arc(a[0],a[1],Math.max(0,r),0,TAU,true); ctx.clip();
  const F=mapFrame(); drawOak(F,{acorns:true});
  const log=logSpot(F); drawLog(log.x,log.y,log.s);
  ctx.restore();
}
function logSpot(F){ return {x:F.cx+F.s*0.86, y:F.gy-F.s*0.04, s:F.s*0.11}; }
function drawLog(x,y,s){            // a cut log on the ground: where the wood chapter lives on the map
  ctx.save(); ctx.translate(x,y);
  box(-s*1.6,-s*0.55,s*2.2,s*1.1,s*0.2,'#8d6b52',2.5);
  ellipse(s*0.6,0,s*0.5,s*0.55,0,'#e8c58f',2.5);
  for(let k=1;k<=3;k++) ring(s*0.6,0,s*0.5*k/4,'#b07a3b',1.5);
  ctx.restore();
}
let lastT=performance.now();
function frame(nowMs){
  const dt=Math.min(0.05,(nowMs-lastT)/1000); lastT=nowMs; now=nowMs/1000;
  ctx.setTransform(V.dpr,0,0,V.dpr,0,0);
  const cur=SCENES[CHAPTERS[current].id];
  if(trans){
    const k=clamp((nowMs-trans.t0)/trans.dur,0,1);
    const F=mapFrame(), a0=anchorPx(CHAPTERS[trans.from].id,F), a1=anchorPx(CHAPTERS[trans.to].id,F);
    const R=Math.hypot(V.w,V.h)*0.75;
    if(k<0.38){ cur.update(dt); cur.draw(); const u=1-easeOut(k/0.38); drawMapOverlay(a0,R*u*u); }
    else if(k<0.62){ drawMapOverlay([0,0],0); const u=smooth((k-0.38)/0.24); const a=[lerp(a0[0],a1[0],u),lerp(a0[1],a1[1],u)]; ring(a[0],a[1],14+4*Math.sin(now*12),GOLD,4); ring(a[0],a[1],14+4*Math.sin(now*12),INK,1.5); }
    else{ if(current!==trans.to) switchTo(trans.to); const nxt=SCENES[CHAPTERS[trans.to].id]; nxt.update(dt); nxt.draw(); const u=easeInOut((k-0.62)/0.38); drawMapOverlay(a1,R*u); }
    if(k>=1) trans=null;
  }else{ cur.update(dt); cur.draw(); }
  if(selected&&selected.pos){ const p=selected.pos(); if(p){ ctx.save(); ctx.setLineDash([8,6]); ctx.lineDashOffset=-now*30; ring(p[0],p[1],p[2]||30,GOLD,4); ctx.restore(); } }
  drawConfetti(dt);
  requestAnimationFrame(frame);
}
if(document.fonts&&document.fonts.load){ document.fonts.load('800 13px Nunito'); document.fonts.load('700 20px Fredoka'); }
window.insideATree={SCENES,CHAPTERS,goTo,award,startQuest,quest,badges};   // handy for testing and tinkering
new ResizeObserver(resize).observe(stage);
resize();
SCENES[CHAPTERS[0].id].enter();
setCaption(0); updateChips(); updateButtons(); drawMinimap(); setStat(SCENES.leaf.stat&&SCENES.leaf.stat());
requestAnimationFrame(frame);
</script>
