<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flyway</title>
<meta name="description" content="Bird migration from a Missouri backyard to the tropics and back. Grades 3-4.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🐦%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;800&display=swap">
<style>
/* ---------- tokens: the Learning Tools sketchbook, plus the sky's own colors ---------- */
:root{
  --ink:#2b2350;        /* indigo-plum, all text + outlines */
  --paper:#fff8e7;      /* butter cream ground */
  --paper-2:#ffefc2;    /* deeper butter for chrome */
  --rocket:#ff6b35;     /* the one loud thing: the big button */
  --rocket-dk:#c2431a;
  --sky:#4fb3f6;
  --grass:#63c64d;
  --gold:#ffd23f;
  --space:#12103a;
  --white:#fffdf7;
  --leaf-dk:#2e7d32;
  --display:"Fredoka","Chalkboard SE","Comic Sans MS","Segoe UI Rounded",ui-rounded,system-ui,sans-serif;
  --body:"Nunito","Segoe UI Rounded",ui-rounded,"Segoe UI",system-ui,sans-serif;
  --emoji:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji","Twemoji Mozilla",sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--paper);color:var(--ink);font-family:var(--body);
  font-size:16px;line-height:1.3;-webkit-text-size-adjust:100%;overflow:hidden;
}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:4px solid var(--sky);outline-offset:3px}

.app{
  height:100vh;height:100dvh;display:grid;grid-template-rows:auto 1fr auto;
  gap:10px;padding:10px 14px 12px;max-width:1180px;margin:0 auto;
}

/* ---------- header ---------- */
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.brand h1{font-family:var(--display);font-weight:700;font-size:38px;line-height:1;margin:0;letter-spacing:.5px;text-shadow:3px 3px 0 var(--gold)}
.brand .tagline{margin:4px 0 0;font-weight:800;font-size:15px;opacity:.85}
.right{display:flex;align-items:center;gap:12px}
.meter{
  display:flex;align-items:center;gap:12px;background:var(--paper-2);
  border:3px solid var(--ink);border-radius:18px;padding:6px 14px;
  box-shadow:4px 4px 0 var(--ink);min-height:56px;transition:background .4s;
}
.meter.all{background:var(--gold)}
.meter-label{font-family:var(--display);font-weight:600;font-size:13px;letter-spacing:1.5px;text-transform:uppercase;line-height:1.1}
.badges{display:flex;gap:6px}
.badge{
  width:38px;height:38px;border-radius:50%;border:3px solid var(--ink);background:var(--white);
  display:grid;place-items:center;font-size:19px;font-family:var(--emoji);line-height:1;
  opacity:.28;filter:grayscale(1);transition:opacity .3s,filter .3s;
}
.badge.won{opacity:1;filter:none;background:var(--gold);animation:pop .5s cubic-bezier(.34,1.56,.64,1)}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}

/* ---------- stage ---------- */
.stage-wrap{min-height:0;display:flex}
.stage{
  position:relative;flex:1;min-height:160px;border:5px solid var(--ink);border-radius:26px;
  overflow:hidden;background:#bfe4ff;box-shadow:6px 6px 0 var(--ink);touch-action:manipulation;
}
#view{position:absolute;inset:0;width:100%;height:100%;display:block}

.caption{
  position:absolute;left:14px;top:12px;max-width:min(58%,470px);background:var(--white);
  border:3px solid var(--ink);border-radius:18px;padding:8px 14px 10px;box-shadow:4px 4px 0 var(--ink);pointer-events:none;
}
.caption.bump{animation:bump .5s cubic-bezier(.34,1.56,.64,1)}
@keyframes bump{0%{transform:scale(.85)}100%{transform:scale(1)}}
.cap-level{font-family:var(--display);font-weight:700;font-size:24px;line-height:1.1}
.cap-text{font-weight:800;font-size:15.5px;margin-top:3px;text-wrap:balance}
.cap-text b{color:var(--rocket-dk)}

.hint{
  position:absolute;left:50%;transform:translateX(-50%);top:12px;background:rgba(255,253,247,.92);
  border:3px solid var(--ink);border-radius:999px;padding:6px 14px;font-weight:800;font-size:14px;
  pointer-events:none;box-shadow:3px 3px 0 var(--ink);
}
.hint[hidden]{display:none}
.stat{position:absolute;right:14px;bottom:12px;display:flex;gap:8px;pointer-events:none;flex-wrap:wrap;justify-content:flex-end;max-width:calc(100% - 28px)}
.stat span{
  background:rgba(255,253,247,.94);border:3px solid var(--ink);border-radius:999px;padding:5px 12px;
  font-family:var(--display);font-weight:600;font-size:15px;box-shadow:3px 3px 0 var(--ink);
  font-variant-numeric:tabular-nums;white-space:nowrap;
}
.stat[hidden]{display:none}

.card{
  position:absolute;right:14px;top:12px;width:min(350px,calc(100% - 28px));display:flex;gap:12px;align-items:flex-start;
  background:var(--white);border:3px solid var(--ink);border-radius:20px;padding:12px;box-shadow:4px 4px 0 var(--ink);
  animation:bump .4s cubic-bezier(.34,1.56,.64,1);
}
.card[hidden]{display:none}
.card-thumb{width:84px;height:84px;flex:0 0 84px;border-radius:14px;border:3px solid var(--ink);background:#e8f4ff}
.card-body{min-width:0;flex:1}
.card-name{font-family:var(--display);font-weight:700;font-size:22px;line-height:1.05}
.card-sub{font-family:var(--display);font-weight:600;font-size:15px;color:var(--rocket-dk);margin-top:2px}
.card-fact{font-weight:800;font-size:15.5px;margin-top:6px}
.card-extra{font-weight:700;font-size:12.5px;margin-top:6px;opacity:.75}
.card-x,.q-x{
  position:absolute;right:-12px;top:-12px;width:34px;height:34px;border-radius:50%;border:3px solid var(--ink);
  background:var(--gold);font-family:var(--display);font-weight:700;font-size:20px;line-height:1;box-shadow:2px 2px 0 var(--ink);
}
.toast{
  position:absolute;left:50%;bottom:64px;transform:translateX(-50%);background:var(--gold);
  border:3px solid var(--ink);border-radius:999px;padding:8px 18px;font-family:var(--display);font-weight:700;font-size:19px;
  white-space:nowrap;box-shadow:4px 4px 0 var(--ink);pointer-events:none;max-width:calc(100% - 28px);
  overflow:hidden;text-overflow:ellipsis;animation:bump .5s cubic-bezier(.34,1.56,.64,1);
}
.toast[hidden]{display:none}

/* ---------- the challenge panel ---------- */
.quest{
  position:absolute;left:14px;bottom:12px;width:min(430px,calc(100% - 28px));background:var(--white);
  border:3px solid var(--ink);border-radius:20px;padding:12px 14px;box-shadow:4px 4px 0 var(--ink);
  animation:bump .4s cubic-bezier(.34,1.56,.64,1);
}
.quest[hidden]{display:none}
.q-head{display:flex;align-items:center;gap:8px}
.q-title{font-family:var(--display);font-weight:700;font-size:17px;flex:1}
.dots{display:flex;gap:4px}
.dot{width:11px;height:11px;border-radius:50%;border:2px solid var(--ink);background:var(--white)}
.dot.done{background:var(--grass)}
.dot.now{background:var(--gold)}
.q-text{font-weight:800;font-size:16px;margin-top:6px;text-wrap:balance}
.q-opts{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px}
.q-opts[hidden]{display:none}
.opt{
  font-family:var(--display);font-weight:600;font-size:16px;border:3px solid var(--ink);border-radius:999px;
  background:var(--paper-2);padding:8px 14px;line-height:1.1;box-shadow:0 3px 0 var(--ink);text-align:left;
  transition:transform .08s,box-shadow .08s;
}
.opt:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.opt.yes{background:var(--grass);color:var(--white)}
.opt.no{animation:shake .4s}
.opt:disabled{cursor:default}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.q-fb{font-weight:800;font-size:14.5px;margin-top:8px;min-height:18px}
.q-fb.good{color:var(--leaf-dk)}
.q-fb.bad{color:var(--rocket-dk)}

/* ---------- dock ---------- */
/* Three groups no longer fit on one row: once the chips carry words the rail
   needs real width, and squeezing all three together is what put the controls
   on top of the buttons. So the rail gets a row of its own and scrolls within
   it, and the buttons and chapter controls share the row below. A grid item's
   default min-width is min-content, so the min-width:0 on the rail is what
   lets it scroll instead of pushing the dock wider than the screen. */
.dock{
  display:grid;
  grid-template-columns:auto minmax(0,1fr);
  grid-template-areas:"levels levels" "buttons ctl";
  align-items:center;gap:10px 14px;
}
.dock > .levels,.dock > .parts{grid-area:levels}
.dock > .buttons{grid-area:buttons}
.dock > .ctl{grid-area:ctl}
/* The chapter rail: an emoji AND a word, the one clearly better idea in
   Build a House. A child should not have to guess which stop is which, and on a
   touch screen there is no hover to reveal a title attribute. It scrolls
   sideways when the words do not fit, and the current stop scrolls itself
   into view. */
.levels{display:flex;align-items:center;gap:6px;min-width:0;overflow-x:auto;overflow-y:hidden;
  scrollbar-width:none;max-width:100%;padding:3px 2px}
.levels::-webkit-scrollbar{display:none}
.lvl{
  display:flex;align-items:center;gap:6px;flex:0 0 auto;min-height:44px;
  padding:5px 13px 5px 9px;border-radius:999px;border:3px solid var(--ink);
  background:var(--white);font-family:var(--display);font-weight:600;font-size:13px;
  line-height:1;white-space:nowrap;box-shadow:3px 3px 0 var(--ink);
  transition:transform .15s,background .15s;position:relative;
}
.lvl .ic{font-size:20px;font-family:var(--emoji);line-height:1}
.lvl:hover{transform:translateY(-2px)}
.lvl.on{background:var(--gold)}
.lvl.done{background:var(--paper-2)}
.lvl.won::after{content:"✓";position:absolute;right:-7px;top:-7px;width:18px;height:18px;border-radius:50%;background:var(--grass);color:var(--white);border:2px solid var(--ink);font:700 11px/14px var(--display)}
.buttons{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.btn{
  font-family:var(--display);font-weight:700;border:3px solid var(--ink);border-radius:999px;background:var(--white);
  padding:10px 16px;font-size:16px;line-height:1;box-shadow:0 5px 0 var(--ink);
  transition:transform .08s,box-shadow .08s,opacity .2s;white-space:nowrap;
}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn:disabled{opacity:.35;cursor:default;transform:none;box-shadow:0 5px 0 var(--ink)}
.btn.big{
  background:var(--rocket);color:var(--white);font-size:23px;padding:12px 22px;
  box-shadow:0 7px 0 var(--rocket-dk),0 7px 0 3px var(--ink);text-shadow:2px 2px 0 var(--rocket-dk);
}
.btn.big:active{transform:translateY(5px);box-shadow:0 2px 0 var(--rocket-dk),0 2px 0 3px var(--ink)}
.btn.quest-btn{background:var(--gold)}
.btn.quest-btn.won{background:var(--grass);color:var(--white)}
.ctl{display:flex;justify-content:flex-end;min-width:0;gap:10px;flex-wrap:wrap}
.ctl-group{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.ctl-group[hidden]{display:none}
.ctl-label{font-family:var(--display);font-weight:600;font-size:12px;letter-spacing:1px;text-transform:uppercase;opacity:.8}
.tog{
  font-family:var(--display);font-weight:600;font-size:15px;border:3px solid var(--ink);border-radius:999px;
  background:var(--white);padding:8px 13px;line-height:1;box-shadow:0 4px 0 var(--ink);
  transition:transform .08s,box-shadow .08s,background .15s;white-space:nowrap;
}
.tog:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.tog.on{background:var(--gold)}
.tog.go{background:var(--grass);color:var(--white);text-shadow:1px 1px 0 var(--leaf-dk)}
.tog.dark{background:var(--space);color:var(--white);text-shadow:1px 1px 0 #000}
.tog.hot{background:var(--rocket);color:var(--white);text-shadow:1px 1px 0 var(--rocket-dk)}
.tog:disabled{opacity:.4;cursor:default;transform:none}

/* ---------- small screens ---------- */
@media (max-width:860px){
  .app{padding:8px;gap:8px}
  .top{flex-wrap:nowrap;gap:8px}
  .brand h1{font-size:22px;text-shadow:2px 2px 0 var(--gold)}
  .brand .tagline{display:none}
  .meter{padding:3px 8px;min-height:40px;gap:6px;border-width:2.5px;box-shadow:3px 3px 0 var(--ink)}
  .meter-label{display:none}
  .badge{width:27px;height:27px;font-size:13px;border-width:2px}
  .badges{gap:4px}
  /* one row per job, and every target at least 44px for a small finger */
  .dock{grid-template-columns:1fr;grid-template-areas:"buttons" "levels" "ctl";gap:8px}
  .levels{grid-area:levels;gap:6px;justify-content:flex-start;flex-wrap:nowrap}
  .lvl{font-size:12px;padding:5px 11px 5px 8px;box-shadow:2px 2px 0 var(--ink)}
  .lvl .ic{font-size:18px}
  .buttons{grid-area:buttons;justify-content:center;gap:8px}
  #btnBack .bl{display:none}     /* Back keeps its arrow and drops the word */
  #btnBack{min-width:44px}
  .ctl{grid-area:ctl;justify-content:center;align-items:center;gap:8px}
  .ctl-group{justify-content:center;gap:6px}
  .btn.big{font-size:17px;padding:10px 14px}
  .btn{padding:8px 12px;font-size:14px;min-height:44px}
  .tog{font-size:13.5px;padding:7px 12px;min-height:44px}
  .ctl-label{font-size:11px}
  .caption{max-width:calc(100% - 28px);padding:6px 10px 8px}
  .cap-level{font-size:17px}.cap-text{font-size:12.5px}
  /* the tap prompt is the only thing that says the picture can be tapped,
     and half the challenges ask for a tap — so it stays on every screen */
  .hint{left:14px;right:14px;transform:none;bottom:10px;text-align:center;
        font-size:12.5px;padding:5px 10px;border-width:2.5px}
  .stat{bottom:52px}
  .card{width:calc(100% - 28px)}
  .card-thumb{width:56px;height:56px;flex-basis:56px}
  .card-name{font-size:17px}.card-sub{font-size:13px}.card-fact{font-size:13px}
  .quest{width:calc(100% - 28px);left:14px;right:14px;top:12px;bottom:auto;padding:10px 12px}
  .q-title{font-size:15px}.q-text{font-size:14px}.opt{font-size:14px;padding:8px 14px;min-height:44px}
  body.questing .caption,body.carding .caption{display:none}
  .stat span{font-size:12px;padding:4px 9px}
}
/* Any short viewport — a phone on its side, or a stubby desktop window. It may be
   too wide for the small-screen
   rules above, so the compact dock has to be spelled out again here — a partial
   override lands half a layout on top of the desktop one, and things overflow. */
@media (max-height:560px){   /* short is what matters here, not narrow: a stubby desktop window needs this too */
  /* the picture is a flex child with a min-height; on a really short screen that
     min let it grow past its own grid row and sit on top of the dock */
  .stage{min-height:0}
  .dock{grid-template-columns:minmax(72px,1fr) auto;grid-template-areas:"levels buttons" "ctl ctl";gap:8px}
  .levels{grid-area:levels;justify-content:flex-start;gap:5px;flex-wrap:nowrap}
  .lvl{min-height:38px;font-size:11.5px;padding:4px 10px 4px 7px}
  .lvl .ic{font-size:16px}
  .buttons{grid-area:buttons;justify-content:flex-end;gap:8px;flex-wrap:wrap}
  .ctl{grid-area:ctl;justify-content:center}
  #btnBack .bl{display:none}
  #btnBack{min-width:38px}
  .btn,.tog{min-height:38px}
  .btn{padding:8px 11px;font-size:14px}
  .btn.big{font-size:17px;padding:10px 14px}
  .tog{font-size:13.5px;padding:7px 10px}
  .caption{max-width:calc(100% - 28px);padding:6px 10px 8px}
  .cap-level{font-size:17px}.cap-text{font-size:12.5px}
  .hint{left:14px;right:14px;transform:none;bottom:10px;text-align:center;
        font-size:12.5px;padding:5px 10px;border-width:2.5px}
  .stat{bottom:46px}
}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
/* ---------- badges that survive a closed tab, and the way to clear them ---------- */
.wipe{
  width:34px;height:34px;flex:0 0 auto;border-radius:50%;border:3px solid var(--ink);
  background:var(--white);font-family:var(--display);font-weight:700;font-size:15px;
  line-height:1;padding:0;box-shadow:2px 2px 0 var(--ink);white-space:nowrap;
}
/* deliberately the one small target in the collection: it throws away a child's
   badges, so it should be hard to hit by accident and takes two taps anyway */
.wipe.armed{width:auto;padding:0 11px;height:34px;background:var(--rocket);color:var(--white);font-size:12.5px}
.wipe[hidden]{display:none}
/* Every .btn is nowrap so the labels read cleanly, but that stops the wide one
   ('Back to the start') from ever shrinking: at a middling width it overflowed
   its column and landed on top of the rail. Let the big button wrap its words
   instead — there is room on a wide screen, and on a squeezed one two lines
   beat two overlapping controls. */
.btn.big{white-space:normal;text-wrap:balance}
.buttons > .btn{min-width:0;max-width:100%}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <h1>Flyway</h1>
      <p class="tagline">Follow the birds from a Missouri backyard to the tropics — and back again.</p>
    </div>
    <div class="right">
      <div class="meter" id="meter" aria-live="polite">
        <div class="meter-label">Journey<br>badges</div>
        <div class="badges" id="badges" aria-label="one badge for each stop on the journey"></div>
        <button class="wipe" id="btnWipe" type="button" hidden aria-label="Clear all badges and start fresh">↺</button>
      </div>
    </div>
  </header>

  <main class="stage-wrap">
    <div class="stage" id="stage">
      <canvas id="view"></canvas>
      <div class="caption" id="caption">
        <div class="cap-level" id="capLevel"></div>
        <div class="cap-text" id="capText"></div>
      </div>
      <div class="stat" id="stat" hidden></div>
      <div class="hint" id="hint">👆 Tap the birds to meet them</div>
      <div class="card" id="card" hidden>
        <button class="card-x" id="cardClose" aria-label="Close">×</button>
        <canvas class="card-thumb" id="thumb" width="168" height="168"></canvas>
        <div class="card-body">
          <div class="card-name" id="cardName"></div>
          <div class="card-sub" id="cardSub"></div>
          <div class="card-fact" id="cardFact"></div>
          <div class="card-extra" id="cardExtra"></div>
        </div>
      </div>
      <div class="quest" id="quest" hidden>
        <button class="q-x" id="questClose" aria-label="Close the challenge">×</button>
        <div class="q-head"><div class="q-title" id="qTitle"></div><div class="dots" id="qDots"></div></div>
        <div class="q-text" id="qText"></div>
        <div class="q-opts" id="qOpts"></div>
        <div class="q-fb" id="qFb" role="status" aria-live="polite"></div>
      </div>
      <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
    </div>
  </main>

  <footer class="dock">
    <div class="levels" id="levels"></div>
    <div class="buttons">
      <button class="btn" id="btnBack" aria-label="Back">◀ <span class="bl">Back</span></button>
      <button class="btn big" id="btnNext">NEXT ▶</button>
      <button class="btn quest-btn" id="btnQuest">🎯 Challenge!</button>
    </div>
    <div class="ctl" id="ctl">
      <div class="ctl-group" id="ctl-season" hidden>
        <span class="ctl-label">Season:</span>
        <button class="tog" data-season="spring">🌱 Spring</button>
        <button class="tog on" data-season="summer">☀️ Summer</button>
        <button class="tog" data-season="fall">🍂 Fall</button>
        <button class="tog" data-season="winter">❄️ Winter</button>
      </div>
      <div class="ctl-group" id="ctl-map" hidden>
        <span class="ctl-label">Traveler:</span>
        <button class="tog on" data-trav="hum">🌺 Hummingbird</button>
        <button class="tog" data-trav="tan">🍒 Tanager</button>
        <button class="tog" data-trav="mar">🏠 Martin</button>
        <button class="tog" data-trav="goo">❄️ Snow goose</button>
        <button class="tog go" id="btnFly">▶ Fly!</button>
      </div>
      <div class="ctl-group" id="ctl-fuel" hidden>
        <button class="tog hot" id="btnEat">🍇 Eat!</button>
        <button class="tog go" id="btnCross">🌊 Cross the Gulf</button>
        <button class="tog" id="btnFuelReset">↺ Reset the tank</button>
      </div>
      <div class="ctl-group" id="ctl-compass" hidden>
        <button class="tog" id="btnDayNight">🌙 Make it night</button>
        <button class="tog" id="btnClouds">☁️ Roll in clouds</button>
        <button class="tog" id="btnField">🧲 Show the magnetic field</button>
      </div>
      <div class="ctl-group" id="ctl-night" hidden>
        <button class="tog on" id="btnLights">💡 City lights: ON</button>
        <button class="tog" id="btnRadar">📡 Radar view</button>
      </div>
    </div>
  </footer>
</div>
<script>
'use strict';
/* =====================================================================
   FLYWAY — bird migration for grades 3–4
   Six stops, drawn on one canvas: why birds leave, the road they take,
   the fuel they carry, the compasses they steer by, the night sky they
   cross, and who shows up in Missouri in each season. Every stop has
   tap-to-meet birds and a challenge that earns a badge.
   ===================================================================== */
const TAU=Math.PI*2;
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const easeOut=t=>1-Math.pow(1-t,3);
const REDUCED=matchMedia('(prefers-reduced-motion: reduce)').matches;
function seeded(n){ let s=n*9301+49297; return ()=>{ s=(s*9301+49297)%233280; return s/233280; }; }
const rnd=Math.random;

const LABEL_FONT='"Nunito","Segoe UI Rounded",ui-rounded,"Segoe UI",system-ui,sans-serif';

      GRASS='#63c64d', WHITE='#fffdf7', SPACE='#12103a', WATER='#7fc4ef', LAND='#bcd98f',
      LAND_DK='#8fbf62', BARK='#8d6b52', BARK_DK='#4e2f18', LEAF='#3f9d3a', LEAF_DK='#2e7d32';

/* ---------- drawing helpers ---------- */
function circle(x,y,r,fill){ ctx.fillStyle=fill; ctx.beginPath(); ctx.arc(x,y,Math.max(0.1,r),0,TAU); ctx.fill(); }
function ring(x,y,r,stroke,w){ ctx.strokeStyle=stroke; ctx.lineWidth=w; ctx.beginPath(); ctx.arc(x,y,Math.max(0.1,r),0,TAU); ctx.stroke(); }
function disc(x,y,r,fill,ol){ circle(x,y,r,fill); if(ol) ring(x,y,r,INK,ol); }
function ellipse(x,y,rx,ry,rot,fill,ol){ ctx.beginPath(); ctx.ellipse(x,y,Math.max(0.1,rx),Math.max(0.1,ry),rot||0,0,TAU); if(fill){ctx.fillStyle=fill;ctx.fill();} if(ol){ ctx.strokeStyle=INK; ctx.lineWidth=ol; ctx.stroke(); } }
function poly(P,fill,ol,close){ ctx.beginPath(); P.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1])); if(close!==false) ctx.closePath(); if(fill){ ctx.fillStyle=fill; ctx.fill(); } if(ol){ ctx.strokeStyle=INK; ctx.lineWidth=ol; ctx.lineJoin='round'; ctx.stroke(); } }
function rrect(x,y,w,h,r){ r=Math.min(r,Math.abs(w)/2,Math.abs(h)/2); ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function box(x,y,w,h,r,fill,ol){ rrect(x,y,w,h,r); if(fill){ctx.fillStyle=fill;ctx.fill();} if(ol){ ctx.strokeStyle=INK; ctx.lineWidth=ol; ctx.stroke(); } }
function line(x1,y1,x2,y2,stroke,w,cap){ ctx.strokeStyle=stroke; ctx.lineWidth=w; ctx.lineCap=cap||'round'; ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke(); }
function path(P,stroke,w,cap,dash){ ctx.save(); if(dash) ctx.setLineDash(dash); ctx.strokeStyle=stroke; ctx.lineWidth=w; ctx.lineCap=cap||'round'; ctx.lineJoin='round'; ctx.beginPath(); P.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1])); ctx.stroke(); ctx.restore(); }
function emoji(ch,x,y,px,flip){ ctx.save(); ctx.translate(x,y); if(flip) ctx.scale(-1,1); ctx.font=px+'px '+EMOJI_FONT; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillStyle='#000'; ctx.fillText(ch,0,px*0.06); ctx.restore(); }
function label(txt,x,y,o){
  o=o||{}; const size=o.size||13;
  ctx.save(); ctx.textAlign=o.align||'center'; ctx.textBaseline=o.baseline||'middle'; ctx.lineJoin='round';
  ctx.font=(o.weight||800)+' '+size+'px '+(o.display?DISPLAY_FONT:LABEL_FONT);
  ctx.strokeStyle=o.dark?'rgba(255,248,231,0.85)':'rgba(43,35,80,0.8)'; ctx.lineWidth=Math.max(3,size*0.32);
  ctx.strokeText(txt,x,y);
  ctx.fillStyle=o.color||(o.dark?INK:PAPER); ctx.fillText(txt,x,y);
  ctx.restore();
}
function sign(txt,x,y,o){
  o=o||{}; const size=o.size||13;
  ctx.save(); ctx.font='800 '+size+'px '+LABEL_FONT;
  const w=ctx.measureText(txt).width+18, h=size+14;
  let bx=o.align==='left'?x:o.align==='right'?x-w:x-w/2, by=y-h/2;
  bx=clamp(bx,4,V.w-w-4); by=clamp(by,4,V.h-h-4);
  if(o.to) line(bx+w/2,by+h/2,o.to[0],o.to[1],INK,2.5);
  box(bx,by,w,h,10,o.fill||WHITE,2.5);
  ctx.fillStyle=o.color||INK; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(txt,bx+w/2,by+h/2+1);
  ctx.restore(); return {x:bx,y:by,w,h};
}
function vgrad(y0,y1,stops){ const g=ctx.createLinearGradient(0,y0,0,y1); stops.forEach(s=>g.addColorStop(s[0],s[1])); return g; }

// draw a perched/flying bird. o: {flip, wing:-1..1 (flap), perch, fat:0..1, scale}
function bird(x,y,s,key,o){
  const B=SPECIES[key]||SPECIES.chickadee; o=o||{};
  const S=s*(B.size||1)*(o.scale||1), TILT=-0.2;
  ctx.save(); ctx.translate(x,y); if(o.flip) ctx.scale(-1,1);
  const rx=S*0.44*(1+(o.fat||0)*0.22), ry=S*0.29*(1+(o.fat||0)*0.40);
  const hr=S*0.235, hx=S*0.36, hy=-S*0.30;
  const neck=B.neck||0, HX=hx+S*0.055*neck, HY=hy-S*0.30*neck;
  const dark=B.wing||B.body;
  // tail, swept back and down
  const tl=S*0.62*(B.tail||.8), tx=-rx*0.8, ty=ry*0.05;
  if(B.fork) poly([[tx,ty-S*0.06],[tx-tl*0.95,ty-tl*0.5],[tx-tl*0.6,ty+S*0.02],[tx-tl*0.95,ty+tl*0.42]],dark,2.2);
  else poly([[tx,ty-S*0.09],[tx-tl*0.95,ty+tl*0.12],[tx-tl*0.9,ty+tl*0.38],[tx,ty+S*0.09]],
            B.tailRed?'#b5482c':(B.tailDark?dark:B.body),2.2);
  // legs first, so the body sits on them
  if(o.perch||o.wade){ const L=ry*(o.wade?3.6:1.35), lw=Math.max(2,S*(o.wade?0.042:0.05));
    [rx*0.16,-rx*0.16].forEach(lx=>{ line(lx,ry*0.55,lx,L,'#e0a33d',lw);
      line(lx,L,lx+S*0.09,L+S*0.03,'#e0a33d',Math.max(1.6,S*0.04)); line(lx,L,lx-S*0.07,L+S*0.03,'#e0a33d',Math.max(1.6,S*0.04)); }); }
  // body
  ellipse(0,0,rx,ry,TILT,B.body,2.6);
  ctx.save(); ctx.beginPath(); ctx.ellipse(0,0,rx,ry,TILT,0,TAU); ctx.clip();
  ellipse(-rx*0.05,ry*0.42,rx*0.9,ry*0.72,TILT,B.belly||B.body,0);
  if(B.spots){ const rr=seeded(7); for(let i=0;i<8;i++) circle(-rx*0.3+rr()*rx*1.1,ry*0.05+(rr()-.5)*ry*1.1,S*0.024,'#7a6244'); }
  if(B.crescent) ellipse(rx*0.1,-ry*0.35,rx*0.26,ry*0.3,0,'#a8ceea',0);
  ctx.restore();
  // neck
  if(neck){ const x0=rx*0.30,y0=-ry*0.5,w0=S*0.16,w1=S*0.082,my=(y0+HY)*0.5;
    ctx.beginPath(); ctx.moveTo(x0-w0/2,y0);
    ctx.quadraticCurveTo(HX-w1-S*0.13,my,HX-w1*0.6,HY+hr*0.25);
    ctx.lineTo(HX+w1*0.6,HY+hr*0.25);
    ctx.quadraticCurveTo(HX+w1*0.5+S*0.02,my,x0+w0/2,y0);
    ctx.closePath(); ctx.fillStyle=B.head||B.body; ctx.fill();
    ctx.strokeStyle=INK; ctx.lineWidth=2.4; ctx.lineJoin='round'; ctx.stroke(); }
  // wing
  const wa=o.wing==null?0.1:o.wing;
  ctx.save(); ctx.translate(-rx*0.06,-ry*0.18); ctx.rotate(TILT-wa*0.9);
  ellipse(0,0,rx*0.66,ry*0.46,0,dark,2.4);
  if(B.wingtip) poly([[-rx*0.6,-ry*0.02],[-rx*1.02,ry*0.16],[-rx*0.42,ry*0.28]],B.wingtip,2);
  ctx.restore();
  // head
  disc(HX,HY,hr,B.head||B.body,2.6);
  if(B.cap){ ctx.save(); ctx.beginPath(); ctx.arc(HX,HY,hr,Math.PI*1.02,TAU*0.02); ctx.closePath(); ctx.fillStyle=B.cap; ctx.fill(); ctx.strokeStyle=INK; ctx.lineWidth=2; ctx.stroke(); ctx.restore(); }
  if(B.cheek) circle(HX-hr*0.05,HY-hr*0.5,hr*0.24,B.cheek);
  if(B.nape) circle(HX-hr*0.6,HY-hr*0.3,hr*0.32,B.nape);
  if(B.face){ ctx.save(); ctx.beginPath(); ctx.arc(HX,HY,hr,0,TAU); ctx.clip(); circle(HX+hr*0.45,HY+hr*0.2,hr*0.62,B.face); ctx.restore(); }
  if(B.bib){ ctx.save(); ctx.beginPath(); ctx.arc(HX,HY,hr,0,TAU); ctx.clip(); ellipse(HX+hr*0.35,HY+hr*0.75,hr*0.6,hr*0.6,0,B.bib,0); ctx.restore(); }
  if(B.throat) ellipse(HX+hr*0.3,HY+hr*0.62,hr*0.42,hr*0.34,0.35,B.throat,2);
  if(B.crest) poly([[HX-hr*0.35,HY-hr*0.8],[HX+hr*0.1,HY-hr*1.95],[HX+hr*0.62,HY-hr*0.6]],B.head||B.body,2.4);
  // bill
  const bl=S*0.2*(B.billLen||1), bw=S*(B.billW||0.062);
  poly([[HX+hr*0.7,HY-bw],[HX+hr*0.7+bl,HY+bw*0.1],[HX+hr*0.7,HY+bw*1.05]],B.bill,2);
  // eye
  circle(HX+hr*0.28,HY-hr*0.22,Math.max(1.6,S*0.05),INK);
  circle(HX+hr*0.36,HY-hr*0.32,Math.max(0.7,S*0.018),WHITE);
  ctx.restore();
}
// wrap text to a width, in canvas
function wrapText(txt,maxw,size,display){
  ctx.save(); ctx.font='800 '+size+'px '+(display?DISPLAY_FONT:LABEL_FONT);
  const words=txt.split(' '), lines=[]; let cur='';
  words.forEach(w=>{ const t=cur?cur+' '+w:w;
    if(ctx.measureText(t).width>maxw&&cur){ lines.push(cur); cur=w; } else cur=t; });
  if(cur) lines.push(cur); ctx.restore(); return lines;
}
// the one line of scene text, always in the same corner
function banner(txt){ if(V.w<620) return; label(txt,V.w*0.03,V.h*0.945,{size:Math.max(13,V.h*0.04),display:true,dark:true,align:'left'}); }
// a tappable marker for things that are ideas rather than objects
function tapMark(x,y,emo,r){
  r=r||18; const pu=1+Math.sin(now*2.4)*0.05;
  ctx.save(); ctx.translate(x,y); ctx.scale(pu,pu);
  disc(0,0,r,'rgba(255,253,247,0.94)',3);
  ctx.setLineDash([4,5]); ring(0,0,r+6,'rgba(43,35,80,0.5)',2); ctx.setLineDash([]);
  if(emo) emoji(emo,0,0,r*1.15);
  ctx.restore();
}
// a flying silhouette-ish bird: two wings + body, used in flocks
function flyer(x,y,s,col,ph,ol){
  const up=Math.sin(ph)*0.9;
  ctx.save(); ctx.translate(x,y);
  poly([[-s,-up*s*0.7],[-s*0.25,-s*0.12],[0,0],[-s*0.25,s*0.1]],col,ol||0);
  poly([[s,-up*s*0.7],[s*0.25,-s*0.12],[0,0],[s*0.25,s*0.1]],col,ol||0);
  ellipse(0,0,s*0.3,s*0.16,0,col,ol||0);
  ctx.restore();
}

/* =====================================================================
   STOP 1 — WHY GO?  A Missouri backyard, four seasons.
   The point: birds don't leave because it gets cold. They leave because
   their food disappears. The bug counter is the argument.
   ===================================================================== */
const SEASON={

const YARD={spring:['hummer','tanager','martin','chickadee','cardinal'],
            summer:['hummer','tanager','bunting','martin','chickadee','cardinal'],
            fall:['hummer','thrush','jay','chickadee','cardinal'],
            winter:['junco','sparrow','woodpecker','jay','chickadee','cardinal']};
let season='summer';
const bugs=[]; for(let i=0;i<30;i++) bugs.push({x:rnd(),y:0.3+rnd()*0.45,ph:rnd()*TAU,sp:0.3+rnd()*0.7});

const sceneWhy={
  ctls:['season'], hint:'👆 Tap a bird to meet it',
  stat(){ const S=SEASON[season];
    return '<span>🐛 Insects to eat: <b>'+S.bugs+'</b> of 100</span><span>🌞 Daylight: <b>'+S.day.toFixed(1)+' h</b></span>'; },
  items(){
    const A=[];
    YARD[season].forEach(k=>{ const b=YARD_BIRDS[k];
      A.push({id:k,name:SPECIES[b.sp].name,sub:b.sub,fact:b.fact,extra:b.extra,sp:b.sp,
              x:b.p[0]*V.w,y:b.p[1]*V.h,r:Math.max(26,V.h*0.07)}); });
    A.push({id:'bugs',name:'The bug supply',sub:SEASON[season].word,emo:'🐛',bg:'#dff0c8',mark:true,
      x:V.w*0.63,y:V.h*0.32,r:V.h*0.06,
      fact:'In summer a Missouri oak is crawling with caterpillars. By January there is almost nothing moving.',
      extra:'One pair of chickadees needs 6,000–9,000 caterpillars to raise a single brood of chicks.'});
    return A;
  },
  draw(dt){
    const S=SEASON[season], H=V.h, W=V.w, gy=H*0.76;
    ctx.fillStyle=vgrad(0,gy,[[0,S.sky[0]],[1,S.sky[1]]]); ctx.fillRect(0,0,W,gy);
    const sunY=H*(season==='winter'?0.24:season==='summer'?0.10:0.16);
    disc(W*0.94,sunY,H*0.055,'#ffe57a',3);
    ctx.fillStyle=S.ground; ctx.fillRect(0,gy,W,H-gy);
    if(season==='winter'){ ctx.fillStyle='#fbfdff'; ctx.fillRect(0,gy-4,W,H-gy+4); }
    else { for(let i=0;i<70;i++){ const gx=(i*37%100)/100*W, gh=H*0.02*(0.6+((i*13)%5)/6);

function haversine(a,b){ const R=3959,t=Math.PI/180, dLat=(b[1]-a[1])*t, dLon=(b[0]-a[0])*t,

      else { F.d-=dt*160; if(F.d<=0){ fuel.fly=null; fuel.w=LEAN+0.35; } }
      if(F.done&&!F.told){ F.told=1; toast('🌺 Made it! 500 miles, about 20 hours, tank empty.',6000); }
      const pr=clamp(F.d/GULF,0,1);
      bxp=lerp(W*0.25,W*0.9,pr); byp=H*0.56-H*0.14*Math.sin(pr*Math.PI)+Math.sin(now*2)*H*0.015;
    }
    bird(bxp,byp+(fuel.fly?0:Math.sin(now*3)*3),H*0.13,'hummer',{wing:Math.sin(now*26)*1.2,fat:fat});
    if(!fuel.fly&&fat<0.99) sign('Press 🍇 Eat!',bxp,byp-H*0.10,{size:Math.max(11,H*0.032),fill:GOLD});
    banner(fuel.fly?(fuel.fly.done?'Made it — and the tank is empty':'Crossing…'):'Fattening up on the Gulf coast');
  },
};

const nav={night:false,clouds:false,field:false};

const STARS=[]; for(let i=0;i<90;i++) STARS.push({a:rnd()*TAU,r:0.08+rnd()*0.95,s:0.6+rnd()*1.6});
const sceneCompass={

  draw(dt){

      bx,by+H*0.21,{size:Math.max(11,H*0.034),display:true,dark:!nav.night,color:nav.night?GOLD:INK});
  },

const sceneGuests={
  ctls:['season'], hint:'👆 Tap this season\u2019s visitors',
  stat(){ return GSTAT[season]; },
  items(){ return GUEST[season].birds.map((b,i)=>({id:'g'+i,name:b.name,sub:b.sub,fact:b.fact,extra:b.extra,sp:b.sp,
    x:b.p[0]*V.w,y:b.p[1]*V.h,r:Math.max(26,V.h*0.07)})); },
  draw(dt){
    const W=V.w,H=V.h, G=GUEST[season], wy=H*0.62, by=H*0.86;
    ctx.fillStyle=vgrad(0,wy,[[0,G.sky[0]],[1,G.sky[1]]]); ctx.fillRect(0,0,W,wy);
    disc(W*0.68,H*(season==='winter'?0.20:0.12),H*0.05,'#ffe57a',3);
    // the far bank, then the treeline standing on it
    ctx.fillStyle=season==='winter'?'#e8eef2':season==='fall'?'#c8b565':'#6fbf4a'; ctx.fillRect(0,wy-H*0.025,W,H*0.03);
    for(let i=0;i<22;i++){ const tx=W*(0.02+i*0.045), r=H*(0.028+((i*7)%5)/70), ty=wy-H*0.02-r*0.55;
      ctx.fillStyle='#6b4f38'; ctx.fillRect(tx-2.5,ty,5,r*0.9);
      circle(tx,ty,r,season==='winter'?'#8a9a8a':season==='fall'?(i%3?'#d09a3f':'#c26a35'):season==='spring'?'#7fc55a':'#3f8d3a'); }
    // the bluff on the right
    poly([[W,wy],[W,H*0.16],[W*0.90,H*0.20],[W*0.83,H*0.36],[W*0.82,wy]],'#c8a878',3);
    poly([[W,H*0.16],[W*0.90,H*0.20],[W*0.93,H*0.27],[W,H*0.25]],'#e0c49a',0);
    // water, then the near bank
    ctx.fillStyle=vgrad(wy,by,[[0,season==='winter'?'#9fc0d8':'#6bb8e8'],[1,season==='winter'?'#c8dae8':'#3f8fc0']]); ctx.fillRect(0,wy,W,by-wy);
    for(let i=0;i<6;i++){ const y=wy+(by-wy)*(i+0.5)/6; path([[0,y],[W*0.3,y-3],[W*0.6,y+3],[W,y-2]],'rgba(255,255,255,0.28)',2); }
    ctx.fillStyle=season==='winter'?'#f2f6f8':season==='fall'?'#c8b565':'#63c64d'; ctx.fillRect(0,by,W,H-by);
    line(0,by,W,by,'rgba(43,35,80,0.15)',3);
    // cattails along the bank
    for(let i=0;i<14;i++){ const cx=W*(0.02+i*0.075)+((i*13)%5), ch=H*0.11;
      if(cx>W*0.24&&cx<W*0.62) continue;
      line(cx,by+H*0.03,cx,by+H*0.03-ch,season==='winter'?'#c8b98d':'#6b9d3a',3);
      box(cx-3,by+H*0.03-ch-H*0.03,6,H*0.035,3,'#7a5a2a',0); }
    // seasonal weather
    if(season==='winter'){ const rr=seeded(13);
      for(let i=0;i<80;i++){ const fx=((rr()*1.2+now*0.01)%1.2-0.1)*W, fy=H*(0.04+rr()*0.4), sz=H*0.011*(0.6+rr());
        flyer(fx,fy,sz,'#fdfbf2',now*7+i,1.2); }
      for(let i=0;i<34;i++){ const rx=W*(0.08+rr()*0.8), ry=wy+H*(0.02+rr()*0.2);
        line(rx+H*0.009,ry-H*0.002,rx+H*0.013,ry-H*0.012,'#fdfbf2',2.4);
        ellipse(rx,ry,H*0.013,H*0.007,0,'#fdfbf2',1.4); circle(rx+H*0.014,ry-H*0.013,H*0.005,'#fdfbf2'); }
      const rs=seeded(19); for(let i=0;i<60;i++) circle((rs()*W+now*6)%W,(rs()*H+now*18)%H,2,'rgba(255,255,255,0.85)'); }
    if(season==='fall'){ const rr=seeded(17); for(let i=0;i<14;i++){ const lx=((rr()+now*0.03)%1)*W, ly=((rr()+now*0.05)%1)*wy;
        ctx.save(); ctx.translate(lx,ly); ctx.rotate(now+i); ellipse(0,0,6,3.5,0,'#d08a3a',1.5); ctx.restore(); } }
    // the guests
    G.birds.forEach(b=>{ const x=b.p[0]*W, y=b.p[1]*H, s=H*0.095;
      if(b.swim) ellipse(x,y+H*0.035,H*0.055,H*0.012,0,'rgba(43,35,80,0.13)',0);
      if(b.hover) bird(x,y+Math.sin(now*3)*3,s*0.9,b.sp,{wing:Math.sin(now*26)*1.2,flip:1});
      else if(b.fly) bird(x+Math.sin(now*0.4)*W*0.09,y+Math.sin(now*0.9)*H*0.02,s,b.sp,{wing:Math.sin(now*6)*0.9});
      else bird(x,y,s,b.sp,{perch:!b.swim&&!b.wade,wade:b.wade,wing:0.12,flip:x>W*0.55}); });
    banner(SEASON[season].word+' in Missouri');
  },
};

/* ---------- the challenge panel ---------- */
const quest={active:null,step:0,picked:0};
function startQuest(id){
  const Q=QUESTS[id]; if(!Q) return;
  closeCard(); quest.active=Q(); quest.step=0; quest.picked=0;
  els.qTitle.textContent=quest.active.title; els.quest.hidden=false; els.hint.hidden=true; document.body.classList.add('questing');
  renderStep();
}
function endQuest(){ quest.active=null; els.quest.hidden=true; document.body.classList.remove('questing'); }
function renderStep(){
  const Q=quest.active; if(!Q) return; const S=Q.steps[quest.step]; if(!S) return;
  els.qDots.innerHTML=''; Q.steps.forEach((_,i)=>{ const d=document.createElement('span'); d.className='dot'+(i<quest.step?' done':i===quest.step?' now':''); els.qDots.appendChild(d); });
  els.qText.innerHTML=S.prompt; els.qFb.textContent=''; els.qFb.className='q-fb'; quest.picked=0;
  els.qOpts.innerHTML='';
  if(S.options){ els.qOpts.hidden=false; S.options.forEach((o,i)=>{ const b=document.createElement('button'); b.className='opt'; b.textContent=o.text; b.addEventListener('click',()=>pick(i,b)); els.qOpts.appendChild(b); }); }
  else els.qOpts.hidden=true;
  if(S.onShow) S.onShow();
}
function feedback(msg,good){ els.qFb.textContent=msg; els.qFb.className='q-fb '+(good?'good':'bad'); }
function stepDone(){ const Q=quest.active; quest.step++;
  if(quest.step>=Q.steps.length){ setTimeout(()=>{ endQuest(); award(Q.id); },1100); }
  else setTimeout(renderStep,1300); }
function pick(i,btn){
  const S=quest.active.steps[quest.step], o=S.options[i];
  if(btn.disabled) return;
  if(o.ok){ btn.classList.add('yes'); btn.disabled=true; quest.picked++; feedback(o.say||'Yes!',true);
    if(quest.picked>=(S.need||1)){ els.qOpts.querySelectorAll('.opt').forEach(b=>b.disabled=true); stepDone(); } }
  else{ btn.classList.remove('no'); void btn.offsetWidth; btn.classList.add('no'); feedback(o.say||'Not that one. Try again!',false); }
}
function questTap(item){
  const Q=quest.active; if(!Q) return false;
  const S=Q.steps[quest.step]; if(!S||!S.tap) return false;
  const r=S.tap(item);
  if(r===true){ feedback(S.yes||'Yes!',true); stepDone(); return true; }
  feedback(typeof r==='string'?r:(S.no||'Not that one. Look again!'),false);
  return true;
}
function questCheck(){ const Q=quest.active; if(!Q) return; const S=Q.steps[quest.step]; if(!S) return;
  if(S.check&&S.check()){ feedback(S.yes||'Yes!',true); S.check=null; stepDone(); } }
els.questClose.addEventListener('click',endQuest);
els.btnQuest.addEventListener('click',()=>{ if(quest.active) endQuest(); else startQuest(CH[current].id); });

/* ---------- confetti ---------- */
const confetti=[];
function burstConfetti(){ if(REDUCED) return;
  const rr=seeded(Date.now()%977+1), cols=[ROCKET,GOLD,SKY,GRASS,WHITE,'#ff4fa3'];
  for(let i=0;i<120;i++) confetti.push({x:rr()*V.w,y:-10-rr()*120,vx:(rr()-.5)*80,vy:60+rr()*90,r:rr()*TAU,vr:(rr()-.5)*8,c:cols[i%cols.length],s:7+rr()*7}); }
function drawConfetti(dt){ for(let i=confetti.length-1;i>=0;i--){ const p=confetti[i];
  p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=70*dt; p.r+=p.vr*dt; if(p.y>V.h+20){ confetti.splice(i,1); continue; }
  ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r); ctx.fillStyle=p.c; ctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2); ctx.restore(); } }

$('btnField').addEventListener('click',()=>{ nav.field=!nav.field;
  $('btnField').textContent=nav.field?'🧲 Hide the magnetic field':'🧲 Show the magnetic field';
  $('btnField').classList.toggle('on',nav.field); });
$('btnLights').addEventListener('click',()=>{ night.lights=!night.lights;
  $('btnLights').textContent='💡 City lights: '+(night.lights?'ON':'OFF');
  $('btnLights').classList.toggle('on',night.lights); refreshStat();
  toast(night.lights?'💡 Lights on — watch the birds start to circle.':'🌙 Lights out. They go back on course.',4000); });
$('btnRadar').addEventListener('click',()=>{ night.radar=!night.radar;
  $('btnRadar').textContent=night.radar?'📡 Hide the radar':'📡 Radar view';
  $('btnRadar').classList.toggle('on',night.radar); refreshStat(); });

/* ---------- moving between stops ---------- */
function updateButtons(){
  els.btnBack.disabled=current===0;
  els.btnNext.textContent=current===CH.length-1?'🔁 Back to the start':'NEXT ▶';
  els.btnQuest.classList.toggle('won',!!badges[CH[current].id]);
  els.btnQuest.textContent=badges[CH[current].id]?'✅ Badge earned':'🎯 Challenge!';
  CH.forEach((c,i)=>{ c.chip.classList.toggle('on',i===current); c.chip.classList.toggle('done',i<current); });
  const onChip=CH[current].chip;                   /* keep the current one in view when the rail scrolls */
  if(onChip&&onChip.scrollIntoView) onChip.scrollIntoView({block:'nearest',inline:'center'});
}
function goTo(i){
  i=clamp(i,0,CH.length-1); if(i===current&&els.caption.dataset.set) return;
  current=i; els.caption.dataset.set='1';
  closeCard(); endQuest(); els.toast.hidden=true; clearTimeout(toastTimer);
  const c=CH[i]; if(c.scene.enter) c.scene.enter();
  setCaption(i); showCtls(c.scene.ctls||[]); refreshStat(); updateButtons();
  els.hint.textContent=c.scene.hint||'👆 Tap things to meet them'; els.hint.hidden=false;
}
els.btnNext.addEventListener('click',()=>goTo(current===CH.length-1?0:current+1));
els.btnBack.addEventListener('click',()=>goTo(current-1));
window.addEventListener('keydown',e=>{
  const tag=e.target.tagName; if(tag==='INPUT') return;
  if((e.key===' '||e.key==='Enter')&&tag==='BUTTON') return;
  if(e.key==='ArrowRight'){ e.preventDefault(); els.btnNext.click(); }
  else if(e.key==='ArrowLeft'){ e.preventDefault(); if(!els.btnBack.disabled) els.btnBack.click(); }
  else if(e.key==='Escape'){ closeCard(); endQuest(); }
  else if(e.key>='1'&&e.key<='6') goTo(+e.key-1);
});

/* ---------- tapping ---------- */
function hit(px,py){
  const A=CH[current].scene.items?CH[current].scene.items():[];
  let best=null,bd=1e9;
  A.forEach(it=>{ const d=Math.hypot(it.x-px,it.y-py); if(d<it.r&&d<bd){ bd=d; best=it; } });
  return best;
}
stage.addEventListener('pointerdown',e=>{
  const r=view.getBoundingClientRect(), px=(e.clientX-r.left)*(V.w/r.width), py=(e.clientY-r.top)*(V.h/r.height);
  const it=hit(px,py);
  const QS=quest.active&&quest.active.steps[quest.step];
  if(QS&&QS.tap){ questTap(it); if(it) showCard(it); return; }
  if(it) showCard(it); else closeCard();
});

/* ---------- canvas sizing + the loop ---------- */
function resize(){
  const r=stage.getBoundingClientRect(), dpr=Math.min(devicePixelRatio||1,2);
  V.w=Math.max(320,r.width); V.h=Math.max(240,r.height);
  view.width=Math.round(V.w*dpr); view.height=Math.round(V.h*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
addEventListener('resize',resize);
let last=0;
function frame(t){
  requestAnimationFrame(frame);
  const dt=Math.min(0.05,(t-last)/1000||0); last=t; now=t/1000;
  ctx.setTransform(Math.min(devicePixelRatio||1,2),0,0,Math.min(devicePixelRatio||1,2),0,0);
  ctx.clearRect(0,0,V.w,V.h);
  const S=CH[current].scene;
  S.draw(REDUCED?0.016:dt);
  if(S.items) S.items().forEach(it=>{ if(it.mark) tapMark(it.x,it.y,it.emo,Math.min(20,it.r*0.6)); });
  if(confetti.length) drawConfetti(dt);
  questCheck(); refreshStat();
}

/* =====================================================================
   BADGES THAT SURVIVE A CLOSED TAB
   A six-year-old gets called to dinner mid-challenge. Losing every badge to
   a reload is the quickest way to make the whole reward loop feel pointless.
   The ↺ in the badge meter clears them so a second child can start fresh —
   two taps, so it cannot happen by accident.
   ===================================================================== */
const SAVE_KEY='learningTools.flyway.badges';
function saveBadges(){ try{ localStorage.setItem(SAVE_KEY,JSON.stringify(Object.keys(badges))); }catch(e){} }
function restoreBadges(){
  let saved=[];
  try{ saved=JSON.parse(localStorage.getItem(SAVE_KEY)||'[]'); }catch(e){ saved=[]; }
  if(!Array.isArray(saved)) saved=[];
  saved.forEach(id=>{
    const c=CH.find(x=>x.id===id); if(!c) return;
    badges[id]=true;
    if(c.badgeEl) c.badgeEl.classList.add('won');
    if(c.chip) c.chip.classList.add('won');
  });
  if(Object.keys(badges).length===CH.length) els.meter.classList.add('all');
  updateWipe();
}
function clearBadges(){
  Object.keys(badges).forEach(k=>{ delete badges[k]; });
  CH.forEach(c=>{ if(c.badgeEl) c.badgeEl.classList.remove('won'); if(c.chip) c.chip.classList.remove('won'); });
  els.meter.classList.remove('all');
  try{ localStorage.removeItem(SAVE_KEY); }catch(e){}
  updateWipe(); updateButtons();
}
let wipeArmed=false, wipeTimer=null;
function updateWipe(){
  const b=$('btnWipe'); if(!b) return;
  const any=Object.keys(badges).length>0;
  b.hidden=!any;
  if(!any){ wipeArmed=false; b.textContent='↺'; b.classList.remove('armed'); }
}
$('btnWipe').addEventListener('click',()=>{
  const b=$('btnWipe');
  if(!wipeArmed){
    wipeArmed=true; b.textContent='Clear?'; b.classList.add('armed');
    clearTimeout(wipeTimer);
    wipeTimer=setTimeout(()=>{ wipeArmed=false; b.textContent='↺'; b.classList.remove('armed'); },3500);
    return;
  }
  clearTimeout(wipeTimer); wipeArmed=false; b.textContent='↺'; b.classList.remove('armed');
  clearBadges(); toast('↺ Badges cleared — a fresh start.',3000);
});
resize(); goTo(0); requestAnimationFrame(frame);
restoreBadges();
window.flyway={CH,SPECIES,ROUTES,badges,goTo,hit,startQuest,quest,award,saveBadges,restoreBadges,clearBadges,state:()=>({season,traveler,fuel,nav,night,current})};
</script>
