<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Forest Elevator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;800&display=swap">
<style>
/* ---------- tokens: the Learning Tools sketchbook, plus the forest's own colors ---------- */
:root{
  --ink:#2b2350;        /* indigo-plum, all text + outlines */
  --paper:#fff8e7;      /* butter cream ground */
  --paper-2:#ffefc2;    /* deeper butter for chrome */
  --rocket:#ff6b35;     /* the one loud thing: NEXT FLOOR */
  --rocket-dk:#c2431a;
  --sky:#4fb3f6;
  --grass:#63c64d;
  --gold:#ffd23f;
  --space:#12103a;
  --white:#fffdf7;
  --leaf:#3f9d3a;
  --leaf-dk:#2e7d32;
  --soil:#8b5a2b;
  --display:"Fredoka","Chalkboard SE","Comic Sans MS","Segoe UI Rounded",ui-rounded,system-ui,sans-serif;
  --body:"Nunito","Segoe UI Rounded",ui-rounded,"Segoe UI",system-ui,sans-serif;
  --emoji:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji","Twemoji Mozilla",sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:var(--body);
  font-size:16px;
  line-height:1.3;
  -webkit-text-size-adjust:100%;
  overflow:hidden;
}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:4px solid var(--sky);outline-offset:3px}

.app{
  height:100vh;height:100dvh;
  display:grid;
  grid-template-rows:auto 1fr auto;
  gap:10px;
  padding:10px 14px 12px;
  max-width:1180px;
  margin:0 auto;
}

/* ---------- header ---------- */
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.brand h1{
  font-family:var(--display);font-weight:700;font-size:38px;line-height:1;margin:0;
  letter-spacing:.5px;color:var(--ink);text-shadow:3px 3px 0 var(--gold);
}
.brand .tagline{margin:4px 0 0;font-weight:800;font-size:15px;opacity:.85}
.right{display:flex;align-items:center;gap:12px}
.meter{
  display:flex;align-items:center;gap:12px;
  background:var(--paper-2);border:3px solid var(--ink);border-radius:18px;
  padding:6px 14px;box-shadow:4px 4px 0 var(--ink);min-height:56px;
  transition:background .4s;
}
.meter.all{background:var(--gold)}
.meter-label{font-family:var(--display);font-weight:600;font-size:13px;letter-spacing:1.5px;text-transform:uppercase;line-height:1.1}
.badges{display:flex;gap:6px}
.badge{
  width:38px;height:38px;border-radius:50%;border:3px solid var(--ink);
  background:var(--white);display:grid;place-items:center;font-size:19px;font-family:var(--emoji);line-height:1;
  opacity:.28;filter:grayscale(1);transition:opacity .3s,filter .3s;
}
.badge.won{opacity:1;filter:none;background:var(--gold);animation:pop .5s cubic-bezier(.34,1.56,.64,1)}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
.map{
  display:flex;align-items:center;gap:8px;
  background:var(--white);border:3px solid var(--ink);border-radius:18px;padding:4px 10px 4px 6px;box-shadow:4px 4px 0 var(--ink);
}
.map canvas{width:44px;height:64px;display:block}
.map span{font-family:var(--display);font-weight:600;font-size:10px;letter-spacing:1px;text-transform:uppercase;line-height:1.2;text-align:center}

/* ---------- stage ---------- */
.stage-wrap{min-height:0;display:flex}
.stage{
  position:relative;flex:1;min-height:300px;
  border:5px solid var(--ink);border-radius:26px;overflow:hidden;
  background:#bfe4ff;box-shadow:6px 6px 0 var(--ink);touch-action:none;
}
#view{position:absolute;inset:0;width:100%;height:100%;display:block}

.caption{
  position:absolute;left:14px;top:12px;max-width:min(58%,460px);
  background:var(--white);border:3px solid var(--ink);border-radius:18px;
  padding:8px 14px 10px;box-shadow:4px 4px 0 var(--ink);pointer-events:none;
}
body.peeking .caption{display:none}
.caption.bump{animation:bump .5s cubic-bezier(.34,1.56,.64,1)}
@keyframes bump{0%{transform:scale(.85)}100%{transform:scale(1)}}
.cap-level{font-family:var(--display);font-weight:700;font-size:24px;line-height:1.1}
.cap-text{font-weight:800;font-size:15.5px;margin-top:3px;text-wrap:balance}
.cap-text b{color:var(--rocket-dk)}

.hint{
  position:absolute;left:50%;transform:translateX(-50%);bottom:12px;
  background:rgba(255,253,247,.92);border:3px solid var(--ink);border-radius:999px;
  padding:6px 14px;font-weight:800;font-size:14px;pointer-events:none;box-shadow:3px 3px 0 var(--ink);
}
.stat{
  position:absolute;right:14px;bottom:12px;display:flex;gap:8px;pointer-events:none;flex-wrap:wrap;justify-content:flex-end;max-width:calc(100% - 28px);
}
.stat span{
  background:rgba(255,253,247,.94);border:3px solid var(--ink);border-radius:999px;
  padding:5px 12px;font-family:var(--display);font-weight:600;font-size:15px;box-shadow:3px 3px 0 var(--ink);
  font-variant-numeric:tabular-nums;white-space:nowrap;
}
.stat[hidden]{display:none}

.card{
  position:absolute;right:14px;top:12px;width:min(350px,calc(100% - 28px));
  display:flex;gap:12px;align-items:flex-start;
  background:var(--white);border:3px solid var(--ink);border-radius:20px;
  padding:12px;box-shadow:4px 4px 0 var(--ink);
  animation:bump .4s cubic-bezier(.34,1.56,.64,1);
}
.card[hidden]{display:none}
.card-thumb{width:84px;height:84px;flex:0 0 84px;border-radius:14px;border:3px solid var(--ink);background:#e8f4ff}
.card-body{min-width:0;flex:1}
.card-name{font-family:var(--display);font-weight:700;font-size:22px;line-height:1.05}
.card-sub{font-family:var(--display);font-weight:600;font-size:15px;color:var(--rocket-dk);margin-top:2px}
.card-fact{font-weight:800;font-size:15.5px;margin-top:6px}
.card-extra{font-weight:700;font-size:12.5px;margin-top:6px;opacity:.75}
.card-x{
  position:absolute;right:-12px;top:-12px;width:34px;height:34px;border-radius:50%;
  border:3px solid var(--ink);background:var(--gold);font-family:var(--display);font-weight:700;font-size:20px;line-height:1;
  box-shadow:2px 2px 0 var(--ink);
}

.toast{
  position:absolute;left:50%;bottom:64px;transform:translateX(-50%);
  background:var(--gold);border:3px solid var(--ink);border-radius:999px;
  padding:8px 18px;font-family:var(--display);font-weight:700;font-size:19px;white-space:nowrap;
  box-shadow:4px 4px 0 var(--ink);pointer-events:none;max-width:calc(100% - 28px);overflow:hidden;text-overflow:ellipsis;
  animation:bump .5s cubic-bezier(.34,1.56,.64,1);
}
.toast[hidden]{display:none}

/* ---------- the challenge panel ---------- */
.quest{
  position:absolute;left:14px;bottom:12px;width:min(420px,calc(100% - 28px));
  background:var(--white);border:3px solid var(--ink);border-radius:20px;
  padding:12px 14px 12px;box-shadow:4px 4px 0 var(--ink);
  animation:bump .4s cubic-bezier(.34,1.56,.64,1);
}
.quest[hidden]{display:none}
.q-head{display:flex;align-items:center;gap:8px}
.q-title{font-family:var(--display);font-weight:700;font-size:17px;flex:1}
.dots{display:flex;gap:4px}
.dot{width:11px;height:11px;border-radius:50%;border:2px solid var(--ink);background:var(--white)}
.dot.done{background:var(--grass)}
.dot.now{background:var(--gold)}
.q-text{font-weight:800;font-size:16px;margin-top:6px;text-wrap:balance}
.q-opts{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px}
.q-opts[hidden]{display:none}
.opt{
  font-family:var(--display);font-weight:600;font-size:16px;border:3px solid var(--ink);border-radius:999px;
  background:var(--paper-2);padding:8px 14px;line-height:1.1;box-shadow:0 3px 0 var(--ink);text-align:left;
  transition:transform .08s,box-shadow .08s;
}
.opt:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.opt.yes{background:var(--grass);color:var(--white)}
.opt.no{animation:shake .4s}
.opt:disabled{cursor:default}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.q-fb{font-weight:800;font-size:14.5px;margin-top:8px;min-height:18px}
.q-fb.good{color:var(--leaf-dk)}
.q-fb.bad{color:var(--rocket-dk)}
.q-x{position:absolute;right:-12px;top:-12px;width:34px;height:34px;border-radius:50%;border:3px solid var(--ink);background:var(--gold);font-family:var(--display);font-weight:700;font-size:20px;line-height:1;box-shadow:2px 2px 0 var(--ink)}

/* ---------- dock ---------- */
.dock{display:grid;grid-template-columns:auto auto minmax(0,1fr);align-items:center;gap:14px}
/* The chapter rail: an emoji AND a word, the one clearly better idea in
   Build a House. A child should not have to guess that 🥕 means Roots, and on a
   touch screen there is no hover to reveal a title attribute. It scrolls
   sideways when the words do not fit, and the current chapter scrolls itself
   into view. */
.levels{display:flex;align-items:center;gap:6px;overflow-x:auto;overflow-y:hidden;
  scrollbar-width:none;max-width:100%;padding:3px 2px}
.levels::-webkit-scrollbar{display:none}
.lvl{
  display:flex;align-items:center;gap:6px;flex:0 0 auto;min-height:44px;
  padding:5px 13px 5px 9px;border-radius:999px;border:3px solid var(--ink);
  background:var(--white);font-family:var(--display);font-weight:600;font-size:13px;
  line-height:1;white-space:nowrap;box-shadow:3px 3px 0 var(--ink);
  transition:transform .15s,background .15s;position:relative;
}
.lvl .ic{font-size:20px;font-family:var(--emoji);line-height:1}
.lvl:hover{transform:translateY(-2px)}
.lvl.on{background:var(--gold)}
.lvl.done{background:var(--paper-2)}
.lvl.won::after{content:"✓";position:absolute;right:-7px;top:-7px;width:18px;height:18px;border-radius:50%;background:var(--grass);color:var(--white);border:2px solid var(--ink);font:700 11px/14px var(--display)}

.buttons{display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-width:0}
.btn{
  font-family:var(--display);font-weight:700;border:3px solid var(--ink);border-radius:999px;
  background:var(--white);padding:10px 16px;font-size:16px;line-height:1;
  box-shadow:0 5px 0 var(--ink);transition:transform .08s,box-shadow .08s,opacity .2s;white-space:nowrap;
}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn:disabled{opacity:.35;cursor:default;transform:none;box-shadow:0 5px 0 var(--ink)}
.btn.big{
  background:var(--rocket);color:var(--white);font-size:23px;padding:12px 22px;
  box-shadow:0 7px 0 var(--rocket-dk),0 7px 0 3px var(--ink);text-shadow:2px 2px 0 var(--rocket-dk);
}
.btn.big:active{transform:translateY(5px);box-shadow:0 2px 0 var(--rocket-dk),0 2px 0 3px var(--ink)}
.btn.big.home{background:var(--sky);text-shadow:2px 2px 0 #1f6fa8;box-shadow:0 7px 0 #1f6fa8,0 7px 0 3px var(--ink)}
.btn.big.home:active{box-shadow:0 2px 0 #1f6fa8,0 2px 0 3px var(--ink)}
.btn.quest-btn{background:var(--gold)}
.btn.quest-btn.won{background:var(--grass);color:var(--white)}

/* chapter controls: one or two groups shown at a time */
.ctl{display:flex;justify-content:flex-end;min-width:0;gap:10px;flex-wrap:wrap}
.ctl-group{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.ctl-group[hidden]{display:none}
.ctl-label{font-family:var(--display);font-weight:600;font-size:12px;letter-spacing:1px;text-transform:uppercase;opacity:.8}
.tog{
  font-family:var(--display);font-weight:600;font-size:15px;border:3px solid var(--ink);border-radius:999px;
  background:var(--white);padding:8px 13px;line-height:1;box-shadow:0 4px 0 var(--ink);
  transition:transform .08s,box-shadow .08s,background .15s;white-space:nowrap;
}
.tog:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.tog.on{background:var(--gold)}
.tog.grow{background:var(--grass);color:var(--white);text-shadow:1px 1px 0 var(--leaf-dk)}
.tog.storm{background:var(--space);color:var(--white);text-shadow:1px 1px 0 #000}
.tog.acorn{background:var(--rocket);color:var(--white);text-shadow:1px 1px 0 var(--rocket-dk)}
.tog:disabled{opacity:.4;cursor:default;transform:none}

/* ---------- small screens ---------- */
@media (max-width:820px){
  .app{padding:8px;gap:8px}
  .top{flex-wrap:nowrap;gap:8px}
  .brand h1{font-size:22px;text-shadow:2px 2px 0 var(--gold)}
  .brand .tagline{display:none}
  .map{display:none}
  .meter{padding:3px 8px;min-height:40px;gap:6px;border-width:2.5px;box-shadow:3px 3px 0 var(--ink)}
  .meter-label{display:none}
  .badge{width:27px;height:27px;font-size:13px;border-width:2px}
  .badges{gap:4px}
  /* one row per job, and every target at least 44px for a small finger */
  .dock{grid-template-columns:1fr;grid-template-areas:"buttons" "levels" "ctl";gap:8px}
  .levels{grid-area:levels;gap:6px;justify-content:flex-start;flex-wrap:nowrap}
  .lvl{font-size:12px;padding:5px 11px 5px 8px;box-shadow:2px 2px 0 var(--ink)}
  .lvl .ic{font-size:18px}
  .buttons{grid-area:buttons;justify-content:center;gap:8px}
  #btnBack .bl{display:none}     /* Back keeps its arrow and drops the word */
  #btnBack{min-width:44px}
  .ctl{grid-area:ctl;justify-content:center;align-items:center;gap:8px}
  .ctl-group{justify-content:center;gap:6px}
  .btn.big{font-size:17px;padding:10px 14px}
  .btn{padding:8px 12px;font-size:14px;min-height:44px}
  .tog{font-size:13.5px;padding:7px 12px;min-height:44px}
  .ctl-label{font-size:11px}
  .caption{max-width:calc(100% - 28px);padding:6px 10px 8px}
  .cap-level{font-size:17px}.cap-text{font-size:12.5px}
  /* the tap prompt is the only thing that says the picture can be tapped,
     and half the challenges ask for a tap — so it stays on every screen */
  .hint{left:14px;right:14px;transform:none;bottom:10px;text-align:center;
        font-size:12.5px;padding:5px 10px;border-width:2.5px}
  .stat{bottom:52px}
  .card{width:calc(100% - 28px)}
  .card-thumb{width:56px;height:56px;flex-basis:56px}
  .card-name{font-size:17px}.card-sub{font-size:13px}.card-fact{font-size:13px}
  .quest{width:calc(100% - 28px);left:14px;right:14px;top:12px;bottom:auto;padding:10px 12px}
  .q-title{font-size:15px}.q-text{font-size:14px}.opt{font-size:14px;padding:8px 14px;min-height:44px}
  body.questing .caption,body.carding .caption{display:none}
  body.peeking .caption{display:none}
  .stat span{font-size:12px;padding:4px 9px}
}
/* a phone on its side is wide but short. It is too wide for the small-screen
   rules above, so the compact dock has to be spelled out again here — a partial
   override lands half a layout on top of the desktop one, and things overflow. */
@media (max-width:900px) and (max-height:520px){
  .dock{grid-template-columns:auto minmax(0,1fr);grid-template-areas:"levels buttons" "ctl ctl";gap:8px}
  .levels{grid-area:levels;justify-content:flex-start;gap:5px;flex-wrap:nowrap}
  .lvl{min-height:38px;font-size:11.5px;padding:4px 10px 4px 7px}
  .lvl .ic{font-size:16px}
  .buttons{grid-area:buttons;justify-content:flex-end;gap:8px;flex-wrap:wrap}
  .ctl{grid-area:ctl;justify-content:center}
  #btnBack .bl{display:none}
  #btnBack{min-width:38px}
  .btn,.tog{min-height:38px}
  .btn{padding:8px 11px;font-size:14px}
  .btn.big{font-size:17px;padding:10px 14px}
  .tog{font-size:13.5px;padding:7px 10px}
  .caption{max-width:calc(100% - 28px);padding:6px 10px 8px}
  .cap-level{font-size:17px}.cap-text{font-size:12.5px}
  .hint{left:14px;right:14px;transform:none;bottom:10px;text-align:center;
        font-size:12.5px;padding:5px 10px;border-width:2.5px}
  .stat{bottom:46px}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none !important;transition:none !important}
}
/* ---------- badges that survive a closed tab, and the way to clear them ---------- */
.wipe{
  width:34px;height:34px;flex:0 0 auto;border-radius:50%;border:3px solid var(--ink);
  background:var(--white);font-family:var(--display);font-weight:700;font-size:15px;
  line-height:1;padding:0;box-shadow:2px 2px 0 var(--ink);white-space:nowrap;
}
/* deliberately the one small target in the collection: it throws away a child's
   badges, so it should be hard to hit by accident and takes two taps anyway */
.wipe.armed{width:auto;padding:0 11px;height:34px;background:var(--rocket);color:var(--white);font-size:12.5px}
.wipe[hidden]{display:none}
/* ---------- read aloud ---------- */
.caption{display:flex;gap:10px;align-items:flex-start}
.cap-body{min-width:0}
.card-media{display:flex;flex-direction:column;gap:8px;align-items:center;flex:0 0 auto}
.q-row{display:flex;gap:9px;align-items:flex-start}
.q-row .q-text{flex:1;margin-top:0}
.spk{
  flex:0 0 auto;width:44px;height:44px;border-radius:50%;border:3px solid var(--ink);
  background:var(--sky);font-size:19px;font-family:'"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji","Twemoji Mozilla",sans-serif';line-height:1;padding:0;
  box-shadow:0 3px 0 #1f6fa8,0 3px 0 2px var(--ink);pointer-events:auto;
  transition:transform .08s,box-shadow .08s;
}
.spk:active{transform:translateY(2px);box-shadow:0 1px 0 #1f6fa8,0 1px 0 2px var(--ink)}
.spk.talking{background:var(--gold);box-shadow:0 3px 0 #c9a01d,0 3px 0 2px var(--ink);animation:wobble .6s infinite}
@keyframes wobble{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
body.nospeech .spk{display:none}
.btn.read{background:var(--sky);color:var(--white);text-shadow:2px 2px 0 #1f6fa8;box-shadow:0 5px 0 #1f6fa8,0 5px 0 3px var(--ink)}
.btn.read:active{box-shadow:0 1px 0 #1f6fa8,0 1px 0 3px var(--ink)}
.btn.read .rd-icon{font-family:'"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji","Twemoji Mozilla",sans-serif'}
.btn.read .rd-word{margin-left:6px}
.btn.read.off{background:var(--white);color:var(--ink);text-shadow:none;box-shadow:0 5px 0 var(--ink);opacity:.75}
body.nospeech .btn.read{display:none}
@media (max-width:860px){
  .btn.read{padding:7px 10px;font-size:15px;min-width:44px;box-shadow:0 3px 0 #1f6fa8,0 3px 0 2px var(--ink)}
  .btn.read .rd-word{display:none}
}
/* ---------- a keyboard path to everything the picture lets you tap ----------
   About half of every challenge is "tap the …", and a canvas is invisible to
   the keyboard, so those badges simply could not be earned without a pointer.
   These buttons carry the same names as the things in the picture. They are
   off-screen until focused, then appear as a chip over the drawing, so Tab
   walks the scene and Enter opens the card or answers the challenge. */
.taplist{position:absolute;left:14px;bottom:58px;z-index:4;pointer-events:none}
.taplist button{
  position:absolute;width:1px;height:1px;padding:0;margin:0;border:0;
  overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;
}
.taplist button:focus-visible{
  position:static;width:auto;height:auto;clip:auto;overflow:visible;pointer-events:auto;
  padding:8px 14px;min-height:44px;border:3px solid var(--ink);border-radius:999px;
  background:var(--gold);color:var(--ink);font-family:var(--display);font-weight:600;
  font-size:14px;line-height:1;box-shadow:3px 3px 0 var(--ink);outline:3px solid var(--sky);outline-offset:3px;
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <h1>Forest Elevator</h1>
      <p class="tagline">Ride from the treetops down to the roots — and meet who lives on every floor.</p>
    </div>
    <div class="right">
      <button class="btn read" id="btnRead" type="button" aria-pressed="true"><span class="rd-icon">🔊</span><span class="rd-word">Reading</span></button>
      <div class="meter" id="meter" aria-live="polite">
        <div class="meter-label">Floor<br>badges</div>
        <div class="badges" id="badges" aria-label="one badge for each floor of the forest"></div>
        <button class="wipe" id="btnWipe" type="button" hidden aria-label="Clear all badges and start fresh">↺</button>
      </div>
      <div class="map" aria-hidden="true">
        <canvas id="minimap" width="88" height="128"></canvas>
        <span>You are<br>here</span>
      </div>
    </div>
  </header>

  <main class="stage-wrap">
    <div class="stage" id="stage">
      <canvas id="view"></canvas>
      <div class="caption" id="caption">
        <button class="spk" id="spkCap" type="button" aria-label="Read this out loud">🔊</button>
        <div class="cap-body">
          <div class="cap-level" id="capLevel"></div>
          <div class="cap-text" id="capText"></div>

</div>
<script>
'use strict';
/* =====================================================================
   FOREST ELEVATOR  —  the floors of a forest, for grades 1–3
   One Missouri oak-hickory forest, drawn as a single tall world in
   meters (ground at y = 0, treetops near y = 30, roots to y = -6).
   An elevator car rides the camera from floor to floor. Every floor has
   tap-to-meet residents and a small challenge that earns a badge. The
   last stop steps out into a clearing to grow a forest from acorns.
   ===================================================================== */
const TAU=Math.PI*2;
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const smooth=t=>t*t*(3-2*t);
const easeInOut=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const easeOut=t=>1-Math.pow(1-t,3);
const REDUCED=matchMedia('(prefers-reduced-motion: reduce)').matches;
function seeded(n){ let s=n*9301+49297; return ()=>{ s=(s*9301+49297)%233280; return s/233280; }; }
const rnd=Math.random;
const EMOJI_FONT='"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji","Twemoji Mozilla",sans-serif';
const LABEL_FONT='"Nunito","Segoe UI Rounded",ui-rounded,"Segoe UI",system-ui,sans-serif';
const DISPLAY_FONT='"Fredoka","Chalkboard SE","Comic Sans MS","Segoe UI Rounded",ui-rounded,system-ui,sans-serif';
const INK='#2b2350', PAPER='#fff8e7', GOLD='#ffd23f', ROCKET='#ff6b35', SKY='#4fb3f6', GRASS='#63c64d', WHITE='#fffdf7';
const LEAF='#3f9d3a', LEAF_DK='#2e7d32', LEAF_LT='#7ccf5a', BARK='#8d6b52', BARK_DK='#4e2f18', SOIL='#8b5a2b', SOIL_DK='#5a3a1c';

/* ---------- canvas + timing ---------- */
const stage=$('stage'), view=$('view');
let ctx=view.getContext('2d');
const V={w:900,h:520,dpr:1};
let now=0;                    // seconds since load

/* ---------- drawing helpers (all write to whatever `ctx` is) ---------- */
function circle(x,y,r,fill){ ctx.fillStyle=fill; ctx.beginPath(); ctx.arc(x,y,r,0,TAU); ctx.fill(); }
function ring(x,y,r,stroke,w){ ctx.strokeStyle=stroke; ctx.lineWidth=w; ctx.beginPath(); ctx.arc(x,y,r,0,TAU); ctx.stroke(); }
function disc(x,y,r,fill,ol){ circle(x,y,r,fill); if(ol) ring(x,y,r,INK,ol); }
function ellipse(x,y,rx,ry,rot,fill,ol){ ctx.beginPath(); ctx.ellipse(x,y,Math.max(0.1,rx),Math.max(0.1,ry),rot||0,0,TAU); ctx.fillStyle=fill; ctx.fill(); if(ol){ ctx.strokeStyle=INK; ctx.lineWidth=ol; ctx.stroke(); } }
function poly(P,fill,ol){ ctx.beginPath(); P.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1])); ctx.closePath(); if(fill){ ctx.fillStyle=fill; ctx.fill(); } if(ol){ ctx.strokeStyle=INK; ctx.lineWidth=ol; ctx.lineJoin='round'; ctx.stroke(); } }
function rrect(x,y,w,h,r){ r=Math.min(r,w/2,h/2); ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function box(x,y,w,h,r,fill,ol){ rrect(x,y,w,h,r); ctx.fillStyle=fill; ctx.fill(); if(ol){ ctx.strokeStyle=INK; ctx.lineWidth=ol; ctx.stroke(); } }
function line(x1,y1,x2,y2,stroke,w,cap){ ctx.strokeStyle=stroke; ctx.lineWidth=w; ctx.lineCap=cap||'round'; ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke(); }
function path(P,stroke,w,cap){ ctx.strokeStyle=stroke; ctx.lineWidth=w; ctx.lineCap=cap||'round'; ctx.lineJoin='round'; ctx.beginPath(); P.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1])); ctx.stroke(); }
function emoji(ch,x,y,px,flip){ ctx.save(); ctx.translate(x,y); if(flip) ctx.scale(-1,1); ctx.font=px+'px '+EMOJI_FONT; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillStyle='#000'; ctx.fillText(ch,0,px*0.06); ctx.restore(); }
// a name tag with a soft halo so it reads on any background
function label(txt,x,y,opts){
  opts=opts||{};
  const size=opts.size||13, dark=opts.dark, align=opts.align||'center', weight=opts.weight||800, font=opts.display?DISPLAY_FONT:LABEL_FONT;
  ctx.save(); ctx.textAlign=align; ctx.textBaseline=opts.baseline||'middle'; ctx.lineJoin='round';
  ctx.font=weight+' '+size+'px '+font;
  ctx.strokeStyle=dark?'rgba(255,248,231,0.85)':'rgba(43,35,80,0.85)'; ctx.lineWidth=Math.max(3,size*0.32);
  ctx.strokeText(txt,x,y);
  ctx.fillStyle=opts.color||(dark?INK:PAPER); ctx.fillText(txt,x,y);
  ctx.restore();
}
// a little sign: rounded box with text, optional pointer line to (px,py)
function sign(txt,x,y,opts){
  opts=opts||{};
  const size=opts.size||13; ctx.save(); ctx.font='800 '+size+'px '+LABEL_FONT;
  const w=ctx.measureText(txt).width+18, h=size+14;
  let bx=opts.align==='left'?x:opts.align==='right'?x-w:x-w/2, by=y-h/2;
  bx=clamp(bx,4,V.w-w-4); by=clamp(by,4,V.h-h-4);
  if(opts.to){ line(bx+w/2,by+h/2,opts.to[0],opts.to[1],INK,2.5); }
  box(bx,by,w,h,10,opts.fill||WHITE,2.5);
  ctx.fillStyle=opts.color||INK; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(txt,bx+w/2,by+h/2+1);
  ctx.restore();
  return {x:bx,y:by,w,h};
}
function cloudPath(x,y,r,n,seed){          // a leafy blob: a circle with a scalloped edge
  const rr=seeded(seed||1); ctx.beginPath();
  for(let i=0;i<n;i++){
    const a0=i/n*TAU, a1=(i+1)/n*TAU, am=(a0+a1)/2, bump=r*(0.12+rr()*0.1);
    const x0=x+Math.cos(a0)*r, y0=y+Math.sin(a0)*r, x1=x+Math.cos(a1)*r, y1=y+Math.sin(a1)*r;
    const cx=x+Math.cos(am)*(r+bump*2.2), cy=y+Math.sin(am)*(r+bump*2.2);
    if(i===0) ctx.moveTo(x0,y0);
    ctx.quadraticCurveTo(cx,cy,x1,y1);
  }
  ctx.closePath();
}
function blob(x,y,r,fill,ol,seed,n){ if(r<1) return; cloudPath(x,y,r,n||clamp(Math.round(r/9),7,16),seed); ctx.fillStyle=fill; ctx.fill(); if(ol){ ctx.strokeStyle=INK; ctx.lineWidth=ol; ctx.stroke(); } }
function hexRgb(h){ return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]; }
function rgba(h,a){ const c=hexRgb(h); return `rgba(${c[0]},${c[1]},${c[2]},${a})`; }
function mix(a,b,t){ const A=hexRgb(a),B=hexRgb(b); return `rgb(${Math.round(lerp(A[0],B[0],t))},${Math.round(lerp(A[1],B[1],t))},${Math.round(lerp(A[2],B[2],t))})`; }
function darker(h,k){ const c=hexRgb(h).map(v=>Math.round(v*(1-k))); return `rgb(${c[0]},${c[1]},${c[2]})`; }
function lighter(h,k){ const c=hexRgb(h).map(v=>Math.round(v+(255-v)*k)); return `rgb(${c[0]},${c[1]},${c[2]})`; }
function dist(ax,ay,bx,by){ return Math.hypot(ax-bx,ay-by); }
function bezPts(p0,p1,p2,n){ const out=[]; for(let i=0;i<=n;i++){ const t=i/n, u=1-t; out.push([u*u*p0[0]+2*u*t*p1[0]+t*t*p2[0], u*u*p0[1]+2*u*t*p1[1]+t*t*p2[1]]); } return out; }

/* =====================================================================
   THE CAMERA — the world is measured in meters. cam.hm is how many
   meters tall the stage is right now; K is pixels per meter.
   ===================================================================== */
const cam={cx:20,cy:23,hm:15};
let K=30;
function sx(x){ return V.w/2+(x-cam.cx)*K; }
function sy(y){ return V.h/2-(y-cam.cy)*K; }
function toWorld(px,py){ return [cam.cx+(px-V.w/2)/K, cam.cy-(py-V.h/2)/K]; }
function onScreen(x0,y0,x1,y1){ return sx(x1)>-40&&sx(x0)<V.w+40&&sy(y0)>-40&&sy(y1)<V.h+40; }   // world box (y0 low, y1 high)
const M=m=>m*K;                                     // meters → pixels
const LW=(m,min)=>Math.max(min||1.5,m*K);          // a line width in meters, never thinner than `min` px
function viewBox(){ const a=V.w/V.h; return {x0:cam.cx-cam.hm*a/2,x1:cam.cx+cam.hm*a/2,y0:cam.cy-cam.hm/2,y1:cam.cy+cam.hm/2}; }

/* ---------- seasons + how much sun reaches each floor ---------- */
let season='summer';
const LIGHT={ summer:{canopy:100,under:20,shrub:8,floor:3}, spring:{canopy:100,under:75,shrub:60,floor:50}, fall:{canopy:100,under:45,shrub:30,floor:22} };
const light=id=>LIGHT[season][id==='roots'?'floor':id];

/* =====================================================================
   THE FOREST — trees, understory, shrubs, floor and soil, all in meters.
   The big white oak at x = 19.5 is the one the elevator rides beside.
   ===================================================================== */
const TREES=[
  {x:4.5,h:25,r:5,kind:'oak',seed:1},
  {x:11,h:22,r:4.5,kind:'hickory',seed:2},
  {x:19.5,h:30,r:6.5,kind:'oak',seed:3,big:true,limbs:[[21.4,12.6,3.2,0.35]]},
  {x:28.5,h:24,r:5,kind:'oak',seed:4,limbs:[[26.5,8.2,-2.4,0.3]]},
  {x:36,h:27,r:5.5,kind:'hickory',seed:5},
];
const BACK=[{x:-1,h:23,r:5},{x:8,h:26,r:5.5},{x:15,h:24,r:5},{x:24,h:26,r:5.5},{x:32,h:23,r:5},{x:41,h:25,r:5.5}];
const UNDER=[ {id:'dogwood',x:13.8,h:6.5,r:2.3}, {id:'redbud',x:25.2,h:7,r:2.5}, {id:'pawpaw',x:29.6,h:6,r:2.1}, {id:'sapling',x:16.0,h:3.2,r:0.9}, {id:'sapling',x:23.0,h:4.4,r:1.2} ];
const CROWN_OFF=[[0,0,1],[-0.6,-0.3,0.75],[0.6,-0.35,0.75],[-0.3,0.45,0.6],[0.35,0.5,0.6],[-0.9,-0.6,0.5],[0.9,-0.55,0.5]];
function crownColor(kind){
  if(season==='summer') return kind==='hickory'?'#4aa843':LEAF;
  if(season==='fall') return kind==='hickory'?'#e0a020':'#c2542a';
  return kind==='hickory'?'#a4d66a':'#8fcf5c';
}
function crownY(t){ return t.h-t.r*0.65; }
// the crown as a cluster of scalloped blobs; in spring the new leaves are small, so the sky shows through
function drawCrownAt(x,y,r,kind,seed,alpha){
  const col=crownColor(kind), sp=season==='spring', sc=sp?0.78:1, ol=LW(0.09,1.5);
  ctx.save(); ctx.globalAlpha=(alpha==null?1:alpha)*(sp?0.7:1);
  CROWN_OFF.forEach((c,i)=>{ const bx=sx(x+c[0]*r), by=sy(y+c[1]*r), br=M(c[2]*r*sc); blob(bx,by,br,darker(col,0.14),ol,seed*7+i); });
  CROWN_OFF.forEach((c,i)=>{ const bx=sx(x+c[0]*r), by=sy(y+c[1]*r), br=M(c[2]*r*sc*0.86); blob(bx,by,br,col,0,seed*7+i); });
  CROWN_OFF.forEach((c,i)=>{ const bx=sx(x+c[0]*r-c[2]*r*0.22), by=sy(y+c[1]*r+c[2]*r*0.25), br=M(c[2]*r*sc*0.4); blob(bx,by,br,lighter(col,0.22),0,seed*7+i+3); });
  ctx.restore();
}
function drawTrunk(x,w,y0,y1,color,seed){
  const flare=w*0.35;
  ctx.beginPath();
  ctx.moveTo(sx(x-w/2-flare),sy(y0)); ctx.quadraticCurveTo(sx(x-w/2),sy(y0+w*1.2),sx(x-w*0.46),sy(y0+(y1-y0)*0.3));
  ctx.lineTo(sx(x-w*0.36),sy(y1)); ctx.lineTo(sx(x+w*0.36),sy(y1)); ctx.lineTo(sx(x+w*0.46),sy(y0+(y1-y0)*0.3));
  ctx.quadraticCurveTo(sx(x+w/2),sy(y0+w*1.2),sx(x+w/2+flare),sy(y0)); ctx.closePath();
  ctx.fillStyle=color; ctx.fill();
  if(M(w)>14){ ctx.save(); ctx.clip(); const rr=seeded(seed||1); ctx.strokeStyle='rgba(60,35,20,0.35)'; ctx.lineWidth=LW(0.04,1.2); ctx.lineCap='round';
    const n=clamp(Math.round((y1-y0)*3),8,60); for(let i=0;i<n;i++){ const bx=x-w*0.45+rr()*w*0.9, by=y0+rr()*(y1-y0), l=(y1-y0)*(0.04+rr()*0.08); ctx.beginPath(); ctx.moveTo(sx(bx),sy(by)); ctx.lineTo(sx(bx+(rr()-.5)*0.1),sy(by+l)); ctx.stroke(); }
    ctx.fillStyle='rgba(255,255,255,0.12)'; ctx.fillRect(sx(x-w*0.42),sy(y1),M(w*0.16),M(y1-y0)); ctx.restore(); }
  ctx.strokeStyle=INK; ctx.lineWidth=LW(0.06,1.5); ctx.lineJoin='round'; ctx.stroke();
}
function drawBranch(P,w){ const S=P.map(p=>[sx(p[0]),sy(p[1])]); path(S,INK,LW(w,1)+3); path(S,BARK,LW(w,1)); }
function drawTree(t,opts){
  opts=opts||{};
  const w=t.w||0.048*t.h, cy=crownY(t), top=cy-t.r*0.2;
  if(!onScreen(t.x-t.r*1.3,-0.5,t.x+t.r*1.3,t.h+1)) return;
  drawTrunk(t.x,w,-0.3,top+t.r*0.2,opts.color||BARK,t.seed);
  // a few limbs into the crown, plus any low limbs the residents perch on
  const rr=seeded(t.seed||1);
  for(let i=0;i<4;i++){ const side=i%2?1:-1, y0=top-t.r*0.9+rr()*t.r*0.5, P=bezPts([t.x,y0],[t.x+side*t.r*0.5,y0+t.r*0.5],[t.x+side*t.r*(0.7+rr()*0.3),y0+t.r*(0.6+rr()*0.5)],8); drawBranch(P,w*0.28); }
  (t.limbs||[]).forEach(L=>{ const [x1,y1,dx,w1]=L; const P=bezPts([t.x,y1-0.6],[t.x+dx*0.4,y1+0.1],[x1+dx*0.35,y1+0.15],8); drawBranch(P,w1); });
  drawCrownAt(t.x,cy,t.r,t.kind,t.seed||1,opts.alpha);
  if(t.kind==='oak'&&season!=='spring'&&K>18&&!opts.noAcorns){ const r2=seeded(t.seed*3+1); for(let i=0;i<8;i++){ const ax=t.x+(r2()-.5)*t.r*1.4, ay=cy+(r2()-.5)*t.r*1.2; disc(sx(ax),sy(ay),M(0.09),'#c9975a',1.2); circle(sx(ax),sy(ay)-M(0.06),M(0.09),'#6e4426'); } }
}
function drawBackTrees(){ ctx.save(); ctx.globalAlpha=0.45; BACK.forEach((t,i)=>{ if(!onScreen(t.x-t.r*1.3,-0.5,t.x+t.r*1.3,t.h+1)) return; drawTrunk(t.x,0.04*t.h,-0.3,crownY(t)+t.r*0.1,'#a89a8a',i+20); drawCrownAt(t.x,crownY(t),t.r,'oak',i+40,0.9); }); ctx.restore(); }

/* ---------- understory trees, shrubs, ferns, the vine ---------- */
function drawSmallTree(u){
  if(!onScreen(u.x-u.r*1.4,-0.3,u.x+u.r*1.4,u.h+0.5)) return;
  const cy=u.h-u.r*0.7, w=Math.max(0.12,u.h*0.035);
  drawTrunk(u.x,w,-0.2,cy,'#7d6a5a',u.x*3|0);
  const rr=seeded(u.x*5|0);
  for(let i=0;i<3;i++){ const side=i%2?1:-1; drawBranch(bezPts([u.x,cy-u.r*0.4],[u.x+side*u.r*0.4,cy],[u.x+side*u.r*0.8,cy+u.r*0.4],6),w*0.35); }
  if(u.id==='dogwood'){
    const col=season==='summer'?'#4d9e48':season==='fall'?'#8e3a4a':'#bfe0a0';
    ctx.save(); ctx.globalAlpha=season==='spring'?0.55:0.95; blob(sx(u.x),sy(cy),M(u.r),col,LW(0.06),11,11); blob(sx(u.x-u.r*0.5),sy(cy+u.r*0.3),M(u.r*0.6),col,LW(0.06),12,9); blob(sx(u.x+u.r*0.5),sy(cy+u.r*0.25),M(u.r*0.6),col,LW(0.06),13,9); ctx.restore();
    if(season==='spring'){ for(let i=0;i<26;i++){ const fx=u.x+(rr()-.5)*u.r*2.2, fy=cy+(rr()-.5)*u.r*1.6; const px=sx(fx),py=sy(fy),fr=M(0.16); for(let k=0;k<4;k++){ const a=k*TAU/4; ellipse(px+Math.cos(a)*fr*0.9,py+Math.sin(a)*fr*0.9,fr*0.85,fr*0.5,a,'#fffaf0',Math.min(1.5,fr*0.12)); } circle(px,py,fr*0.3,'#d8e26a'); } }
    if(season==='fall'){ for(let i=0;i<18;i++){ const fx=u.x+(rr()-.5)*u.r*2, fy=cy+(rr()-.5)*u.r*1.4; disc(sx(fx),sy(fy),M(0.08),'#e6322b',1); } }
  }else if(u.id==='redbud'){
    if(season==='spring'){ for(let i=0;i<70;i++){ const fx=u.x+(rr()-.5)*u.r*2.2, fy=cy+(rr()-.5)*u.r*1.8; disc(sx(fx),sy(fy),M(0.13),'#e0489a',Math.min(1.2,M(0.02))); } }

const leaves=[];
function updateLeaves(dt){
  if(season==='fall'&&!REDUCED&&leaves.length<45&&rnd()<dt*8){ const vb=viewBox(); const t=TREES[Math.floor(rnd()*TREES.length)]; const x=t.x+(rnd()-.5)*t.r*2, y=crownY(t)+(rnd()-.5)*t.r; if(x>vb.x0-2&&x<vb.x1+2) leaves.push({x,y:Math.min(y,vb.y1+1),vx:(rnd()-.5)*0.6,vy:-(0.9+rnd()*0.6),r:rnd()*TAU,vr:(rnd()-.5)*4,c:['#c9703a','#d9a441','#b04a2c','#e0b95a'][Math.floor(rnd()*4)]}); }

}

/* =====================================================================
   READ ALOUD — lifted from Flower Explorer, which is where this was first
   built. This tool is aimed at grades 1-3, where plenty of children are
   still emerging readers, so every caption, card and challenge can be read
   to them. Uses the browser's built-in speech; if there is none, every 🔊
   button hides itself and the tool works exactly as before.
   ===================================================================== */
const Speech=(()=>{
  const has=('speechSynthesis' in window)&&('SpeechSynthesisUtterance' in window);
  if(!has) document.body.classList.add('nospeech');
  let on=true, voice=null, btn=null, current=null, pending=null, unlocked=false;
  function pickVoice(){
    if(!has) return;
    const vs=speechSynthesis.getVoices(); if(!vs.length) return;
    const want=[/samantha/i,/karen/i,/moira/i,/google us english/i,/zira/i,/female/i];
    for(const w of want){ const v=vs.find(v=>/^en/i.test(v.lang)&&w.test(v.name)); if(v){ voice=v; return; } }
    voice=vs.find(v=>/^en-US/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang))||vs[0];
  }
  if(has){ pickVoice(); speechSynthesis.onvoiceschanged=pickVoice; }
  /* strip markup and pronunciation hints — "canopy (KAN-uh-pee)" reads badly */
  function plain(html){
    return String(html).replace(/<[^>]*>/g,'').replace(/\s*\((?=[A-Z]{2,})[^)]*\)/g,'')
      /* emoji are decoration here, but a screen voice reads them out: "tree
         evergreen, top floor, the canopy". Drop them before speaking. */
      .replace(/[\u{1F000}-\u{1FAFF}\u{1F1E6}-\u{1F1FF}\u{2190}-\u{27BF}\u{2B00}-\u{2BFF}\u{FE0F}\u{20E3}]/gu,'')
      .replace(/&amp;/g,'and').replace(/&nbsp;/g,' ').replace(/[·•]/g,',').replace(/\s+/g,' ').trim();
  }
  function stop(){ if(!has) return; current=null; speechSynthesis.cancel(); if(btn){ btn.classList.remove('talking'); btn=null; } }
  function say(text,fromBtn){
    if(!has) return;
    const t=plain(text); if(!t) return;
    stop();
    const u=new SpeechSynthesisUtterance(t);
    try{ if(voice) u.voice=voice; }catch(e){}   /* a bad voice must never take the page down with it */
    u.rate=0.88; u.pitch=1.1; u.volume=1;
    btn=fromBtn||null; if(btn) btn.classList.add('talking');
    u.onend=u.onerror=()=>{ if(btn){ btn.classList.remove('talking'); btn=null; } current=null; };
    current=u;
    setTimeout(()=>{ if(current===u) speechSynthesis.speak(u); },REDUCED?0:60);   /* Chrome wants a tick after cancel() */
  }
  /* iOS will not speak until the child has touched something, so the opening
     line used to be dropped silently. Try it straight away, and if nothing is
     actually speaking by the first tap, say it then instead. */
  function unlock(){
    if(unlocked) return; unlocked=true;
    const t=pending; pending=null;
    if(t&&on&&has&&!speechSynthesis.speaking) say(t);
  }
  if(has){ addEventListener('pointerdown',unlock,{once:true}); addEventListener('keydown',unlock,{once:true}); }
  function auto(text){ if(!on) return; say(text); if(!unlocked) pending=text; }
  return { has, say, auto, stop, plain, get on(){ return on; }, set on(v){ on=v; if(!v) stop(); } };
})();

function drawConfetti(dt){

/* =====================================================================
   GROW A FOREST — a clearing with slots for trees. Acorns fall, animals
   eat most, a few sprout. Seedlings in the shade wait; a storm makes a
   gap; the lucky ones race up to the canopy.
   ===================================================================== */
const GROW=(()=>{
  const SLOTS=[]; for(let i=0;i<9;i++) SLOTS.push(6.6+3.4*i);
  const S={year:0,plants:[],acorns:[],eaters:[],phase:null,stats:{dropped:0,eaten:0,sprouted:0},storm:null,flash:0};
  const STAGE={seedling:{h:0.5,r:0.3},sapling:{h:3,r:1.1},young:{h:10,r:2.4},canopy:{h:16.5,r:3.8}};
  function mk(slot,stage,age,kind,born,extra){ const st=STAGE[stage]; return Object.assign({slot,x:SLOTS[slot],stage,age:age||0,h:st.h,hT:st.h,r:st.r,kind:kind||(rnd()<0.75?'oak':'hickory'),born:born==null?S.year:born,seed:Math.floor(rnd()*900)+1,dead:0},extra||{}); }
  function reset(){
    S.year=0; S.plants=[]; S.acorns=[]; S.eaters=[]; S.phase=null; S.storm=null; S.stats={dropped:0,eaten:0,sprouted:0};
    S.plants.push(mk(1,'canopy',140,'oak',-140,{h:17.5,hT:17.5,r:4.1}), mk(4,'canopy',260,'oak',-260,{h:20,hT:20,r:4.8}), mk(7,'canopy',110,'hickory',-110,{h:16.5,hT:16.5,r:3.8}));
    S.plants.push(mk(3,'seedling',0,'oak',0), mk(5,'seedling',0,'oak',0), mk(6,'sapling',1,'oak',-2,{h:2.6,hT:2.6}));
    refreshStat();
  }
  function lightAt(slot){ const x=SLOTS[slot]; let L=1; S.plants.forEach(p=>{ if(p.stage==='canopy'&&Math.abs(p.x-x)<=p.r+0.4) L*=0.12; else if(p.stage==='young'&&Math.abs(p.x-x)<=2.4) L*=0.5; }); return L; }
  const at=slot=>S.plants.find(p=>p.slot===slot&&p.stage!=='log'&&p.stage!=='dead');
  function dropAcorns(){
    if(S.phase) return; const trees=S.plants.filter(p=>p.stage==='canopy'&&p.kind==='oak'); if(!trees.length){ toast('No oaks left to drop acorns! Press ↺ Reset the clearing.',3500); return; }
    closeCard(); S.phase={name:'fall',t:0}; S.acorns=[]; S.stats.dropped=100; S.stats.eaten=0; S.stats.sprouted=0;
    const keep=4+Math.floor(rnd()*4); const empty=SLOTS.map((_,i)=>i).filter(i=>!at(i));
    for(let i=0;i<100;i++){ const t=trees[i%trees.length]; const lucky=i<keep; let lx=t.x+(rnd()-.5)*t.r*2.4; let far=false;
      if(lucky&&empty.length){ const slot=empty[Math.floor(rnd()*empty.length)]; lx=SLOTS[slot]+(rnd()-.5)*0.5; far=Math.abs(lx-t.x)>t.r*1.3; }
      S.acorns.push({x:t.x+(rnd()-.5)*t.r*1.6,y:crownY(t)+(rnd()-.5)*t.r,lx,vy:0,t:rnd()*0.5,lucky,far,landed:false,eaten:false}); }
    toast('🌰 100 acorns! Here come the hungry animals…',3500);
  }
  function eatersIn(){
    S.eaters=[ {emoji:'🐿️',x:-2,y:0.45,s:1.0,v:3.2,name:'Gray squirrel',fact:'Eats acorns — and buries extras. Some forgotten ones sprout!'},{emoji:'🦃',x:43,y:0.65,s:1.3,v:2.4,name:'Wild turkey',fact:'Scratches through the leaves and gobbles acorns by the hundred.'},{emoji:'🦌',x:-4,y:0.9,s:1.8,v:2.8,name:'White-tailed deer',fact:'Crunches acorns — and nibbles seedlings, too!'},{draw:'jay',x:45,y:1.1,s:0.8,v:4,name:'Blue jay',fact:'Carries acorns far away and buries them. Jays plant forests!'},{draw:'mouse',x:-1,y:0.3,s:0.5,v:2.6,name:'Deer mouse',fact:'Nibbles acorns all winter long.'} ];
    S.eaters.forEach((e,i)=>{ e.dir=e.x<0?1:-1; e.id='eater'; e.card='eater'; e.sub='Acorn eater'; e.leaving=false; });
  }
  function update(dt){
    S.plants.forEach(p=>{ p.h+=(p.hT-p.h)*Math.min(1,dt*2.2); if(p.fall){ p.fall.t=Math.min(1,p.fall.t+dt/1.3); if(p.fall.t>=1&&p.stage!=='log'){ p.stage='log'; p.logDir=p.fall.dir; p.logLen=p.h*0.62; } } });
    if(S.storm){ S.storm.t+=dt; if(S.storm.t>2.6) S.storm=null; }
    S.flash=Math.max(0,S.flash-dt*3);
    if(!S.phase) return;
    const ph=S.phase; ph.t+=dt;
    if(ph.name==='fall'){
      let all=true; S.acorns.forEach(a=>{ if(a.t>0){ a.t-=dt; all=false; return; } if(a.landed) return; all=false; a.vy+=18*dt; a.y-=a.vy*dt; a.x+=(a.lx-a.x)*Math.min(1,dt*2.5); if(a.y<=0.12){ a.y=0.12; a.landed=true; a.x=a.lx; } });
      if(all){ eatersIn(); S.phase={name:'eat',t:0}; }
    }else if(ph.name==='eat'){
      let left=S.acorns.filter(a=>!a.eaten&&!a.lucky);
      S.eaters.forEach(e=>{ if(e.leaving){ e.x+=e.v*dt*-e.dir*2.2; return; }
        let target=null,best=1e9; left.forEach(a=>{ const d=Math.abs(a.x-e.x); if(d<best){best=d;target=a;} });
        if(!target){ e.leaving=true; return; }
        if(best<0.6){ e.eat=(e.eat||0)+dt; if(e.eat>0.045){ e.eat=0; target.eaten=true; S.stats.eaten++; left=left.filter(a=>a!==target); } }
        else{ e.x+=Math.sign(target.x-e.x)*e.v*dt; e.dir=Math.sign(target.x-e.x)||e.dir; }
      });
      // once every plain acorn is gone, give the animals a moment to trot off, then sprout
      if(!left.length){ ph.done=(ph.done||0)+dt; if(ph.done>0.9){ S.eaters=[]; sprout(); } }
      if(ph.t>9){ S.acorns.forEach(a=>{ if(!a.lucky&&!a.eaten){ a.eaten=true; S.stats.eaten++; } }); S.eaters=[]; sprout(); }
    }
  }
  function sprout(){
    let n=0; S.acorns.filter(a=>a.lucky).forEach(a=>{ let slot=0; SLOTS.forEach((x,i)=>{ if(Math.abs(x-a.x)<Math.abs(SLOTS[slot]-a.x)) slot=i; }); if(!at(slot)&&Math.abs(SLOTS[slot]-a.x)<1.8){ S.plants.push(mk(slot,'seedling',0)); n++; } else { S.stats.eaten++; } });
    S.stats.sprouted=n; S.acorns=[]; S.phase=null; refreshStat();
    toast('🍽️ '+S.stats.eaten+' eaten or rotted. 🌱 '+n+' sprouted!',5000);
  }
  function nextYear(){
    if(S.phase){ toast('Wait for the animals to finish!',2000); return; }
    closeCard(); S.year++; let grew=0, died=0, fell=null;
    /* while the challenge is running, one seedling is guaranteed to make it and the
       ladder is shorter — the lesson is that almost no acorn wins, not that the
       child should press this button twenty times and still lose */
    const helping = !!(quest.active && quest.active.id==='grow');
    S.plants.forEach(p=>{
      if(p.stage==='dead'){ p.dead++; return; }
      const L=lightAt(p.slot);
      if(p.stage==='seedling'){ if(L>=0.5){ p.age++; if(!helping&&rnd()<0.12){ p.stage='dead'; died++; p.why='deer'; } else if(p.age>=(helping?1:2)){ p.stage='sapling'; p.age=0; p.hT=STAGE.sapling.h; p.r=STAGE.sapling.r; grew++; } } else if(!helping&&rnd()<0.4){ p.stage='dead'; died++; p.why='shade'; } }
      else if(p.stage==='sapling'){ if(L>=0.4){ p.age++; p.hT=Math.min(STAGE.young.h,p.hT+2.8); if(p.age>=(helping?2:3)){ p.stage='young'; p.age=0; p.hT=STAGE.young.h; p.r=STAGE.young.r; grew++; } } else if(!helping&&rnd()<0.15){ p.stage='dead'; died++; p.why='shade'; } }
      else if(p.stage==='young'){ p.age++; p.hT=Math.min(STAGE.canopy.h,p.hT+2.6); if(p.age>=(helping?2:3)){ p.stage='canopy'; p.hT=STAGE.canopy.h; p.r=STAGE.canopy.r; grew++; } }
      else if(p.stage==='canopy'){ p.age++; if(p.age>300&&rnd()<0.2&&!fell&&!p.fall) fell=p; }
    });
    S.plants=S.plants.filter(p=>!(p.stage==='dead'&&p.dead>1));
    if(fell) fall(fell,'The old giant fell down on its own — big trees don\'t live forever.');
    refreshStat();
    const young=S.plants.filter(p=>p.stage==='seedling'||p.stage==='sapling'||p.stage==='young').length;
    if(!young) toast('🌰 No young trees left — press Drop 100 acorns to try again!',5000);
    else if(died&&!grew) toast(died===1?'😔 A seedling didn\'t make it. Too dark down there.':'😔 '+died+' seedlings didn\'t make it. Too dark down there.',3000);
    else if(grew) toast('📈 Growing! The sunny ones are shooting up.',2500);
  }
  function fall(p,msg){ const dir=p.x<20?1:-1; p.fall={t:0,dir}; if(msg) toast(msg,4500); }
  function storm(){
    if(S.phase){ toast('Wait for the animals to finish!',2000); return; }
    const big=S.plants.filter(p=>p.stage==='canopy'&&!p.fall).sort((a,b)=>b.age-a.age)[0];
    S.storm={t:0}; S.flash=1; closeCard();
    if(!big){ toast('🌩️ Whoosh! No big trees left to knock down.',3000); return; }
    fall(big,'🌩️ CRASH! The old '+big.kind+' fell. Sun pours into the gap!');
  }
  function stat(){ const c=s=>S.plants.filter(p=>p.stage===s).length; return '<span>📅 Year <b>'+S.year+'</b></span><span>🌱 <b>'+c('seedling')+'</b></span><span>🌿 <b>'+c('sapling')+'</b></span><span>🌲 <b>'+c('young')+'</b></span><span>🌳 <b>'+c('canopy')+'</b></span>'; }
  function drawPlant(p){
    if(p.stage==='log'){ const x0=Math.min(p.x,p.x+p.logDir*p.logLen), w=p.logLen; box(sx(x0),sy(0.75),M(w),M(0.7),M(0.3),'#6e4a2c',LW(0.06,1.5)); ellipse(sx(p.logDir>0?p.x+p.logLen:p.x),sy(0.4),M(0.16),M(0.35),0,'#e8c58f',LW(0.05,1.2)); if(S.year-p.born>1) drawMushroom(x0+w*0.4,0.75,0.25,'#d9b06a'); return; }
    if(p.stage==='dead'){ line(sx(p.x),sy(0.05),sx(p.x+0.15),sy(0.6),'#7a5a3a',LW(0.06,2)); label(p.why==='deer'?'🦌':'💤',sx(p.x),sy(0.9),{size:14}); return; }
    ctx.save();
    if(p.fall){ const a=smooth(p.fall.t)*Math.PI/2*p.fall.dir; ctx.translate(sx(p.x),sy(0)); ctx.rotate(a); ctx.translate(-sx(p.x),-sy(0)); }
    if(p.stage==='seedling'){ emoji('🌱',sx(p.x),sy(0.35),clamp(M(0.9),18,40)); }
    else{ drawTree({x:p.x,h:p.h,r:p.stage==='sapling'?Math.min(p.r,p.h*0.36):p.r,kind:p.kind,seed:p.seed,w:Math.max(0.12,0.05*p.h)},{noAcorns:p.stage!=='canopy'}); }
    ctx.restore();
  }
  function draw(){
    drawSky(S.storm?clamp(S.storm.t<2?S.storm.t*1.5:(2.6-S.storm.t)*1.6,0,1):0);
    if(!S.storm) drawSun(36.5,24,1.4);
    ctx.save(); ctx.globalAlpha=0.22; BACK.forEach((t,i)=>{ const tt={x:t.x-1,h:t.h*0.62,r:t.r*0.7}; drawTrunk(tt.x,0.03*tt.h,-0.3,crownY(tt)+tt.r*0.1,'#a89a8a',i+20); drawCrownAt(tt.x,crownY(tt),tt.r,'oak',i+40,0.9); }); ctx.restore();
    // ground
    ctx.fillStyle=SOIL; ctx.fillRect(0,sy(0),V.w,V.h); drawGroundLine(-1,41); drawLitter(-1,41);
    // sunny or shady spot markers
    SLOTS.forEach((x,i)=>{ const L=lightAt(i), sunny=L>=0.5; disc(sx(x),sy(-0.62),Math.max(7,M(0.42)),sunny?GOLD:'#2b2a6e',2); if(sunny) emoji('☀️',sx(x),sy(-0.62),Math.max(11,M(0.6))); });
    const sorted=S.plants.slice().sort((a,b)=>(a.stage==='log'?-1:0)-(b.stage==='log'?-1:0));
    sorted.forEach(drawPlant);
    S.acorns.forEach(a=>{ if(a.eaten) return; const px=sx(a.x),py=sy(a.y),r=Math.max(3,M(0.2)); disc(px,py,r,'#c9975a',1); circle(px,py-r*0.5,r,'#6e4426'); if(a.far&&!a.landed) label('🐦',px+r*2,py-r*2,{size:14}); });
    S.eaters.forEach(e=>{ ctx.save(); ctx.translate(sx(e.x),sy(e.y)); if(e.dir<0) ctx.scale(-1,1); if(e.draw) DRAWERS[e.draw](M(e.s)); else emoji(e.emoji,0,0,M(e.s)); ctx.restore(); });
    if(S.phase&&S.phase.name==='eat') sign('🍽️ eaten: '+S.stats.eaten,V.w/2,sy(4),{size:15,fill:GOLD});
    if(S.storm){ const rr=seeded(3+Math.floor(now*20)); ctx.strokeStyle='rgba(200,220,255,0.7)'; ctx.lineWidth=2; for(let i=0;i<60;i++){ const x=rr()*V.w, y=rr()*V.h; ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x-6,y+22); ctx.stroke(); } }
    if(S.flash>0){ ctx.fillStyle='rgba(255,255,255,'+(S.flash*0.7)+')'; ctx.fillRect(0,0,V.w,V.h); }
    sign('☀️ sunny spot   🌑 shady spot',V.w*0.24,sy(-1.5),{size:12});
  }
  function hit(wx,wy){
    for(const e of S.eaters){ if(dist(wx,wy,e.x,e.y)<Math.max(e.s*0.7,22/K)) return e; }
    for(const p of S.plants.slice().reverse()){
      if(p.stage==='log'){ const x0=Math.min(p.x,p.x+p.logDir*p.logLen); if(wx>=x0-0.3&&wx<=x0+p.logLen+0.3&&wy>=-0.2&&wy<=1.2) return Object.assign({id:'log',card:'log',name:'Fallen giant',sub:'A gap in the roof — and a new home',fact:'When a big tree falls it opens a sunny gap. The log becomes a home for salamanders and beetles, and slowly turns back into soil.',emoji:'🪵',p},{}); continue; }
      if(p.stage==='dead'){ if(dist(wx,wy,p.x,0.4)<Math.max(0.8,22/K)) return {id:'dead',name:'A seedling that didn\'t make it',sub:p.why==='deer'?'A deer ate it':'Too dark to grow',fact:'Most seedlings never grow up. Too little sun, or a hungry deer. That\'s normal in a forest — that\'s why an oak drops so many acorns.',emoji:'💤',p}; continue; }
      const hw=p.stage==='seedling'?Math.max(0.9,22/K):p.stage==='sapling'?1.2:p.r; if(wx>=p.x-hw&&wx<=p.x+hw&&wy>=-0.1&&wy<=Math.max(p.h+0.5,1.2)){ const L=lightAt(p.slot); const sunny=L>=0.5;
        if(p.stage==='seedling') return {id:'seedling',name:'Seedling',sub:'SEED-ling · a baby tree',fact:sunny?'This one is in a sunny spot — press ⏩ Next year and watch it grow!':'It\'s stuck in the shade under the big trees. It can\'t grow up until some sun gets in.',emoji:'🌱',p};
        if(p.stage==='sapling') return {id:'sapling',name:'Sapling',sub:'A young tree, taller than you',fact:sunny?'It\'s on its way up! A few more sunny years and it will be a big tree.':'It\'s waiting in the shade. Saplings can wait a long time for a gap.',emoji:'🌿',p};
        if(p.stage==='young') return {id:'young',name:'Young tree',sub:'Almost to the roof',fact:'Its top is nearly in the canopy. Soon it will be catching the sun — and shading everything below it.',emoji:'🌲',p};
        return {id:'tree',mine:p.born>=0,name:'Big '+p.kind,sub:'About '+(S.year-p.born)+' years old'+(p.born>=0?' · YOU grew this one!':''),fact:'Its leafy top is part of the canopy now. It shades everything below — so its own seedlings can\'t grow under it!',emoji:'🌳',p}; }
    }
    if(S.acorns.some(a=>!a.eaten&&a.landed&&dist(wx,wy,a.x,a.y)<Math.max(0.6,22/K))) return {id:'acorn',name:'Acorns',sub:'An oak\'s seeds',fact:'Each acorn could be a tree. But squirrels, jays, turkeys, deer, and mice think they\'re delicious.',emoji:'🌰'};
    return null;
  }
  function itemPos(it){ if(it.p){ const p=it.p; return [sx(p.x),sy(p.stage==='seedling'?0.4:p.stage==='log'?0.4:p.h*0.6),Math.max(24,M(p.stage==='seedling'?0.8:p.stage==='log'?p.logLen*0.5:p.r))]; } if(it.card==='eater') return [sx(it.x),sy(it.y),Math.max(24,M(it.s)*0.7)]; return null; }
  $('btnAcorns').addEventListener('click',dropAcorns); $('btnYear').addEventListener('click',nextYear); $('btnStorm').addEventListener('click',storm); $('btnReset').addEventListener('click',()=>{ reset(); toast('↺ A fresh clearing.',2000); });
  reset();
  return {S,get plants(){return S.plants;},update,draw,hit,stat,reset,itemPos};
})();

/* =====================================================================
   NAVIGATION: chips, buttons, the elevator ride between floors
   ===================================================================== */
CHAPTERS.forEach((c,i)=>{
  const b=document.createElement('button'); b.className='lvl'; b.type='button'; b.setAttribute('aria-label','Go to '+c.name);
  b.appendChild(Object.assign(document.createElement('span'),{className:'ic',textContent:c.icon}));
  b.appendChild(Object.assign(document.createElement('span'),{className:'nm',textContent:c.name}));
  b.addEventListener('click',()=>goTo(i)); els.levels.appendChild(b); c.chip=b;
});
function buildTapList(){
  const host=$('taplist'); if(!host) return;
  host.innerHTML='';
  const c=CHAPTERS[current];
  if(c.grow) return;                       /* the clearing is built from acorns, not a fixed cast */
  /* resVisible() waits for the log to finish rising; the keyboard list should
     follow the intent, not the animation, or it rebuilds a beat too early */
  RES.filter(r=>r.floor===c.id&&(r.underLog?wantLog:true)).forEach(r=>{
    const b=document.createElement('button'); b.type='button'; b.textContent=r.name;
    b.addEventListener('click',()=>{
      if(quest.active&&quest.active.steps[quest.step].tap){ if(questTap(r)) return; }
      showCard(r);
    });
    host.appendChild(b);
  });
}
function updateChips(){
  CHAPTERS.forEach((c,k)=>{ c.chip.classList.toggle('on',k===current); c.chip.classList.toggle('done',k<current); });
  const on=CHAPTERS[current].chip;                 /* keep the current one in view when the rail scrolls */
  if(on&&on.scrollIntoView) on.scrollIntoView({block:'nearest',inline:'center'});
}
function updateButtons(){
  els.btnBack.disabled=(current===0);
  const last=(current===CHAPTERS.length-1), grow=(current===CHAPTERS.length-2);
  els.btnNext.textContent=last?'🔁 Back to the start':grow?'STEP OUT ▶':'GO DOWN ▼';
  els.btnNext.classList.toggle('home',last);
  els.btnBack.innerHTML=last?'◀ <span class="bl">Back</span>':'▲ <span class="bl">Up</span>';
  els.btnBack.setAttribute('aria-label',last?'Back':'Up');
  const c=CHAPTERS[current], won=!!badges[c.id];
  els.btnQuest.textContent=won?'✅ Badge earned':'🎯 Challenge!';
  els.btnQuest.classList.toggle('won',won);
  ['season','floor','roots','grow'].forEach(g=>{ $('ctl-'+g).hidden=!c.ctls.includes(g); });
}
let trans=null;   // {from,to,t0,dur,c0,c1,curtain}
function goTo(i){
  i=clamp(i,0,CHAPTERS.length-1); if(i===current||trans) return;
  closeCard(); endQuest(); els.hint.hidden=true;
  resetTransient();
  const from=current, curtain=CHAPTERS[i].grow||CHAPTERS[from].grow;
  if(REDUCED){ switchTo(i); return; }
  trans={from,to:i,t0:performance.now(),dur:curtain?1100:1500,c0:{...cam},c1:camFor(CHAPTERS[i]),curtain};
}
function switchTo(i){
  current=i; Object.assign(cam,camFor(CHAPTERS[i]));
  setCaption(i); updateChips(); updateButtons(); drawMinimap(); refreshStat();
  els.hint.textContent=CHAPTERS[i].hint; els.hint.hidden=false;   /* every floor says what to tap */
  buildTapList();
}
els.btnNext.addEventListener('click',()=>goTo(current===CHAPTERS.length-1?0:current+1));
els.btnBack.addEventListener('click',()=>goTo(current-1));

/* ---------- taps ---------- */
let pDown=null;
view.addEventListener('pointerdown',e=>{ pDown={x:e.clientX,y:e.clientY}; });
view.addEventListener('pointerup',e=>{
  if(!pDown) return; const moved=Math.hypot(e.clientX-pDown.x,e.clientY-pDown.y); pDown=null;
  if(moved>12||trans) return;
  const r=view.getBoundingClientRect(), [wx,wy]=toWorld(e.clientX-r.left,e.clientY-r.top);
  const item=CHAPTERS[current].grow?GROW.hit(wx,wy):resHit(wx,wy);
  if(quest.active&&quest.active.steps[quest.step].tap){ if(questTap(item)) return; }
  if(item) showCard(item); else closeCard();
});
window.addEventListener('keydown',e=>{
  const tag=e.target.tagName; if(tag==='INPUT') return;
  if((e.key===' '||e.key==='Enter')&&tag==='BUTTON') return;
  if(e.key==='ArrowDown'||e.key==='ArrowRight'){ e.preventDefault(); els.btnNext.click(); }
  else if(e.key==='ArrowUp'||e.key==='ArrowLeft'){ e.preventDefault(); els.btnBack.click(); }
  else if(e.key==='Escape'){ closeCard(); endQuest(); }
  else if(e.key>='1'&&e.key<='6') goTo(+e.key-1);
});

/* ---------- sizing + the frame loop ---------- */
function placeQuestBtn(){ if(narrowMQ.matches) $('ctl').prepend(els.btnQuest); else els.btnNext.after(els.btnQuest); updateButtons(); }
narrowMQ.addEventListener('change',placeQuestBtn); placeQuestBtn();
function resize(){
  const r=stage.getBoundingClientRect();
  V.w=Math.max(320,Math.round(r.width)); V.h=Math.max(240,Math.round(r.height));
  V.dpr=Math.min(2,window.devicePixelRatio||1);
  view.width=Math.round(V.w*V.dpr); view.height=Math.round(V.h*V.dpr);
  if(!trans) Object.assign(cam,camFor(CHAPTERS[current]));
}
let lastT=performance.now();
function frame(nowMs){
  const dt=Math.min(0.05,(nowMs-lastT)/1000); lastT=nowMs; now=nowMs/1000;
  ctx.setTransform(V.dpr,0,0,V.dpr,0,0);
  logLift+=((wantLog?1:0)-logLift)*Math.min(1,dt*3);
  updateLeaves(dt); GROW.update(dt);
  let curtainA=0;
  if(trans){
    const k=clamp((nowMs-trans.t0)/trans.dur,0,1);
    if(trans.curtain){ curtainA=1-Math.abs(k*2-1); if(k>=0.5&&current!==trans.to) switchTo(trans.to); }
    else{ const u=easeInOut(k); cam.cx=lerp(trans.c0.cx,trans.c1.cx,u); cam.cy=lerp(trans.c0.cy,trans.c1.cy,u); cam.hm=Math.exp(lerp(Math.log(trans.c0.hm),Math.log(trans.c1.hm),u)); if(k>=1&&current!==trans.to) switchTo(trans.to); }
    if(k>=1) trans=null;
  }
  K=V.h/cam.hm;
  const showGrow=CHAPTERS[current].grow;
  if(showGrow) GROW.draw(); else drawWorld();
  if(selected){ const p=showGrow?GROW.itemPos(selected):resScreenPos(selected); if(p){ ctx.save(); ctx.setLineDash([8,6]); ctx.lineDashOffset=-now*30; ring(p[0],p[1],p[2],GOLD,4); ctx.restore(); } }
  if(curtainA>0){ ctx.fillStyle='rgba(255,248,231,'+curtainA+')'; ctx.fillRect(0,0,V.w,V.h); if(curtainA>0.6){ ctx.globalAlpha=(curtainA-0.6)/0.4; label(CHAPTERS[trans?trans.to:current].grow?'🚪 Stepping out into the clearing…':'🛗 Back into the elevator…',V.w/2,V.h/2,{size:22,display:true,dark:true}); ctx.globalAlpha=1; } }
  drawConfetti(dt);
  requestAnimationFrame(frame);
}
if(document.fonts&&document.fonts.load){ document.fonts.load('800 13px Nunito'); document.fonts.load('700 20px Fredoka'); }
window.forestElevator={CHAPTERS,RES,GROW,goTo,award,startQuest,quest,badges,setSeason,cam,resPos,resHit,setLog};   // handy for testing and tinkering
new ResizeObserver(resize).observe(stage);
makeBeams();
resize();

/* =====================================================================
   BADGES THAT SURVIVE A CLOSED TAB
   A six-year-old gets called to dinner mid-challenge. Losing every badge to
   a reload is the quickest way to make the whole reward loop feel pointless.
   The ↺ in the badge meter clears them so a second child can start fresh —
   two taps, so it cannot happen by accident.
   ===================================================================== */
const SAVE_KEY='learningTools.forestElevator.badges';
function saveBadges(){ try{ localStorage.setItem(SAVE_KEY,JSON.stringify(Object.keys(badges))); }catch(e){} }
function restoreBadges(){
  let saved=[];
  try{ saved=JSON.parse(localStorage.getItem(SAVE_KEY)||'[]'); }catch(e){ saved=[]; }
  if(!Array.isArray(saved)) saved=[];
  saved.forEach(id=>{
    const c=CHAPTERS.find(x=>x.id===id); if(!c) return;
    badges[id]=true;
    if(c.badgeEl) c.badgeEl.classList.add('won');
    if(c.chip) c.chip.classList.add('won');
  });
  if(Object.keys(badges).length===CHAPTERS.length) els.meter.classList.add('all');
  updateWipe();
}
function clearBadges(){
  Object.keys(badges).forEach(k=>{ delete badges[k]; });
  CHAPTERS.forEach(c=>{ if(c.badgeEl) c.badgeEl.classList.remove('won'); if(c.chip) c.chip.classList.remove('won'); });
  els.meter.classList.remove('all');
  try{ localStorage.removeItem(SAVE_KEY); }catch(e){}
  updateWipe(); updateButtons();
}
let wipeArmed=false, wipeTimer=null;
function updateWipe(){
  const b=$('btnWipe'); if(!b) return;
  const any=Object.keys(badges).length>0;
  b.hidden=!any;
  if(!any){ wipeArmed=false; b.textContent='↺'; b.classList.remove('armed'); }
}
$('btnWipe').addEventListener('click',()=>{
  const b=$('btnWipe');
  if(!wipeArmed){
    wipeArmed=true; b.textContent='Clear?'; b.classList.add('armed');
    clearTimeout(wipeTimer);
    wipeTimer=setTimeout(()=>{ wipeArmed=false; b.textContent='↺'; b.classList.remove('armed'); },3500);
    return;
  }
  clearTimeout(wipeTimer); wipeArmed=false; b.textContent='↺'; b.classList.remove('armed');
  clearBadges(); toast('↺ Badges cleared — a fresh start.',3000);
});
setCaption(0); updateChips(); updateButtons(); drawMinimap(); refreshStat();
els.hint.textContent=CHAPTERS[0].hint;
buildTapList();
restoreBadges();
requestAnimationFrame(frame);

</script>
