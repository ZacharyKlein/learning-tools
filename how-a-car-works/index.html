       thumb:S=>{ ctx.fillStyle='#cdeeff'; ctx.fillRect(0,0,S,S); disc(S*0.5,S*0.3,S*0.16,'#f6c99a',2.5); box(S*0.34,S*0.46,S*0.32,S*0.36,6,'#5f7fd6',2.5); line(S*0.34,S*0.46,S*0.68,S*0.8,GOLD,7); }},
      {key:'crumple',name:'Crumple zone',sub:'the squashy front',fact:'The front of a car is built to fold up like an accordion in a crash. Folding takes time — and slowing down over a longer time is much gentler on the people inside.',
       hit:(x2,y2)=>{ const P=carPt({x0:carX(),gy:B.roadY,s:B.carS},0.93,0.2); return Math.hypot(x2-P[0],y2-P[1])<B.carS*0.13; },
       pos:()=>{ const P=carPt({x0:carX(),gy:B.roadY,s:B.carS},0.93,0.2); return [P[0],P[1],B.carS*0.12]; }},
      {key:'abs',name:'ABS',sub:'anti-lock brakes',fact:'If a wheel stops turning it slides, and a sliding tire grips badly. ABS lets go and grabs again many times a second so the wheels keep rolling — that is the buzzing you feel in a hard stop.',
       hit:(x2,y2)=>y2<B.roadY-B.carS*0.5&&x2<V.w*0.5&&y2>V.h*0.06, pos:()=>[V.w*0.25,V.h*0.2,40]},
    ];
  }
  function carX(){ return clamp(x*B.ft-B.carS*0.5,-B.carS,V.w); }
  function nearWheel(px,py){
    const F={x0:carX(),gy:B.roadY,s:B.carS};
    return [WHEEL.rear,WHEEL.front].some(w=>{ const P=carPt(F,w,WHEEL.r); return Math.hypot(px-P[0],py-P[1])<B.carS*0.13; });
  }
  function reset(){ phase='roll'; x=18; v=mph*1.4667; marks=null; heat=0; dust=[]; }
  function setSpeed(m){ mph=m; ['s20','s40','s60'].forEach((id,i)=>$(id).classList.toggle('on',[20,40,60][i]===m)); reset(); setStat(stat()); }

  function update(dt){
    t+=dt;
    if(phase==='roll'){ v=mph*1.4667; x+=v*dt; if(x>WORLD*0.95) x=6; }
    else if(phase==='react'){ x+=v*dt; if(t>=1.5){ marks.brakeAt=x; phase='brake'; } }
    else if(phase==='brake'){
      v=Math.max(0,v-DECEL()*dt); x+=v*dt; heat=Math.min(1,heat+dt*1.5);
      if(!REDUCED&&rnd()<dt*20) dust.push({x:x*B.ft,y:B.roadY,r:B.carS*0.03,t:0});
      if(v<=0.01){ phase='stopped'; marks.stopAt=x; }
    }else{ heat=Math.max(0,heat-dt*0.25); }
    wheelSpin+=v*dt*0.6;
    dust.forEach(d=>{ d.t+=dt; d.r+=dt*B.carS*0.1; d.y-=dt*B.carS*0.1; }); dust=dust.filter(d=>d.t<1.1);
    if(phase!=='roll') setStat(stat());
  }
  function brake(){
    if(phase==='roll'){ marks={seeAt:x}; phase='react'; t=0; }
    else reset();
    $('btnBrake').textContent=phase==='roll'?'🛑 BRAKE!':'↺ Again';
  }

  function flag(ftPos,txt,col){
    const px=ftPos*B.ft;
    line(px,B.roadY+B.roadH,px,B.roadY-B.carS*0.55,col,3);
    box(px,B.roadY-B.carS*0.62,Math.min(V.w*0.2,txt.length*(B.narrow?6.4:7.6)+16),B.narrow?17:21,6,col,2.5);
    label(txt,px+8,B.roadY-B.carS*0.62+(B.narrow?9:11),{size:B.narrow?10:12,align:'left',color:WHITE});
  }
  function drawBrakeInset(){
    const x2=B.insetX,y2=B.insetY,R=B.insetR, hot=heat;
    disc(x2,y2,R+4,WHITE,3.5);
    ctx.save(); ctx.beginPath(); ctx.arc(x2,y2,R,0,TAU); ctx.clip();
    ctx.fillStyle='#e4eaf5'; ctx.fillRect(x2-R,y2-R,R*2,R*2);
    const discCol=hot>0.02?mix('#b9c3d6',BRAKE_R,clamp(hot,0,1)):'#b9c3d6';
    disc(x2,y2,R*0.78,discCol,3);
    ctx.save(); ctx.translate(x2,y2); ctx.rotate(wheelSpin*0.6);
    for(let i=0;i<10;i++){ ctx.rotate(TAU/10); line(0,-R*0.3,0,-R*0.66,'rgba(93,104,128,.5)',3); } ctx.restore();
    disc(x2,y2,R*0.2,STEEL_DK,2.5);
    const squeeze=(phase==='brake'?1:0)*R*0.08;
    line(x2-R*0.9,y2-R*0.55,x2-R*0.62,y2-R*0.2,'#8d95a8',R*0.09);   // the hose that carries the squeeze
    [[-1],[1]].forEach(([s])=>{ box(x2+s*(R*0.62-squeeze)-R*0.07,y2-R*0.34,R*0.14,R*0.68,4,phase==='brake'?BRAKE_R:'#8d95a8',2.5); });
    box(x2-R*0.85,y2-R*0.5,R*0.24,R,6,'#8d95a8',2.5);
    if(hot>0.3&&!REDUCED){ ctx.save(); ctx.globalAlpha=(hot-0.3)*0.8;
      for(let i=0;i<5;i++){ const a=now*2+i; disc(x2+Math.cos(a)*R*0.7,y2-R*0.6-((now*30+i*18)%40),R*0.09,'#ffd6a5',0); } ctx.restore(); }
    ctx.restore(); ring(x2,y2,R,INK,3.5);
    label(phase==='brake'?'squeezing — getting HOT 🔥':'inside a wheel',x2,y2+R+(B.narrow?11:15),{size:B.narrow?10:12,dark:true});
  }

  function draw(){
    // sky, ground, road
    ctx.fillStyle='#cdeeff'; ctx.fillRect(0,0,V.w,V.h);
    ctx.fillStyle='#8fd06b'; ctx.fillRect(0,B.roadY-6,V.w,V.h-B.roadY+6);
    drawRoad(B.roadY,B.roadH,x*B.ft*0.3,{wet});
    // the foot ruler
    ctx.fillStyle=PAPER; ctx.fillRect(0,B.rulerY,V.w,V.h-B.rulerY);
    line(0,B.rulerY,V.w,B.rulerY,INK,3);
    for(let f=0;f<=WORLD;f+=20){
      const px=f*B.ft, big=f%100===0;
      line(px,B.rulerY,px,B.rulerY+(big?14:7),INK,big?3:1.5);
      if(big&&f) label(f+' ft',px,B.rulerY+(B.narrow?24:26),{size:B.narrow?10:12,dark:true});
    }
    // markers from the last stop
    if(marks){
      if(marks.seeAt!==undefined) flag(marks.seeAt,'👀 you see it',SKY);
      if(marks.brakeAt!==undefined) flag(marks.brakeAt,'🦶 brakes on',GOLD);
      if(marks.stopAt!==undefined){
        flag(marks.stopAt,'🛑 stopped',BRAKE_R);
        const react=Math.round(marks.brakeAt-marks.seeAt), brakeD=Math.round(marks.stopAt-marks.brakeAt);
        sign('thinking '+react+' ft  +  braking '+brakeD+' ft  =  '+(react+brakeD)+' feet to stop',V.w*0.6,V.h*0.30,{size:B.narrow?12:16,fill:GOLD});
      }
    }
    dust.forEach(d=>{ ctx.save(); ctx.globalAlpha=clamp(.5*(1-d.t),0,1); disc(d.x,d.y,d.r,'#efe6d2',0); ctx.restore(); });
    // the car
    const F={x0:carX(),gy:B.roadY,s:B.carS};
    drawCar(F,{spin:wheelSpin,glow:heat*0.5});
    // driver + belt
    const H=carPt(F,0.40,0.36), Bt=carPt(F,0.34,0.24);
    disc(H[0],H[1],B.carS*0.045,'#f6c99a',2.5);
    line(H[0]-B.carS*0.01,H[1]+B.carS*0.03,Bt[0],Bt[1],'#5f7fd6',Math.max(3,B.carS*0.05));
    line(H[0]+B.carS*0.02,H[1]+B.carS*0.02,Bt[0]+B.carS*0.04,Bt[1]+B.carS*0.03,GOLD,Math.max(2,B.carS*0.022));
    if(phase==='react') sign('😲 “Stop!” — 1½ seconds before your foot even moves',carX()+B.carS*0.5,B.roadY-B.carS*0.9,{size:B.narrow?11:14,fill:SKY,color:WHITE});
    drawBrakeInset();
    if(wet) label('🌧️ wet road — much less grip',V.w*0.03,B.roadY+B.roadH*0.5,{size:B.narrow?11:14,align:'left'});
  }
  function hit(x2,y2){ for(const it of items) if(it.hit(x2,y2)) return it; return null; }
  function stat(){
    const spd=Math.round(v/1.4667);
    return '<span>🚗 '+spd+' mph</span>'+(marks&&marks.stopAt!==undefined?'<span>📏 '+Math.round(marks.stopAt-marks.seeAt)+' ft to stop</span>':'')+(wet?'<span>🌧️ wet</span>':'');
  }
  [20,40,60].forEach((m,i)=>$(['s20','s40','s60'][i]).addEventListener('click',()=>setSpeed(m)));
  $('togWet').addEventListener('click',()=>{ wet=!wet; $('togWet').classList.toggle('on',wet); reset(); });
  $('btnBrake').addEventListener('click',brake);

  function quest(){
    return {id:'brakes',title:'🛞 Stopping',questPos:'tr',steps:[
      {prompt:'At <b>20 mph</b> the brakes need about <b>20 feet</b>. Try 40 mph — twice as fast. How far?',
       onShow(){ setSpeed(40); },
       options:[{text:'About 80 feet — four times as far',ok:true,say:'Yes! Double the speed, FOUR times the braking distance.'},
                {text:'About 40 feet — twice as far',say:'Press BRAKE at 40 and read the ruler. It is worse than double!'},
                {text:'The same, about 20 feet',say:'Try it — press BRAKE and watch the flags.'}]},
      {prompt:'Now <b>tap the part</b> that turns all that motion into heat.',
       tap:it=>it&&it.key==='disc'?true:(it&&(it.key==='tread'||it.key==='patch')?'Close! The tires hold the road — but something inside the wheel is doing the squeezing.':false),
       yes:'The brake disc and pads. Watch them glow red.', no:'Look inside the wheel — there is a close-up in the corner.'},
      {prompt:'The brakes squeeze the <b>wheels</b>. So what actually stops the <b>car</b>?',
       options:[{text:'The tires gripping the road',ok:true,say:'Right — four hand-sized patches of rubber. On ice they can’t grip, so you slide.'},
                {text:'The engine',say:'The engine makes the car go, not stop.'},
                {text:'The steering wheel',say:'That points the car, it does not slow it.'}]},
      {prompt:'The car stops in 80 feet. <b>You</b> are still moving at 40 mph. Tap the thing that catches you.',
       tap:it=>it&&it.key==='belt'?true:(it&&it.key==='crumple'?'The crumple zone helps the car — but tap what holds YOU in the seat.':false),
       yes:'Your seat belt. Buckling up cuts the risk of being killed by about half.', no:'Look inside the car, at the driver.'},
    ]};
  }
  return {layout,update,draw,hit,stat,quest,
    enter(){ reset(); setStat(stat()); $('btnBrake').textContent='🛑 BRAKE!'; }, leave(){}};
})();

/* =====================================================================
   CHAPTER 5 · STEERING — rack and pinion, seen from above with the roof
   off. The steering wheel turns a little round gear (the pinion); its
   teeth push a toothed bar (the rack) sideways; the bar pushes both
   front wheels the same way. The inset drives the car around the circle
   that steering angle actually gives you.
   ===================================================================== */
SCENES.steering=(()=>{
  const S={}; let items=[];
  const MAXANG=0.58;                                 // ~33° at full lock
  const WHEELBASE=9.2;                               // feet
  let steer=0, want=0, roll=false, hd=0, px=0, py=0, trail=[], tt=0;

  function layout(){
    const W=V.w,H=V.h; S.narrow=W<640;
    S.s=S.narrow?Math.min(W*0.90,H*0.62):Math.min(W*0.62,H*1.30);   // same framing as the axles chapter
    S.T={x0:W*(S.narrow?0.05:0.05), cy:H*(S.narrow?0.52:0.62), s:S.s};
    S.hw=TOPW/2*S.s;
    S.insetW=S.narrow?Math.min(W*0.32,H*0.22):Math.min(W*0.26,H*0.42); S.insetX=W-S.insetW-14; S.insetY=H-S.insetW-(S.narrow?44:16);
    items=[
      {key:'wheel',name:'Steering wheel',sub:'what you hold',fact:'Turning it does not push the wheels directly — it turns a shaft with a little gear on the end. About three whole turns takes you from full left to full right.',
       hit:(x,y)=>Math.hypot(x-S.swx,y-S.swy)<S.s*0.075, pos:()=>[S.swx,S.swy,S.s*0.075],
       thumb:S2=>{ ctx.fillStyle='#dfe6f2'; ctx.fillRect(0,0,S2,S2); ring(S2*0.5,S2*0.5,S2*0.3,'#2f2c3a',9); disc(S2*0.5,S2*0.5,S2*0.1,STEEL_DK,2.5); line(S2*0.2,S2*0.5,S2*0.8,S2*0.5,'#2f2c3a',7); }},
      {key:'pinion',name:'Pinion',sub:'the little round gear',fact:'A small gear on the bottom of the steering shaft. Its teeth sit in the teeth of the rack, so when it turns, the rack has to slide.',
       hit:(x,y)=>Math.hypot(x-S.pinX,y-S.pinY)<S.s*0.05, pos:()=>[S.pinX,S.pinY,S.s*0.05]},
      {key:'rack',name:'Rack',sub:'the sliding toothed bar',fact:'A straight bar with teeth cut into it, lying across the car. The pinion turns and the rack slides left or right — that sideways slide is what points the wheels.',extra:'Rack and pinion: two gears, one round and one straight.',
       hit:(x,y)=>Math.abs(x-S.rackX)<S.s*0.045&&Math.abs(y-S.T.cy)<S.hw*1.1, pos:()=>[S.rackX,S.T.cy+S.rackOff,S.s*0.06],
       thumb:S2=>{ ctx.fillStyle='#dfe6f2'; ctx.fillRect(0,0,S2,S2); box(S2*0.06,S2*0.42,S2*0.88,S2*0.16,4,STEEL,3); ctx.fillStyle=STEEL_DK; for(let i=0;i<7;i++) ctx.fillRect(S2*0.1+i*S2*0.12,S2*0.34,S2*0.06,S2*0.09); }},
      {key:'tierod',name:'Tie rod',sub:'the push-bar',fact:'One short bar from each end of the rack out to a wheel. Both wheels get pushed at once, so they always point the same way.',
       hit:(x,y)=>Math.abs(y-(S.T.cy-S.hw*0.6))<S.hw*0.5&&x>S.rackX&&x<S.frontX||Math.abs(y-(S.T.cy+S.hw*0.6))<S.hw*0.5&&x>S.rackX&&x<S.frontX,
       pos:()=>[(S.rackX+S.frontX)/2,S.T.cy-S.hw*0.7,S.s*0.05]},
      {key:'front',name:'Front wheels',sub:'the steered pair',fact:'Only the front wheels turn. The back wheels always point straight ahead and just follow — which is why the back of the car cuts the corner.',extra:'Big trucks and some fancy cars can steer the back wheels a little too.',
       hit:(x,y)=>Math.hypot(x-S.frontX,y-(S.T.cy-S.hw))<S.s*0.1||Math.hypot(x-S.frontX,y-(S.T.cy+S.hw))<S.s*0.1,
       pos:()=>[S.frontX,S.T.cy-S.hw,S.s*0.1]},
      {key:'circle',name:'Turning circle',sub:'how tight you can turn',fact:'At full lock a normal car draws a circle about 35 feet across — a bit wider than a school bus is long. Turn the wheel more and the circle gets smaller.',
       hit:(x,y)=>x>S.insetX&&y>S.insetY, pos:()=>[S.insetX+S.insetW/2,S.insetY+S.insetW/2,S.insetW*0.5]},
    ];
  }
  function setSteer(v){
    want=clamp(v,-1,1);
    $('wLeft').classList.toggle('on',want<0); $('wRight').classList.toggle('on',want>0); $('wCenter').classList.toggle('on',want===0);
    setStat(stat());
  }
  function update(dt){
    steer=lerp(steer,want,1-Math.pow(0.004,dt));
    tt+=dt;
    if(roll){
      const ang=steer*MAXANG, sp=14;                 // ~10 mph
      const rate = Math.tan(ang)/WHEELBASE*sp;
      hd+=rate*dt; px+=Math.cos(hd)*sp*dt; py+=Math.sin(hd)*sp*dt;
      if(tt>0.06){ trail.push([px,py]); tt=0; if(trail.length>420) trail.shift(); }
    }
    setStat(stat());
  }
  function radiusFt(){ const a=Math.abs(steer)*MAXANG; return a<0.02?Infinity:WHEELBASE/Math.tan(a); }

  function drawInset(){
    const x=S.insetX,y=S.insetY,W=S.insetW;
    box(x,y,W,W,16,'#6d7385',3.5);
    ctx.save(); rrect(x,y,W,W,16); ctx.clip();
    const sc=W/95, cx=x+W/2, cy=y+W/2;
    // the trail the car has left
    if(trail.length>1){ ctx.strokeStyle='rgba(255,210,63,.85)'; ctx.lineWidth=3; ctx.setLineDash([7,6]); ctx.beginPath();
      trail.forEach((p,i)=>{ const sx=cx+(p[0]-px)*sc, sy=cy+(p[1]-py)*sc; i?ctx.lineTo(sx,sy):ctx.moveTo(sx,sy); }); ctx.stroke(); ctx.setLineDash([]); }
    // the car itself, nose along its heading
    ctx.save(); ctx.translate(cx,cy); ctx.rotate(hd);
    const cs=W*0.20; drawCarTop({x0:-cs*0.5,cy:0,s:cs},{}); ctx.restore();
    ctx.restore();
    box(x,y,W,W,16,'rgba(0,0,0,0)',3.5);
    const R=radiusFt();
    label(R===Infinity?'straight ahead':'circle about '+Math.round(R*2/5)*5+' feet across',x+W/2,y+W-13,{size:S.narrow?10:12});
    label(roll?'🚗 driving':'press Drive ▶',x+W/2,y+13,{size:S.narrow?10:12});
  }

  function draw(){
    ctx.fillStyle=ROAD; ctx.fillRect(0,0,V.w,V.h);
    ctx.fillStyle='rgba(255,255,255,.05)';
    for(let i=0;i<50;i++){ const rr=seeded(i+2); ctx.fillRect(rr()*V.w,rr()*V.h,3,3); }
    const T=S.T, ang=steer*MAXANG;
    S.frontX=T.x0+0.775*S.s; S.rackX=T.x0+0.705*S.s;
    S.swx=T.x0+0.50*S.s; S.swy=T.cy-S.hw*0.55;
    S.pinX=S.rackX; S.pinY=T.cy-S.hw*0.55;
    S.rackOff=-Math.sin(ang)*S.s*0.075;
    // the body, faded, roof off
    drawCarTop(T,{ghost:true});
    // the steering shaft
    line(S.swx,S.swy,S.pinX,S.pinY,STEEL_DK,Math.max(4,S.s*0.014));
    // the rack: a bar across the car that slides
    const rackTop=T.cy-S.hw*0.92+S.rackOff, rackBot=T.cy+S.hw*0.92+S.rackOff;
    box(S.rackX-S.s*0.020,rackTop,S.s*0.040,rackBot-rackTop,S.s*0.020,STEEL_LT,3.5);
    ctx.fillStyle=STEEL_DK;
    for(let yy=rackTop+S.s*0.02;yy<rackBot-S.s*0.02;yy+=S.s*0.028) ctx.fillRect(S.rackX-S.s*0.034,yy,S.s*0.016,S.s*0.012);
    // the pinion, turning
    drawGear(S.pinX-S.s*0.038,S.pinY,S.s*0.036,10,-S.rackOff/(S.s*0.036),GOLD,2.5);
    // tie rods out to the wheels
    [[-1],[1]].forEach(([side])=>{
      const wc=[S.frontX,T.cy+side*S.hw];
      const arm=[wc[0]-Math.cos(ang)*S.s*0.085,wc[1]-Math.sin(ang)*S.s*0.085];
      const rackEnd=[S.rackX,T.cy+side*S.hw*0.86+S.rackOff];
      line(rackEnd[0],rackEnd[1],arm[0],arm[1],STEEL_LT,Math.max(3.5,S.s*0.013));
      line(rackEnd[0],rackEnd[1],arm[0],arm[1],STEEL_DK,Math.max(1.5,S.s*0.005));
      disc(rackEnd[0],rackEnd[1],S.s*0.014,STEEL_DK,2);
      disc(arm[0],arm[1],S.s*0.014,STEEL_DK,2);
      drawTopWheel(T,0.775,side*TOPW/2,ang,{});
    });
    // the back wheels, always straight
    drawTopWheel(T,0.215,-TOPW/2,0,{}); drawTopWheel(T,0.215,TOPW/2,0,{});
    // the steering wheel, turning about 1½ times at full lock
    const sw=S.s*0.062;
    ctx.save(); ctx.translate(S.swx,S.swy); ctx.rotate(steer*Math.PI*1.5);
    ring(0,0,sw,'#2f2c3a',Math.max(5,sw*0.28));
    line(-sw,0,sw,0,'#2f2c3a',Math.max(4,sw*0.22));
    line(0,0,0,sw,'#2f2c3a',Math.max(4,sw*0.22));
    disc(0,0,sw*0.3,STEEL_DK,2.5); ctx.restore();
    // arrows showing which way things go
    if(Math.abs(steer)>0.08){
      const dir=steer>0?1:-1;
      label(dir>0?'rack slides ▲':'rack slides ▼',S.rackX-S.s*0.075,T.cy+S.hw*1.18,{size:S.narrow?11:14,align:'right'});
      label(dir>0?'wheels point right ↘':'wheels point left ↗',S.frontX+S.s*0.02,T.cy-S.hw*1.2,{size:S.narrow?11:14,align:'left'});
    }
    label('steering wheel',S.swx,S.swy-sw-14,{size:S.narrow?10:13});
    label('the rack',S.rackX+S.s*0.02,T.cy+S.hw*0.45,{size:S.narrow?10:13,align:'left'});
    drawInset();
  }
  function hit(x,y){ for(const it of items) if(it.hit(x,y)) return it; return null; }
  function stat(){
    const R=radiusFt(), deg=Math.round(Math.abs(steer)*MAXANG*180/Math.PI);
    return '<span>🎡 wheels turned '+deg+'°</span>'+(R===Infinity?'<span>➡️ straight</span>':'<span>⭕ '+Math.round(R*2/5)*5+' ft circle</span>');
  }
  $('wLeft').addEventListener('click',()=>setSteer(want>0?0:want-0.5));
  $('wRight').addEventListener('click',()=>setSteer(want<0?0:want+0.5));
  $('wCenter').addEventListener('click',()=>setSteer(0));
  $('togRoll').addEventListener('click',()=>{ roll=!roll; $('togRoll').classList.toggle('on',roll); if(!roll) trail=[]; });

  function quest(){
    return {id:'steering',title:'🎡 Point the wheels',questPos:'tr',steps:[
      {prompt:'Turn the steering wheel and watch. <b>Tap the bar</b> that slides sideways across the car.',
       onShow(){ setSteer(1); roll=true; $('togRoll').classList.add('on'); },
       tap:it=>it&&it.key==='rack'?true:(it&&it.key==='pinion'?'That is the little round gear that pushes it. Tap the long straight bar with teeth.':false),
       yes:'The rack. Round gear + straight gear = rack and pinion.', no:'Look for the long bar lying across the front of the car.'},
      {prompt:'Which wheels actually turn when you steer?',
       options:[{text:'Just the front two',ok:true,say:'Right — the back wheels only follow.'},
                {text:'All four',say:'Watch the back wheels — they never move.'},
                {text:'Just the back two',say:'The other end! Watch the front.'}]},
      {prompt:'Press <b>Left</b> twice to turn the wheel all the way. What happens to the circle the car drives?',
       onShow(){ setSteer(-0.5); },
       options:[{text:'It gets smaller — a tighter turn',ok:true,say:'Yes. Full lock is about a 35-foot circle.'},
                {text:'It gets bigger',say:'Try it — press Left again and watch the number in the corner.'},
                {text:'It stays the same',say:'Watch the yellow trail in the little window.'}]},
      {prompt:'Last one: what does the steering system NOT do?',
       options:[{text:'Make the car go faster',ok:true,say:'Correct — that is the engine’s job. Badge earned!'},
                {text:'Point the front wheels',say:'It does do that!'},
                {text:'Push both front wheels the same way',say:'It does that too — that is what the tie rods are for.'}]},
    ]};
  }
  return {layout,update,draw,hit,stat,quest,
    enter(){ setStat(stat()); }, leave(){ roll=false; $('togRoll').classList.remove('on'); }};
})();

/* =====================================================================
   CHAPTER 6 · GAS OR ELECTRIC? — two lanes, the same 100 blobs of
   energy sent down each one. Out of 100, a gasoline car gets about 20
   to the wheels; nearly all the rest leaves as heat out of the engine
   and the tailpipe. An electric car gets about 77 there, and on the
   brakes it can even push some back into the battery.
   ===================================================================== */
SCENES.power=(()=>{
  const P={}; let items=[], bits=[], regen=[], heatPuffs=[];
  let running=0, arrivedG=0, arrivedE=0, fillT=-1, braking=0;
  // [fraction along the river, blobs lost there, label, short label, phone fraction]
  const GAS_LOSS=[[0.30,6,'idling','idle',0.16],[0.45,68,'engine heat','engine',0.48],[0.66,6,'gears + friction','gears',0.80]];
  const EV_LOSS=[[0.22,10,'charging','charge',0.20],[0.55,13,'motor + gears','motor',0.62]];
  const lossF=L=>P.narrow?L[4]:L[0];

  function layout(){
    const W=V.w,H=V.h; P.narrow=W<640;
    P.laneH=H*0.32; P.gasY=H*0.28; P.evY=H*0.63;   // both lanes clear the caption
    P.carS=Math.min(W*0.24,P.laneH*0.92);
    P.x0=W*0.06; P.pathX0=P.x0+P.carS*0.92; P.pathX1=W*(P.narrow?0.80:0.90);
    items=[
      {key:'tank',name:'Fuel tank',sub:'a tank of gasoline',fact:'About 13 gallons of gasoline, usually under the back seat. Gasoline holds a huge amount of energy for its weight — that is the one thing it is really good at.',
       hit:(x,y)=>inLane(y,0)&&x>P.x0+P.carS*0.1&&x<P.x0+P.carS*0.45, pos:()=>[P.x0+P.carS*0.28,laneMid(0)+P.carS*0.1,26],
       thumb:S=>{ ctx.fillStyle='#f6e2c0'; ctx.fillRect(0,0,S,S); box(S*0.2,S*0.3,S*0.6,S*0.44,8,FUEL,3); box(S*0.44,S*0.16,S*0.12,S*0.16,3,STEEL_DK,2.5); }},
      {key:'engine',name:'Gasoline engine',sub:'burns to spin',fact:'Burning fuel makes heat, and only some of that heat becomes spin. Most of it escapes out of the radiator and the tailpipe. That is why the hood of a car gets hot.',extra:'Of 100 blobs of fuel energy, only about 20 reach the wheels.',
       hit:(x,y)=>inLane(y,0)&&x>P.x0+P.carS*0.6&&x<P.x0+P.carS*1.0, pos:()=>[P.x0+P.carS*0.8,laneMid(0),26]},
      {key:'exhaust',name:'Tailpipe',sub:'what comes out',fact:'Hot gases, water vapour and carbon dioxide. An electric car has no tailpipe at all — though the electricity that charged it had to be made somewhere.',
       hit:(x,y)=>inLane(y,0)&&x<P.x0+P.carS*0.12, pos:()=>[P.x0,laneMid(0)+P.carS*0.12,24]},
      {key:'radiator',name:'Radiator',sub:'the heat dumper',fact:'A little cooler at the front of the car with fins and a fan. Water runs around the hot engine, carries the heat here, and the wind blows it away.',
       hit:(x,y)=>inLane(y,0)&&x>P.x0+P.carS*1.0&&x<P.pathX0+30, pos:()=>[P.x0+P.carS*1.02,laneMid(0),24]},
      {key:'battery',name:'Battery pack',sub:'a floor full of cells',fact:'Thousands of cells like big flashlight batteries, spread across the floor of the car. A full pack usually carries a car 250 to 300 miles.',extra:'It is heavy — often 1,000 pounds — which is why electric cars feel so planted.',
       hit:(x,y)=>inLane(y,1)&&x>P.x0+P.carS*0.1&&x<P.x0+P.carS*0.8, pos:()=>[P.x0+P.carS*0.45,laneMid(1)+P.carS*0.13,26],
       thumb:S=>{ ctx.fillStyle='#d8f6e8'; ctx.fillRect(0,0,S,S); box(S*0.1,S*0.34,S*0.8,S*0.34,7,VOLT,3); for(let i=0;i<4;i++) line(S*(0.22+i*0.19),S*0.36,S*(0.22+i*0.19),S*0.66,VOLT_DK,3); }},
      {key:'motor',name:'Electric motor',sub:'magnets and coils',fact:'No fire, no bangs — just magnets pushing and pulling. It has one moving part instead of hundreds, and it makes its full twisting force the instant you press the pedal.',extra:'That is why an electric car needs only one gear.',
       hit:(x,y)=>inLane(y,1)&&x>P.x0+P.carS*0.8&&x<P.pathX0+30, pos:()=>[P.x0+P.carS*0.9,laneMid(1),26]},
      {key:'regen',name:'Regenerative braking',sub:'brakes that refill',fact:'Slowing down, the motor runs backwards as a generator: the wheels turn it, and it pushes electricity back into the battery. A gas car just turns that energy into hot brakes.',extra:'In stop-and-go city driving this can hand back around a fifth of the energy.',
       hit:(x,y)=>inLane(y,1)&&x>P.pathX1-40, pos:()=>[P.pathX1,laneMid(1),26]},
      {key:'plug',name:'Charging',sub:'plug vs pump',fact:'A gas pump fills a tank in about five minutes. A fast charger takes a car from nearly empty to 80% in roughly half an hour — but most charging happens overnight at home, while everyone is asleep.',
       hit:(x,y)=>fillT>=0&&y>V.h*0.4&&y<V.h*0.6, pos:()=>[V.w*0.5,V.h*0.5,30]},
      {key:'same',name:'What is the same',sub:'most of the car!',fact:'Wheels, tires, brakes, steering, seats, seat belts, lights — nearly everything you have met so far is identical. Only the part that MAKES the spin is different.',
       hit:(x,y)=>x>P.pathX1-10&&y>V.h*0.4&&y<V.h*0.62, pos:()=>[P.pathX1+10,V.h*0.5,26]},
    ];
  }
  function laneMid(l){ return (l?P.evY:P.gasY)+P.laneH*0.52; }
  function inLane(y,l){ const t=l?P.evY:P.gasY; return y>t&&y<t+P.laneH; }
  function pathAt(l,f){ return [lerp(P.pathX0,P.pathX1,f), laneMid(l)+Math.sin(f*9+(l?1:0))*P.laneH*0.03]; }

  function send(){
    bits=[]; heatPuffs=[]; arrivedG=0; arrivedE=0; running=1;
    const build=(lane,losses,col)=>{
      let left=100; const out=[];
      losses.forEach(L=>{ for(let i=0;i<L[1];i++) out.push(lossF(L)); left-=L[1]; });
      for(let i=0;i<left;i++) out.push(1);
      out.sort(()=>rnd()-0.5);
      out.forEach((fate,i)=>bits.push({lane,f:-i*0.012,fate,col,gone:false}));
    };
    build(0,GAS_LOSS,FUEL); build(1,EV_LOSS,VOLT);
  }
  function update(dt){
    if(running) {
      let alive=0;
      bits.forEach(b=>{
        if(b.gone) return;
        b.f+=dt*0.34;
        if(b.f>=b.fate){
          if(b.fate>=1){ b.gone=true; if(b.lane) arrivedE++; else arrivedG++; }
          else { b.gone=true; const p=pathAt(b.lane,b.fate); heatPuffs.push({x:p[0],y:p[1],t:0,lane:b.lane}); }
        } else alive++;
      });
      if(alive===0) running=0;
      setStat(stat());
    }
    heatPuffs.forEach(h=>{ h.t+=dt; }); heatPuffs=heatPuffs.filter(h=>h.t<1.4);
    if(braking>0){
      braking-=dt;
      if(rnd()<dt*30) regen.push({f:1,t:0});
    }
    regen.forEach(r=>{ r.f-=dt*0.5; }); regen=regen.filter(r=>r.f>0.02);
    if(fillT>=0){ fillT+=dt; if(fillT>9) fillT=-1; }
  }

  function lane(l){
    const top=l?P.evY:P.gasY, mid=laneMid(l);
    box(P.x0-P.carS*0.12,top,V.w-P.x0-P.carS*0.02,P.laneH,20,l?'#e3f9ef':'#fdf0dc',3.5);
    label(l?'⚡ ELECTRIC':'⛽ GASOLINE',P.x0-P.carS*0.06,top+(P.narrow?13:17),{size:P.narrow?13:17,dark:true,display:true,align:'left'});
    // the car, cut open
    const F={x0:P.x0,gy:mid+P.carS*0.2,s:P.carS};
    drawCar(F,{color:l?'#3f9d6a':CAR_RED});
    if(l){
      const b=carPt(F,0.30,0.135); box(b[0],b[1]-P.carS*0.03,P.carS*0.44,P.carS*0.06,4,VOLT,2.5);
      const m=carPt(F,0.86,0.20); disc(m[0],m[1],P.carS*0.055,VOLT,2.5); label('M',m[0],m[1],{size:P.narrow?10:13,dark:true});
      const pl=carPt(F,0.06,0.28); box(pl[0]-P.carS*0.03,pl[1]-P.carS*0.03,P.carS*0.06,P.carS*0.06,3,STEEL,2);
    }else{
      const t=carPt(F,0.24,0.17); box(t[0],t[1]-P.carS*0.05,P.carS*0.2,P.carS*0.1,5,FUEL,2.5);
      const e=carPt(F,0.84,0.21); box(e[0]-P.carS*0.06,e[1]-P.carS*0.055,P.carS*0.12,P.carS*0.11,4,'#b9c3d6',2.5);
      const pipe=carPt(F,0.02,0.13);
      box(pipe[0]-P.carS*0.06,pipe[1]-P.carS*0.018,P.carS*0.08,P.carS*0.036,4,STEEL_DK,2);
      if(running||heatPuffs.length){ for(let i=0;i<3;i++){ const k=((now*0.6+i*0.33)%1); ctx.save(); ctx.globalAlpha=0.5*(1-k);
        disc(pipe[0]-P.carS*0.08-k*P.carS*0.3,pipe[1]-k*P.carS*0.2,P.carS*0.03+k*P.carS*0.05,SMOKE,0); ctx.restore(); } }
    }
    // the energy river
    const y=mid;
    ctx.save(); ctx.setLineDash([9,8]); ctx.lineDashOffset=-now*22;
    path([[P.pathX0,y],[P.pathX1,y]],l?'rgba(61,220,151,.55)':'rgba(201,139,58,.55)',Math.max(6,P.laneH*0.08));
    ctx.restore();
    // where the losses happen
    (l?EV_LOSS:GAS_LOSS).forEach(([f,n])=>{ const p=pathAt(l,f);
      label('−'+n,p[0],y-P.laneH*0.20,{size:P.narrow?12:15,dark:true,color:BRAKE_R});
      label(l?(f<0.3?'charging':'motor + gears'):(f<0.35?'idling':f<0.55?'engine heat':'gears + friction'),p[0],y-P.laneH*0.31,{size:P.narrow?9:11,dark:true});
    });
    // the bucket at the end
    const got=l?arrivedE:arrivedG;
    const bw2=Math.min(V.w*0.13,P.carS*0.62), bcx=P.pathX1-4+bw2/2;
    box(P.pathX1-4,y-P.laneH*0.19,bw2,P.laneH*0.38,12,WHITE,3);
    label('🛞 '+got,bcx,y-P.laneH*0.03,{size:P.narrow?15:20,dark:true,display:true});
    label('of 100',bcx,y+P.laneH*0.11,{size:P.narrow?9:11,dark:true});
  }

  function draw(){
    ctx.fillStyle='#eef1f8'; ctx.fillRect(0,0,V.w,V.h);
    lane(0); lane(1);
    // the blobs
    bits.forEach(b=>{ if(b.gone||b.f<0) return; const p=pathAt(b.lane,clamp(b.f,0,1));
      disc(p[0],p[1]+((b.f*97)%7-3),Math.max(3,P.laneH*0.028),b.col,1.5); });
    heatPuffs.forEach(h=>{ ctx.save(); ctx.globalAlpha=clamp(1-h.t/1.4,0,1);
      disc(h.x,h.y-h.t*P.laneH*0.28,Math.max(3,P.laneH*0.03)+h.t*8,h.lane?'#bfd8cf':'#ffb26b',0); ctx.restore(); });
    // regen dots running backwards into the battery
    regen.forEach(r=>{ const p=pathAt(1,r.f); disc(p[0],p[1],Math.max(3,P.laneH*0.026),VOLT_DK,1.5); });
    if(braking>0){ label('⚡ the wheels are charging the battery!',(P.pathX0+P.pathX1)/2,laneMid(1)+P.laneH*0.26,{size:P.narrow?12:15,dark:true});
      label('🔥 the brakes just make heat',(P.pathX0+P.pathX1)/2,laneMid(0)+P.laneH*0.26,{size:P.narrow?12:15,dark:true}); }
    // the fill-up race
    if(fillT>=0){
      const w=Math.min(V.w*0.62,420), x=V.w/2-w/2, y=V.h*0.40, h=V.h*0.2;
      box(x,y,w,h,18,WHITE,4);
      label('⛽ pump: 5 minutes',x+16,y+h*0.30,{size:P.narrow?12:15,dark:true,align:'left'});
      label('🔌 fast charger: about 30 minutes to 80%',x+16,y+h*0.70,{size:P.narrow?12:15,dark:true,align:'left'});
      const f1=clamp(fillT/1.4,0,1), f2=clamp(fillT/8.4,0,1);
      box(x+w*0.52,y+h*0.20,w*0.42,h*0.2,8,'#e2e7f0',2); box(x+w*0.52,y+h*0.20,w*0.42*f1,h*0.2,8,FUEL,0);
      box(x+w*0.52,y+h*0.60,w*0.42,h*0.2,8,'#e2e7f0',2); box(x+w*0.52,y+h*0.60,w*0.42*f2,h*0.2,8,VOLT,0);
      label('most charging happens at home, overnight',x+w/2,y+h+16,{size:P.narrow?10:12,dark:true});
    }
  }
  function hit(x,y){ for(const it of items) if(it.hit(x,y)) return it; return null; }
  function stat(){ return '<span>⛽ '+arrivedG+' of 100</span><span>⚡ '+arrivedE+' of 100</span>'; }
  $('btnRace').addEventListener('click',send);
  $('btnSlow').addEventListener('click',()=>{ braking=2.6; });
  $('btnFill').addEventListener('click',()=>{ fillT=fillT<0?0:-1; });

  function quest(){
    return {id:'power',title:'⚡ Two ways to spin a wheel',questPos:'tr',steps:[
      {prompt:'Press <b>Send 100 energy</b> and watch. Out of 100 blobs of gasoline energy, how many reach the wheels?',
       onShow(){ send(); },
       options:[{text:'About 20',ok:true,say:'Yes — the other 80 leave as heat. Engines are hot for a reason.'},
                {text:'About 50',say:'Watch the bucket at the end of the gasoline lane.'},
                {text:'About 90',say:'That is closer to the electric lane. Look at the gas one!'}]},
      {prompt:'<b>Tap the part</b> an electric car does not have at all.',
       tap:it=>it&&(it.key==='exhaust'||it.key==='engine'||it.key==='radiator')?true:false,
       yes:'Right — no engine, no tailpipe, and no fire anywhere in the car.', no:'Look along the gasoline car: something there has no partner in the electric one.'},
      {prompt:'An electric car gets by with <b>one gear</b>. Why?',
       options:[{text:'The motor pulls hard at any speed',ok:true,say:'Exactly — no need to trade speed for muscle.'},
                {text:'Electric cars are slower',say:'They are often quicker off the line, actually!'},
                {text:'Gears do not work on electricity',say:'Gears work fine — the motor just does not need them.'}]},
      {prompt:'When an electric car slows down, where does the energy go?',
       onShow(){ braking=3.2; },
       options:[{text:'Back into the battery',ok:true,say:'The motor runs backwards as a generator. Free miles!'},
                {text:'Out of the tailpipe',say:'There is no tailpipe on this one.'},
                {text:'It just disappears',say:'Energy never disappears — watch the green dots run backwards.'}]},
      {prompt:'Last one. Which parts are the <b>same</b> in both cars?',
       options:[{text:'Wheels, brakes and steering',ok:true,say:'Almost the whole car is the same. Badge earned — that is all six!'},
                {text:'The engine',say:'Only one of them has an engine.'},
                {text:'The fuel tank',say:'The electric one carries a battery instead.'}]},
    ]};
  }
  return {layout,update,draw,hit,stat,quest,
    enter(){ setStat(stat()); if(!bits.length) send(); }, leave(){}};
})();

/* =====================================================================
   NAVIGATION: chips, buttons, and the zoom-out-to-the-whole-car
   transition between chapters.
   ===================================================================== */
CHAPTERS.forEach((c,i)=>{
  const b=document.createElement('button'); b.className='lvl'; b.type='button'; b.textContent=c.icon; b.title=c.name; b.setAttribute('aria-label','Go to '+c.name);
  b.addEventListener('click',()=>goTo(i)); els.levels.appendChild(b); c.chip=b;
});
function updateChips(){ CHAPTERS.forEach((c,k)=>{ c.chip.classList.toggle('on',k===current); c.chip.classList.toggle('done',k<current); }); }
function updateButtons(){
  els.btnBack.disabled=(current===0);
  const last=(current===CHAPTERS.length-1);
  els.btnNext.textContent=last?'🔁 Start again':'NEXT PART ▶';
  els.btnNext.classList.toggle('home',last);
  const id=CHAPTERS[current].id, won=!!badges[id];
  els.btnQuest.textContent=won?'✅ Challenge done!':'🎯 Challenge!';
  els.btnQuest.classList.toggle('won',won);
  CHAPTERS.forEach(c=>{ const g=$('ctl-'+c.id); if(g) g.hidden=(c.id!==id); });
}
let trans=null;   // {from,to,t0,dur}
function goTo(i){
  i=clamp(i,0,CHAPTERS.length-1); if(i===current&&!trans) return;
  if(trans) return;
  closeCard(); endQuest(); els.hint.hidden=true;
  const from=current;
  if(REDUCED){ switchTo(i); return; }
  trans={from,to:i,t0:performance.now(),dur:1250};
  SCENES[CHAPTERS[i].id].enter();
}
function switchTo(i){
  SCENES[CHAPTERS[current].id].leave(); current=i; SCENES[CHAPTERS[i].id].enter();
  setCaption(i); updateChips(); updateButtons(); drawMinimap(); setStat(SCENES[CHAPTERS[i].id].stat&&SCENES[CHAPTERS[i].id].stat());
  els.hint.textContent=CHAPTERS[i].hint; els.hint.hidden=false;   /* every part says what to tap */
}
els.btnNext.addEventListener('click',()=>goTo(current===CHAPTERS.length-1?0:current+1));
els.btnBack.addEventListener('click',()=>goTo(current-1));

/* ---------- taps ---------- */
let pDown=null;
view.addEventListener('pointerdown',e=>{ pDown={x:e.clientX,y:e.clientY}; });
view.addEventListener('pointerup',e=>{
  if(!pDown) return; const moved=Math.hypot(e.clientX-pDown.x,e.clientY-pDown.y); pDown=null;
  if(moved>12||trans) return;
  const r=view.getBoundingClientRect(), x=e.clientX-r.left, y=e.clientY-r.top;
  const scene=SCENES[CHAPTERS[current].id];
  const item=scene.hit?scene.hit(x,y):null;
  if(quest.active&&quest.active.steps[quest.step].tap){ if(questTap(item)) return; }
  if(item){ if(scene.onTap&&scene.onTap(item)===false) return; showCard(item); } else closeCard();
});
window.addEventListener('keydown',e=>{
  const tag=e.target.tagName; if(tag==='INPUT') return;
  if((e.key===' '||e.key==='Enter')&&tag==='BUTTON') return;
  if(e.key==='ArrowRight'){ e.preventDefault(); els.btnNext.click(); }
  else if(e.key==='ArrowLeft'){ e.preventDefault(); els.btnBack.click(); }
  else if(e.key==='Escape'){ closeCard(); endQuest(); }
  else if(e.key>='1'&&e.key<='6') goTo(+e.key-1);
});

/* ---------- sizing + the frame loop ---------- */
// on phones the Challenge button moves down next to the chapter controls
function placeQuestBtn(){ if(narrowMQ.matches) $('ctl').prepend(els.btnQuest); else els.btnNext.after(els.btnQuest); updateButtons(); }
narrowMQ.addEventListener('change',placeQuestBtn); placeQuestBtn();
function resize(){
  const r=stage.getBoundingClientRect();
  V.w=Math.max(320,Math.round(r.width)); V.h=Math.max(240,Math.round(r.height));
  V.dpr=Math.min(2,window.devicePixelRatio||1);
  view.width=Math.round(V.w*V.dpr); view.height=Math.round(V.h*V.dpr);
  Object.values(SCENES).forEach(s=>s.layout&&s.layout());
}
function drawMapOverlay(a,r){      // the whole car, everywhere except inside a circle
  ctx.save(); ctx.beginPath(); ctx.rect(0,0,V.w,V.h); ctx.arc(a[0],a[1],Math.max(0,r),0,TAU,true); ctx.clip();
  ctx.fillStyle='#cdeeff'; ctx.fillRect(0,0,V.w,V.h);
  const F=mapFrame();
  ctx.fillStyle=ROAD; ctx.fillRect(0,F.gy,V.w,V.h-F.gy);
  ctx.fillStyle='#f6e7b0'; for(let x=-40;x<V.w;x+=90) ctx.fillRect(x,F.gy+(V.h-F.gy)*0.45,52,5);
  drawCar(F,{});
  ctx.restore();
}
let lastT=performance.now();
function frame(nowMs){
  const dt=Math.min(0.05,(nowMs-lastT)/1000); lastT=nowMs; now=nowMs/1000;
  ctx.setTransform(V.dpr,0,0,V.dpr,0,0);
  const cur=SCENES[CHAPTERS[current].id];
  if(trans){
    const k=clamp((nowMs-trans.t0)/trans.dur,0,1);
    const F=mapFrame(), a0=anchorPx(CHAPTERS[trans.from].id,F), a1=anchorPx(CHAPTERS[trans.to].id,F);
    const R=Math.hypot(V.w,V.h)*0.75;
    if(k<0.38){ cur.update(dt); cur.draw(); const u=1-easeOut(k/0.38); drawMapOverlay(a0,R*u*u); }
    else if(k<0.62){ drawMapOverlay([0,0],0); const u=smooth((k-0.38)/0.24); const a=[lerp(a0[0],a1[0],u),lerp(a0[1],a1[1],u)]; ring(a[0],a[1],14+4*Math.sin(now*12),GOLD,4); ring(a[0],a[1],14+4*Math.sin(now*12),INK,1.5); }
    else{ if(current!==trans.to) switchTo(trans.to); const nxt=SCENES[CHAPTERS[trans.to].id]; nxt.update(dt); nxt.draw(); const u=easeInOut((k-0.62)/0.38); drawMapOverlay(a1,R*u); }
    if(k>=1) trans=null;
  }else{ cur.update(dt); cur.draw(); }
  if(selected&&selected.pos){ const p=selected.pos(); if(p){ ctx.save(); ctx.setLineDash([8,6]); ctx.lineDashOffset=-now*30; ring(p[0],p[1],p[2]||30,GOLD,4); ctx.restore(); } }
  drawConfetti(dt);
  requestAnimationFrame(frame);
}
if(document.fonts&&document.fonts.load){ document.fonts.load('800 13px Nunito'); document.fonts.load('700 20px Fredoka'); }
window.howACarWorks={SCENES,CHAPTERS,goTo,award,startQuest,quest,badges};   // handy for testing and tinkering
new ResizeObserver(resize).observe(stage);
resize();
SCENES[CHAPTERS[0].id].enter();
setCaption(0); updateChips(); updateButtons(); drawMinimap(); setStat(SCENES.engine.stat&&SCENES.engine.stat());
requestAnimationFrame(frame);
</script>
</body>
