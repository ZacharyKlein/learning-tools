    notes:['A hip roof — sloped on all four sides, so the wind has no flat wall to shove','Up on posts, so a storm surge runs underneath the house instead of through it','Short eaves: wind gets under a big overhang and peels the roof off'],
    P:{stories:1,roof:'hip',pitch:.45,siding:'clapboard',color:'#eef2e6',trim:'#3a6b8a',windows:'sixover',eave:.03,porch:'stoop',stilts:true,depth:1},
    checks:[['A hip roof, sloped on all four sides', d=> d.roof==='hip'],
            ['Lifted up on posts, above the flood', d=> d.stilts],
            ['Short overhangs the wind cannot grab', d=> d.eave==='narrow']] },
  bayou:{ name:'New Orleans', emo:'🌴', sky:'#d8f0e8', ground:'#cfe6b6',
    weather:'Hot and soaking wet nine months a year, and no air conditioning until the 1950s.',
    made:'Cypress, which does not rot, on skinny city lots.',
    notes:['A deep shady porch — the coolest room in the house','Raised off the wet ground on brick piers','Tall ceilings and doors front and back, so the breeze blows straight through'],
    P:{stories:1,roof:'gableFront',pitch:.62,siding:'clapboard',color:'#f2d9a0',trim:'#2e6b6b',windows:'tall',eave:.05,porch:'deep',col:'turned',stilts:true,depth:.7,gableVent:true},
    checks:[['A deep porch for shade and breeze', d=> d.porch==='deep'||d.porch==='wrap'],
            ['Raised off the soggy ground', d=> d.stilts],
            ['A roof steep enough for hard rain', d=> d.roof!=='flat'&&d.pitch>=6]] },
  missouri:{ name:'Missouri', emo:'🌳', sky:'#cdeeff', ground:'#d7eec0',
    weather:'Ice in January, 95° and sticky in July, and thunderstorms in between.',
    made:'Oak and hickory forests, plus good clay for brick — so both.',
    notes:['A middling roof, around 6 in 12: steep enough for snow, cheap enough to build','Wide eaves to shade the windows from the high summer sun','Footings 30 inches down, below the frost line, and R-49 in the attic'],
    P:{stories:2,roof:'gable',pitch:.55,siding:'brick',color:'#c9a37e',trim:'#37507a',windows:'sixover',shutters:true,chimney:1,eave:.09,porch:'deep',col:'square',depth:1},
    checks:[['A middling pitch, 4 to 10 in 12', d=> d.roof!=='flat'&&d.pitch>=4&&d.pitch<=10],
            ['Wide eaves for the summer sun', d=> d.eave==='wide'],
            ['Sitting on a real foundation, not posts', d=> !d.stilts]] },
};
const G6 = { mode:'climate', place:'missouri', seen:new Set(['missouri']),
  d:{ roof:'gable', pitch:6, eave:'wide', porch:'deep', siding:'clapboard', stilts:false, stories:1 } };
function g6score(){ let n=0; PLACES[G6.place].checks.forEach(c=>{ if(c[1](G6.d)) n++; }); return n; }
function g6match(){
  let best=null,bs=-1;
  STYLES.forEach(s=>{
    const P=s.P; let sc=0;
    const rf = P.roof==='gableFront'?'gable':(P.roof==='cross'?'gable':P.roof);
    if(rf===G6.d.roof) sc+=5;
    const pp=Math.round((P.pitch||.5)*12);
    sc += Math.max(0, 2.5-Math.abs(pp-G6.d.pitch)/2.5);
    if((P.porch||'none')===G6.d.porch) sc+=2;
    const sd = P.siding==='halftimber'?'stucco':P.siding;
    if(sd===G6.d.siding) sc+=2;
    if(((P.eave||0)>=.08?'wide':'narrow')===G6.d.eave) sc+=1.5;
    if((P.stories||1)>=2 === (G6.d.stories>=2)) sc+=1.5;
    if(sc>bs){bs=sc;best=s;}
  });
  return best;
}
function g6params(){
  const d=G6.d;
  return { stories:d.stories, roof:d.roof, pitch:d.pitch/12, siding:d.siding,
    color: d.siding==='brick'?'#c9a37e':(d.siding==='stucco'?'#efe6d2':'#f2e8d2'),
    trim:'#37507a', windows: d.stories>=2?'sixover':'picture', shutters:d.stories>=2,
    chimney:1, porch:d.porch, col: d.porch==='wrap'?'turned':'square',
    eave: d.eave==='wide'?.12:.02, stilts:d.stilts, depth:1 };
}
function rebuildControls(){ ctlEl.innerHTML=''; CH[cur].controls(); }
CH.push({
  id:'world', emoji:'🌍', short:'Why so different?', title:'Why houses look different',
  blurb:'A house is an argument with the weather, made out of whatever is lying around nearby.',
  win:'Architect! You can look at a house and read the climate it was built for.',
  init(){},
  controls(){
    const m=ctlGroup('Mode');
    segmented(m,[{label:'🌎 Places',v:'climate'},{label:'✏️ Design your own',v:'design'}],G6.mode,
      v=>{ G6.mode=v; setTimeout(rebuildControls,0); });
    if(G6.mode==='climate'){
      const a=ctlGroup('Where');
      segmented(a,[{label:'🌳 Missouri',v:'missouri'},{label:'🏔️ Mountains',v:'rockies'},{label:'🌵 Desert',v:'desert'},
                   {label:'🌀 Gulf Coast',v:'gulf'},{label:'🌴 New Orleans',v:'bayou'}],G6.place,
        v=>{ G6.place=v; G6.seen.add(v); });
    } else {
      const a=ctlGroup('Judge it for');
      segmented(a,[{label:'🌳 Missouri',v:'missouri'},{label:'🏔️ Mountains',v:'rockies'},{label:'🌵 Desert',v:'desert'},
                   {label:'🌀 Gulf Coast',v:'gulf'},{label:'🌴 New Orleans',v:'bayou'}],G6.place,v=>G6.place=v);
      const b=ctlGroup('Roof');
      segmented(b,[{label:'Gable',v:'gable'},{label:'Hip',v:'hip'},{label:'Flat',v:'flat'},{label:'A-frame',v:'aframe'}],G6.d.roof,v=>G6.d.roof=v);
      const c=ctlGroup('Pitch'); slider(c,2,14,1,G6.d.pitch,v=>G6.d.pitch=v,v=>v+' in 12');
      const d=ctlGroup('Eaves');
      segmented(d,[{label:'Narrow',v:'narrow'},{label:'Wide',v:'wide'}],G6.d.eave,v=>G6.d.eave=v);
      const e=ctlGroup('Porch');
      segmented(e,[{label:'None',v:'none'},{label:'Stoop',v:'stoop'},{label:'Deep',v:'deep'},{label:'Wrap',v:'wrap'}],G6.d.porch,v=>G6.d.porch=v);
      const f=ctlGroup('Walls');
      segmented(f,[{label:'Clapboard',v:'clapboard'},{label:'Shingle',v:'shingle'},{label:'Brick',v:'brick'},{label:'Stucco',v:'stucco'}],G6.d.siding,v=>G6.d.siding=v);
      const h=ctlGroup('Floors');
      segmented(h,[{label:'One',v:1},{label:'Two',v:2}],G6.d.stories,v=>G6.d.stories=+v);
      const i=ctlGroup('');
      pill(i, G6.d.stilts?'🦵 On posts':'🧱 On the ground', b2=>{ G6.d.stilts=!G6.d.stilts;
        b2.textContent=G6.d.stilts?'🦵 On posts':'🧱 On the ground'; });
    }
  },
  draw(t){
    const pl=PLACES[G6.place];
    g.fillStyle=pl.sky; g.fillRect(0,0,W,H);
    const gy=H*0.80;
    g.fillStyle=pl.ground; g.fillRect(0,gy,W,H-gy);
    line(0,gy,W,gy,'rgba(43,35,80,.35)',3);
    // scenery
    if(G6.place==='rockies'){ poly([[0,gy],[W*0.22,gy-H*0.42],[W*0.44,gy]],'#e7eef5','#b9c6d4',2);
      poly([[W*0.56,gy],[W*0.8,gy-H*0.5],[W*1.04,gy]],'#dfe8f1','#b9c6d4',2);
      for(let i=0;i<50;i++) circ((i*151+t*9)%W,((i*83)+t*45)%gy,2,'#fff','rgba(43,35,80,.15)',1); }
    if(G6.place==='desert'){ emo('🌵',W*0.1,gy-24,34); emo('🌵',W*0.9,gy-18,26); emo('☀️',W*0.85,H*0.14,PHONE?30:42); }
    if(G6.place==='bayou'){ emo('🌴',W*0.08,gy-28,36); emo('🌴',W*0.93,gy-24,30); }
    if(G6.place==='gulf'){ for(let i=0;i<6;i++){ const yy=40+i*(gy-70)/6, ph=((t*0.5)+i/6)%1;
      arrow(-40+ph*(W+80),yy,60+ph*(W+80),yy-5,'rgba(79,179,246,.6)',3,9);}
      g.fillStyle='rgba(79,179,246,.35)'; g.fillRect(0,gy+8,W,H-gy-8); }
    if(G6.place==='missouri'){ emo('🌳',W*0.07,gy-26,34); emo('🌳',W*0.94,gy-22,28); }

    const P = G6.mode==='climate' ? pl.P : g6params();
    const hw=Math.min(W*(PHONE?0.52:0.34), 300)*((G6.mode==='climate'&&pl.P.wide)||1), hx=W*0.5-hw/2;
    let hy=gy;
    if(P.stilts){ hy=gy-hw*0.20;
      for(const f of [0.08,0.34,0.66,0.92]) box(hx+hw*f-6, hy, 12, gy-hy+5, '#b08050', INK, 2.5);
      poly([[hx-6,hy],[hx+hw+6,hy],[hx+hw+2,hy+8],[hx-2,hy+8]],'#c9a877',INK,2.5);
    }
    drawStyleHouse(hx,hy,hw,P);

    if(G6.mode==='climate'){
      const LX=PHONE?8:W*0.04, LW=W-2*LX, FS=PHONE?11.5:14.5, LH=PHONE?15:19;
      dtxt(pl.emo+'  '+pl.name, W/2, PHONE?22:28, PHONE?19:27, INK);
      let yy = PHONE?44:56;
      yy += wrapT(pl.weather, LX, yy, LW, FS, '#4a4270','left',LH) + 5;
      pl.notes.forEach(n=>{ yy += wrapT('• '+n, LX, yy, LW, FS, INK,'left',LH) + 3; });
      setHud(null);
      setCaption('<b>Built from '+pl.made.charAt(0).toLowerCase()+pl.made.slice(1)+'</b> Same job, different answer &mdash; the weather and whatever grows nearby decide what a house looks like.');
    } else {
      const m=g6match(), sc=g6score();
      dtxt('You designed: '+m.name+'-ish', W/2, PHONE?22:26, PHONE?16:23, INK);
      otxt('closest match · '+m.years, W/2, PHONE?42:50, PHONE?11:14, '#6b5b8a','center',4);
      const bx=PHONE?8:W*0.04, LW=W-2*bx, FS=PHONE?11.5:14.5, LH=PHONE?15:19;
      let yy = PHONE?64:76;
      otxt('How it would do in '+pl.name+':', bx, yy, PHONE?12:15, INK,'left',4); yy+=LH+2;
      pl.checks.forEach(c=>{ const ok=c[1](G6.d);
        yy += wrapT((ok?'✔ ':'✘ ')+c[0], bx, yy, LW, FS, ok?'#1c6b3a':BAD,'left',LH) + 3; });
      const grade = sc===3?'A perfect fit.':sc===2?'It would survive.':sc===1?'It would struggle.':'It would not last a year.';
      setHud(null);
      otxt('Score for '+pl.name+': '+sc+' of 3', W-12, H-capH()-14, PHONE?12:14.5, sc===3?'#1c6b3a':INK,'right',4);
      setCaption('<b>'+grade+'</b> Every knob you turned is a real decision a real architect makes — and the answer changes with the weather outside.');
    }
    hit('house',hx,hy-hw*1.1,hw,hw*1.1);
  },
  tap(x,y,h){
    if(h&&h.id==='house'){
      showCard('A house from a catalog',
        'Between 1908 and 1942 you could order a whole house from the Sears catalog for $360 to $2,890. It came on a train in boxcars: about 25 tons and more than 30,000 pieces, every board stamped with a number to match the blueprints. Sears sold more than 70,000 of them, and thousands are still lived in today.', x, y);
    }
  },
  quest:[
    {type:'do', q:'Visit at least three places and see what the weather does to a house.',
     watch:()=> G6.seen.size>=3, why:'Steep for snow, flat for desert, hipped and on posts for hurricanes. The weather draws the house.'},
    {type:'choice', q:'Why is a desert roof nearly flat, and a mountain roof steep?',
     opts:[{t:'A roof is shaped by what falls on it',ok:true,why:'Exactly. Snow has to slide off or it crushes you; in a desert almost nothing falls, so flat is cheaper and easier.'},
           {t:'Deserts are hotter, and heat flattens things',ok:false,why:'Heat does not squash roofs. Think about what lands on top of them.'},
           {t:'Mountain builders like triangles',ok:false,why:'They do use triangles — but the reason is what is sitting on the roof every January.'}]},
    {type:'do', q:'Switch to "Design your own", pick the Gulf Coast, and design a house that scores 3 out of 3.',
     watch:()=> G6.mode==='design' && G6.place==='gulf' && g6score()===3,
     why:'Hip roof, short eaves, up on posts. That is a real coastal house, and it is that shape for three separate reasons.'},
    {type:'choice', q:'In 1910 you really could order a whole house from a catalog. How did it show up?',
     opts:[{t:'On a train, in 30,000 numbered pieces',ok:true,why:'Sears shipped about 25 tons in boxcars, every board stamped to match the blueprints. Over 70,000 families built one.'},
           {t:'Already built, on a very big truck',ok:false,why:'There were no trucks that big in 1910 — and no roads for them. Tap the house for the real story.'},
           {t:'It was a joke advertisement',ok:false,why:'It was completely real. Tap the house to read about it.'}]},
  ],
});

/* =====================================================================
   BADGES THAT SURVIVE A CLOSED TAB
   A nine-year-old gets called to dinner mid-challenge. Losing every badge to
   a reload is the quickest way to make the whole reward loop feel pointless.
   The ↺ in the badge meter clears them so a second child can start fresh —
   two taps, so it cannot happen by accident.
   ===================================================================== */
const SAVE_KEY='learningTools.buildAHouse.badges';
function saveBadges(){ try{ localStorage.setItem(SAVE_KEY,JSON.stringify([...badgesWon])); }catch(e){} }
function restoreBadges(){
  let saved=[];
  try{ saved=JSON.parse(localStorage.getItem(SAVE_KEY)||'[]'); }catch(e){ saved=[]; }
  if(!Array.isArray(saved)) saved=[];
  const ids=new Set(CH.map(c=>c.id));
  saved.forEach(id=>{ if(ids.has(id)) badgesWon.add(id); });
  updateWipe();
}
function clearBadges(){
  badgesWon.clear();
  try{ localStorage.removeItem(SAVE_KEY); }catch(e){}
  renderBadges(); updateWipe();
  qDone=false; qStep=0; renderQuest();
}
let wipeArmed=false, wipeTimer=null;
function updateWipe(){
  const b=el('btnWipe'); if(!b) return;
  b.hidden = badgesWon.size===0;
  if(!badgesWon.size){ wipeArmed=false; b.textContent='↺'; b.classList.remove('armed'); }
}
el('btnWipe').addEventListener('click',()=>{
  const b=el('btnWipe');
  if(!wipeArmed){
    wipeArmed=true; b.textContent='Clear?'; b.classList.add('armed');
    clearTimeout(wipeTimer);
    wipeTimer=setTimeout(()=>{ wipeArmed=false; b.textContent='↺'; b.classList.remove('armed'); },3500);
    return;
  }
  clearTimeout(wipeTimer); wipeArmed=false; b.textContent='↺'; b.classList.remove('armed');
  clearBadges();
});

/* =============================== boot ==================================== */
restoreBadges();
renderBadges();
renderRail();
fit();
goTo(0, true);
drawMinimap();
rafId = requestAnimationFrame(frame);
if(document.fonts && document.fonts.ready) document.fonts.ready.then(()=>{ fit(); drawMinimap(); });

/* a small door for tinkering and for tests */
window.buildAHouse = {
  chapters: CH, goTo, award, badges: badgesWon,
  saveBadges, restoreBadges, clearBadges, get chapter(){ return cur; },
  state: { ground:G1, bones:G2, roof:G3, build:G4, style:G5, world:G6 },
  quest: { get step(){ return qStep; }, get done(){ return qDone; } },
  answer(i){ const b=qOptsEl.children[i]; if(b) b.click(); },
  styles: STYLES,
  get hits(){ return HITS.slice(); },
  tapId(id){ const r=HITS.find(h=>h.id===id); if(!r) return false;
    const ch=CH[cur]; if(ch.tap) ch.tap(r.x+r.w/2, r.y+r.h/2, r); return true; },
  solve(){ // finish the current chapter's challenge (used by the test harness)
    const ch=CH[cur]; if(!ch.quest) return; qDone=true; renderQuest(); award(ch.id);
  }
};
</script>
