<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>City Explorer</title>
<meta name="description" content="How a city is put together: streets and blocks, neighborhoods, downtown, the pipes and wires under the road, who comes when you call 911, and parks — then build a city of your own. Grades 3-4.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🏙️%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;800&display=swap">
<style>
/* ---------- tokens: the Learning Tools sketchbook, plus a city's own colors ---------- */
:root{
  --ink:#2b2350;        /* indigo-plum, all text + outlines */
  --paper:#fff8e7;      /* butter cream ground */
  --paper-2:#ffefc2;    /* deeper butter for chrome */
  --rocket:#ff6b35;     /* the one loud thing */
  --rocket-dk:#c2431a;
  --sky:#4fb3f6;
  --grass:#63c64d;
  --gold:#ffd23f;
  --white:#fffdf7;
  --night:#1b1b46;
  --asphalt:#6f6b7d;    /* streets */
  --asphalt-dk:#4a4757;
  --brick:#b1553f;      /* St. Louis is a brick city */
  --brick-dk:#7d3527;
  --river:#4a93c9;
  --river-dk:#2d6a98;
  --zone-home:#ffd98a;  /* the four zoning colors, used in ch.3 and ch.7 alike */
  --zone-shop:#ff8f6b;
  --zone-work:#b39ddb;
  --zone-park:#8fd47a;
  --display:"Fredoka","Chalkboard SE","Comic Sans MS","Segoe UI Rounded",ui-rounded,system-ui,sans-serif;
  --body:"Nunito","Segoe UI Rounded",ui-rounded,"Segoe UI",system-ui,sans-serif;
  --emoji:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji","Twemoji Mozilla",sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--paper);color:var(--ink);font-family:var(--body);
  font-size:16px;line-height:1.3;-webkit-text-size-adjust:100%;overflow:hidden;
}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:4px solid var(--sky);outline-offset:3px}

.app{
  height:100vh;height:100dvh;
  display:grid;grid-template-rows:auto 1fr auto;gap:10px;
  padding:10px 14px 12px;max-width:1180px;margin:0 auto;
}

/* ---------- header ---------- */
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.brand h1{font-family:var(--display);font-weight:700;font-size:38px;line-height:1;margin:0;
  letter-spacing:.5px;color:var(--ink);text-shadow:3px 3px 0 var(--gold)}
.brand .tagline{margin:4px 0 0;font-weight:800;font-size:15px;opacity:.85}
.right{display:flex;align-items:center;gap:12px}
.meter{
  display:flex;align-items:center;gap:12px;
  background:var(--paper-2);border:3px solid var(--ink);border-radius:18px;
  padding:6px 14px;box-shadow:4px 4px 0 var(--ink);min-height:56px;transition:background .4s;
}
.meter.all{background:var(--gold)}
.meter-label{font-family:var(--display);font-weight:600;font-size:13px;letter-spacing:1.5px;text-transform:uppercase;line-height:1.1}
.badges{display:flex;gap:6px}
.badge{
  width:38px;height:38px;border-radius:50%;border:3px solid var(--ink);
  background:var(--white);display:grid;place-items:center;font-size:19px;font-family:var(--emoji);line-height:1;
  opacity:.28;filter:grayscale(1);transition:opacity .3s,filter .3s;
}
.badge.won{opacity:1;filter:none;background:var(--gold);animation:pop .5s cubic-bezier(.34,1.56,.64,1)}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}

/* ---------- stage ---------- */
.stage-wrap{min-height:0;display:flex}
.stage{
  position:relative;flex:1;min-height:160px;
  border:5px solid var(--ink);border-radius:26px;overflow:hidden;
  background:#cfe9ff;box-shadow:6px 6px 0 var(--ink);touch-action:none;
}
#view{position:absolute;inset:0;width:100%;height:100%;display:block}

.caption{
  position:absolute;left:14px;top:12px;max-width:min(58%,460px);
  background:var(--white);border:3px solid var(--ink);border-radius:18px;
  padding:8px 14px 10px;box-shadow:4px 4px 0 var(--ink);pointer-events:none;
}
.caption.bump{animation:bump .5s cubic-bezier(.34,1.56,.64,1)}
@keyframes bump{0%{transform:scale(.85)}100%{transform:scale(1)}}
.cap-level{font-family:var(--display);font-weight:700;font-size:24px;line-height:1.1}
.cap-text{font-weight:800;font-size:15.5px;margin-top:3px;text-wrap:balance}
.cap-text b{color:var(--rocket-dk)}

.hint{
  position:absolute;left:50%;transform:translateX(-50%);bottom:12px;
  background:rgba(255,253,247,.94);border:3px solid var(--ink);border-radius:999px;
  padding:6px 14px;font-weight:800;font-size:14px;pointer-events:none;box-shadow:3px 3px 0 var(--ink);
  max-width:calc(100% - 28px);text-align:center;
}
.stat{
  position:absolute;right:14px;bottom:58px;display:flex;gap:8px;pointer-events:none;
  flex-wrap:wrap;justify-content:flex-end;max-width:calc(100% - 28px);
}
.stat span{
  background:rgba(255,253,247,.94);border:3px solid var(--ink);border-radius:999px;
  padding:5px 12px;font-family:var(--display);font-weight:600;font-size:15px;box-shadow:3px 3px 0 var(--ink);
  font-variant-numeric:tabular-nums;white-space:nowrap;
}
.stat span.ok{background:#d6f5cd}
.stat span.bad{background:#ffe0d6}
.stat[hidden]{display:none}

.card{
  position:absolute;right:14px;top:12px;width:min(350px,calc(100% - 28px));
  display:flex;gap:12px;align-items:flex-start;
  background:var(--white);border:3px solid var(--ink);border-radius:20px;
  padding:12px;box-shadow:4px 4px 0 var(--ink);
  animation:bump .4s cubic-bezier(.34,1.56,.64,1);
}
.card[hidden]{display:none}
.card-thumb{width:84px;height:84px;flex:0 0 84px;border-radius:14px;border:3px solid var(--ink);background:#e8f4ff}
.card-body{min-width:0;flex:1}
.card-name{font-family:var(--display);font-weight:700;font-size:22px;line-height:1.05}
.card-sub{font-family:var(--display);font-weight:600;font-size:15px;color:var(--rocket-dk);margin-top:2px}
.card-fact{font-weight:800;font-size:15.5px;margin-top:6px}
.card-extra{font-weight:700;font-size:12.5px;margin-top:6px;opacity:.75}
.card-x{
  position:absolute;right:-12px;top:-12px;width:34px;height:34px;border-radius:50%;
  border:3px solid var(--ink);background:var(--gold);font-family:var(--display);font-weight:700;
  font-size:20px;line-height:1;box-shadow:2px 2px 0 var(--ink);
}

.toast{
  position:absolute;left:50%;bottom:104px;transform:translateX(-50%);
  background:var(--gold);border:3px solid var(--ink);border-radius:999px;
  padding:8px 18px;font-family:var(--display);font-weight:700;font-size:19px;
  box-shadow:4px 4px 0 var(--ink);pointer-events:none;max-width:min(620px,calc(100% - 28px));
  text-align:center;animation:bump .5s cubic-bezier(.34,1.56,.64,1);
}
.toast[hidden]{display:none}

/* ---------- the challenge panel ---------- */
.quest{
  position:absolute;left:14px;bottom:12px;width:min(420px,calc(100% - 28px));
  background:var(--white);border:3px solid var(--ink);border-radius:20px;
  padding:12px 14px;box-shadow:4px 4px 0 var(--ink);
  animation:bump .4s cubic-bezier(.34,1.56,.64,1);
}
.quest[hidden]{display:none}
.q-head{display:flex;align-items:center;gap:8px}
.q-title{font-family:var(--display);font-weight:700;font-size:17px;flex:1}
.dots{display:flex;gap:4px}
.dot{width:11px;height:11px;border-radius:50%;border:2px solid var(--ink);background:var(--white)}
.dot.done{background:var(--grass)}
.dot.now{background:var(--gold)}
.q-text{font-weight:800;font-size:16px;margin-top:6px;text-wrap:balance}
.q-opts{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px}
.q-opts[hidden]{display:none}
.opt{
  font-family:var(--display);font-weight:600;font-size:16px;border:3px solid var(--ink);border-radius:999px;
  background:var(--paper-2);padding:8px 14px;line-height:1.1;box-shadow:0 3px 0 var(--ink);text-align:left;
  transition:transform .08s,box-shadow .08s;
}
.opt:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.opt.yes{background:var(--grass);color:var(--white)}
.opt.no{animation:shake .4s}
.opt:disabled{cursor:default}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.q-fb{font-weight:800;font-size:14.5px;margin-top:8px;min-height:18px}
.q-fb.good{color:#2e7d32}
.q-fb.bad{color:var(--rocket-dk)}
.q-x{position:absolute;right:-12px;top:-12px;width:34px;height:34px;border-radius:50%;border:3px solid var(--ink);
  background:var(--gold);font-family:var(--display);font-weight:700;font-size:20px;line-height:1;box-shadow:2px 2px 0 var(--ink)}
/* In Build a City the map fills the stage, so the challenge takes the caption's
   corner instead of sitting on top of the grid — the instruction IS the caption
   while a challenge is running. */
body.building .quest{top:12px;bottom:auto}
body.building.questing .caption{display:none}
/* …and the caption shrinks to a slim instruction bar across the top, so the
   grid underneath is never half-hidden behind a paragraph of prose. */
body.building .caption{left:14px;right:14px;max-width:none;padding:6px 12px 7px}
body.building .cap-level{display:none}
body.building .cap-text{font-size:14px;margin-top:0}
/* the city-size comparison covers the map completely; the caption would land on
   its heading */
body.comparing .caption,body.comparing .stat{display:none}

/* ---------- dock ----------
   The rail gets a row of its own and scrolls inside it; the buttons and the
   chapter controls share the row below. Never size the rail's column to its
   content: an `auto` track sizes to max-content and shoves the other columns
   into each other. That is the bug tests/layout-check.mjs exists to catch. */
.dock{
  display:grid;grid-template-columns:auto minmax(0,1fr);
  grid-template-areas:"levels levels" "buttons ctl";
  align-items:center;gap:10px 14px;
}
.dock > .levels{grid-area:levels}
.dock > .buttons{grid-area:buttons}
.dock > .ctl{grid-area:ctl}
.levels{display:flex;align-items:center;gap:6px;min-width:0;overflow-x:auto;overflow-y:hidden;
  scrollbar-width:none;max-width:100%;padding:3px 2px}
.levels::-webkit-scrollbar{display:none}
.lvl{
  display:flex;align-items:center;gap:6px;flex:0 0 auto;min-height:44px;
  padding:5px 13px 5px 9px;border-radius:999px;border:3px solid var(--ink);
  background:var(--white);font-family:var(--display);font-weight:600;font-size:13px;
  line-height:1;white-space:nowrap;box-shadow:3px 3px 0 var(--ink);
  transition:transform .15s,background .15s;position:relative;
}
.lvl .ic{font-size:20px;font-family:var(--emoji);line-height:1}
.lvl:hover{transform:translateY(-2px)}
.lvl.on{background:var(--gold)}
.lvl.done{background:var(--paper-2)}
.lvl.won::after{content:"✓";position:absolute;right:-7px;top:-7px;width:18px;height:18px;border-radius:50%;
  background:var(--grass);color:var(--white);border:2px solid var(--ink);font:700 11px/14px var(--display)}

.buttons{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.btn{
  font-family:var(--display);font-weight:700;border:3px solid var(--ink);border-radius:999px;
  background:var(--white);padding:10px 16px;font-size:16px;line-height:1;
  box-shadow:0 5px 0 var(--ink);transition:transform .08s,box-shadow .08s,opacity .2s;white-space:nowrap;
}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn:disabled{opacity:.35;cursor:default;transform:none;box-shadow:0 5px 0 var(--ink)}
.btn.big{
  background:var(--rocket);color:var(--white);font-size:23px;padding:12px 22px;
  box-shadow:0 7px 0 var(--rocket-dk),0 7px 0 3px var(--ink);text-shadow:2px 2px 0 var(--rocket-dk);
}
.btn.big:active{transform:translateY(5px);box-shadow:0 2px 0 var(--rocket-dk),0 2px 0 3px var(--ink)}
.btn.big.home{background:var(--sky);text-shadow:2px 2px 0 #1f6fa8;box-shadow:0 7px 0 #1f6fa8,0 7px 0 3px var(--ink)}
.btn.big.home:active{box-shadow:0 2px 0 #1f6fa8,0 2px 0 3px var(--ink)}
.btn.quest-btn{background:var(--gold)}
.btn.quest-btn.won{background:var(--grass);color:var(--white)}
/* Every .btn is nowrap so the labels read cleanly, but that stops the wide one
   ("Back to the start") from ever shrinking. Let the big button wrap instead. */
.btn.big{white-space:normal;text-wrap:balance}
.buttons > .btn{min-width:0;max-width:100%}

.ctl{display:flex;justify-content:flex-end;min-width:0;gap:10px;flex-wrap:wrap}
.ctl-group{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end;min-width:0;max-width:100%}
.ctl-group[hidden]{display:none}
.ctl-label{font-family:var(--display);font-weight:600;font-size:13px;letter-spacing:1px;text-transform:uppercase;opacity:.75}
.tog{
  font-family:var(--display);font-weight:600;font-size:15px;border:3px solid var(--ink);border-radius:999px;
  background:var(--white);padding:8px 13px;line-height:1;box-shadow:0 4px 0 var(--ink);min-height:44px;
  transition:transform .08s,box-shadow .08s,background .15s;white-space:nowrap;
}
.tog:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.tog.on{background:var(--gold)}
.tog.hot{background:var(--rocket);color:var(--white);text-shadow:1px 1px 0 var(--rocket-dk)}
.tog.cool{background:var(--sky);color:var(--white);text-shadow:1px 1px 0 #1f6fa8}
.tog:disabled{opacity:.4;cursor:default;transform:none}

/* ---------- the build palette ----------
   Nine tools will not fit on a phone as a wrapping row without eating the map,
   so the palette borrows the chapter rail's trick: one row, scrolling inside
   itself. Same shape, same gesture, one less thing to learn. */
.palette{
  display:flex;align-items:center;gap:6px;flex:1 1 220px;min-width:0;max-width:100%;
  overflow-x:auto;overflow-y:hidden;flex-wrap:nowrap;scrollbar-width:none;padding:3px 2px;
}
.palette::-webkit-scrollbar{display:none}
.palette .tog{flex:0 0 auto;padding:8px 11px;font-size:14px}
.palette .tog.on{background:var(--gold);transform:translateY(2px);box-shadow:0 2px 0 var(--ink)}

/* ---------- small screens ---------- */
@media (max-width:820px){
  .app{padding:8px;gap:8px}
  .top{flex-wrap:nowrap;gap:8px}
  .brand h1{font-size:22px;text-shadow:2px 2px 0 var(--gold)}
  .brand .tagline{display:none}
  .meter{padding:3px 8px;min-height:40px;gap:6px;border-width:2.5px;box-shadow:3px 3px 0 var(--ink)}
  .meter-label{display:none}
  .badge{width:27px;height:27px;font-size:13px;border-width:2px}
  .badges{gap:4px}
  .dock{grid-template-columns:1fr;grid-template-areas:"buttons" "levels" "ctl";gap:8px}
  .levels{grid-area:levels;gap:6px;justify-content:flex-start;flex-wrap:nowrap}
  .lvl{font-size:12px;padding:5px 11px 5px 8px;box-shadow:2px 2px 0 var(--ink)}
  .lvl .ic{font-size:18px}
  .buttons{grid-area:buttons;justify-content:center;gap:8px}
  #btnBack .bl{display:none}
  #btnBack{min-width:44px}
  .ctl{grid-area:ctl;justify-content:center;align-items:center;gap:8px}
  .ctl-group{justify-content:center;gap:6px}
  .btn.big{font-size:17px;padding:10px 14px}
  .btn{padding:8px 12px;font-size:14px;min-height:44px}
  .tog{font-size:13.5px;padding:7px 12px}
  .caption{max-width:calc(100% - 28px);padding:6px 10px 8px}
  .cap-level{font-size:17px}.cap-text{font-size:12.5px}
  /* the tap prompt is the only thing that says the picture can be tapped,
     and half the challenges ask for a tap — so it stays on every screen */
  .hint{left:14px;right:14px;transform:none;bottom:10px;
        font-size:12.5px;padding:5px 10px;border-width:2.5px}
  .stat{bottom:50px}
  /* a wrapped toast inside a 999px radius turns into a circle, so on a phone,
     where every toast wraps, it becomes a rounded card instead */
  .toast{bottom:92px;font-size:14.5px;border-radius:20px;padding:7px 14px;line-height:1.25}
  .card{width:calc(100% - 28px)}
  .card-thumb{width:56px;height:56px;flex-basis:56px}
  .card-name{font-size:17px}.card-sub{font-size:13px}.card-fact{font-size:13px}
  .quest{width:calc(100% - 28px);left:14px;right:14px;top:12px;bottom:auto;padding:10px 12px}
  .q-title{font-size:15px}.q-text{font-size:14px}.opt{font-size:14px;padding:8px 14px;min-height:44px}
  body.questing .caption,body.carding .caption{display:none}
  .stat span{font-size:12px;padding:4px 9px}
}
/* Any short viewport — a phone on its side, or a stubby desktop window. It may be
   too wide for the rules above, so the compact dock is spelled out again here: a
   partial override lands half a layout on top of the desktop one. */
@media (max-height:560px){
  .stage{min-height:0}
  .dock{grid-template-columns:minmax(72px,1fr) auto;grid-template-areas:"levels buttons" "ctl ctl";gap:8px}
  .levels{grid-area:levels;justify-content:flex-start;gap:5px;flex-wrap:nowrap}
  .lvl{min-height:38px;font-size:11.5px;padding:4px 10px 4px 7px}
  .lvl .ic{font-size:16px}
  .buttons{grid-area:buttons;justify-content:flex-end;gap:8px;flex-wrap:wrap}
  .ctl{grid-area:ctl;justify-content:center}
  #btnBack .bl{display:none}
  #btnBack{min-width:38px}
  .btn,.tog{min-height:38px}
  .btn{padding:8px 11px;font-size:14px}
  .btn.big{font-size:17px;padding:10px 14px}
  .tog{font-size:13.5px;padding:7px 10px}
  .palette .tog{padding:7px 10px;font-size:13.5px}
  .caption{max-width:calc(100% - 28px);padding:6px 10px 8px}
  .cap-level{font-size:17px}.cap-text{font-size:12.5px}
  .hint{left:14px;right:14px;transform:none;bottom:10px;
        font-size:12.5px;padding:5px 10px;border-width:2.5px}
  .stat{bottom:44px}
  .toast{bottom:80px;font-size:15px;border-radius:20px;line-height:1.25}
}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}

/* ---------- badges that survive a closed tab, and the way to clear them ---------- */
.wipe{
  width:34px;height:34px;flex:0 0 auto;border-radius:50%;border:3px solid var(--ink);
  background:var(--white);font-family:var(--display);font-weight:700;font-size:15px;
  line-height:1;padding:0;box-shadow:2px 2px 0 var(--ink);white-space:nowrap;
}
/* deliberately the one small target in the collection: it throws away a child's
   badges, so it should be hard to hit by accident — and it takes two taps anyway */
.wipe.armed{width:auto;padding:0 11px;height:34px;background:var(--rocket);color:var(--white);font-size:12.5px}
.wipe[hidden]{display:none}

/* ---------- a keyboard path to everything the picture lets you tap ----------
   About half of every challenge is "tap the …", and a canvas is invisible to the
   keyboard, so those badges simply could not be earned without a pointer. These
   buttons carry the same names as the things in the picture: off-screen until
   focused, then a chip over the drawing, so Tab walks the scene and Enter opens
   the card or answers the challenge. In Build a City there is nothing to name —
   sixty identical squares — so the same list becomes a cursor: move it around
   the map with Tab and Enter, and build where it stands. */
.taplist{position:absolute;left:14px;bottom:58px;z-index:4;pointer-events:none}
.taplist button{position:absolute;width:1px;height:1px;padding:0;margin:0;border:0;
  overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.taplist button:focus-visible{
  position:static;width:auto;height:auto;clip:auto;overflow:visible;pointer-events:auto;
  padding:8px 14px;min-height:44px;border:3px solid var(--ink);border-radius:999px;
  background:var(--gold);color:var(--ink);font-family:var(--display);font-weight:600;
  font-size:14px;line-height:1;box-shadow:3px 3px 0 var(--ink);outline:3px solid var(--sky);outline-offset:3px;
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <h1>City Explorer</h1>
      <p class="tagline">How a city is put together — then build one of your own.</p>
    </div>
    <div class="right">
      <div class="meter" id="meter" aria-live="polite">
        <div class="meter-label">City<br>badges</div>
        <div class="badges" id="badges" aria-label="one badge for each part of the city"></div>
        <button class="wipe" id="btnWipe" type="button" hidden aria-label="Clear all badges and start fresh">↺</button>
      </div>
    </div>
  </header>

  <main class="stage-wrap">
    <div class="stage" id="stage">
      <canvas id="view"></canvas>
      <div class="caption" id="caption">
        <div class="cap-level" id="capLevel"></div>
        <div class="cap-text" id="capText"></div>
      </div>
      <div class="stat" id="stat" hidden></div>
      <div class="hint" id="hint">👆 Tap the river, a block or an alley</div>
      <div class="card" id="card" hidden>
        <button class="card-x" id="cardClose" aria-label="Close">×</button>
        <canvas class="card-thumb" id="thumb" width="168" height="168"></canvas>

<script>
/* =====================================================================
   CITY EXPLORER — a single file, no build step, no dependencies.

   Seven chapters. The spine running through all of them is one idea:
   everything in a city hangs off the street. The street is the shape of
   the place (ch.1), it is how far you can walk to school (ch.2), it is
   why land in the middle is expensive (ch.3), it is where the water,
   sewer, gas and wires actually run (ch.4), it is how long the fire truck
   takes (ch.5), and it is what a park has to sit next to for anyone to
   reach it (ch.6). Then in ch.7 the child builds a city, and the
   simulator will not let them forget it: pipes follow roads, so a house
   with no street has no water, no power and no fire truck.

   St. Louis is the worked example throughout — a real city with a real
   river, real numbers and real names — with towns, mid-sized cities and
   metropolis-sized places set beside it in chapter 1 so "city" does not
   quietly come to mean "a place exactly this big".

   Drawing: everything is drawn in a fixed 1000x620 "design space" that is
   scaled to fit inside the stage and centred, so the whole picture is
   always on screen at every size the layout check throws at it. The
   canvas transform does the scaling, so every coordinate below is a
   design coordinate and every line width is a design line width.
   ===================================================================== */
const TAU=Math.PI*2;
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const smooth=t=>t*t*(3-2*t);
const easeOut=t=>1-Math.pow(1-t,3);
const REDUCED=matchMedia('(prefers-reduced-motion: reduce)').matches;
const rnd=Math.random;
function seeded(n){ let s=n*9301+49297; return ()=>{ s=(s*9301+49297)%233280; return s/233280; }; }
const EMOJI_FONT='"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji","Twemoji Mozilla",sans-serif';
const LABEL_FONT='"Nunito","Segoe UI Rounded",ui-rounded,"Segoe UI",system-ui,sans-serif';
const DISPLAY_FONT='"Fredoka","Chalkboard SE","Comic Sans MS","Segoe UI Rounded",ui-rounded,system-ui,sans-serif';
const INK='#2b2350', PAPER='#fff8e7', GOLD='#ffd23f', ROCKET='#ff6b35', ROCKET_DK='#c2431a',
      SKY='#4fb3f6', GRASS='#63c64d', WHITE='#fffdf7', NIGHT='#1b1b46';
const ASPHALT='#6f6b7d', ASPHALT_DK='#4a4757', BRICK='#b1553f', BRICK_DK='#7d3527',
      RIVER='#4a93c9', RIVER_DK='#2d6a98', GROUND='#efe3c4', GROUND_DK='#ddceab',
      Z_HOME='#ffd98a', Z_SHOP='#ff8f6b', Z_WORK='#b39ddb', Z_PARK='#8fd47a',
      PIPE_WATER='#3da5dd', PIPE_SEWER='#8a6a4a', PIPE_GAS='#f2c14e', PIPE_ELEC='#e8564b', PIPE_FIBER='#8ad3c0';

/* ---------- canvas + the design-space transform ---------- */
const DW=1000, DH=620;                 // the picture every scene is drawn in
const stage=$('stage'), view=$('view');
let ctx=view.getContext('2d');
const V={w:900,h:560,dpr:1};
let S=1, OX=0, OY=0;                   // scale + letterbox offsets, set in resize()
let now=0;                             // seconds since load
function toDesign(px,py){ return [(px-OX)/S,(py-OY)/S]; }

/* ---------- drawing helpers (all write to whatever `ctx` is) ---------- */
function circle(x,y,r,fill){ ctx.fillStyle=fill; ctx.beginPath(); ctx.arc(x,y,r,0,TAU); ctx.fill(); }
function ring(x,y,r,stroke,w){ ctx.strokeStyle=stroke; ctx.lineWidth=w; ctx.beginPath(); ctx.arc(x,y,r,0,TAU); ctx.stroke(); }
function disc(x,y,r,fill,ol){ circle(x,y,r,fill); if(ol) ring(x,y,r,INK,ol); }
function ellipse(x,y,rx,ry,rot,fill,ol){ ctx.beginPath(); ctx.ellipse(x,y,Math.max(.1,rx),Math.max(.1,ry),rot||0,0,TAU);
  ctx.fillStyle=fill; ctx.fill(); if(ol){ ctx.strokeStyle=INK; ctx.lineWidth=ol; ctx.stroke(); } }
function poly(P,fill,ol,close){ ctx.beginPath(); P.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));
  if(close!==false) ctx.closePath(); if(fill){ ctx.fillStyle=fill; ctx.fill(); }
  if(ol){ ctx.strokeStyle=INK; ctx.lineWidth=ol; ctx.lineJoin='round'; ctx.stroke(); } }
function rrect(x,y,w,h,r){ r=Math.min(r,Math.abs(w)/2,Math.abs(h)/2); ctx.beginPath(); ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function box(x,y,w,h,r,fill,ol,olc){ rrect(x,y,w,h,r); if(fill){ ctx.fillStyle=fill; ctx.fill(); }
  if(ol){ ctx.strokeStyle=olc||INK; ctx.lineWidth=ol; ctx.stroke(); } }
function line(x1,y1,x2,y2,stroke,w,cap){ ctx.strokeStyle=stroke; ctx.lineWidth=w; ctx.lineCap=cap||'round';
  ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke(); }
function path(P,stroke,w,cap){ ctx.strokeStyle=stroke; ctx.lineWidth=w; ctx.lineCap=cap||'round'; ctx.lineJoin='round';
  ctx.beginPath(); P.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1])); ctx.stroke(); }
function dash(P,stroke,w,pat){ ctx.save(); ctx.setLineDash(pat||[14,10]); path(P,stroke,w); ctx.restore(); }
function emoji(ch,x,y,px,flip){ ctx.save(); ctx.translate(x,y); if(flip) ctx.scale(-1,1);
  ctx.font=px+'px '+EMOJI_FONT; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillStyle='#000';
  ctx.fillText(ch,0,px*.06); ctx.restore(); }
function label(txt,x,y,o){
  o=o||{}; const size=o.size||26;
  ctx.save(); ctx.font=(o.weight||800)+' '+size+'px '+(o.display?DISPLAY_FONT:LABEL_FONT);
  ctx.textAlign=o.align||'center'; ctx.textBaseline=o.base||'middle';
  if(o.halo!==false){ ctx.lineWidth=o.haloW||Math.max(4,size*.28); ctx.lineJoin='round';
    ctx.strokeStyle=o.halo||(o.dark?PAPER:'rgba(255,253,247,.95)'); ctx.strokeText(txt,x,y); }
  ctx.fillStyle=o.color||INK; ctx.fillText(txt,x,y); ctx.restore();
}
function arrow(x1,y1,x2,y2,color,w,head){
  line(x1,y1,x2,y2,color,w); const a=Math.atan2(y2-y1,x2-x1), h=head||w*3.2;
  poly([[x2,y2],[x2-h*Math.cos(a-.42),y2-h*Math.sin(a-.42)],[x2-h*Math.cos(a+.42),y2-h*Math.sin(a+.42)]],color,0);
}
function hexRgb(h){ return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]; }
function rgba(h,a){ const c=hexRgb(h); return 'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')'; }
function mix(a,b,t){ const A=hexRgb(a),B=hexRgb(b);
  return 'rgb('+Math.round(lerp(A[0],B[0],t))+','+Math.round(lerp(A[1],B[1],t))+','+Math.round(lerp(A[2],B[2],t))+')'; }
function vgrad(x,y0,y1,stops){ const g=ctx.createLinearGradient(x,y0,x,y1); stops.forEach(s=>g.addColorStop(s[0],s[1])); return g; }
/* a person, drawn wherever a scale reference is needed */
function person(x,y,h,color){
  const hd=h*.22; line(x,y-h*.52,x,y-h*.18,color||INK,h*.15); disc(x,y-h*.66,hd,'#f0c39a',h*.06);
  line(x,y-h*.44,x-h*.2,y-h*.3,color||INK,h*.09); line(x,y-h*.44,x+h*.2,y-h*.3,color||INK,h*.09);
  line(x,y-h*.18,x-h*.14,y,color||INK,h*.1); line(x,y-h*.18,x+h*.14,y,color||INK,h*.1);
}
/* a plain brick building front — the whole tool is set in a brick city */
function building(x,y,w,h,o){
  o=o||{};
  box(x,y,w,h,o.r||6,o.fill||BRICK,4);
  const rows=Math.max(1,o.rows||Math.floor(h/34)), cols=Math.max(1,o.cols||Math.floor(w/30));
  const mw=w/cols*.52, mh=Math.min(16,h/rows*.46);
  for(let r=0;r<rows;r++) for(let c=0;c<cols;c++){
    const wx=x+w*(c+.5)/cols-mw/2, wy=y+h*(r+.42)/rows-mh/2;
    if(o.lit===undefined || ((r*7+c*3)%5)<3) box(wx,wy,mw,mh,2,o.win||(o.lit?GOLD:'#bfe4ff'),2);
    else box(wx,wy,mw,mh,2,'#3a4a63',2);
  }
}

/* =====================================================================
   HIT SHAPES
   Every tappable thing in the picture carries one. They are deliberately
   fat: at phone size the design space is scaled to about 0.39, so a 44px
   finger target is roughly 115 design units across, and anything smaller
   than that is only tappable by a mouse.
   ===================================================================== */
function hits(h,x,y){
  if(!h) return false;
  if(h.t==='r') return x>=h.x&&x<=h.x+h.w&&y>=h.y&&y<=h.y+h.h;
  if(h.t==='c') return Math.hypot(x-h.x,y-h.y)<=h.r;
  return false;
}
function markOf(h){
  if(!h) return null;
  if(h.t==='r') return [h.x+h.w/2,h.y+h.h/2,Math.max(h.w,h.h)*.55];
  if(h.t==='c') return [h.x,h.y,h.r];
  return null;
}
const R=(x,y,w,h)=>({t:'r',x,y,w,h});
const C=(x,y,r)=>({t:'c',x,y,r});

/* =====================================================================
   CHAPTERS
   ===================================================================== */
const CHAPTERS=[
  {id:'grid', icon:'🗺️', name:'Streets', title:'🗺️ The Street Grid', ctls:['grid'],
   caption:'A city starts as a <b>plan on the ground</b>. Streets go in first, and everything else fills the <b>blocks</b> between them. St. Louis began in 1764 as three short streets beside the Mississippi — and grew <b>west</b> from there.',
   hint:'👆 Tap the river, downtown, a block or an alley'},
  {id:'homes', icon:'🏘️', name:'Neighborhoods', title:'🏘️ Where People Live', ctls:['homes'],
   caption:'Most of a city is <b>homes</b>. A neighborhood is a piece of the city with its own name, its own school, its own corner store — St. Louis has <b>79</b> of them.',
   hint:'👆 Tap a house, the school, the store or the alley'},
  {id:'downtown', icon:'🏙️', name:'Downtown', title:'🏙️ Where the Work Is', ctls:['downtown'],
   caption:'Shops and offices go in <b>commercial</b> zones. Land in the middle costs the most, so buildings there grow <b>up</b> instead of out. Factories go where the barges and trains are.',
   hint:'👆 Tap a tower, the Arch, the shops or the warehouse'},
  {id:'pipes', icon:'🚰', name:'Pipes & wires', title:'🚰 Under the Street', ctls:['pipes'],
   caption:'Under every street is a second city: <b>water</b> coming in, <b>sewer</b> going out, gas, electricity and internet. They follow the roads, because the road is the one strip of land the city owns all the way through.',
   hint:'👆 Tap a pipe, a wire, the water plant or a manhole'},
  {id:'help', icon:'🚒', name:'Help', title:'🚒 Who Comes to Help', ctls:['help'],
   caption:'Fire, police and ambulances are spread <b>all over</b> the city on purpose. One giant station in the middle would be too far from everywhere else — and in a fire, <b>minutes</b> are the whole story.',
   hint:'👆 Tap a firehouse, the hospital, a hydrant or 911'},
  {id:'green', icon:'🌳', name:'Green space', title:'🌳 Room to Breathe', ctls:['green'],
   caption:'A city needs <b>green</b> as much as it needs pavement. Forest Park is <b>1,326 acres</b> — about 500 acres bigger than Central Park in New York — and the zoo, the art museum, the science center and the history museum inside it are all <b>free</b>.',
   hint:'👆 Tap the zoo, the museum, the playground or a trail'},
  {id:'build', icon:'🏗️', name:'Build a city', title:'🏗️ Build a City', ctls:['build'],
   caption:'Pick a tool from the row below, then tap the map — drag to lay a whole street at once. The rule the city runs on: <b>pipes and wires follow the streets</b>, so nothing works until a road reaches it.',
   hint:'👷 Pick a tool below, then tap the map to build'},
];
const narrowMQ=matchMedia('(max-width:820px)');
let current=0;
const badges={};
let selected=null;

const els={ capLevel:$('capLevel'), capText:$('capText'), caption:$('caption'), hint:$('hint'), stat:$('stat'),
  card:$('card'), cardName:$('cardName'), cardSub:$('cardSub'), cardFact:$('cardFact'), cardExtra:$('cardExtra'),
  cardClose:$('cardClose'), thumb:$('thumb'), toast:$('toast'), levels:$('levels'),
  btnBack:$('btnBack'), btnNext:$('btnNext'), btnQuest:$('btnQuest'),
  quest:$('quest'), qTitle:$('qTitle'), qDots:$('qDots'), qText:$('qText'), qOpts:$('qOpts'), qFb:$('qFb'),
  questClose:$('questClose'), badges:$('badges'), meter:$('meter') };

/* =====================================================================
   SCENE 1 — THE STREET GRID
   A map seen from above, with the Mississippi down the right-hand side,
   because that is where it is. The grid grows west through four eras,
   which is also the real order: the river first, then the blocks, then
   the boulevard, then the highway cut straight through the middle.
   ===================================================================== */
const MAP={x0:130,x1:838,y0:95,y1:559,cols:6,rows:4};
const CW=(MAP.x1-MAP.x0)/MAP.cols, CH=(MAP.y1-MAP.y0)/MAP.rows;   // 118 x 116
const bx=c=>MAP.x0+c*CW, by=r=>MAP.y0+r*CH;
const ERAS=[
  {yr:'1764', west:5, rows:[1,2], say:'🕰️ 1764 — Pierre Laclède and Auguste Chouteau pick a bluff about 40 feet above the water. Three short streets, and by winter, 40 families.'},
  {yr:'1850', west:3, rows:[0,3], say:'🕰️ 1850 — steamboats everywhere. The grid marches west, one block at a time, and the city fills in behind it.'},
  {yr:'1904', west:1, rows:[0,3], say:'🕰️ 1904 — the World\'s Fair year. Streetcars reach the big new park, and the city is one of the largest in the country.'},
  {yr:'today', west:0, rows:[0,3], say:'🕰️ Today — about 280,000 people inside the city limits, and 2.8 million in the whole St. Louis area. The highway arrived in the 1950s and cut straight through.'},
];
const GRID={era:3, block:false, sizes:false, flow:0};
function gridAlive(c,r){
  const e=ERAS[GRID.era];
  return c>=e.west && r>=e.rows[0] && r<=e.rows[1];
}
function drawGrid(){
  /* ground */
  ctx.fillStyle=GROUND; ctx.fillRect(-DW,-DH,DW*3,DH*3);
  /* countryside / suburbs outside the city limits */
  ctx.fillStyle='#d9e8c0'; ctx.fillRect(-DW,-DH,DW+MAP.x0,DH*3);
  if(GRID.era>=3){
    const s=seeded(12);
    for(let i=0;i<9;i++){ const x=14+s()*100, y=110+s()*430;
      box(x,y,26,20,4,WHITE,3); poly([[x-3,y],[x+13,y-12],[x+29,y]],'#c46d55',3); }
    dash([[MAP.x0-2,88],[MAP.x0-2,566]],ROCKET_DK,5,[16,12]);
    ctx.save(); ctx.translate(MAP.x0-16,330); ctx.rotate(-Math.PI/2);
    label('CITY LIMITS',0,0,{size:20,display:true,color:ROCKET_DK}); ctx.restore();
  }
  /* the river, always */
  const rx=846;
  ctx.fillStyle=RIVER; ctx.fillRect(rx,-DH,DW*2,DH*3);
  for(let i=0;i<6;i++){ const y=40+i*100+Math.sin(now*.5+i)*6;
    path([[rx+18,y],[rx+58,y+14],[rx+96,y-4],[rx+140,y+10]],rgba('#ffffff',.42),5); }
  path([[rx,-40],[rx+8,160],[rx-6,340],[rx+10,520],[rx,660]],INK,5);
  ctx.save(); ctx.translate(rx+74,326); ctx.rotate(-Math.PI/2);
  label('Mississippi River',0,0,{size:21,display:true,color:WHITE,halo:RIVER_DK,haloW:7}); ctx.restore();
  /* blocks */
  for(let r=0;r<MAP.rows;r++) for(let c=0;c<MAP.cols;c++){
    if(!gridAlive(c,r)) continue;
    const x=bx(c)+7, y=by(r)+7, w=CW-14, h=CH-14;
    const dt=(c===5&&r>=1&&r<=2), pk=(c===1&&r===2&&GRID.era>=2);
    box(x,y,w,h,5,pk?Z_PARK:dt?'#e8dcc0':'#f6edd6',3.5);
    if(pk){ const s=seeded(3+r*7+c);
      for(let i=0;i<7;i++) emoji('🌳',x+12+s()*(w-24),y+14+s()*(h-28),20);
      label('a big park',x+w/2,y+h-12,{size:16,display:true}); }
    else if(dt){ const s=seeded(50+r*3+c);
      for(let i=0;i<10;i++){ const bw=13+s()*11, bh=13+s()*13;
        box(x+6+s()*(w-26),y+6+s()*(h-26),bw,bh,2,mix(BRICK,'#8d8798',s()),2); } }
    else{ /* houses along the street, and the alley down the middle */
      const s=seeded(9+r*11+c), n=Math.floor(w/22);
      for(let i=0;i<n;i++){ const hx=x+5+i*22;
        box(hx,y+6,15,14,2,mix(BRICK,'#c98f66',s()),2);
        box(hx,y+h-20,15,14,2,mix(BRICK,'#c98f66',s()),2); }
      if(GRID.era>=2) dash([[x+3,y+h/2],[x+w-3,y+h/2]],'#9a9282',3,[9,7]);
    }
  }
  /* streets: the lines between the blocks */
  for(let c=0;c<=MAP.cols;c++){
    let top=null,bot=null;
    for(let r=0;r<MAP.rows;r++) if(gridAlive(c,r)||gridAlive(c-1,r)){ if(top===null) top=by(r); bot=by(r+1); }
    if(top!==null) line(bx(c),top-6,bx(c),bot+6,ASPHALT,c===3&&GRID.era>=2?26:13);
  }
  for(let r=0;r<=MAP.rows;r++){
    let l=null,rr=null;
    for(let c=0;c<MAP.cols;c++) if(gridAlive(c,r)||gridAlive(c,r-1)){ if(l===null) l=bx(c); rr=bx(c+1); }
    if(l!==null) line(l-6,by(r),rr+6,by(r),ASPHALT,13);
  }
  if(GRID.era>=2){
    line(bx(3),MAP.y0-6,bx(3),MAP.y1+6,ASPHALT,26);
    dash([[bx(3),MAP.y0],[bx(3),MAP.y1]],GOLD,3,[16,14]);
    ctx.save(); ctx.translate(bx(3)-2,by(2)+CH/2); ctx.rotate(-Math.PI/2);
    label('GRAND BOULEVARD',0,0,{size:15,display:true,color:WHITE,halo:ASPHALT_DK,haloW:6}); ctx.restore();
  }
  /* the highway, cut straight through in the 1950s */
  if(GRID.era>=3){

/* =====================================================================
   SCENE 7 — BUILD A CITY
   The simulator. Everything the six chapters said, turned into rules the
   map actually enforces:

     · nothing works unless a street touches it            (ch.1)
     · homes need water AND power AND a road               (ch.2, ch.4)
     · water and power travel ALONG the roads, not through
       the air — so the road network is the pipe network   (ch.4)
     · a water plant has to stand on the river             (ch.4)
     · a fire engine can only reach so far                 (ch.5)
     · a factory beside a house makes the house miserable  (ch.3)
     · a park within a short walk makes it happier         (ch.6)

   The advisor never says "something is wrong". It names the one thing
   that is most wrong, and where it is, in the words a nine-year-old
   would use. That is the whole teaching mechanism.
   ===================================================================== */
const COLS=6, ROWS=4, CELLW=132, CELLH=106, GX=40, GY=104;
const RIVX=848;
const KINDS={
  road :{icon:'🛣️',name:'Road',    fill:ASPHALT},
  home :{icon:'🏠',name:'Homes',   fill:Z_HOME},
  shop :{icon:'🏬',name:'Shops',   fill:Z_SHOP},
  work :{icon:'🏭',name:'Factory', fill:Z_WORK},
  park :{icon:'🌳',name:'Park',    fill:Z_PARK},
  fire :{icon:'🚒',name:'Firehouse',fill:'#ff9d9d'},
  water:{icon:'💧',name:'Water plant',fill:'#a9d8f0'},
  power:{icon:'⚡',name:'Power plant',fill:'#ffe07a'},
};
const TOOLS=['road','home','shop','work','park','fire','water','power'];
const BUILD={ tool:'road', cells:new Array(COLS*ROWS).fill(null), cur:{c:0,r:0}, showCur:false, sim:null, tick:0 };
const gi=(c,r)=>r*COLS+c;
const inG=(c,r)=>c>=0&&c<COLS&&r>=0&&r<ROWS;
const cellX=c=>GX+c*CELLW, cellY=r=>GY+r*CELLH;
function cellAt(x,y){
  const c=Math.floor((x-GX)/CELLW), r=Math.floor((y-GY)/CELLH);
  return inG(c,r)?{c,r}:null;
}
/* where a thing is, said the way a child would say it */
function placeName(c,r){
  const across=['on the far left','on the left','in the middle','in the middle','on the right','on the far right'][c];
  const down=['at the top','in the second row','in the third row','at the bottom'][r];
  return across+' '+down;
}
function nbrs(c,r){ return [[c+1,r],[c-1,r],[c,r+1],[c,r-1]].filter(p=>inG(p[0],p[1])); }
function kindAt(c,r){ return inG(c,r)?BUILD.cells[gi(c,r)]:null; }

/* ---------- the simulation ---------- */
function simulate(){
  const K=BUILD.cells;
  const roadOf=i=>K[i]==='road';
  /* water and power do not fly through the air: they run along the roads.
     Flood-fill the road network out from each plant and see how far it gets. */
  function servedRoads(kind){
    const seen=new Set(), q=[];
    for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++){
      if(K[gi(c,r)]!==kind) continue;
      nbrs(c,r).forEach(([nc,nr])=>{ const i=gi(nc,nr); if(roadOf(i)&&!seen.has(i)){ seen.add(i); q.push([nc,nr]); } });
    }
    while(q.length){ const [c,r]=q.pop();
      nbrs(c,r).forEach(([nc,nr])=>{ const i=gi(nc,nr); if(roadOf(i)&&!seen.has(i)){ seen.add(i); q.push([nc,nr]); } });
    }
    return seen;
  }
  const wRoads=servedRoads('water'), pRoads=servedRoads('power');
  const has=(c,r,set)=>nbrs(c,r).some(([nc,nr])=>set.has(gi(nc,nr)));
  const hasRoad=(c,r)=>nbrs(c,r).some(([nc,nr])=>roadOf(gi(nc,nr)));
  const fires=[], parks=[], works=[], plants=[], powers=[];
  for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++){
    const k=K[gi(c,r)];
    if(k==='fire') fires.push([c,r]); else if(k==='park') parks.push([c,r]);
    else if(k==='work') works.push([c,r]); else if(k==='water') plants.push([c,r]);
    else if(k==='power') powers.push([c,r]);
  }
  const near=(c,r,list,d)=>list.some(p=>Math.max(Math.abs(p[0]-c),Math.abs(p[1]-r))<=d);
  const S={ homes:[], people:0, jobs:0, orphans:[], happy:null, plants, powers, fires, parks, works,
            wRoads, pRoads, roads:K.filter(k=>k==='road').length };
  for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++){
    const k=K[gi(c,r)]; if(!k||k==='road') continue;
    const road=hasRoad(c,r);
    if(!road) S.orphans.push({c,r,k});
    if(k==='home'){
      const w=has(c,r,wRoads), p=has(c,r,pRoads);
      const f=road&&fires.some(q=>Math.hypot(q[0]-c,q[1]-r)<=2.2);
      const h={c,r,road,water:w&&road,power:p&&road,fire:f,
               park:near(c,r,parks,2), smog:near(c,r,works,1)};
      h.live=h.road&&h.water&&h.power;
      S.homes.push(h);
      if(h.live) S.people+=6;
    }
    else if(k==='shop'  && road && has(c,r,pRoads)) S.jobs+=4;
    else if(k==='work'  && road && has(c,r,pRoads) && has(c,r,wRoads)) S.jobs+=10;
  }
  const live=S.homes.filter(h=>h.live);
  S.live=live;
  if(live.length){
    const frac=f=>live.filter(f).length/live.length;
    const ratio=S.jobs/S.people;
    const jobScore=ratio>=.35&&ratio<=1.05?1:ratio<.35?clamp(ratio/.35,0,1):clamp(2-ratio/1.05,0,1);
    S.happy=Math.round(clamp(50+22*frac(h=>h.fire)+18*frac(h=>h.park)+10*jobScore-30*frac(h=>h.smog),0,100));
  }
  S.goals=[
    {id:'people', ok:S.people>=18,                              txt:'👨‍👩‍👧 '+S.people+' / 18 people'},
    {id:'served', ok:S.homes.length>0&&S.homes.every(h=>h.live), txt:'💧⚡ '+live.length+' / '+S.homes.length+' served'},
    {id:'fire',   ok:S.homes.length>0&&S.homes.every(h=>h.fire), txt:'🚒 '+S.homes.filter(h=>h.fire).length+' / '+S.homes.length+' covered'},
    {id:'happy',  ok:S.happy!==null&&S.happy>=70,                txt:'😀 '+(S.happy===null?'—':S.happy+'%')},
  ];
  S.done=S.goals.every(g=>g.ok);
  S.advice=advise(S);
  BUILD.sim=S;
  return S;
}
/* One problem at a time, the most pressing one, and always where it is. */
function advise(S){
  const K=BUILD.cells;
  if(!K.some(k=>k)) return '👷 Start with a road. In a city, everything hangs off a street.';
  if(!S.roads) return '👷 Not one street yet. Nothing works until a road reaches it.';
  if(S.orphans.length){ const o=S.orphans[0];
    return '👷 The '+KINDS[o.k].icon+' '+placeName(o.c,o.r)+' has no street touching it.'; }
  if(!S.homes.length) return '👷 Nowhere to live yet. Put down some 🏠 homes beside a road.';
  if(!S.plants.length) return '👷 Nobody has water. A 💧 water plant has to sit on the river — the right-hand column.';
  if(!S.wRoads.size) return '👷 Your 💧 plant is not touching a road, so the pipes go nowhere.';
  if(!S.powers.length) return '👷 No electricity anywhere. Add an ⚡ power plant, and a road to it.';
  if(!S.pRoads.size) return '👷 Your ⚡ plant is not touching a road, so the wires go nowhere.';
  const dry=S.homes.filter(h=>!h.water), dark=S.homes.filter(h=>h.water&&!h.power);
  if(dry.length) return '👷 The 🏠 '+placeName(dry[0].c,dry[0].r)+' has no water. Pipes run under the roads — the road has to get there from the plant.';
  if(dark.length) return '👷 The 🏠 '+placeName(dark[0].c,dark[0].r)+' has no power. The wires follow the roads too.';
  const smog=S.live.filter(h=>h.smog);
  if(smog.length) return '👷 The 🏠 '+placeName(smog[0].c,smog[0].r)+' is right beside the 🏭 — smoke, noise and trucks. Factories belong at the edge, by the river.';
  const cold=S.homes.filter(h=>!h.fire);
  if(cold.length) return '👷 The 🏠 '+placeName(cold[0].c,cold[0].r)+' is too far from a 🚒. An engine has about four minutes.';
  if(S.people<18) return '👷 '+S.people+' people live here. Keep adding 🏠 homes — each one needs a road, water and power.';
  if(S.jobs<S.people*.35) return '👷 More people than jobs. Add 🏬 shops so they have somewhere to work.';
  if(S.jobs>S.people*1.05) return '👷 More jobs than people to fill them. Add 🏠 homes.';
  if(!S.parks.length) return '👷 Not one park. Every home should have green within a short walk.';
  if(S.happy!==null&&S.happy<70) return '👷 Nearly. A 🌳 park near the homes lifts everybody.';
  return '👷 Every light is green. That is a real city — well done.';
}

/* ---------- drawing the map ---------- */
function drawBuild(){
  const S=BUILD.sim||simulate();
  ctx.fillStyle=GROUND; ctx.fillRect(-DW,-DH,DW*3,DH*3);
  /* the river down the right-hand side, as in every other chapter */
  ctx.fillStyle=RIVER; ctx.fillRect(RIVX,-DH,DW*2,DH*3);
  for(let i=0;i<6;i++) path([[RIVX+16,60+i*94+Math.sin(now*.5+i)*5],[RIVX+52,74+i*94],[RIVX+96,58+i*94]],rgba('#ffffff',.4),5);
  path([[RIVX,-40],[RIVX+9,180],[RIVX-6,380],[RIVX+8,600]],INK,5);
  ctx.save(); ctx.translate(RIVX+62,330); ctx.rotate(-Math.PI/2);
  label('the river',0,0,{size:20,display:true,color:WHITE,halo:RIVER_DK,haloW:7}); ctx.restore();
  /* fire coverage, painted under everything */
  S.fires.forEach(f=>{ const x=cellX(f[0])+CELLW/2, y=cellY(f[1])+CELLH/2;
    ctx.save(); ctx.globalAlpha=.17; ellipse(x,y,2.2*CELLW,2.2*CELLH,0,ROCKET); ctx.restore(); });
  /* the lots */
  for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++){
    const x=cellX(c), y=cellY(r), k=BUILD.cells[gi(c,r)];
    if(!k){ box(x+4,y+4,CELLW-8,CELLH-8,8,'#f4ead2',3,'#c9bda1'); continue; }
    drawLot(c,r,k,x,y,S);
  }
  /* water and power, running along the streets — the point of the chapter */
  for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++){
    if(BUILD.cells[gi(c,r)]!=='road') continue;
    const i=gi(c,r), x=cellX(c), y=cellY(r);
    if(S.wRoads.has(i)) line(x+10,y+CELLH-24,x+CELLW-10,y+CELLH-24,PIPE_WATER,7);
    if(S.pRoads.has(i)) line(x+10,y+CELLH-13,x+CELLW-13,y+CELLH-13,GOLD,7);
  }
  /* the grid lines, so an empty map still reads as land waiting for streets */
  ctx.save(); ctx.globalAlpha=.35;
  for(let c=0;c<=COLS;c++) line(cellX(c),GY,cellX(c),GY+ROWS*CELLH,'#b9ac8e',2);
  for(let r=0;r<=ROWS;r++) line(GX,cellY(r),GX+COLS*CELLW,cellY(r),'#b9ac8e',2);
  ctx.restore();
  /* the river column is where a water plant may go */
  if(BUILD.tool==='water'){
    ctx.save(); ctx.globalAlpha=.3; ctx.fillStyle=SKY;
    ctx.fillRect(cellX(COLS-1),GY,CELLW,ROWS*CELLH); ctx.restore();
    label('water plants go here',cellX(COLS-1)+CELLW/2,GY-16,{size:16,display:true,color:'#1d5a8f'});
  }
  /* the keyboard cursor */
  if(BUILD.showCur){ const x=cellX(BUILD.cur.c), y=cellY(BUILD.cur.r);
    ctx.save(); ctx.setLineDash([13,9]); ctx.lineDashOffset=-now*40;
    box(x+2,y+2,CELLW-4,CELLH-4,9,null,6,ROCKET_DK); ctx.restore(); }
  /* what you are about to build. Below the map, on the left: the instruction
     bar owns the top and the goal pills own the bottom right. */
  const t=KINDS[BUILD.tool];
  box(GX,540,262,46,12,S.done?'#d6f5cd':rgba(WHITE,.95),4);
  emoji(t?t.icon:'🧹',GX+28,563,26);
  label(t?t.name:'Erase',GX+52,563,{size:18,display:true,align:'left'});
}
function drawLot(c,r,k,x,y,S){
  const w=CELLW, h=CELLH;
  if(k==='road'){
    box(x,y,w,h,0,ASPHALT,0);
    dash([[x,y+h/2],[x+w,y+h/2]],GOLD,3,[17,13]);
    return;
  }
  box(x+4,y+4,w-8,h-8,8,KINDS[k].fill,3.5);
  const cx=x+w/2, cy=y+h/2;
  if(k==='home'){
    const H=S.homes.find(q=>q.c===c&&q.r===r)||{};
    for(let i=0;i<2;i++){ const hx=x+26+i*54;
      box(hx,cy-22,38,34,4,H.live?BRICK:'#b6a99a',3);
      poly([[hx-6,cy-22],[hx+19,cy-40],[hx+44,cy-22]],H.live?BRICK_DK:'#948878',3);
      box(hx+13,cy-2,12,14,2,'#6f4a35',2); }
    /* three little lights: water, power, fire cover */
    [['💧',H.water],['⚡',H.power],['🚒',H.fire]].forEach((q,i)=>{
      const lx=cx-40+i*40, ly=y+h-20;
      disc(lx,ly,15,q[1]?'#7fd06a':'#e8c9c2',3);
      emoji(q[0],lx,ly,15);
      if(!q[1]) line(lx-9,ly+9,lx+9,ly-9,ROCKET_DK,4);
    });
    if(H.smog) emoji('😣',x+w-22,y+20,22);
    else if(H.live&&H.park) emoji('😀',x+w-22,y+20,22);
  }
  else if(k==='shop'){
    box(x+24,cy-24,w-48,42,4,'#f3e3cf',3);
    for(let i=0;i<4;i++) box(x+30+i*20,cy+2,14,16,2,SKY,2);
    for(let i=0;i<5;i++) box(x+24+i*17,cy-30,17,10,2,i%2?'#d9534f':WHITE,2);
    emoji('🏬',cx,y+h-24,24);
  }
  else if(k==='work'){
    box(x+22,cy-16,w-44,44,4,'#7f6f9c',3);
    for(let i=0;i<2;i++){ const sx=x+38+i*42; box(sx,cy-52,16,38,2,'#6a5b86',3);
      for(let p=0;p<3;p++) circle(sx+8+Math.sin(now*1.3+p+i)*7,cy-62-p*17-((now*22)%17),8+p*3,rgba('#cfc9dd',.55-p*.13)); }
    emoji('🏭',cx,y+h-24,22);
  }
  else if(k==='park'){
    const s=seeded(c*13+r*7+3);
    for(let i=0;i<7;i++) emoji('🌳',x+22+s()*(w-44),y+22+s()*(h-44),21);
    emoji('🛝',cx,y+h-26,20);
  }
  else if(k==='fire'){
    box(x+26,cy-20,w-52,38,4,'#d9534f',3);
    box(x+44,cy+2,34,16,2,'#7a2f2c',2);
    emoji('🚒',cx,cy-26,26);
  }
  else if(k==='water'){
    circle(x+44,cy,20,'#9ec9e4'); ring(x+44,cy,20,INK,3);
    circle(x+84,cy,20,'#9ec9e4'); ring(x+84,cy,20,INK,3);
    emoji('💧',cx,y+h-24,22);
    if(!S.wRoads.size) emoji('⚠️',x+w-22,y+20,20);
  }
  else if(k==='power'){
    poly([[x+34,cy+18],[x+44,cy-26],[x+72,cy-26],[x+82,cy+18]],'#cfc6b4',3);
    for(let p=0;p<3;p++) circle(x+58+Math.sin(now+p)*6,cy-36-p*15-((now*18)%15),9+p*3,rgba('#e8e2d4',.5-p*.12));
    emoji('⚡',cx,y+h-24,22);
    if(!S.pRoads.size) emoji('⚠️',x+w-22,y+20,20);
  }
}
/* ---------- painting ---------- */
function paintCell(c,r,silent){
  if(!inG(c,r)) return false;
  const i=gi(c,r), tool=BUILD.tool;
  if(tool==='erase'){
    if(!BUILD.cells[i]) return false;
    BUILD.cells[i]=null; afterBuild(); return true;
  }
  if(tool==='water'&&c!==COLS-1){
    if(!silent) toast('💧 A water plant has to stand on the river — the right-hand column.',3800);
    return false;
  }
  if(BUILD.cells[i]===tool) return false;

}

  const before=BUILD.sim&&BUILD.sim.done;

}

function updateScenes(dt){
  if(PIPES.tap>=0){ PIPES.tap+=dt*.42; if(PIPES.tap>1.5) PIPES.tap=-1; }
  if(PIPES.flush>=0){ PIPES.flush+=dt*.46; if(PIPES.flush>1.4) PIPES.flush=-1; }
  if(PIPES.power>=0){ PIPES.power+=dt*.6; if(PIPES.power>1.3){ PIPES.power=-1; PIPES.lit=true; } }
  if(PIPES.stormOn){ PIPES.storm=Math.min(1.25,PIPES.storm+dt*.34);
    if(PIPES.storm>=1&&!PIPES.overflow){ PIPES.overflow=1;
      toast('🌧️ The pipe is full — and the extra goes straight to the river. That is a combined sewer overflow.',7000); } }
  else PIPES.storm=Math.max(0,PIPES.storm-dt*.5);
  if(HELP.call&&HELP.t<HELP.call.dur){
    HELP.t=Math.min(HELP.call.dur,HELP.t+dt);
    if(HELP.t>=HELP.call.dur&&!HELP.call.done){ HELP.call.done=true;
      toast('🚒 On scene in '+HELP.call.mins+' minutes. The nearest engine went, not the biggest one.',5200); }
  }
  DT.shown=lerp(DT.shown===undefined?DT.extra:DT.shown,DT.extra,Math.min(1,dt*4));
  BUILD.tick+=dt;
}

/* ---------- the challenge panel ----------
   Three kinds of step: pick an answer, tap a thing in the picture, or —
   new in this tool — `watch`, which waits for the map itself to reach a
   state. Build a City needs the third kind: "get water to a house" is
   not a question, it is a thing you do. */
const quest={active:null,step:0,picked:0,waiting:false};
function startQuest(id){
  const c=CHAPTERS.find(c=>c.id===id); if(!c||!c.quest) return;
  closeCard(); quest.active={id:c.id,title:c.questTitle,steps:c.quest}; quest.step=0; quest.picked=0;
  els.qTitle.textContent=quest.active.title; els.quest.hidden=false; els.hint.hidden=true;
  document.body.classList.add('questing');
  renderStep();
}
function endQuest(){ quest.active=null; quest.waiting=false; els.quest.hidden=true;
  document.body.classList.remove('questing');
  if(!els.card.hidden) return; els.hint.hidden=false; }
function renderStep(){
  const Q=quest.active, St=Q.steps[quest.step];
  els.qDots.innerHTML='';
  Q.steps.forEach((_,i)=>{ const d=document.createElement('span');
    d.className='dot'+(i<quest.step?' done':i===quest.step?' now':''); els.qDots.appendChild(d); });
  els.qText.innerHTML=St.prompt; els.qFb.textContent=''; els.qFb.className='q-fb'; quest.picked=0;
  els.qOpts.innerHTML='';
  if(St.options){ els.qOpts.hidden=false;
    St.options.forEach((o,i)=>{ const b=document.createElement('button'); b.className='opt'; b.type='button';
      b.textContent=o.text; b.addEventListener('click',()=>pick(i,b)); els.qOpts.appendChild(b); }); }
  else els.qOpts.hidden=true;
  quest.waiting=!!St.watch;
  if(St.onShow) St.onShow();
  if(St.watch) questWatch();
}
function feedback(msg,good){ els.qFb.textContent=msg; els.qFb.className='q-fb '+(good?'good':'bad'); }
function stepDone(){
  const Q=quest.active; quest.step++; quest.waiting=false;
  if(quest.step>=Q.steps.length) setTimeout(()=>{ endQuest(); award(Q.id); },1100);
  else setTimeout(()=>{ if(quest.active) renderStep(); },1300);
}
function pick(i,btn){
  const St=quest.active.steps[quest.step], o=St.options[i];
  if(btn.disabled) return;
  if(o.ok){ btn.classList.add('yes'); btn.disabled=true; quest.picked++; feedback(o.say||'Yes!',true);
    if(quest.picked>=(St.need||1)){ els.qOpts.querySelectorAll('.opt').forEach(b=>b.disabled=true); stepDone(); } }
  else{ btn.classList.remove('no'); void btn.offsetWidth; btn.classList.add('no');
    feedback(o.say||'Not that one. Try again!',false); }
}
function questTap(item){
  const Q=quest.active; if(!Q) return false;
  const St=Q.steps[quest.step]; if(!St.tap) return false;
  const r=St.tap(item);
  if(r===true){ feedback(St.yes||'Yes!',true); stepDone(); return true; }
  feedback(typeof r==='string'?r:(St.no||'Not that one. Look again!'),false);
  return true;
}
/* the third kind of step: the map itself is the answer */
function questWatch(){
  if(!quest.active||!quest.waiting) return;
  const St=quest.active.steps[quest.step];
  if(!St.watch||!St.watch()) return;
  quest.waiting=false;
  feedback(St.yes||'That is it!',true);
  stepDone();
}
els.questClose.addEventListener('click',endQuest);
els.btnQuest.addEventListener('click',()=>{ if(quest.active) endQuest(); else startQuest(CHAPTERS[current].id); });

/* ---------- confetti ---------- */
const confetti=[];
function burstConfetti(){
  if(REDUCED) return;
  const rr=seeded(Date.now()%977+1), cols=[ROCKET,GOLD,SKY,GRASS,WHITE,'#ff4fa3'];
  for(let i=0;i<120;i++) confetti.push({x:rr()*V.w,y:-10-rr()*120,vx:(rr()-.5)*80,vy:60+rr()*90,
    r:rr()*TAU,vr:(rr()-.5)*8,c:cols[i%cols.length],s:7+rr()*7});
}
function drawConfetti(dt){
  for(let i=confetti.length-1;i>=0;i--){ const p=confetti[i];
    p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=70*dt; p.r+=p.vr*dt;
    if(p.y>V.h+20){ confetti.splice(i,1); continue; }
    ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r); ctx.fillStyle=p.c;
    ctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2); ctx.restore(); }
}

  let from=HELP.fires[0], best=1e9;
  HELP.fires.forEach(f=>{ const d=Math.hypot(f[0]-at[0],f[1]-at[1]); if(d<best){ best=d; from=f; } });
  const mins=Math.max(1,Math.round(best/REACH*4*10)/10);
  HELP.call={at,from,dur:clamp(best/260,.8,3.4),mins,done:false}; HELP.t=0;
  toast('📞 "9-1-1, what is your emergency?" The dispatcher sends the closest engine.',4200);
});
$('btnAddFire').addEventListener('click',()=>{
  if(HELP.added>=STATION_SPOTS.length-2){ toast('🚒 This city has no money for another one!',3000); return; }
  HELP.fires.push(STATION_SPOTS[2+HELP.added]); HELP.added++;
  setReach(true); refreshStat(); buildTapList(); questWatch();
  toast('🚒 A new firehouse — '+coverPct()+'% of homes are now within four minutes.',5000);
});
$('btnHelpReset').addEventListener('click',()=>{ HELP.fires=[STATION_SPOTS[0].slice(),STATION_SPOTS[1].slice()];
  HELP.added=0; HELP.call=null; HELP.t=0; refreshStat(); buildTapList();
  toast('↺ Back to two firehouses.',2600); });

/* --- ch.6 green space --- */
function setHeat(v){ GREEN.heat=v; $('togHeat').classList.toggle('on',v);
  $('togHeat').textContent=v?'🌡️ Hide the heat':'🌡️ Show the heat'; }
function setWalkPark(v){ GREEN.walk=v; $('togWalkPark').classList.toggle('on',v);
  $('togWalkPark').textContent=v?'🚶 Hide the walk':'🚶 10-minute walk'; }
function setFair(v){ GREEN.fair=v; $('togFair').classList.toggle('on',v);
  $('togFair').textContent=v?'🎡 Back to today':'🎡 The 1904 World\'s Fair'; }
$('togHeat').addEventListener('click',()=>{ setHeat(!GREEN.heat);
  if(GREEN.heat) toast('🌡️ A built-up block can sit ten degrees hotter than a park a few streets away.',5800); });
$('togWalkPark').addEventListener('click',()=>{ setWalkPark(!GREEN.walk);
  if(GREEN.walk) toast('🚶 Half a mile. Compare the big park\'s circle with the little playground\'s.',5200); });
$('togFair').addEventListener('click',()=>{ setFair(!GREEN.fair);
  if(GREEN.fair) toast('🎡 Twenty million visitors in 1904 — and the Olympic swimming races were held here too.',6000); });

/* --- ch.7 build a city --- */
function setTool(k){
  BUILD.tool=k;
  document.querySelectorAll('#palette .tog').forEach(b=>{
    const on=b.dataset.tool===k; b.classList.toggle('on',on);
    /* the palette scrolls inside itself, so the chosen tool has to be dragged
       back into view or a child cannot see which one is lit */
    if(on&&b.scrollIntoView) b.scrollIntoView({block:'nearest',inline:'nearest'});
  });
}
(function makePalette(){
  const host=$('palette');
  TOOLS.concat('erase').forEach(k=>{
    const b=document.createElement('button');
    b.type='button'; b.className='tog'+(k===BUILD.tool?' on':''); b.dataset.tool=k;
    b.textContent=(k==='erase'?'🧹':KINDS[k].icon)+' '+(k==='erase'?'Erase':KINDS[k].name);
    b.addEventListener('click',()=>setTool(k));
    host.appendChild(b);
  });
})();
$('btnClearMap').addEventListener('click',()=>{ clearMap(); toast('↺ Empty land again. Start with a road.',3000); });

/* Everything a chapter switches on gets switched off again when the child
   leaves it. Keeping this in one named function, rather than scattering
   `if (id !== 'grid')` through goTo, is what stops a control quietly
   following the child to the next chapter. The things a child has BUILT —
   the grown city, the extra floors, the extra firehouses, the map in
   chapter 7 — are deliberately not here: each has its own ↺ that says
   what it puts back. */
function resetTransient(){
  setBlock(false); setSizes(false); setWalk(false); setZones(false); setNight(false);
  setReach(false); setHeat(false); setWalkPark(false); setFair(false); setStorm(false);
  PIPES.tap=-1; PIPES.flush=-1; PIPES.power=-1; PIPES.lit=false; PIPES.storm=0; PIPES.overflow=0;
  HELP.call=null; HELP.t=0;
  BUILD.showCur=false;
}

/* =====================================================================
   MOVING BETWEEN CHAPTERS
   ===================================================================== */
CHAPTERS.forEach((c,i)=>{
  const b=document.createElement('span'); b.className='badge'; b.textContent=c.icon; b.title=c.name+' badge';
  els.badges.appendChild(b); c.badgeEl=b;
  const t=document.createElement('button'); t.className='lvl'; t.type='button';
  t.setAttribute('aria-label','Go to '+c.name);
  t.appendChild(Object.assign(document.createElement('span'),{className:'ic',textContent:c.icon}));
  t.appendChild(Object.assign(document.createElement('span'),{className:'nm',textContent:c.name}));
  t.addEventListener('click',()=>goTo(i)); els.levels.appendChild(t); c.chip=t;
});
function buildTapList(){
  const host=$('taplist'); if(!host) return;
  host.innerHTML='';
  const mk=(txt,fn)=>{ const b=document.createElement('button'); b.type='button'; b.textContent=txt;
    b.addEventListener('click',fn); host.appendChild(b); return b; };
  if(CHAPTERS[current].id==='build'){
    /* sixty identical squares have no names, so the same off-screen list
       becomes a cursor instead: move it, then build where it stands. */
    const move=(dc,dr)=>()=>{ BUILD.showCur=true;
      BUILD.cur.c=clamp(BUILD.cur.c+dc,0,COLS-1); BUILD.cur.r=clamp(BUILD.cur.r+dr,0,ROWS-1);
      toast('📍 Builder is '+placeName(BUILD.cur.c,BUILD.cur.r),1800); };
    mk('Move the builder left',move(-1,0));
    mk('Move the builder right',move(1,0));
    mk('Move the builder up',move(0,-1));
    mk('Move the builder down',move(0,1));
    mk('Build here',()=>{ BUILD.showCur=true; paintCell(BUILD.cur.c,BUILD.cur.r); });
    host.querySelectorAll('button').forEach(b=>b.addEventListener('focus',()=>{ BUILD.showCur=true; }));
    return;
  }
  items().forEach(it=>mk(it.name,()=>{
    if(quest.active&&quest.active.steps[quest.step].tap){ if(questTap(it)) return; }
    showCard(it);
  }));
}
function updateChips(){
  CHAPTERS.forEach((c,k)=>{ c.chip.classList.toggle('on',k===current); c.chip.classList.toggle('done',k<current); });
  const on=CHAPTERS[current].chip;                 /* keep the current one in view when the rail scrolls */
  if(on&&on.scrollIntoView) on.scrollIntoView({block:'nearest',inline:'center'});
}
function updateButtons(){
  els.btnBack.disabled=(current===0);
  const last=(current===CHAPTERS.length-1);
  els.btnNext.textContent=last?'🔁 Back to the start':'Next ▶';
  els.btnNext.classList.toggle('home',last);
  const c=CHAPTERS[current], won=!!badges[c.id];
  els.btnQuest.textContent=won?'✅ Badge earned':'🎯 Challenge!';
  els.btnQuest.classList.toggle('won',won);
  ['grid','homes','downtown','pipes','help','green','build'].forEach(g=>{ $('ctl-'+g).hidden=!c.ctls.includes(g); });
  document.body.classList.toggle('building',c.id==='build');
}
let trans=null;         // {to,t0,dur}
function goTo(i){
  i=clamp(i,0,CHAPTERS.length-1); if(i===current||trans) return;
  closeCard(); endQuest(); els.hint.hidden=true;
  resetTransient();
  if(REDUCED){ switchTo(i); return; }
  trans={to:i,t0:performance.now(),dur:700};
}
function switchTo(i){
  current=i;
  setCaption(i); updateChips(); updateButtons();
  if(CHAPTERS[i].id==='build') simulate();
  refreshStat();
  els.hint.textContent=CHAPTERS[i].id==='build'?BUILD.sim.advice:CHAPTERS[i].hint;  /* every chapter says what to do */
  els.hint.hidden=false;
  buildTapList();
}
els.btnNext.addEventListener('click',()=>goTo(current===CHAPTERS.length-1?0:current+1));
els.btnBack.addEventListener('click',()=>goTo(current-1));

/* ---------- taps ----------
   Six chapters answer a tap with a card. The seventh answers it by
   building something, and a drag lays a whole street at once, which is
   the only way drawing roads with a finger is bearable. */
let pDown=null, painting=false, lastPaint=null;
function eventCell(e){
  const r=view.getBoundingClientRect(), [wx,wy]=toDesign(e.clientX-r.left,e.clientY-r.top);
  return cellAt(wx,wy);
}
view.addEventListener('pointerdown',e=>{
  pDown={x:e.clientX,y:e.clientY};
  if(CHAPTERS[current].id!=='build'||trans) return;
  painting=true; lastPaint=null;
  const c=eventCell(e); if(c){ lastPaint=c.c+','+c.r; paintCell(c.c,c.r); }
  try{ view.setPointerCapture(e.pointerId); }catch(err){}
});
view.addEventListener('pointermove',e=>{
  if(!painting) return;
  const c=eventCell(e); if(!c) return;
  const key=c.c+','+c.r; if(key===lastPaint) return;
  lastPaint=key; paintCell(c.c,c.r,true);
});
const stopPaint=()=>{ painting=false; lastPaint=null; };
view.addEventListener('pointerup',e=>{
  const wasPainting=painting; stopPaint();
  if(!pDown) return; const moved=Math.hypot(e.clientX-pDown.x,e.clientY-pDown.y); pDown=null;
  if(wasPainting||moved>12||trans) return;
  const r=view.getBoundingClientRect(), [wx,wy]=toDesign(e.clientX-r.left,e.clientY-r.top);
  const item=hitTest(wx,wy);
  if(quest.active&&quest.active.steps[quest.step].tap){ if(questTap(item)) return; }
  if(item) showCard(item); else closeCard();
});
view.addEventListener('pointercancel',stopPaint);
view.addEventListener('pointerleave',stopPaint);
window.addEventListener('keydown',e=>{
  const tag=e.target.tagName; if(tag==='INPUT') return;
  if((e.key===' '||e.key==='Enter')&&tag==='BUTTON') return;
  if(e.key==='ArrowRight'||e.key==='ArrowDown'){ e.preventDefault(); els.btnNext.click(); }
  else if(e.key==='ArrowLeft'||e.key==='ArrowUp'){ e.preventDefault(); els.btnBack.click(); }
  else if(e.key==='Escape'){ closeCard(); endQuest(); }
  else if(e.key>='1'&&e.key<='7') goTo(+e.key-1);
});

/* ---------- sizing + the frame loop ---------- */
function placeQuestBtn(){ if(narrowMQ.matches) $('ctl').prepend(els.btnQuest); else els.btnNext.after(els.btnQuest); updateButtons(); }
narrowMQ.addEventListener('change',placeQuestBtn); placeQuestBtn();
function resize(){
  const r=stage.getBoundingClientRect();
  V.w=Math.max(240,Math.round(r.width)); V.h=Math.max(160,Math.round(r.height));
  V.dpr=Math.min(2,window.devicePixelRatio||1);
  view.width=Math.round(V.w*V.dpr); view.height=Math.round(V.h*V.dpr);
  /* "contain": the whole picture is on screen at every size the layout check
     throws at it, from a 320px phone to a 2000px window. The bands left over
     are painted by each scene's own background, which is drawn well outside
     the design box on purpose. */
  S=Math.min(V.w/DW,V.h/DH); OX=(V.w-DW*S)/2; OY=(V.h-DH*S)/2;
}
let lastT=performance.now(), lastStat=0;
function frame(nowMs){
  const dt=Math.min(.05,(nowMs-lastT)/1000); lastT=nowMs; now=nowMs/1000;
  updateScenes(dt);
  if(nowMs-lastStat>250){ lastStat=nowMs; refreshStat(); questWatch(); }
  let fade=0;
  if(trans){
    const k=clamp((nowMs-trans.t0)/trans.dur,0,1);
    fade=1-Math.abs(k*2-1);
    if(k>=.5&&current!==trans.to) switchTo(trans.to);
    if(k>=1) trans=null;
  }
  ctx.setTransform(V.dpr*S,0,0,V.dpr*S,V.dpr*OX,V.dpr*OY);
  SCENES[CHAPTERS[current].id].draw();
  if(selected){ const m=selected.mark||markOf(selected.hit);
    if(m){ ctx.save(); ctx.setLineDash([14,10]); ctx.lineDashOffset=-now*44;
      ring(m[0],m[1],m[2],GOLD,7); ctx.restore(); } }
  ctx.setTransform(V.dpr,0,0,V.dpr,0,0);
  if(fade>0){ ctx.fillStyle='rgba(255,248,231,'+fade+')'; ctx.fillRect(0,0,V.w,V.h); }
  drawConfetti(dt);
  requestAnimationFrame(frame);
}
if(document.fonts&&document.fonts.load){ document.fonts.load('800 13px Nunito'); document.fonts.load('700 20px Fredoka'); }
window.cityExplorer={CHAPTERS,goTo,award,startQuest,quest,badges,items,hitTest,simulate,paintCell,clearMap,
  GRID,HOMES,DT,PIPES,HELP,GREEN,BUILD,coverPct};          // handy for testing and tinkering
new ResizeObserver(resize).observe(stage);
resize();

/* =====================================================================
   BADGES THAT SURVIVE A CLOSED TAB
   A nine-year-old gets called to dinner mid-challenge. Losing every badge
   to a reload is the quickest way to make the whole reward loop feel
   pointless. The ↺ in the meter clears them so a second child can start
   fresh — two taps, so it cannot happen by accident.
   ===================================================================== */
const SAVE_KEY='learningTools.cityExplorer.badges';
function saveBadges(){ try{ localStorage.setItem(SAVE_KEY,JSON.stringify(Object.keys(badges))); }catch(e){} }
function restoreBadges(){
  let saved=[];
  try{ saved=JSON.parse(localStorage.getItem(SAVE_KEY)||'[]'); }catch(e){ saved=[]; }
  if(!Array.isArray(saved)) saved=[];
  saved.forEach(id=>{ const c=CHAPTERS.find(x=>x.id===id); if(!c) return;
    badges[id]=true;
    if(c.badgeEl) c.badgeEl.classList.add('won');
    if(c.chip) c.chip.classList.add('won'); });
  if(Object.keys(badges).length===CHAPTERS.length) els.meter.classList.add('all');
  updateWipe(); updateButtons();
}
function clearBadges(){
  Object.keys(badges).forEach(k=>{ delete badges[k]; });
  CHAPTERS.forEach(c=>{ if(c.badgeEl) c.badgeEl.classList.remove('won'); if(c.chip) c.chip.classList.remove('won'); });
  els.meter.classList.remove('all');
  try{ localStorage.removeItem(SAVE_KEY); }catch(e){}
  updateWipe(); updateButtons();
}
let wipeArmed=false, wipeTimer=null;
function updateWipe(){
  const b=$('btnWipe'); if(!b) return;
  const any=Object.keys(badges).length>0;
  b.hidden=!any;
  if(!any){ wipeArmed=false; b.textContent='↺'; b.classList.remove('armed'); }
}
$('btnWipe').addEventListener('click',()=>{
  const b=$('btnWipe');
  if(!wipeArmed){
    wipeArmed=true; b.textContent='Clear?'; b.classList.add('armed');
    clearTimeout(wipeTimer);
    wipeTimer=setTimeout(()=>{ wipeArmed=false; b.textContent='↺'; b.classList.remove('armed'); },3500);
    return;
  }
  clearTimeout(wipeTimer); wipeArmed=false; b.textContent='↺'; b.classList.remove('armed');
  clearBadges(); toast('↺ Badges cleared — a fresh start.',3000);
});
growLabel(); simulate();
setCaption(0); updateChips(); updateButtons(); refreshStat();
els.hint.textContent=CHAPTERS[0].hint;
buildTapList();
restoreBadges();
requestAnimationFrame(frame);
</script>
</body>
